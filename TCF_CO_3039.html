es insectes ne jouent évidemment aucun rôle. En fait, ce sont des petites boules au bout des tiges qui se fendent et attirent les cellules mâles pour les féconder.\n– Et à quoi te serviront ces découvertes ?\n– Par la suite, on pourra multiplier ces algues et les utiliser dans la composition des produits pharmaceutiques.", "audio": "CO 5/039.MP3", "_test": "5", "_pos": 39, "_origlabel": "test5#39", "_sources": ["test5#39"]}, {"type": "document", "q": "Question 37. Qu'est-ce qui fait polémique ?", "c": ["L'industrialisation galopante des rives.", "La dégradation d'un site naturel rare.", "La pollution des nappes phréatiques.", "La raréfaction des énergies fossiles."], "a": 1, "k": "un écosystème assez précieux et assez unique au monde", "transcript": "– Qu'est-ce que vous avez en couverture ce mois-ci ?\n– On se questionne sur la présence de pétrole dans le sous-sol du golfe Saint-Laurent. Il y a beaucoup de controverses au sujet de son exploitation, de son extraction, sur les dommages potentiels que cela pourrait causer au golfe, qui est un écosystème assez précieux et assez unique au monde. Mais il y a aussi cette richesse qu'on ne soupçonnait pas il y a une vingtaine ou trentaine d'années, ce pétrole dans le sous-sol. Alors, ça fait des débats de société assez importants ici.", "audio": "CO 9/037.MP3", "_test": "9", "_pos": 37, "_origlabel": "test9#37", "_sources": ["test9#37", "test35#37"]}, {"type": "document", "q": "D'après le journaliste, en quoi les bons résultats européens en matière d'écologie sont-ils contestables ?", "c": ["Ils font l'objet de manipulations douteuses par les pollueurs", "Ils répondent à des critères insuffisamment exigeants", "Ils sont destinés à justifier les politiques économiques", "Ils sont publiés par des organismes liés aux entreprises"], "a": 1, "k": "Les quotas de rejet de CO2, fixés à l'avance, ont été calculés de manière à ne pas trop effaroucher les industriels.", "transcript": "Les pays européens sont presque tous d'excellents élèves de l'écologie. Mais est-ce une bonne nouvelle ? s'interroge le Figaro. Pas si sûr. L'Europe, dit Gérard Dupuy, dans Libération, ne paraît vertueuse que parce que son double décimètre était truqué. Les quotas de rejet de CO2, fixés à l'avance, ont été calculés de manière à ne pas trop effaroucher les industriels. Du coup, ils ne servaient à rien. Mais, reconnaît Gérard Dupuy, il serait tout aussi erroné, à l'inverse, d'avoir des exigences drastiques mais irréalistes. Les industriels savent d'ailleurs agiter un épouvantail efficace. La méthode la plus simple, pour arriver à une absence complète de pollution, c'est de fermer une usine et de la délocaliser sous d'autres cieux. Ce n'est pas toujours une menace en l'air.", "audio": "CO 10/038.MP3", "_test": "10", "_pos": 38, "_origlabel": "test10#38", "_sources": ["test10#38"]}, {"type": "document", "q": "Sur quoi s'appuie la recommandation de Thomas Lepeltier ?", "c": ["Sur des considérations morales", "Sur des convictions écologiques", "Sur des certitudes économiques", "Sur des prescriptions diététiques"], "a": 0, "k": "c'est une question d'éthique animale", "transcript": "— Dans mon article de presse pour commencer, vous signez donc pour le magazine Sciences Humaines un article qui s'intitule « Faut-il encore manger de la viande ? » et vous écrivez qu'il est nécessaire de diminuer fortement notre consommation sans pour autant devenir végétarien. C'est la condition animale qui vous intéresse principalement sur cette question ?\n— Oui, c'est une question d'éthique animale. Moi, je pense qu'il y a une grande évolution de la société. La notion de cruauté envers les animaux a de plus en plus de mal à être acceptée. Or, on a assisté depuis les cinquante dernières années à une mise en place d'une industrie de la viande qui fait terriblement souffrir les animaux.", "audio": "CO 29/037.MP3", "_test": "29", "_pos": 37, "_origlabel": "test29#37", "_sources": ["test29#37"]}, {"type": "document", "q": "Sur quoi s'appuient les recommandations de Thomas Le Peltier ?", "c": ["Sur des considérations morales", "Sur des convictions écologiques", "Sur des certitudes économiques", "Sur des prescriptions diététiques"], "a": 0, "transcript": "— C'est la condition animale qui vous intéresse principalement ? — Oui, c'est une question d'éthique animale. La notion de cruauté envers les animaux a de plus en plus de mal à être acceptée. Or, on a assisté depuis les 50 dernières années à une mise en place d'une industrie de la viande qui fait terriblement souffrir les animaux.", "k": "une question d'éthique animale", "audio": "CO 30/037.MP3", "_test": "30", "_pos": 37, "_origlabel": "test30#37", "_sources": ["test30#37"]}, {"type": "document", "q": "Question 39. Que regrette l'intervenant dans ce type de relation ?", "c": ["La fragilité de l'engagement", "La multiplicité des contacts", "La pauvreté des échanges", "L'absence du face à face"], "a": 0, "k": "les liens se créent d'un clic, se défont d'un clic", "transcript": "Dans les relations d'amitié virtuelle, bien souvent les liens se créent d'un clic, se défont d'un clic. Il y a une précarité de la relation humaine dans ces réseaux-là. Et puis même aussi, dans les rencontres, on est appelé à faire sur le mode de l'instantanéité, speed dating, toutes les formes de speed meeting, qui fait qu'on cède à l'affect du moment pour décider si on maintient une relation ou pas. Quant au caractère durable et vertueux des amitiés à l'échelle de notre vie, on peut se poser la question de leur existence à la journée.", "audio": "CO 33/039.MP3", "_test": "33", "_pos": 39, "_origlabel": "test33#39", "_sources": ["test33#39"]}, {"type": "document", "q": "Quel est le constat de l'intervenant sur l'exploitation des gaz de schiste ?", "c": ["Elle est régie par des normes internationales strictes.", "Elle est réputée sans danger pour le milieu naturel.", "Les inconvénients qu'elle présente sont manifestes.", "Les sociétés de production en exagèrent la rentabilité."], "a": 3, "k": "les effets économiques ne sont pas aussi élevés que ceux que nous avons", "transcript": "On voit aujourd'hui que le débat est très mal posé parce que d'un côté on nous parle de gains économiques supposés rapides et sûrs, et de l'autre un coût environnemental qui maintenant est sous contrôle. Mais en réalité, quand on se penche uniquement sur les effets économiques, on se rend compte que les effets économiques ne sont pas aussi élevés que ceux que nous avons, les pro-exploitations.", "audio": "CO 40/039.MP3", "_test": "40", "_pos": 39, "_origlabel": "test40#39", "_sources": ["test40#39"]}, {"type": "document", "q": "Question 37 : Sur quoi porte la réflexion de ce scientifique ?", "c": ["La communication entre les animaux", "La place de l'être humain dans la nature", "Le progrès des sciences naturelles", "L'évolution de l'espèce humaine"], "a": 1, "k": "C'est l'anthropocentrisme : on regarde les autres du haut de nos positions", "transcript": "À cette époque-là, on ne connaissait pas grand-chose. C'est surtout la manière dont on regardait. D'un seul coup, il y a eu cet effet réversif. C'est l'anthropocentrisme : on regarde les autres du haut de nos positions, et d'un seul coup, ça nous permet de dire « Mais qu'est-ce qui te permet de te mettre cette position-là ? » On a longtemps dit que la capacité d'interroger sur ce que nous sommes était propre à l'humain.", "audio": "CO 26/037.MP3", "_test": "26", "_pos": 37, "_origlabel": "test26#37", "_sources": ["test26#37"]}]}, "Sante": {"cours": [{"type": "document", "q": "Question 34. Quelles sont les réactions des Parisiens installés à Montpellier ?", "c": ["Ils sont satisfaits de l'espace de leur nouvelle habitation.", "Ils ont un souci de l'intégration.", "Ils regrettent le manque de culture à Montpellier.", "Ils se plaignent du climat."], "a": 1, "k": "Ils ont un souci de l'intégration.", "transcript": "Le département de l'Hérault attire de nombreux nouveaux habitants chaque année et notamment de plus en plus de Parisiens qui s'installent dans le 34. Fuyant le stress et la grisaille de la capitale, Montpellier semble une destination de rêve. Mais qui sont ces nouveaux arrivants ?\n– Nous, on a quitté Paris parce qu'on n'aurait jamais pu devenir propriétaire. On vivait dans un 40 m² et pour le même prix, on a trouvé une petite maison avec patio dans les quartiers ouest de Montpellier.\n– Alors, qu'est-ce que vous trouvez à Montpellier ?\n– Ici, on a du soleil tous les jours. Franchement, je dois dire que ce que j'apprécie, c'est la qualité des rapports humains. Les gens sont plus posés, moins stressés. Pour une ville de province, la vie culturelle se révèle quand même assez riche avec beaucoup de festivals. Après, pour ce qui est de la vie sociale, c'est un peu délicat. On se sent étranger et les gens du pays nous considèrent comme des Parisiens, ça c'est sûr. Ils nous le disent.", "audio": "CO 2/034.MP3", "_test": "2", "_pos": 34, "_origlabel": "test2#34", "_sources": ["test2#34"]}, {"type": "document", "q": "Question 30. Quelle est l'idée avancée par la journaliste ?", "c": ["La mode est une perte de temps.", "Il faut suivre les tendances actuelles.", "L'apparence ne compte pas.", "La tenue vestimentaire influence l'état psychologique."], "a": 3, "k": "La tenue vestimentaire influence l'état psychologique.", "transcript": "Je n'ai rien à me mettre. Avez-vous déjà prononcé cette phrase devant votre armoire pleine de vêtements ? Ces questions semblent futiles. La mode nous paraît parfois un luxe superflu et on oppose souvent l'être et le paraître. Mais faites l'expérience. Si vous êtes femme, quel que soit votre gabarit, enfilez une robe qui vous met en valeur, de jolies chaussures, une touche de rouge à lèvres peut-être. Vous vous sentirez sans aucun doute plus sûre de vous. Votre caractère en sera peut-être même transformé.", "audio": "CO 34/030.MP3", "_test": "4", "_pos": 30, "_origlabel": "test4#30", "_sources": ["test4#30"]}, {"type": "document", "q": "Question 34. Selon l'intervenant, pourquoi l'aquaculture pose-t-elle problème ?", "c": ["L'alimentation fournie aux élevages est de mauvaise qualité.", "L'existence d'industries piscicoles nuit à la variété des espèces.", "La filière aquacole fragilise l'équilibre alimentaire mondial.", "Les pêcheurs pillent les fonds marins pour soutenir la concurrence."], "a": 2, "k": "ne fait qu'aggraver la situation dans les autres pays", "transcript": "Ils estiment que la consommation de poissons d'élevage dans les pays riches ne fait qu'aggraver la situation dans les autres pays, puisqu'il faut avoir recours aux réserves de poissons des pays en développement pour produire les ressources qu'on consacre à l'élevage industriel.", "audio": "CO 6/034.MP3", "_test": "6", "_pos": 34, "_origlabel": "test6#34", "_sources": ["test6#34", "test32#35"]}, {"type": "document", "q": "Dans quelle mesure cette femme fait-elle de la politique ?", "c": ["En communiquant dans les médias.", "En critiquant le pouvoir en place.", "En représentant ses électeurs.", "En s'engageant comme citoyenne."], "a": 3, "k": "la société civile se sont de plus en plus organisés à l'extérieur des institutions formelles de la démocratie", "transcript": "– On a de la difficulté à croire que vous n'ayez pas envie de faire de la politique.\n– Mais vous savez, j'espère qu'on va parler un peu de démocratie, mais la démocratie ne s'exprime pas exclusivement par la politique électorale. Ça me surprend toujours quand je vous entends dire vous n'avez pas l'intention de faire de la politique. En fait, j'en fais de la politique, je fais de la politique internationale mais sans mandat, ce qui d'ailleurs pose ses propres problèmes. Les gens pourraient dire mais qui vous a donné un mandat ? Mais je pense qu'on vit maintenant dans un monde où les gens qu'on appelle la société civile se sont de plus en plus organisés à l'extérieur des institutions formelles de la démocratie.", "audio": "CO 7/033.MP3", "_test": "7", "_pos": 33, "_origlabel": "test7#33", "_sources": ["test7#33", "test21#33"]}, {"type": "document", "q": "Question 32. Qu'est-ce qui est mis en avant concernant le sport ?", "c": ["Il développe la volonté de vaincre.", "Il enrichit les relations humaines.", "Il garantit l'équilibre psychologique.", "Il procure des bienfaits physiques."], "a": 1, "k": "l'esprit d'équipe, du dépassement de soi, du respect, de l'amitié", "transcript": "Aujourd'hui, à quoi sert le sport pour trouver sa place dans la société ? Foot, basket, lutte, course, il n'y a pas que la compétition. En tout cas, chez ce milliard, on va parler de l'esprit d'équipe, du dépassement de soi, du respect, de l'amitié. La FIFA, l'UNESCO et le Programme alimentaire mondial viennent de signer un partenariat pour aider les enfants dans ce sens. Et c'est vrai que l'impact social du sport est encore trop souvent ignoré. On dit toujours : le sport, c'est bon pour la santé, mais il n'y a pas que la santé. Une génération bien dans ses baskets, c'est aussi une génération plus ouverte vers les autres.", "audio": "CO 8/032.MP3", "_test": "8", "_pos": 32, "_origlabel": "test8#32", "_sources": ["test8#32"]}, {"type": "document", "q": "Question 32. Que déplore cet homme à propos de l'individu dans le monde actuel ?", "c": ["L'absence de formes d'altruisme.", "La place accordée à l'apparence.", "La superficialité des relations.", "Le manque d'estime de soi."], "a": 3, "k": "devenez narcissique", "transcript": "Et je me suis rendu compte que nous vivons dans un monde où nous ne nous autorisons pas à être nous-mêmes, à nous écouter, à nous respecter. C'est surtout cette manière dont nous sommes pris par une forme d'auto-exploitation qui entraîne tant de gens jusqu'à l'épuisement, jusqu'au burn-out, qui m'a donné envie de dire : sauvez votre peau, devenez narcissique. Et je crois qu'en fait être narcissique, c'est pouvoir s'écouter, se rencontrer, se respecter et je crois que ça, c'est vraiment aujourd'hui crucial.", "audio": "CO 9/032.MP3", "_test": "9", "_pos": 32, "_origlabel": "test9#32", "_sources": ["test9#32"]}, {"type": "document", "q": "Qu'est-ce qui a décidé Daniel Desmoulins à démarrer son activité ?", "c": ["La qualité croissante des résultats.", "Les aménagements hydrauliques.", "L'expérience de ses collègues.", "L'importation de pieds de vigne."], "a": 0, "k": "les produits devenaient de mieux en mieux", "transcript": "Depuis quelques années, des vignerons ont investi des sommes importantes au Québec pour se lancer dans une nouvelle culture, comme Daniel Desmoulins, qui a ouvert le vignoble « L'Ange Gardien » en face du fleuve Saint-Laurent.\n– Faire du vin au Québec, c'est un challenge. Je ne me serais peut-être pas lancé dans cette aventure il y a 20 ans, mais je trouvais que les produits devenaient de mieux en mieux. C'est pour cela qu'il y a 10 ans, avec ma femme, nous avons décidé de nous lancer dans le vin. Je pense que nous avons des produits extrêmement intéressants parce qu'ils ont un petit peu d'acidité. Et puis, il y a toujours le vin de glace. Nous avons la température adéquate pour cela. Nous récoltons le raisin fin décembre, début janvier.", "audio": "CO 24/034.MP3", "_test": "24", "_pos": 34, "_origlabel": "test24#34", "_sources": ["test24#34", "test35#34"]}, {"type": "document", "q": "Que constatent ces journalistes culinaires ?", "c": ["La gastronomie moderne reprend d'anciennes recettes.", "De nouvelles herbes sont commercialisées.", "Il y a un réel manque d'originalité chez les chefs actuels.", "On multiplie l'utilisation de parfums artificiels."], "a": 3, "k": "l'industrie qui maintenant crée des milliers d'arômes", "transcript": "Les arômes dans la cuisine, ce n'est pas vraiment une nouveauté. Non, ce n'est pas une chose nouvelle, puisque la cuisine a toujours été aromatisée. Avant, on était aux fleurs d'oranger. Et maintenant encore — le gingembre, d'ailleurs dans l'Antiquité, on savait déjà extraire des arômes naturels des plantes. Donc ce n'est pas une chose nouvelle. Mais ce qui est nouveau, en revanche, c'est l'industrie qui maintenant crée des milliers d'arômes pour répondre aux besoins de l'industrie agroalimentaire, qui va donc aromatiser tous les produits que vous trouvez dans vos rayons.", "audio": "CO 24/035.MP3", "_test": "24", "_pos": 35, "_origlabel": "test24#35", "_sources": ["test24#35"]}, {"type": "document", "q": "Quelle est l'accusation portée contre l'industrie pharmaceutique ?", "c": ["Elle commercialise des produits dangereux pour la santé", "Elle crée des besoins pour réutiliser de vieux remèdes", "Elle fait des profits grâce à la vente de traitements périmés", "Elle limite la recherche consacrée aux pathologies rares"], "a": 1, "k": "elle invente des maladies pour recycler les molécules antérieures", "transcript": "— Le zoom de France Info consacré ce matin aux dérives de l'industrie pharmaceutique ou comment inventer de nouvelles maladies pour recycler d'anciennes molécules. Le mal de dos est devenu une spondylarthrite ankylosante, une période de tristesse cache forcément une dépression... Aujourd'hui, on a l'impression, Philippe Éven, que tout est maladie.\n— Oui, ça c'est maintenant 15 ans que ça dure. Vous savez, quand une industrie comme celle-là, qui a beaucoup rapporté, ne trouve plus de médicaments, alors elle invente des maladies pour recycler les molécules antérieures et trouver de nouveaux créneaux d'exploitation. Ce que vous venez de raconter est absolument scandaleux. Un, la spondylarthrite ankylosante est une maladie exceptionnelle. Mais deuxièmement, malheureusement, on n'a aucun moyen de la guérir.", "audio": "CO 29/034.MP3", "_test": "29", "_pos": 34, "_origlabel": "test29#34", "_sources": ["test29#34", "test30#35"]}, {"type": "document", "q": "Quelle est l'idée avancée par la journaliste ?", "c": ["Aujourd'hui, être à la mode est une préoccupation superficielle", "Il faut porter des vêtements adaptés à toutes circonstances", "La société actuelle donne trop de place à l'apparence", "La tenue vestimentaire influence l'état psychologique"], "a": 3, "transcript": "Je n'ai rien à me mettre. Avez-vous déjà prononcé cette phrase devant votre armoire pleine de vêtements ? Si vous êtes femme, quel que soit votre gabarit, enfilez une robe qui vous met en valeur, de jolies chaussures, une touche de rouge à lèvres peut-être. Vous vous sentirez, sans aucun doute, plus sûre de vous. Votre caractère en sera peut-être même transformé.", "k": "Votre caractère en sera peut-être même transformé", "audio": "CO 30/031.MP3", "_test": "30", "_pos": 31, "_origlabel": "test30#31", "_sources": ["test30#31"]}, {"type": "document", "q": "Question 30. De quoi fait le médecin ?", "c": ["Conseiller des médicaments.", "Établir un certificat médical.", "Examiner une radiographie.", "Traiter un problème de poids."], "a": 1, "k": "j'ai besoin de votre autorisation pour m'inscrire dans un club de sport", "transcript": "Bonjour docteur. Je voudrais faire de l'escalade et j'ai besoin de votre autorisation pour m'inscrire dans un club de sport. L'escalade, mais c'est très mauvais pour votre dos. Je vous conseille plutôt de faire de la natation. La natation, ce n'est pas bon pour ma peau. Et puis j'adore la montagne. Eh bien, faites plutôt de la randonnée. Ah oui, donné c'est une idée, c'est de l'aider à maigrir.", "audio": "CO 11/030.MP3", "_test": "11", "_pos": 30, "_origlabel": "test11#30", "_sources": ["test11#30"]}, {"type": "document", "q": "Question 35. Que reproche l'ONG française à l'agence européenne ?", "c": ["De contester les bienfaits des aliments naturels", "De protéger les fabricants de produits de synthèse", "De rejeter les résultats des dernières recherches", "De valoriser les qualités nutritionnelles du sucre"], "a": 2, "k": "L'agence européenne n'a pas tenu compte des études scientifiques récentes", "transcript": "Faut-il se méfier de l'aspartame, cet édulcorant utilisé à la place du sucre ? Oui, crie le réseau environnement santé, non, estime l'EFSA, l'autorité européenne de sécurité des aliments. Dans un rapport préliminaire publié début janvier, sa conclusion est que l'édulcorant ne présente aucun danger pour la santé. C'est faux, estime l'ONG française qui conteste la méthode d'expertise. Valérie Barbin et les reproches sont nombreux pour le réseau environnement santé. L'agence européenne n'a pas tenu compte des études scientifiques récentes alors que ses études montrent toutes un lien entre l'aspartame et un risque accru de cancer, de naissance prématurée et de pathologies comme le diabète.", "audio": "CO 12/035.MP3", "_test": "12", "_pos": 35, "_origlabel": "test12#35", "_sources": ["test12#35"]}, {"type": "document", "q": "De quoi il est question dans cette interview ?", "c": ["Les capacités cognitives des abeilles.", "La communication des abeilles.", "Les dangers qui menacent les abeilles.", "Les méthodes de récolte de miel."], "a": 1, "k": "les abeilles communiquent et qu'elles ont la capacité de communiquer", "transcript": "Et c'est vrai que de découvrir à quel point le cerveau des abeilles, les abeilles ont des capacités cognitives peut être, c'est l'émerveillement devant leur capacité devant ce tout petit cerveau. Et cette méga cognition peut peut-être nous aider à les protéger. Vous dites vous-même que les abeilles communiquent et qu'elles ont la capacité de communiquer. Alors j'aimerais bien qu'on justement qu'on comprenne un peu à quel point elle communique et comment elle communique. On s'arrête, peut-être sur cette fameuse danse des abeilles qui avait été décodée par les tolo Karl von Frisch. Et c'est cette danse qui leur permet de communiquer. C'est ça. Absolument. Donc ça, ça a été l'objet du prix Nobel octroyé à Karl von Frisch. Dans les années 70, il a pu découvrir après de nombreuses années d'études, que les abeilles qui reviennent d'une source de nourriture, donc une fleur qui est riche en hectares, par exemple, font à l'intérieur de la ruche une danse, c'est-à-dire des mouvements stéréotypés qui ont pour capacité d'indiquer la distance et la direction de cette source à d'autres congénères qui ne sont pas ou qui ne connaissent pas, qui ne sont pas allés à cette source de nourriture.", "audio": "CO 15/034.MP3", "_test": "15", "_pos": 34, "_origlabel": "test15#34", "_sources": ["test15#34"]}, {"type": "document", "q": "Question 35 : Quelle est la particularité du piment d'Espelette ?", "c": ["Il a été découvert en Amérique avant d'être introduit en France", "Il est cueilli uniquement en été pour être conforme aux normes", "Il est utilisé dans de nombreux plats de la cuisine basque", "Son exportation à l'étranger est fortement contrôlée"], "a": 3, "k": "une appellation d'origine contrôlée", "transcript": "Cousin du poivron, le piment d'Espelette a été rapporté d'Amérique du Sud par Christophe Colomb. Aujourd'hui, il est la seule épice française disposant d'une appellation d'origine contrôlée et sa notoriété a largement dépassé les frontières du Pays basque. Pour avoir droit à la prestigieuse appellation « Piment d'Espelette », les piments doivent être récoltés à un stade très précis.", "audio": "CO 26/035.MP3", "_test": "26", "_pos": 35, "_origlabel": "test26#35", "_sources": ["test26#35"]}, {"type": "document", "q": "Question 31. Que conseille le médecin à son patient pour perdre du poids ?", "c": ["Manger de tout, y compris ce qu'il n'aime pas", "Cesser de consommer du pain ou des féculents", "Manger plus léger sans changer ses habitudes", "Se garder de consommer des aliments sucrés"], "a": 2, "k": "L'essentiel pour parvenir à maigrir et à ne pas recommencer à grossir est de moins manger", "transcript": "Docteur, quels aliments dois-je supprimer pour ne pas grossir ? L'essentiel pour parvenir à maigrir et à ne pas recommencer à grossir est de moins manger, mais tout en respectant son mode de vie et ses goûts. Vraiment, on peut manger de tout, oui, aucun aliment n'est mauvais en soi. Tout dépend des quantités et de la façon dont il est consommé. Il faut privilégier la diversité, c'est tout. Oui, deux conseils encore : réduisez l'apport en lipides et en sucre. Privilégiez les légumes verts, en quantité modérée, ainsi que les féculents et le pain.", "audio": "CO 28/031.MP3", "_test": "28", "_pos": 31, "_origlabel": "test28#31", "_sources": ["test28#31"]}, {"type": "document", "q": "Question 36. Quel est le projet de cet organisme ?", "c": ["Installer des fontaines d'eau purifiée dans les villages.", "Encadrer les projets locaux pour créer des activités économiques.", "Distribuer gratuitement de l'eau potable.", "Construire des infrastructures de santé."], "a": 1, "k": "Encadrer les projets locaux pour créer des activités économiques.", "transcript": "L'origine de notre projet, c'est cette rencontre avec un ingénieur cambodgien qui m'a raconté sa guide dans ce village où chacun a des rizières mais où il n'y a aucune infrastructure. Je lui ai demandé ce qu'il buvait et il m'a dit « On boit l'eau de la mort ». Avec tout le cortège de maladie que vous pouvez imaginer. Donc j'ai fait le tour des grandes ONG. J'ai consulté diverses organisations et l'idée qu'on a obtenu, c'est qu'au lieu de poser la fontaine au bord de la route, de purifier l'eau et dire aux gens voilà, on va proposer à un groupe d'individus de devenir entrepreneurs. Ils vont créer leur propre activité de distribution de boisson et vont ainsi générer un chiffre d'affaires qui va leur permettre d'améliorer leur niveau de vie.", "audio": "CO 2/036.MP3", "_test": "2", "_pos": 36, "_origlabel": "test2#36", "_sources": ["test2#36"]}, {"type": "document", "q": "Question 37. Que préconise ce spécialiste face à l'engouement des jeunes pour les jeux vidéo ?", "c": ["De consulter un médecin psychothérapeute.", "Pour limiter la naissance des automobiles.", "De prescrire un traitement médicamenteux.", "D'informer les utilisateurs sur leurs dangers."], "a": 3, "k": "on l'accompagne", "transcript": "La question principale, c'est de savoir si on va médicaliser la crise d'adolescence ou pas, sachant qu'aujourd'hui le symptôme principal de la crise d'adolescence chez le garçon, c'est le jeu vidéo excessif ou l'internet excessif. Donc, si on dit addiction, on le médicalise, et ça veut dire tôt ou tard pas seulement des psychothérapies, mais des chimiothérapies pour tous les adolescents joueurs. Alors qu'on sait, encore une fois d'expérience, que 99 % arrêtent de jouer à 17 ou 18 ans parce qu'ils ont fini leurs adolescences, qui sont plus en révolte contre les parents, qui sont soucieux de s'intégrer à la société et d'avoir une activité professionnelle. Donc, à l'adolescence, on l'accompagne. Voilà, ne la pathologisons pas. Et je suis bien content que l'académie de médecine ait pris cette position.", "audio": "CO 5/037.MP3", "_test": "5", "_pos": 37, "_origlabel": "test5#37", "_sources": ["test5#37"]}, {"type": "document", "q": "Quel est le propos de ce médecin ?", "c": ["Il admet que les guérisons spontanées sont fréquentes.", "Il considère que la médecine a du mal à tout expliquer.", "Il déconseille l'utilisation de certains médicaments.", "Il est convaincu de l'efficacité des remèdes naturels."], "a": 1, "k": "il faut être un peu humble en médecine", "transcript": "Moi, j'accepte l'idée que l'homéopathie n'a pas une efficacité tellement différente d'un placebo, mais en fait nous avons besoin de médicaments qui sont des placebos, et je suis médecin et je le dis, et le problème c'est qu'aujourd'hui, à la limite, quand un patient guérit grâce à un placebo, on va sous-entendre qu'il a eu tort de guérir. C'est-à-dire que oui, effectivement, il faut être un peu humble en médecine. On ne comprend pas tout ce qui se passe, et par moment on guérit grâce à une injonction thérapeutique ou à autre chose que l'on ignore et qu'il faut étudier.", "audio": "CO 7/037.MP3", "_test": "7", "_pos": 37, "_origlabel": "test7#37", "_sources": ["test7#37"]}, {"type": "document", "q": "D'après les chercheurs dont parle le journaliste, qu'est-ce qui est bénéfique pour la santé ?", "c": ["Pratiquer des exercices mentaux", "Exprimer ses sentiments", "Se montrer chaleureux", "Se retirer régulièrement au calme"], "a": 2, "k": "plus nous manifestons d'amabilité, et plus nous sécrétons de sérotonine", "transcript": "D'après les chercheurs, plus nous manifestons d'amabilité, et plus nous sécrétons de sérotonine, l'hormone de la bonne humeur. De plus, l'altruisme aurait des effets positifs sur le cerveau en activant des connexions qui sont moins vivaces quand la compassion est absente. Les pensées hostiles ou agressives augmentent le rythme cardiaque et la pression artérielle, alors que la gentillesse abaisse le niveau de stress et apaise la tension. On a vu des gens mourir de méchanceté. L'agressivité pratiquée au quotidien augmente les risques cardiaques et conduit à une solitude qui aggrave tous les problèmes.", "audio": "CO 29/039.MP3", "_test": "29", "_pos": 39, "_origlabel": "test29#39", "_sources": ["test29#39"]}, {"type": "document", "q": "Question 36. Que permet la pratique de ce jeu vidéo aux membres d'une équipe médicale ?", "c": ["D'automatiser leurs techniques.", "D'éviter les rivalités entre collègues.", "De perfectionner leur savoir-faire.", "D'enrichir leurs échanges internes."], "a": 3, "k": "communication au sein de l'équipe médicale", "transcript": "Bruno voulait nous parler ce matin des Serious Games. Ces applications informatiques s'inspirent des jeux vidéo pour améliorer l'efficacité d'un médecin, mais pas seulement face à une maladie, face à un problème de santé. Pour mieux comprendre, on va prendre des exemples, et notamment celui qui est développé en ce moment au CHU de Toulouse, Bruno. Eh bien, ce jeu de simulation en 3D permet de tester le travail d'une équipe dans une salle d'opération. Alors, il ne porte pas sur les gestes médico-techniques, mais sur la communication au sein de l'équipe médicale et sur les procédures à respecter. C'est un jeu très utile quand on sait que près d'un tiers des événements indésirables graves liés aux soins viennent d'un problème au niveau du travail en équipe. Que permet la pratique de ce jeu vidéo aux membres d'une équipe médicale ?", "audio": "CO 35/036.MP3", "_test": "35", "_pos": 36, "_origlabel": "test35#36", "_sources": ["test35#36"]}], "devoirs": [{"type": "document", "q": "Question 37. Que préconise ce spécialiste face à l'engouement des jeunes pour les jeux vidéo ?", "c": ["De consulter un médecin psychothérapeute.", "D'attendre que le temps ait fait son œuvre.", "De prescrire un traitement médicamenteux.", "D'informer les utilisateurs sur leurs dangers."], "a": 1, "k": "l'adolescence, on l'accompagne, ne la pathologisons pas", "transcript": "Voilà, la question principale, c'est de savoir si on va médicaliser la crise d'adolescence ou pas. Sachant qu'aujourd'hui le symptôme principal de la crise d'adolescence chez le garçon, c'est le jeu vidéo excessif ou l'internet excessif. Donc, si on dit addiction, on le médicalise et ça veut dire tôt ou tard, pas seulement des psychothérapies, mais des chimiothérapies pour tous les adolescents joueurs. Alors qu'on sait encore une fois d'expérience que 99 % arrêtent de jouer à 17 ou 18 ans parce qu'ils ont fini leur crise d'adolescence, qu'ils sont plus en révolte contre les parents, qu'ils sont soucieux de s'intégrer à la société et d'avoir une activité professionnelle. Donc l'adolescence, on l'accompagne, voilà, ne la pathologisons pas, et je suis bien content que l'Académie de médecine ait pris cette position.\nQue préconise ce spécialiste face à l'engouement des jeunes pour les jeux vidéo ?", "audio": "CO 36/037.MP3", "_test": "36", "_pos": 37, "_origlabel": "test36#37", "_sources": ["test36#37"]}, {"type": "document", "q": "Question 38 : Que révèle l'étude menée sur un régime alimentaire sans viande ?", "c": ["Ses avantages nutritionnels.", "Ses conséquences financières.", "Ses effets sur l'environnement.", "Ses répercussions sur la santé."], "a": 2, "k": "une baisse record de moins 70% des émissions de carbone", "transcript": "Qu'est-ce qui se passe si tous nos petits amis, qu'on entend ici, disparaissent de nos assiettes ? Selon une récente simulation conduite à l'université John Hopkins, le résultat serait net et sans bavure. Si les humains poussent le curseur jusqu'à se passer totalement des protéines animales, on obtient une baisse record de moins 70% des émissions de carbone liées à l'alimentation. Quant à la consommation d'eau, elle serait diminuée d'environ 20%. Donc c'est énorme et pourtant cette étude ne conclut pas qu'il faut abandonner la viande et les protéines animales.", "audio": "CO 37/038.MP3", "_test": "37", "_pos": 38, "_origlabel": "test37#38", "_sources": ["test37#38"]}, {"type": "document", "q": "Question 36 : Qu'a-t-on découvert sur le sommeil ?", "c": ["Il améliore la concentration pendant la journée.", "Il réduit le stress et l'anxiété.", "Il renforce le système immunitaire.", "Il favorise la résolution de problèmes."], "a": 3, "k": "rôle essentiel dans l'inventivité et dans la résolution des problèmes", "transcript": "Petit dicton au rayon du bon sens près de chez nous : quand on a un problème, eh bien, dormons dessus. Rien de tel qu'une bonne nuit de sommeil pour y voir plus clair. Eh bien, cette vérité, sachez-le, les chercheurs américains de l'université de Californie l'ont démontrée scientifiquement. Le sommeil permet de résoudre des problèmes sans que vous fassiez quoi que ce soit. Quand on dort, vous le savez, on alterne les périodes de sommeil profond et de sommeil paradoxal. Eh bien, cette phase paradoxale, riche en rêves, jouerait un rôle essentiel dans l'inventivité et dans la résolution des problèmes. Vous avez donc compris le message : il faut dormir.", "audio": "CO 38/036.MP3", "_test": "38", "_pos": 36, "_origlabel": "test38#36", "_sources": ["test38#36"]}, {"type": "document", "q": "Question 36. Que révèle l'enquête sur le comportement des patients français ?", "c": ["Ils attendent la dernière minute avant de consulter.", "Ils consomment de plus en plus de médicaments.", "Ils pratiquent majoritairement l'automédication.", "Ils s'en remettent trop à l'autorité du praticien."], "a": 3, "k": "c'est au médecin de se débrouiller", "transcript": "Nous avons interrogé les Français, monsieur et médecin, afin de voir la première sur la santé collectée, s'il ne fait qu'un résultat qui vous a paru surprenant. Éventuellement, ce serait vous, des médecins qui considèrent que pour que la santé soit efficace, il faut que le patient intervienne le plus possible pour ses soins et pas ceux qui considèrent le médecin comme le sachant unique. Des côtés positifs à savoir. Alors les Français nous disent que c'est au médecin de se débrouiller.", "audio": "CO 11/036.MP3", "_test": "11", "_pos": 36, "_origlabel": "test11#36", "_sources": ["test11#36"]}, {"type": "document", "q": "Question 38. Qu'est-ce qui fait progresser la santé publique, selon la chronique médicale de ce journaliste ?", "c": ["Les médicaments de référence parce qu'ils sont plus efficaces que les génériques.", "Les génériques parce qu'ils compensent le coût élevé des nouveaux médicaments.", "Les médicaments de référence parce qu'ils financent les nouveaux médicaments.", "Les génériques parce qu'ils sont plus innovants que les médicaments de référence."], "a": 1, "k": "ils font faire des économies à la collectivité", "transcript": "Bien sûr, ce ne sont pas les médicaments génériques qui font directement progresser la santé puisqu'ils ont la même efficacité thérapeutique que les médicaments de référence et sont fabriqués avec les mêmes molécules. Ceci dit, ils coûtent 30 % moins chers que les médicaments de référence qui eux sont référés. Ils font faire des économies à la collectivité et les économies ainsi réalisées permettent à la collectivité de prendre en charge le remboursement des nouveaux médicaments qui sont innovants. Donc chers, les médicaments génériques ont ainsi une vocation de santé publique. Ils permettent en quelque sorte de constituer une réserve de fonds donnant accès à tous et sans description au traitement innovant de demain.", "audio": "CO 11/038.MP3", "_test": "11", "_pos": 38, "_origlabel": "test11#38", "_sources": ["test11#38"]}, {"type": "document", "q": "Question 36. Qu'a-t-on découvert sur le sommeil ?", "c": ["Il conditionne l'humeur.", "Il dope l'énergie.", "Il minimise l'angoisse.", "Il stimule la créativité."], "a": 3, "k": "joue un rôle essentiel dans l'inventivité", "transcript": "– Les chercheurs américains de l'Université de Californie ont démontré que le sommeil permet de résoudre des problèmes sans que l'on fasse quoi que ce soit. La phase paradoxale du sommeil, riche en rêves, joue un rôle essentiel dans l'inventivité et la résolution des problèmes.", "audio": "CO 17/036.MP3", "_test": "17", "_pos": 36, "_origlabel": "test17#36", "_sources": ["test17#36"]}]}, "Technologie": {"cours": [{"type": "document", "q": "Question 32. Quel est l'acte de piraterie dans ce débat ?", "c": ["L'utilisation de la musique dans les programmes télévisés.", "Les copies gratuites sur internet.", "La diffusion non autorisée en radio.", "Le partage de CD entre particuliers."], "a": 1, "k": "Les copies gratuites sur internet.", "transcript": "– Les maisons de disque se plaignent des téléchargements de fichiers musicaux sur internet. Qu'en pensez-vous ?\n– Nous enregistrons en effet une baisse des ventes parce qu'avec internet on peut tout enregistrer, c'est-à-dire piller les droits d'auteur et le travail des artistes.\n– Pourtant la piraterie a toujours existé.\n– Certes, mais les gens achètent moins depuis que ce nouveau moyen existe. Si ce phénomène continue à augmenter, le déficit sera ingérable. Pourtant, un certain nombre de produits musicaux issus d'émissions de télévision sont très à la mode et font monter les ventes de disques.\n– Oui, bien sûr, mais ce sont des produits marketing éphémères et cela ne comble pas le manque financier dû à la piraterie.", "audio": "CO 2/032.MP3", "_test": "2", "_pos": 32, "_origlabel": "test2#32", "_sources": ["test2#32"]}, {"type": "document", "q": "Question 35. Quel est l'intérêt de l'application Plana pour les usagers ?", "c": ["Allonger la durée de vie des smartphones.", "Évaluer la consommation téléphonique.", "Gérer le temps de connexion à internet.", "Optimiser l'utilisation des appareils."], "a": 3, "k": "Le principe n'est pas d'utiliser moins son smartphone, mais mieux", "transcript": "– Internet pollue. Cette technologie consomme aujourd'hui 10 % de l'énergie mondiale et cette consommation augmente d'année en année depuis 2013, elle a doublé. Alors pour enrayer ce fléau, une application a été créée afin de nous inciter à mieux utiliser nos smartphones car chaque geste compte. Comment se présente-t-elle cette application ?\n– Eh bien, comme pour mieux se faire entendre, Mathilde, elle prend la forme d'un assistant vocal dont le but est de nous aider à revoir certains de nos réflexes.\n– Et quel est le principe ?\n– Le principe n'est pas d'utiliser moins son smartphone, mais mieux. L'application Plana va donc scanner l'activité de votre téléphone. Elle va en dresser le bilan afin de pouvoir en tirer des conclusions et le rendre moins énergivore.", "audio": "CO 5/035.MP3", "_test": "5", "_pos": 35, "_origlabel": "test5#35", "_sources": ["test5#35"]}, {"type": "document", "q": "Question 35. Qu'explique la personne interviewée ?", "c": ["Établir des priorités s'avère être très difficile.", "Grâce au numérique les gains de temps sont importants.", "Il n'y a pas de limite à la quantité d'informations traitées.", "La communication en ligne est addictive."], "a": 0, "k": "on perd un petit peu le sens de la priorité", "transcript": "Si vous voulez vraiment voir quelles sont vos priorités dans une journée, ce qui est vraiment important se compte sur les doigts d'une main. Le problème, c'est que le flux d'informations aujourd'hui est tel qu'on est submergé d'informations parmi lesquelles on perd un petit peu le sens de la priorité.", "audio": "CO 6/035.MP3", "_test": "6", "_pos": 35, "_origlabel": "test6#35", "_sources": ["test6#35", "test37#34"]}, {"type": "document", "q": "Question 30. Pourquoi ce site plaît-il au propriétaire de voiture ?", "c": ["Il contrôle rigoureusement toutes les formalités de garantie.", "Il organise préalablement une rencontre avec les locataires.", "Il propose une première révision gratuite des véhicules.", "Il vérifie systématiquement l'identité de chacun de ses clients."], "a": 3, "k": "un système d'évaluation, un système de caution", "transcript": "L'internaute n'a que l'embarras du choix aujourd'hui pour trouver une voiture de particulier à louer près de chez lui. Zilooto se présente ainsi comme le numéro 1 du secteur avec plus de 1000 locations par mois et 4000 propriétaires sur toute la France. Des propriétaires qu'il a parfois fallu rassurer, Marion Carette, cofondatrice du site.\n– Spontanément, un propriétaire de voiture a peur de louer sa voiture, mais on a vraiment beaucoup travaillé sur ces aspects-là. Donc on a un contrat, on a un système d'assurance qui permet vraiment d'assurer le locataire pour la voiture qui ne lui appartient pas pendant la durée de la location. On a un système d'évaluation, un système de caution, et tout ça fait finalement que le propriétaire arrive sur notre site en étant rassuré.", "audio": "CO 8/030.MP3", "_test": "8", "_pos": 30, "_origlabel": "test8#30", "_sources": ["test8#30"]}, {"type": "document", "q": "Question 33. Qu'explique Luc Julia à propos de l'intelligence artificielle ?", "c": ["Elle engendre une peur irrationnelle.", "Elle possède un nom inapproprié.", "Son champ d'action est restreint.", "Son développement est imprévisible."], "a": 1, "k": "on n'aurait pas dû appeler ça l'intelligence artificielle", "transcript": "– Luc Julia, vous êtes spécialiste de ce qu'il ne faut pas appeler l'intelligence artificielle. Donc pourquoi votre livre s'intitule-t-il « L'intelligence artificielle n'existe pas » ?\n– En fait, c'est un constat que je fais depuis quelques années. Je suis un peu fatigué par ce que j'entends, toutes les bêtises qu'on dit sur l'intelligence artificielle. Et donc j'ai juste voulu rétablir un peu la vérité en expliquant qu'on ne sait pas ce que c'est que l'intelligence et donc qu'on ne peut pas construire de l'intelligence artificielle en ne sachant pas ce que c'est. Et du coup, ce qu'on appelle l'intelligence artificielle depuis 1956, en fait, ce sont des techniques mathématiques, statistiques, etc., qui n'ont rien à voir avec l'intelligence et on n'aurait pas dû appeler ça l'intelligence artificielle.", "audio": "CO 9/033.MP3", "_test": "9", "_pos": 33, "_origlabel": "test9#33", "_sources": ["test9#33"]}, {"type": "document", "q": "Pourquoi ce site plaît-il aux propriétaires de voitures ?", "c": ["il contrôle rigoureusement toutes les formalités de garantie", "il organise préalablement une rencontre avec les locataires", "il propose une première révision gratuite des véhicules", "il vérifie systématiquement l'identité de chacun de ses clients"], "a": 0, "transcript": "Zilok Auto se présente comme le numéro 1 du secteur. Marion Carrette : 'On a un contrat, on a un système d'assurance qui permet d'assurer vraiment le locataire pour la voiture pendant la durée de la location. On a un système d'évaluation, un système de caution, et tout ça fait que le propriétaire arrive sur notre site en étant rassuré.'", "k": "système d'assurance", "audio": "CO 30/030.MP3", "_test": "30", "_pos": 30, "_origlabel": "test30#30", "_sources": ["test30#30"]}, {"type": "document", "q": "Question 32. Comment ce sociologue étudie-t-il la communication ?", "c": ["En écoutant les gens dans la sphère privée.", "En employant des technologies innovantes.", "En interrogeant des personnes cultivées.", "En observant divers types d'interlocuteurs."], "a": 3, "k": "les hommes, les sociétés ou les cultures ne se comprennent pas mieux", "transcript": "La communication est l'une des plus grandes révolutions de notre époque moderne. Elle a bouleversé nos existences et la société. Ainsi parle Dominique Volton, sociologue très médiatique. Dominique Volton a passé sa vie à valoriser une conception originale de la communication. Il s'est penché sur les mouvements de libération de la femme, les syndicats, les médias, la politique. Une question obsède Dominique Volton. Comment réussir à cohabiter avec l'autre ? Et un paradoxe l'étonne. Malgré les techniques de communication de plus en plus performantes, les hommes, les sociétés ou les cultures ne se comprennent pas mieux qu'il y a 2000 ans. Comment ce sociologue étudie-t-il la communication ?", "audio": "CO 35/032.MP3", "_test": "35", "_pos": 32, "_origlabel": "test35#32", "_sources": ["test35#32"]}, {"type": "document", "q": "Question 31 : Qu'apprend-on sur le site historique de Pompéi ?", "c": ["Il est menacé par le trop grand nombre de visiteurs.", "Il vient d'être inscrit au patrimoine mondial de l'UNESCO.", "Il fait l'objet d'importants travaux de restauration.", "Il est fermé au public depuis plusieurs années."], "a": 0, "k": "l'inconscience des visiteurs", "transcript": "C'est le plus grand site archéologique du monde, sur une superficie de 44 hectares, il accueille chaque année 2 millions et demi de visiteurs. C'est sa chance, mais c'est aussi son malheur, car Pompéi, à une vingtaine de kilomètres de Naples, est en péril. L'Italie, qui se présente comme l'héritière du plus grand patrimoine de l'humanité, a bien tenté d'en prendre soin, mais ces dernières années, des effondrements à répétition nous montrent que l'on a franchi la frontière de l'urgence. C'est l'Europe qui s'émeut de l'état de quasi-abandon dans lequel se retrouve le site. Tout concourt à un laisser-aller dramatique, sans oublier l'inconscience des visiteurs qui se conduisent souvent dans ces ruines millénaires comme dans un vulgaire parc d'attractions.", "audio": "CO 38/031.MP3", "_test": "38", "_pos": 31, "_origlabel": "test38#31", "_sources": ["test38#31"]}, {"type": "document", "q": "Qu'apprend-on sur le site historique de Pompéi ?", "c": ["L'attitude des touristes accélère sa dégradation.", "Le financement des travaux d'entretien est menacé.", "Les autorités restaurent actuellement les vestiges.", "L'intérêt pour l'architecture des lieux est en déclin."], "a": 0, "k": "l'inconscience des visiteurs", "transcript": "C'est le plus grand site archéologique du monde. Sur une superficie de 44 hectares, il accueille chaque année 2,5 millions de visiteurs. C'est sa chance, mais c'est aussi son malheur, car Pompéi est en péril. Ces dernières années, des effondrements à répétition nous montrent que l'on a franchi la frontière de l'urgence. Tout concourt à un laissé-aller dramatique, sans oublier l'inconscience des visiteurs qui se conduisent souvent dans ces ruines comme dans un vulgaire parc d'attraction.", "audio": "CO 40/030.MP3", "_test": "40", "_pos": 30, "_origlabel": "test40#30", "_sources": ["test40#30"]}, {"type": "document", "q": "En quoi consiste le concept présenté par la société Biomim Greenloop ?", "c": ["À comparer les étapes du clonage naturel et artificiel.", "À observer l'effet des activités humaines sur la nature.", "À orienter la recherche en prenant la nature comme modèle.", "À sensibiliser les hommes à respecter leur milieu naturel."], "a": 2, "k": "s'inspirer du vivant, de la nature, pour concevoir de nouvelles technologies", "transcript": "Le biomimétisme, c'est en fait s'inspirer du vivant, de la nature, pour concevoir de nouvelles technologies, pour innover. Le monde du vivant a de nombreuses choses à nous apprendre. La vie s'est maintenue effectivement depuis 3,8 milliards d'années. On est actuellement entouré d'au moins 8 millions d'espèces qui ont toutes les leçons à nous donner pour pérenniser notre présence sur Terre.", "audio": "CO 40/033.MP3", "_test": "40", "_pos": 33, "_origlabel": "test40#33", "_sources": ["test40#33"]}, {"type": "document", "q": "Question 34. Que dit cet intervenant sur la langue française ?", "c": ["Elle crée des discriminations", "Elle enrichit les rapports", "Elle est utile pour le droit", "Elle varie selon les contextes"], "a": 1, "k": "Elle enrichit les rapports", "transcript": "Mais c'est important, la langue que l'on parle aujourd'hui en 2018, alors que l'on a du traducteur sur tous les téléphones.\n– Ah oui, c'est important parce que la langue véhicule autre chose, la langue véhicule une manière de regarder le monde, véhicule aussi des solidarités des gens qui ont fait leurs études en France, qui se sont imprégnés des systèmes, par exemple, juridiques français, non pas la même façon de raisonner et vont créer avec nous un espace très important. Et puis j'ajoute que la francophonie, ce n'est pas seulement la France. On voit bien que les membres de l'organisation internationale de la francophonie viennent de très nombreux horizons de continents différents.", "audio": "CO 18/034.MP3", "_test": "18", "_pos": 34, "_origlabel": "test18#34", "_sources": ["test18#34"]}, {"type": "document", "q": "Question 34. Que pense-t-on de l'obligation d'éteindre les portables ?", "c": ["Elle doit servir d'exemple aux enfants.", "Elle est automatique en cas de réunion.", "Elle répond à un besoin des employés.", "Elle s'applique très rarement au travail."], "a": 3, "k": "très peu de patrons demandent à leurs employés d'éteindre leurs portables", "transcript": "Interdire les téléphones de tous les lieux de travail permettrait d'être plus productifs et peut-être même de devenir plus joyeux. À ce jour, très peu de patrons demandent à leurs employés d'éteindre leurs portables quand ils entrent en salle de réunion. Pourtant, ce ne serait pas difficile à mettre en place si nos enfants sont capables de le faire quand ils vont à l'école. Cela devrait être identique pour la majorité des adultes.", "audio": "CO 22/034.MP3", "_test": "22", "_pos": 34, "_origlabel": "test22#34", "_sources": ["test22#34"]}, {"type": "document", "q": "Quelle est la mission du service présenté par cet homme ?", "c": ["Constituer un atlas mondial électronique.", "Proposer des reportages sur la vie privée.", "Recenser les plaintes pour violation d'intimité.", "Surveiller les maisons pour stopper les vols."], "a": 0, "k": "filme le monde pour en donner un accès virtuel très précis", "transcript": "— Il existe des voitures équipées de caméras à 360 degrés qui photographient le monde pour le cartographier en 3D. Présent dans plusieurs pays, ce service filme le monde pour en donner un accès virtuel très précis via internet. Mais cette application interpelle les médias, les juristes et les blogueurs sur sa légalité envers le respect de la vie privée. Sillonnant les rues, ces techniciens capturent parfois des indiscrétions. Cependant, un des géants du net estime que le floutage automatique de tous les visages et de toutes les plaques d'immatriculation doivent le prémunir des plaintes éventuelles. Néanmoins, des craintes demeurent, et entre autres celle de l'intrusion dans la vie privée, et la crainte de cambriolage potentiel suite à la publication de photos de maisons sur le réseau.", "audio": "CO1/036.MP3", "_test": "1", "_pos": 36, "_origlabel": "test1#36", "_sources": ["test1#36"]}, {"type": "document", "q": "Question 36. Qu'est-ce qu'on apprend sur l'humour ?", "c": ["Il est commun à toutes les cultures", "Il est le propre des êtres humains", "Il est lié à une grande intelligence", "Il est reproductible artificiellement"], "a": 1, "k": "le dernier refuge pour l'humanité", "transcript": "Fait, les algorithmes ne sont pas drôles. Ils ne comprennent ni les jeux de mots ni les sarcasmes, ni le deuxième degré. L'humour est un domaine qui leur échappe complètement et sans doute encore pour longtemps. Est-ce que vous saviez qu'il y a tout un champ de la recherche en intelligence artificielle qui essaye de trouver la formule mathématique de l'humour ? Mais pour l'instant, ce que montrent ces recherches et surtout leur échec, c'est que l'humour est un phénomène extrêmement complexe, plein de références culturelles hautement relatives. L'humour se traduit mal. Il fait appel à toutes sortes de ressorts psychologiques inconscients. Bref, l'humour, c'est l'ultime frontière pour les algorithmes et peut-être le dernier refuge pour l'humanité.", "audio": "CO 12/036.MP3", "_test": "12", "_pos": 36, "_origlabel": "test12#36", "_sources": ["test12#36", "test31#36"]}, {"type": "document", "q": "Question 36. Qu'explique l'intervenant à propos des nouveaux outils numériques ?", "c": ["Ils améliorent les facultés d'attention", "Ils entravent la liberté de penser", "Ils assurent les travaux fastidieux", "Ils diminuent les aptitudes cognitives"], "a": 2, "k": "déléguer aux machines certaines tâches asservissantes", "transcript": "Les nouveaux outils qu'on utilise au quotidien, est-ce qu'ils ont stimulé de nouvelles intelligences, ou est-ce qu'ils ont amoindri d'autres capacités ? On peut considérer qu'en effet, les nouveaux outils numériques, par exemple les ordinateurs, font qu'on va déléguer aux machines certaines tâches asservissantes pour l'homme. On voit pour la mémoire, le calcul mental, c'est un autre aspect. Le second, c'est que la mémoire est devenue plutôt externe. La mémoire étant externe, finalement les tâches qui nécessitaient beaucoup de temps, de concentration, de labeur plus automatique, peuvent être déléguées aux machines. Donc il y a là un espace de nouveauté.", "audio": "CO 33/036.MP3", "_test": "33", "_pos": 36, "_origlabel": "test33#36", "_sources": ["test33#36"]}, {"type": "document", "q": "Question 39 : Qu'est-ce qui empêche l'essor de l'économie verte ?", "c": ["Le manque de technologies disponibles.", "L'opposition des gouvernements.", "Le coût trop élevé des énergies renouvelables.", "Notre dépendance culturelle aux énergies fossiles."], "a": 3, "k": "du mal à sortir d'un imaginaire et d'une culture montée sur les énergies fossiles", "transcript": "Les solutions, les outils pour lancer une économie verte, a priori, ils existent. Alors pourquoi est-ce que ça coince aujourd'hui ? Mais je crois qu'il y a plusieurs raisons. Un, on a vécu depuis un siècle et demi autour des énergies fossiles, ça a été le charbon et puis évidemment le pétrole, le gaz, et au fond, ça a complètement forgé notre économie, toute notre industrie, de la chimie, beaucoup de choses en dépendent, y compris les pesticides pour l'agriculture, et puis ça a forgé notre imaginaire. Donc on a évidemment du mal à sortir d'un imaginaire et d'une culture montée sur les énergies fossiles.", "audio": "CO 38/039.MP3", "_test": "38", "_pos": 39, "_origlabel": "test38#39", "_sources": ["test38#39"]}], "devoirs": []}}</script>

var ZOOM_MIN = 60, ZOOM_MAX = 200, curZoom = 100;
function applyZoom(v){
  v = parseInt(v,10); if(isNaN(v)) v = 100;
  v = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v));
  curZoom = v;
  var stage = document.getElementById("zoomStage");
  if(stage) stage.style.transform = "scale(" + (v/100) + ")";
  var val = document.getElementById("zoomVal");
  if(val) val.textContent = v + "%";
  var r = document.getElementById("zoomRange");
  if(r && parseInt(r.value,10) !== v) r.value = v;
}
function zoomStep(d){ applyZoom(curZoom + d); }

function esc(s) {
  var t = String(s);
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hlText(text, key) {
  var h = esc(text).replace(/\n/g,"<br>");
  if (!key) return h;
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0,idx) + "<mark>" + h.substring(idx, idx+ek.length) + "</mark>" + h.substring(idx+ek.length);
    }
  } catch(e) {}
  return h;
}

  var zb = document.getElementById("zoombar"); if(zb) zb.style.display = "flex";
  render(getSavedIndex(lv));
}

function updateHeader() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  document.getElementById("hdr-sub").textContent = QQ.length + " questions · " + ok + " correcte(s)";
  var pct = Math.round((Object.keys(ans).length / QQ.length) * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("pleft").textContent = "Question " + (cur+1) + " / " + QQ.length;
  document.getElementById("pright").textContent = pct + "% complété";
}

function formatTimeJS(s) {
  if (!s || !isFinite(s) || s < 0) return "0:00";
  var m = Math.floor(s/60);
  var sec = Math.floor(s%60);
  return m + ":" + (sec<10?"0":"") + sec;
}

function pauseAllAudio() {
  for (var k in audioObjs) {
    var a = audioObjs[k];
    if (a && !a.paused) {
      a.pause();
      var icon = document.getElementById("play-icon-"+k);
      if (icon) icon.textContent = "▶";
    }
  }
}

function getOrCreateAudio(qi) {
  if (audioObjs[qi]) return audioObjs[qi];
  var q = QQ[qi];
  var a = new Audio(q.audio);
  audioObjs[qi] = a;
  a.addEventListener("loadedmetadata", function(){
    var seekEl = document.getElementById("seek-"+qi);
    var durEl = document.getElementById("time-dur-"+qi);
    if (seekEl) seekEl.max = a.duration;
    if (durEl) durEl.textContent = formatTimeJS(a.duration);
  });
  a.addEventListener("timeupdate", function(){
    var curEl = document.getElementById("time-cur-"+qi);
    var seekEl = document.getElementById("seek-"+qi);
    if (curEl) curEl.textContent = formatTimeJS(a.currentTime);
    if (seekEl) seekEl.value = a.currentTime;
  });
  a.addEventListener("ended", function(){
    var icon = document.getElementById("play-icon-"+qi);
    if (icon) icon.textContent = "▶";
  });
  return a;
}

function playAudio(qi) {
  var a = getOrCreateAudio(qi);
  var icon = document.getElementById("play-icon-"+qi);
  if (!a.paused) {
    a.pause();
    if (icon) icon.textContent = "▶";
    return;
  }
  pauseAllAudio();
  a.play().catch(function(){});
  icon = document.getElementById("play-icon-"+qi);
  if (icon) icon.textContent = "⏸";
}

function seekAudio(qi, val) {
  var a = getOrCreateAudio(qi);
  a.currentTime = parseFloat(val);
}

function render(i) {
  pauseAllAudio();
  cur = i;
  if (CUR_LEVEL) saveProgress(CUR_LEVEL, i);
  var q = QQ[i];
  var ua = ans[i];
  var done = ua !== undefined;
  var labels = ["A","B","C","D"];
  var isImage = q.type === "image";

  var imgHtml = "";
  if (isImage && q.imgData) {
    imgHtml = "<div class='img-wrap'><img src='" + q.imgData + "' alt='Q"+(i+1)+"'></div>";
  }

  var existingAudio = audioObjs[i];
  var curT = existingAudio ? existingAudio.currentTime : 0;
  var durT = (existingAudio && isFinite(existingAudio.duration)) ? existingAudio.duration : 0;
  var isPlaying = existingAudio && !existingAudio.paused;
  var audioHtml =
    "<div class='audio-row' style='flex-direction:column;align-items:stretch;gap:8px'>" +
      "<div style='display:flex;align-items:center;gap:10px'>" +
        "<button class='play-btn' onclick='playAudio("+i+")'>"+
          "<span id='play-icon-"+i+"'>"+(isPlaying?"⏸":"▶")+"</span>"+
        "</button>" +
        "<span class='audio-label'>Écouter le document</span>" +
      "</div>" +
      "<div style='display:flex;align-items:center;gap:8px'>" +
        "<span style='font-size:11px;color:#185FA5;min-width:30px;text-align:right' id='time-cur-"+i+"'>"+formatTimeJS(curT)+"</span>" +
        "<input type='range' min='0' max='"+(durT||100)+"' step='0.1' value='"+curT+"' id='seek-"+i+"' oninput='seekAudio("+i+",this.value)' style='flex:1;height:4px;accent-color:#185FA5'>" +
        "<span style='font-size:11px;color:#888;min-width:30px' id='time-dur-"+i+"'>"+formatTimeJS(durT)+"</span>" +
      "</div>" +
    "</div>";

  var choicesHtml = "";
  for (var ci=0; ci<q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      cls += " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    var txt;
    if (q.type === "document") {
      txt = "<span>" + esc(q.c[ci]) + "</span>";
    } else {
      txt = done ? "<span>" + esc(q.c[ci]) + "</span>" : "";
    }
    choicesHtml += "<button class='"+cls+"' onclick='pick("+i+","+ci+")'><span class='badge'>"+labels[ci]+"</span>"+txt+"</button>";
  }

  var feedbackHtml = "";
  if (done) {
    feedbackHtml = ua.ok
      ? "<div class='feedback ok'>✅ Bonne réponse !</div>"
      : "<div class='feedback ko'>❌ Réponse incorrecte. La bonne réponse est <strong>"+labels[q.a]+". "+esc(q.c[q.a])+"</strong></div>";
  }

  var transcriptHtml = "";
  if (done && q.transcript) {
    var tContent = hlText(q.transcript.replace(/^— /gm,""), q.k);
    var questionLine = (q.type === "document" && q.q) ? ("<div style='margin-top:.7rem;font-weight:500;font-style:normal'>" + esc(q.q) + "</div>") : "";
    transcriptHtml =
      "<div class='transcript-box' style='margin-top:.85rem'>" +
        tContent + questionLine +
      "</div>";
    if (q.k) {
      transcriptHtml += "<div class='key-label' style='margin-top:.6rem'>🔑 Phrase-clé surlignée</div>";
    }
  }

  var prevDis = i===0 ? " disabled" : "";
  var nextDis = i===QQ.length-1 ? " disabled" : "";
  var srcLabel = (q._sources && q._sources.length) ? "<span class='src-label'>Présent dans : "+q._sources.join(" · ")+"</span>" : (q._origlabel ? "<span class='src-label'>Source : "+q._origlabel+"</span>" : "");

  document.getElementById("view").innerHTML =
    "<div class='nav'>" +
      "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "<button class='btn'"+prevDis+" onclick='render("+(i-1)+")'>← Précédente</button>" +
      "<button class='btn'"+nextDis+" onclick='render("+(i+1)+")'>Suivante →</button>" +
      "<button class='btn btn-results' onclick='summary()'>Résultats</button>" +
    "</div>" +
    buildJumpBar(i) +
    "<div class='card'>" +
      "<div class='q-type-label'>"+getTypeLabel(q.type)+"</div>" + srcLabel +
      imgHtml + audioHtml +
      "<div class='question'>Q"+(i+1)+". " + (
        q.type === "document"
          ? "Écoutez le document sonore et la question, choisissez la bonne réponse."
          : q.type === "extrait"
          ? "Écoutez l'extrait sonore et les 4 propositions. Choisissez la bonne réponse."
          : "Écoutez les 4 propositions, choisissez celle qui correspond à l'image."
      ) + "</div>" +
      "<div class='choices'>"+choicesHtml+"</div>" +
      feedbackHtml + transcriptHtml +
    "</div>";

  updateHeader();
}

function buildJumpBar(cur_i) {
  if (!QQ || !QQ.length) return "";
  var h = "<div class='qjump'><span class='qjlabel'>Aller à la question :</span>";
  for (var j = 0; j < QQ.length; j++) {
    var cls = "qj";
    if (ans[j] !== undefined) cls += " answered";
    if (j === cur_i) cls += " current";
    h += "<button class='" + cls + "' onclick='render(" + j + ")'>" + (j + 1) + "</button>";
  }
  h += "</div>";
  return h;
}
function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  return { ok:ok, total: QQ.length, pct: Math.round(ok/QQ.length*100) };
}

function summary() {
  pauseAllAudio();
  var r = calcScore();
  var gridHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var cls = "grid-btn na";
    var ua = ans[i];
    if (ua) cls = ua.ok ? "grid-btn ok" : "grid-btn ko";
    gridHtml += "<button class='"+cls+"' onclick='render("+i+")' title='Q"+(i+1)+"'>"+(i+1)+"</button>";
  }
  document.getElementById("view").innerHTML =
    "<div class='summary'>" +
      "<h2>📊 Résultats – "+LEVEL_LABEL[CUR_LEVEL]+"</h2>" +
      "<div class='score-block'>" +
        "<div class='score-correct'>"+r.ok+" / "+r.total+" ✓ ("+r.pct+"%)</div>" +
      "</div>" +
      "<div class='grid'>"+gridHtml+"</div>" +
      "<div class='sum-actions'>" +
        "<button class='sum-btn' onclick='showReport()'>📋 Erreurs fréquentes</button>" +
        "<button class='sum-btn pdf' onclick='printPDF()'>🖨️ Exporter PDF</button>" +
        "<button class='sum-btn red' onclick='reset()'>↺ Recommencer cette catégorie</button>" +
        "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "</div>" +
      "<div class='sum-note'>* Banque de pratique regroupée par catégorie (type de question / position), pas un test officiel complet · Score = pourcentage de bonnes réponses</div>" +
    "</div>";
  updateHeader();
}

function showReport() {
  pauseAllAudio();
  var labels = ["A","B","C","D"];
  var wrongItems = [];
  var html = "";
  for (var i=0; i<QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    wrongItems.push(i);
    var q = QQ[i];
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
      else if (ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = q.transcript ? hlText(q.transcript, q.k) : "";
    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    html +=
      "<div class='report-item'>" +
        "<div class='qnum'>Question "+(i+1)+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.6rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.6rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }
  if (!html) html = "<div style='text-align:center;padding:2rem;color:#185FA5;font-weight:600'>🎉 Aucune erreur ! Bravo !</div>";
  document.getElementById("view").innerHTML =
    "<div class='report-header no-print'>" +
      "<strong style='font-size:16px'>📋 Rapport des erreurs ("+wrongItems.length+" question"+(wrongItems.length!==1?"s":"")+")</strong>" +
      "<button class='btn btn-results' onclick='summary()'>← Retour aux résultats</button>" +
    "</div>" +
    html;
}

function printPDF() {
  var r = calcScore();
  var labels = ["A","B","C","D"];
  var allQHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var q = QQ[i];
    var ua = ans[i];

      var cls = "report-choice neutral";
      var icon = "";
      if (done) {

        else if (ua && ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }

    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    var statusBadge = done ? (ua.ok ? " ✅" : " ❌ (→"+labels[q.a]+")") : " —";
    allQHtml +=
      "<div class='report-item'>" +
        "<div class='qnum'>Q"+(i+1)+statusBadge+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.5rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.5rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }

  var pw = window.open("","_blank");
