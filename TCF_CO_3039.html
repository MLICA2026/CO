avec lesquelles on travaille depuis très longtemps. On travaille ensemble, on leur donne des facultés à l'avance, enfin on travaille de façon très très proche.\n— Est-ce que vous avez vu disparaître vos prestataires, en fait, de sous-traitants ?\n— On a vu disparaître tellement de choses et puis...\n— Dans quelle proportion ?\n— C'est terrible. Tous les trois jours, on entend que quelque chose a fermé, quelqu'un qui fait de la dentelle, des boutons, des ateliers...", "audio": "CO 29/033.MP3", "_test": "29", "_pos": 33, "_origlabel": "test29#33", "_sources": ["test29#33"]}, {"type": "document", "q": "Quelle est la position de cette syndicaliste sur les audits au travail ?", "c": ["Elle critique la fiabilité des méthodes d'investigation utilisées", "Elle déplore leur manque d'impact au sein des entreprises", "Elle doute de la qualité de l'interprétation des données collectées", "Elle met en question la représentativité des échantillons"], "a": 0, "k": "On sait ce que c'est le sondage, la façon dont on oriente les questions", "transcript": "Ce sont les entreprises elles-mêmes qui payent la société « Une boîte à vivre » pour être auditées, et à chaque fois, entre 200 et 800 salariés sont consultés. Réaction de Marie-Alice Medeuf-Andrieu, responsable du dialogue social au sein du syndicat Force Ouvrière.\n— Quand une entreprise force ses salariés à être interrogés par une structure extérieure, forcément, vous allez vanter les qualités de votre entreprise, et vous allez répondre favorablement. Les problèmes internes de l'entreprise ne seront pas du tout dévoilés. On sait ce que c'est le sondage, la façon dont on oriente les questions. Et qui plus est, il s'agit aussi d'une procédure qui consiste à permettre à l'entreprise d'améliorer son image à l'extérieur. Donc, forcément, la réalité est biaisée.", "audio": "CO 29/035.MP3", "_test": "29", "_pos": 35, "_origlabel": "test29#35", "_sources": ["test29#35"]}, {"type": "document", "q": "Quelle dualité est inhérente à l'économie sociale et solidaire ?", "c": ["Elle cherche à recruter des jeunes diplômés néanmoins expérimentés.", "Elle est en pleine expansion, sans offrir suffisamment d'emplois.", "Elle offre des postes épanouissants quoique peu rémunérateurs.", "Elle permet à ses salariés de s'exprimer mais sans résultat concret."], "a": 2, "k": "je gagne deux fois moins", "transcript": "— Bonjour Céline Caron.\n— Bonjour.\n— Vous êtes donc spécialiste de l'économie sociale et vous constatez que de plus en plus de cadres ont envie de travailler pour des associations, sociétés mutualistes ou autres coopératives. Mais la réalité n'est pas toujours rose. Écoutons le témoignage d'une auditrice de Radio France.\n— Diplômée d'une grande école de commerce, j'ai opté pour une spécialisation en économie sociale et solidaire, et j'ai fait le choix d'un métier qui, pour moi, a du sens. J'aide les porteurs de projet à créer leur entreprise quand les banques ne veulent pas leur faire confiance. Je suis ravie du poste que j'occupe actuellement. Pourtant, en comparaison avec ceux qui ont suivi les mêmes études que moi, je gagne deux fois moins, et ça me pose souvent question.", "audio": "CO 31/033.MP3", "_test": "31", "_pos": 33, "_origlabel": "test31#33", "_sources": ["test31#33"]}, {"type": "document", "q": "Question 31. De quoi dépend le montant du pourboire au Québec ?", "c": ["De la législation en vigueur.", "De la paye des employés.", "Du bon vouloir du client.", "Du type d'établissement."], "a": 2, "k": "laisser une somme d'argent à quelqu'un pour le remercier de ses bons services", "transcript": "– Bonjour. Alors, voilà ma question. Je voudrais savoir comment fonctionne le système des pourboires au Québec, car cela varie beaucoup d'un pays à l'autre. Est-ce obligatoire ou non ?\n– Eh bien, c'est une chose courante chez nous de laisser une somme d'argent à quelqu'un pour le remercier de ses bons services, car le service n'est pas inclus dans le salaire du personnel.\n– Et comment calcule-t-on la somme d'argent qu'on doit laisser ?\n– En général, on doit laisser entre 15 et 20 % de la somme indiquée sur la facture. C'est une vraie gymnastique au moment de payer ?\n– Non, pas vraiment. Nous autres Québécois, on est habitués à ce système. Ça se fait presque automatiquement.\nDe quoi dépend le montant du pourboire au Québec ?", "audio": "CO 36/031.MP3", "_test": "36", "_pos": 31, "_origlabel": "test36#31", "_sources": ["test36#31"]}, {"type": "document", "q": "Question 32. Quel constat la journaliste fait-elle sur la contrefaçon ?", "c": ["Elle concerne de moins en moins d'articles.", "Elle est maîtrisée grâce aux contrôles.", "Elle met en danger le marché du travail.", "Elle se concentre sur des objets précieux."], "a": 2, "k": "contribue à supprimer 30 000 emplois en France chaque année", "transcript": "Longtemps, la copie illégale de produits ne concernait que le domaine du luxe. Aujourd'hui, tous les secteurs de l'économie sont atteints par ce phénomène. Pièces automobiles, prêt-à-porter, jouets ou encore médicaments. La douane française a saisi plus de 5 millions d'articles, soit deux fois plus que l'année dernière. Et on estime que cette contrefaçon contribue à supprimer 30 000 emplois en France chaque année.\nQuel constat la journaliste fait-elle sur la contrefaçon ?", "audio": "CO 36/032.MP3", "_test": "36", "_pos": 32, "_origlabel": "test36#32", "_sources": ["test36#32"]}, {"c": ["Accroître la mixité sociale dans les grandes villes.", "Décrocher des financements pour ses activités.", "Modifier le fonctionnement des marchés aux puces.", "Obtenir un statut professionnel officiel pour les biffins."], "a": 3, "q": "Que souhaite l'association dont il est question ?", "transcript": "Beaucoup de projecteurs maintenant sur la biffe. C'est un phénomène qui s'étend ici, surtout à Paris, fait par la Fricarité. Des hommes et des femmes qui ne sont pas brocanteurs font de la récup, leur métier, revendent en fait tout ce qui peut l'être. Alors le dialogue avec les autochtones n'est pas toujours simple, mais une association se mobilise pour leur permettre de poursuivre leur activité. Les acteurs du marché aux puces expliquent que ce dynamisme économique est nécessaire en ville pour lutter contre la pauvreté, pour réduire les déchets, pour créer une économie circulaire populaire et pour évidemment protéger aussi les ressources de la planète. En premier lieu, pour les familles des biffins et les biffins, c'est nécessaire d'avoir un peu d'argent en vendant sa récup, c'est un travail et il devrait être reconnu comme tel.", "k": "c'est un travail et il devrait être reconnu comme tel", "type": "document", "audio": "CO 39/030.MP3", "_test": "39", "_pos": 30, "_origlabel": "test39#30", "_sources": ["test39#30"]}, {"type": "document", "q": "Question 31. Qu'apprend-on sur le niveau d'orthographe dans le monde du travail ?", "c": ["C'est un délai négligeable pour les recruteurs.", "Il est indépendant de la promotion professionnelle.", "Il est prévu de tester celui des futurs salariés.", "La question est préoccupante pour les plus jeunes."], "a": 3, "k": "chez les jeunes de moins de 30 ans", "transcript": "Sans aller jusqu'au licenciement, quelles sont les conséquences d'un mauvais niveau d'orthographe ? Alors, les responsables des ressources humaines interrogés par l'institut de sondage reconnaissent à 52 % que cela a déjà pu jouer dans la mise à l'écart d'un candidat au moment du recrutement. Et ils sont 15 % à estimer que cela peut freiner la promotion d'un salarié. Ce n'est pas vrai pour toute la population, mais ça prend une autre proportion chez les jeunes de moins de 30 ans qui disent avoir le plus de mal avec l'orthographe. Quand on leur demande si leurs fautes ont suscité des reproches de la part de leurs collègues, leur hiérarchie ou leurs clients, ils sont deux fois plus nombreux que le reste de la population à dire oui.", "audio": "CO 21/031.MP3", "_test": "21", "_pos": 31, "_origlabel": "test21#31", "_sources": ["test21#31", "test39#31"]}, {"type": "document", "q": "Quel est le public particulièrement visé par cette publicité ?", "c": ["Les jeunes chefs d'entreprises.", "Les responsables de petites entreprises.", "Les directeurs d'entreprises publiques.", "Les sociétés des secteurs tertiaires."], "a": 1, "k": "dans mon entreprise, moi, je suis tout seul à m'occuper de tout", "transcript": "« C'est vrai que de temps en temps, on entend parler de nouvelles mesures pour l'emploi des jeunes. C'est bien, mais dans mon entreprise, moi, je suis tout seul à m'occuper de tout. Et franchement, je n'ai pas le temps de remplir toute cette paperasse. »\n« Oui, mais il y a du nouveau avec le contrat jeune en entreprise. Si on emploie un jeune peu ou pas diplômé de 16 à 22 ans, c'est zéro charge pour l'entreprise pendant deux ans et 50 % la troisième année, avec une simple déclaration à remplir auprès de l'État. Plus de souci pour les petits patrons, c'est pas mal, non ? »", "audio": "CO 14/032.MP3", "_test": "14", "_pos": 32, "_origlabel": "test14#32", "_sources": ["test14#32"]}, {"type": "document", "q": "Comment la personne interviewée envisage-t-elle le métier d'actrice ?", "c": ["Comme la possibilité de s'évader dans d'autres vies.", "Comme la réalisation d'un rêve d'enfance.", "Comme le moyen d'être le centre de l'attention.", "Comme le reflet d'un caractère authentique."], "a": 3, "k": "j'ai envie d'être le plus sincère possible", "transcript": "« Lorsque je joue un personnage, j'essaie toujours de trouver un écho à ma propre histoire ou personnalité, mais j'ai envie d'être le plus sincère possible selon moi. Jouer la comédie, c'est être dans la vérité de chaque instant. Je ne veux pas créer un personnage médiatique. Beaucoup d'artistes le font. Je ne veux pas vivre dans le mensonge ou la séduction. J'aime les rapports simples. J'aime rigoler, faire l'imbécile sans me soucier de mon image. Lorsque j'étais enfant, je rêvais d'avoir une vie ordinaire, être mariée à un homme normal, avoir des enfants et un peu d'argent aussi. Bref, tout ce que je n'avais pas à la maison — je ne pensais pas du tout devenir actrice. »", "audio": "CO 14/033.MP3", "_test": "14", "_pos": 33, "_origlabel": "test14#33", "_sources": ["test14#33"]}, {"type": "document", "q": "En quoi les projets financés par ce type d'épargne sont-ils particuliers ?", "c": ["Ils concernent des investissements à long terme.", "Ils impliquent des associations à but non lucratif.", "Ils offrent des opportunités de bénéfices élevés.", "Ils prennent en considération le facteur social."], "a": 3, "k": "embaucher des handicapés, embaucher les chômeurs de longue durée", "transcript": "« La finance solidaire. C'est un compromis entre une recherche de rentabilité du placement que l'on fait et une recherche de sens. Si on veut, on va avoir un peu moins de rentabilité, mais un peu plus de sens. Du sens, c'est faire un geste vis-à-vis d'autres, vis-à-vis d'entrepreneurs qui vont par exemple embaucher des handicapés, embaucher les chômeurs de longue durée, s'endetter pour acheter du matériel, économiser de l'énergie. C'est tout un ensemble de démarches et d'outils d'épargne. Il y a un peu moins de rentabilité, peut-être un petit peu plus de sens. »", "audio": "CO 14/034.MP3", "_test": "14", "_pos": 34, "_origlabel": "test14#34", "_sources": ["test14#34"]}, {"type": "document", "q": "Que dit ce chef de service ?", "c": ["Il annonce une réorganisation.", "Il encourage un collaborateur.", "Il négocie des délais de livraison.", "Il rappelle à l'ordre un employé."], "a": 3, "k": "N'oubliez pas que je dirige ce service et que vous devez faire ce que je vous demande.", "transcript": "N'oubliez pas que je dirige ce service et que vous devez faire ce que je vous demande. Je suis prêt à discuter avec vous à propos de l'organisation des livraisons, mais il n'est pas question de remettre en cause ma manière de travailler dans ce bureau.", "audio": "CO 15/031.MP3", "_test": "15", "_pos": 31, "_origlabel": "test15#31", "_sources": ["test15#31"]}], "devoirs": [{"type": "document", "q": "Que dit cet homme sur ce logiciel de traduction ?", "c": ["Il a besoin d'être perfectionné.", "Il fonctionne pour les romans.", "Il peut adapter la ponctuation.", "Il sert aux spécialistes du métier."], "a": 0, "k": "le travail qu'on a réalisé a dû aussi être amélioré, confirmé, valorisé et vérifié", "transcript": "– En mathématiques, les mots sont redondants. C'est l'ordre des mots qui fait tout le sens.\n– Mais dans le monde littéraire, on peut avoir une petite virgule, un point qui peut être l'objet de nombreux commentaires.\n– Et ça, aujourd'hui, il vaut mieux faire confiance à la main humaine et à sa traduction manuelle qu'à l'algorithme et à l'intelligence artificielle.\n– Donc le logiciel ne peut pas, aujourd'hui, et n'est pas prêt.\n– Si on veut nous comprendre remplacer des traducteurs humains, il n'est absolument pas prêt, ni pour la littérature ni pour les mathématiques, puisque le travail qu'on a réalisé a dû aussi être amélioré, confirmé, valorisé et vérifié par une équipe de traducteurs qui sont des professionnels de la traduction scientifique de l'anglais vers le français.", "audio": "CO 16/030.MP3", "_test": "16", "_pos": 30, "_origlabel": "test16#30", "_sources": ["test16#30"]}, {"type": "document", "q": "Question 35. Qu'est-ce qui a conduit Armel à suivre une formation continue ?", "c": ["La perte de son emploi.", "Sa volonté d'apprendre.", "Ses nouvelles fonctions.", "Un dispositif gouvernemental."], "a": 0, "k": "j'ai été licencié", "transcript": "– La formation continue offre parfois une seconde chance inespérée pour changer de cap. Armel nous le montre. Parlez-nous de votre ancien emploi.\n– Ingénieur agroalimentaire. J'ai travaillé pendant 12 ans dans un centre technique industriel dont j'ai été licencié.\n– Pourquoi avoir suivi une formation ?\n– Suite à mon licenciement, j'ai postulé à différentes offres d'emploi, mais on me reprochait toujours mon profil trop scientifique et ma méconnaissance des systèmes et acteurs de l'innovation. Afin de combler ces lacunes, je me suis inscrite en master.\n– Comment cela s'est-il déroulé ?\n– Les obstacles ont été nombreux : administratifs, financiers et organisationnels. Bon, et la double compétence acquise me permet aujourd'hui de travailler dans le domaine que je cherchais.", "audio": "CO 21/035.MP3", "_test": "21", "_pos": 35, "_origlabel": "test21#35", "_sources": ["test21#35"]}, {"type": "document", "q": "Question 35. Que redoute Jean à propos de cet emploi ?", "c": ["La perte de sa liberté intellectuelle.", "Les nombreux voyages à l'étranger.", "Un manque de reconnaissance.", "Une rémunération insuffisante."], "a": 0, "k": "la rédaction garde un droit de regard sur les papiers", "transcript": "Alors Jean, c'était ce journal. Qu'est-ce que ça a donné ?\n– C'était passionnant, épuisant parce que l'on ne compte pas ces heures. Il y a énormément de déplacements. Ça, c'est un côté agréable, mais qu'il faut gérer intelligemment par rapport à la vie de famille.\n– C'est un travail très valorisant, non ?\n– C'est vrai. On bénéficie d'une considération exceptionnelle, mais ça aussi, il faut gérer. C'est que la rédaction garde un droit de regard sur les papiers. Je crains que le travail avec eux soit trop orienté. Ils ont des accointances fortes avec certains élus, même s'ils le nient. Et ce n'est pas sans conséquence. Le salaire pourra peut-être faire oublier des réticences. La déontologie et toi, ça fait deux.", "audio": "CO 23/035.MP3", "_test": "23", "_pos": 35, "_origlabel": "test23#35", "_sources": ["test23#35"]}, {"type": "document", "q": "Question 34. Quelle est la position de ce spécialiste par rapport à cette étude ?", "c": ["Il adhère au choix de la méthodologie retenue.", "Il approuve toutes les conclusions présentées.", "Il conteste le professionnalisme des sondeurs.", "Il met en doute l'interprétation des résultats."], "a": 3, "k": "est-ce que cette étude prouve", "transcript": "Journaliste : Une étude menée dans 10 pays montre que les Français ont mauvaise opinion de leur chef d'entreprise. Bernard Ramanantsoa, vous êtes directeur d'une école de commerce. Qu'en pensez-vous ?\nBernard Ramanantsoa : C'est vrai que les dirigeants français ressortent moins bien notés. Lorsqu'il s'agit d'organiser le travail de leur équipe ou d'accompagner leurs collaborateurs dans leur évolution professionnelle, ils sont 20 points en dessous des dirigeants internationaux. Maintenant, est-ce que cette étude prouve que les chefs d'entreprise sont moins bons ou est-ce que ça prouve que les gens qui ont répondu au questionnaire, quand ils sont Français, sont capables d'être plus critiques que leurs homologues européens ? Car encore une fois, il s'agit de perceptions qu'ont les salariés de leurs patrons.", "audio": "CO 25/034.MP3", "_test": "25", "_pos": 34, "_origlabel": "test25#34", "_sources": ["test25#34"]}, {"type": "document", "q": "Question 30 : Quel regard porte cet homme sur sa célébrité ?", "c": ["Elle l'a beaucoup fasciné à ses débuts", "Elle l'a conduit à la tête d'un grand magazine", "Elle l'a laissé complètement indifférent", "Elle l'a mis en danger pendant sa carrière"], "a": 2, "k": "la célébrité n'a jamais été un objectif pour moi", "transcript": "Je n'ai pas cherché la célébrité, franchement. Des amis le savent, ils savent que j'ai gravi en ce temps-là d'être un éditeur, servant des plus grands corridors, ayant interviewé des personnalités comme Roland Barthes, Michel Foucault. Non, la célébrité n'a jamais été un objectif pour moi à l'époque, ça ne l'est toujours pas.", "audio": "CO 26/030.MP3", "_test": "26", "_pos": 30, "_origlabel": "test26#30", "_sources": ["test26#30"]}, {"type": "document", "q": "Question 34 : Qu'est-il reproché à cet emploi ?", "c": ["La perte de sa liberté intellectuelle", "Les nombreux voyages à l'étranger", "Un manque de reconnaissance", "Une rémunération insuffisante"], "a": 0, "k": "la rédaction a un droit de regard sur le papier", "transcript": "Alors Jean, cet essai au journal, qu'est-ce que ça a donné ? C'était passionnant. Épuisant, parce qu'on ne compte pas ses heures. Il y a énormément de déplacements, c'est un côté agréable. C'est un travail très valorisant, non ? C'est vrai, on bénéficie d'une considération exceptionnelle. Ce qui pose problème, c'est que la rédaction a un droit de regard sur le papier. Les gens qui travaillent avec eux peuvent être trop orientés. Il y a un manque d'indépendance.", "audio": "CO 26/034.MP3", "_test": "26", "_pos": 34, "_origlabel": "test26#34", "_sources": ["test26#34"]}, {"type": "document", "q": "Question 34. Que faut-il éviter pour progresser au sein d'une entreprise ?", "c": ["De prendre ouvertement position dans des rivalités internes", "De se confier à tous ses collègues avant de les connaître", "De trop faire valoir ses compétences pour montrer sa supériorité", "De vouloir participer à tous les projets sans vraiment s'investir"], "a": 0, "k": "Évitez cependant de rentrer dans les stratégies de clan, les querelles, les intrigues", "transcript": "Progresser dans l'entreprise est une question de compétence, mais également d'intelligence relationnelle. Ne soyez pas naïf, le monde du travail est un monde de compétition et de rivalité, une ambiance qui peut toutefois vous stimuler et accroître votre envie de réussir et de progresser. Évitez cependant de rentrer dans les stratégies de clan, les querelles, les intrigues au sein de l'entreprise. Le pouvoir peut changer de main à vos dépens. Soyez un observateur attentif des relations au sein du service, cernez la personnalité des uns et des autres et les jeux de cour, sans y participer.", "audio": "CO 28/034.MP3", "_test": "28", "_pos": 34, "_origlabel": "test28#34", "_sources": ["test28#34"]}, {"type": "document", "q": "Question 35. D'après cet entretien, que souhaite l'ensemble des intéressés ?", "c": ["De nouveaux modes de cultures", "Des circuits de distribution courts", "Des contrôles sanitaires plus rapides", "Des systèmes de production innovants"], "a": 1, "k": "réduire la distance entre la production elle-même et l'assiette", "transcript": "Le souhait de tout le monde aujourd'hui, des producteurs comme des consommateurs, c'est de réduire la distance entre la production elle-même et l'assiette. Mais c'est exactement ça, et donc nous avons vu surgir toutes les pratiques que l'on connaît, les modes de distribution relativement rapides. Et donc le premier forum a voulu être un lieu de rencontre des professionnels pour apprécier les évolutions et les modes de commercialisation et d'achat de nos concitoyens.", "audio": "CO 28/035.MP3", "_test": "28", "_pos": 35, "_origlabel": "test28#35", "_sources": ["test28#35"]}, {"type": "document", "q": "Question 39. Que cherche à faire cette entreprise ?", "c": ["Améliorer la présentation des produits.", "Augmenter le nombre de clients.", "Multiplier les points de vente.", "Maintenir des tarifs compétitifs."], "a": 3, "k": "Maintenir des tarifs compétitifs.", "transcript": "La qualité, vous savez, de très grande qualité, tout ça, ça a un prix. Si on veut se trouver une place sur le marché, il faut donc — et c'est tout un exercice — arriver à produire des aliments à des coûts qui sont quand même abordables. Et c'est l'exercice qui occupe en ce moment Sophie, gérante de Caroline. C'est une petite fabrique de pâtes et de sauce qui est installée à Saint-des-Régies.", "audio": "CO 2/039.MP3", "_test": "2", "_pos": 39, "_origlabel": "test2#39", "_sources": ["test2#39"]}, {"type": "document", "q": "Question 39. Quelle conclusion la journaliste tire-t-elle de sa visite dans cette librairie ?", "c": ["Les manuels de bonheur sont trop chers.", "Le bonheur s'achète facilement.", "Les librairies manquent de diversité.", "L'accès au bonheur nécessite du travail."], "a": 3, "k": "L'accès au bonheur nécessite du travail.", "transcript": "Peut-être aurais-je dû moi aussi faire l'acquisition de l'un de ces nombreux manuels du bonheur proposés par la librairie ? Cela m'aurait peut-être aidée à positiver, à voir les choses autrement comme le prônent justement ces ouvrages. Ainsi, je ne serais pas rentrée avec la sensation un peu déprimante, je dois le dire, que pour être heureux, eh bien il faut faire des efforts. Le bonheur n'est pas inné, nous disent les spécialistes. Il s'apprend. Et donc au rayon bonheur de la librairie — je n'invente pas, il y a bien une étiquette « bonheur » sur un rayon — les manuels proposent leur aide à grand coup d'exercices, de conseils rédigés généralement à l'impératif. On lit : « Ne vous souciez pas du regard des autres. »", "audio": "CO 34/039.MP3", "_test": "4", "_pos": 39, "_origlabel": "test4#39", "_sources": ["test4#39"]}, {"type": "document", "q": "Question 36. Dans quel but les entreprises utilisent-elles les nouveaux médias ?", "c": ["Pour faire connaître leurs services.", "Pour rechercher des collaborateurs.", "Pour s'informer sur la concurrence.", "Pour vendre leurs produits en ligne."], "a": 1, "k": "elles s'en servent de plus en plus pour recruter", "transcript": "Recruter grâce aux réseaux sociaux, ce n'est plus une tendance émergente, mais bien un mouvement de fond. En quatre ans, la part des entreprises qui utilisent les médias sociaux a plus que doublé, et elles s'en servent de plus en plus pour recruter. C'est le cas de 44 % d'entre elles.", "audio": "CO 6/036.MP3", "_test": "6", "_pos": 36, "_origlabel": "test6#36", "_sources": ["test6#36", "test8#36"]}, {"type": "document", "q": "Que dit le scientifique sur l'existence extraterrestre ?", "c": ["C'est un thème controversé.", "C'est une croyance invraisemblable.", "C'est une hypothèse vérifiée.", "C'est une invention de science-fiction."], "a": 0, "k": "j'ai des collègues qui pensent le contraire", "transcript": "– Est-ce que vous pensez que dans le cosmos, il y a une autre planète sur laquelle nous pourrions habiter ?\n– Que nous pourrions, je ne sais pas. Nous ne savons rien de cela. Je sais que mon opinion, mais c'est une opinion, ce n'est pas quelque chose que je peux appuyer par des preuves scientifiques, c'est que dans cet univers, la vie est un phénomène très général. Je pense qu'il y a beaucoup de planètes, d'exoplanètes habitées, mais je ne peux pas l'affirmer parce que je n'ai pas de preuve, et j'ai des collègues qui pensent le contraire. Donc c'est un bon sujet de discussion pour les jours où la télévision est en panne.", "audio": "CO 7/036.MP3", "_test": "7", "_pos": 36, "_origlabel": "test7#36", "_sources": ["test7#36"]}, {"type": "document", "q": "Selon cette personne, qu'est-ce que l'utilisation d'internet apporte au processus de recrutement ?", "c": ["Une diminution de la longueur des entretiens.", "Une meilleure diffusion des offres d'emploi.", "Une plus grande équité entre les candidats.", "Une protection accrue des données personnelles."], "a": 2, "k": "réduit les discriminations", "transcript": "Dans mon cabinet de recrutement, internet est devenu un outil indispensable, non seulement pour repérer des candidats potentiels sur la toile, mais également pour la phase d'entretien. Grâce au logiciel de visioconférence, les cadres ne doivent plus se déplacer, et parfois faire des centaines de kilomètres, pour s'entendre dire après 10 minutes d'entretien qu'ils n'ont pas le profil. De plus, l'utilisation de tels logiciels offre un autre avantage considérable : il réduit les discriminations, car l'entretien peut être enregistré aussi bien par le candidat que par le recruteur. Cela évite les questions déplacées. Enfin, les enregistrements peuvent être visionnés autant de fois qu'on le souhaite, ou encore être transmis à nos clients pour plus de transparence et de professionnalisme.", "audio": "CO 24/037.MP3", "_test": "24", "_pos": 37, "_origlabel": "test24#37", "_sources": ["test24#37"]}, {"type": "document", "q": "Comment réagissent les populations indigènes concernées par ce projet ?", "c": ["Elles demandent un nouveau statut juridique.", "Elles exigent des garanties réelles et tangibles.", "Elles mettent en doute la viabilité du projet.", "Elles veulent que les terres restent intactes."], "a": 1, "k": "sortir les autochtones de leurs dépendances économiques", "transcript": "Le plan Nord mise aussi sur l'appui des populations locales, notamment celui des Inuits et des Amérindiens, que l'on va former aux nouveaux emplois. Certaines nations, comme celles des Innus, ont des réticences. Ce conseiller juridique milite pour que son peuple et le gouvernement du Québec signent une entente pour sortir les autochtones de leurs dépendances économiques. De toute évidence, les retombées économiques pour les communautés autochtones ne seront pas là simplement. Mais je pense que c'est une responsabilité du gouvernement québécois de s'assurer que les jeunes Innus soient formés et qu'ils aient accès à des emplois valorisants dans les projets miniers. Certains environnementalistes ont des réserves face à ce plan qui va faciliter l'exploitation de zones jusqu'ici vierges.", "audio": "CO 24/039.MP3", "_test": "24", "_pos": 39, "_origlabel": "test24#39", "_sources": ["test24#39", "test40#38"]}, {"type": "document", "q": "Qu'explique ce voyagiste sur sa façon de travailler ?", "c": ["Il privilégie des partenaires impliqués dans la vie de leur région", "Il favorise des hôtels qui répondent aux exigences occidentales", "Il préfère les conseils des populations autochtones à ceux des fournisseurs", "Il propose des prestations qui contribuent au développement humanitaire"], "a": 0, "k": "afin que les retombées locales soient plus fortes", "transcript": "— Le choix de ce prestataire revient à un voyageur responsable. C'est eux qui embauchent les gens localement, qui vont faire des repérages, qui choisissent les hôtels avec lesquels ils travaillent et réservent directement auprès des locaux. En général, afin que les retombées locales soient plus fortes, ils vont favoriser le développement de l'économie locale.\n— Comment est-ce que vous sélectionnez les agences ?\n— On va voir déjà toutes les agences locales qui existent dans le pays. On a un certain nombre de critères sur la francophonie, sur la qualité des échanges, sur l'expertise des agents et sur leur activité responsable. Une agence en Tanzanie, par exemple, qui a monté un orphelinat, une agence au Népal qui reforeste une partie de l'Everest... Beaucoup d'agences essaient de développer très fortement leur spécificité locale.", "audio": "CO 29/036.MP3", "_test": "29", "_pos": 36, "_origlabel": "test29#36", "_sources": ["test29#36"]}, {"type": "document", "q": "Sur quel point l'homme et la femme sont-ils d'accord ?", "c": ["La situation de l'emploi ne s'améliore pas cette année en France", "La France n'est pas le pays européen le plus frappé par le chômage", "Le chômage a reculé pour tous, sans distinction d'âge ou de sexe", "L'action engagée par le gouvernement permettra une amélioration"], "a": 1, "k": "Oui, c'est vrai. C'est bien pire ailleurs chez certains de nos voisins.", "transcript": "— J'ai entendu à la radio que le chômage avait reculé en février selon le ministère du Travail.\n— Ce n'est pas l'analyse du Bureau international du travail, pour qui le taux de chômage en France n'a pas varié le mois dernier.\n— Je t'assure que, comparé avec les pays voisins, le chômage a baissé en France pour tout le monde : hommes, femmes, jeunes...\n— Oui, c'est vrai. C'est bien pire ailleurs chez certains de nos voisins. Ce qui est préoccupant, c'est que la situation s'aggrave davantage pour les femmes et les jeunes.\n— Sur l'année, ça devrait s'arranger. Le gouvernement a fait de l'action pour l'emploi sa priorité.\n— Des promesses ! Pour les 12 derniers mois, le nombre de demandeurs d'emploi a augmenté de plus de 3 %.", "audio": "CO 29/038.MP3", "_test": "29", "_pos": 38, "_origlabel": "test29#38", "_sources": ["test29#38"]}, {"type": "document", "q": "Question 38 : Qu'explique l'intervenant à propos de la pénibilité au travail ?", "c": ["La pénibilité physique reste le principal problème.", "La souffrance s'est déplacée du physique vers le psychologique.", "Le temps de travail a augmenté dans tous les secteurs.", "Les travailleurs du secteur privé souffrent davantage."], "a": 1, "k": "le malaise s'est déplacé", "transcript": "Alors, aussi bien dans le public que dans le privé, ce mal-être au travail résulte, selon vous, d'une mutation sociale profonde et structurelle du marché du travail, de notre rapport au travail ? — Ce que l'on constate, c'est que, pour essayer de résumer ça, le travail était issu étymologiquement du tripalium, le poteau de torture, tu gagneras ta vie à la sueur de ton front, etc. C'est-à-dire la pénibilité physique. Or, on constate, et c'est un paradoxe, qu'en fait, le temps de travail dans la vie a plutôt diminué, et la pénibilité physique a considérablement diminué dans la plupart des métiers. Mais ça a été compensé par, ou transformé par une charge psychique, une mobilisation psychique et une pénibilité subjective, et donc le malaise s'est déplacé.", "audio": "CO 38/038.MP3", "_test": "38", "_pos": 38, "_origlabel": "test38#38", "_sources": ["test38#38"]}, {"c": ["Expliquer l'intérêt de renseigner un document.", "Motiver les employés ayant un mauvais bilan.", "Présenter un nouveau système d'avancement.", "Remercier l'équipe pour son investissement."], "a": 0, "q": "Quel est le but de cette réunion ?", "transcript": "Bonjour et bienvenue à tous. Je vous ai convoqués aujourd'hui afin de faire un point sur les fiches préparatoires à votre entretien d'évaluation. J'ai entendu ici et là que nombreux sont ceux parmi vous qui rechignent à les remplir. Ils ont tort. Toute cette phase de réflexion vous permettra de mieux cerner les difficultés que vous avez rencontrées cette année et d'y remédier. Vous pourrez ainsi fixer de nouveaux objectifs, plus en adéquation avec les besoins réels de l'entreprise. Et surtout, de mieux faire évoluer votre carrière. Formation, promotion, augmentation.", "k": "Toute cette phase de réflexion vous permettra de mieux cerner les difficultés", "type": "document", "audio": "CO 39/039.MP3", "_test": "39", "_pos": 39, "_origlabel": "test39#39", "_sources": ["test39#39"]}, {"type": "document", "q": "Quelle est la réaction de cet homme ?", "c": ["Il demande un délai supplémentaire de réflexion.", "Il doute de l'intérêt d'un diagnostic préalable.", "Il hésite sur la définition de son projet.", "Il souhaite l'avis de consultants extérieurs."], "a": 1, "k": "je connais bien le secteur dans lequel je m'engage et je dispose déjà des informations", "transcript": "Bonjour, j'espère bientôt devenir chef d'entreprise. On me conseille de réaliser une étude de marché, mais je dois vous avouer que je ne sais pas exactement comment faire. L'étude de marché consiste à valider votre projet en identifiant sur le terrain et clients potentiels et à de votre besoin de produit de vos services. Oui, mais je connais bien le secteur dans lequel je m'engage et je dispose déjà des informations. Ne négligez pas cette étape. Elle vous permet de définir une stratégie commerciale pour atteindre nos objectifs.", "audio": "CO 15/036.MP3", "_test": "15", "_pos": 36, "_origlabel": "test15#36", "_sources": ["test15#36"]}, {"type": "document", "q": "Pourquoi l'intervenant a-t-il accepté de travailler chez JP Morgan ?", "c": ["Pour mettre en pratique ses connaissances.", "Pour opérer une reconversion professionnelle.", "Pour pouvoir rembourser son emprunt.", "Pour vivre quelques années à l'étranger."], "a": 2, "k": "je m'étais endetté pour financer cette école de commerce", "transcript": "– Je suis recruté chez JP Morgan à Londres pour bosser sur le pétrole, en fusion-acquisition, et c'était payé vraiment une fortune, 38 000 francs par mois.\n– Je ne savais pas du tout ce que c'était, la finance n'était vraiment pas mon domaine, mais bon, j'y suis allé par appât du gain, malgré tout, l'appât du gain.\n– Pourquoi ? Parce que je m'étais endetté pour financer cette école de commerce. Voilà, je découvrais des choses dans le prolongement de cette école de commerce, et je me rendais compte, expérience après expérience, que ce n'était pas du tout ma voie et que je n'avais, sous aucun prétexte, même un prétexte financier très important, envie de poursuivre dans cette voie.", "audio": "CO 16/037.MP3", "_test": "16", "_pos": 37, "_origlabel": "test16#37", "_sources": ["test16#37"]}, {"type": "document", "q": "Question 38. Que explique l'intervenant à propos de la pénibilité au travail ?", "c": ["La pénibilité au travail est d'ordre physique.", "Moins de travail physique, plus de stress explique le malaise.", "Augmentation de la pénibilité physique et psychique.", "Le malaise vient de plus de travail dans le privé."], "a": 1, "k": "compensé ou transformé par une charge psychique", "transcript": "Alors, aussi bien dans le public que dans le privé, ce mal-être au travail résulte, selon vous, d'une mutation sociale profonde et structurelle du marché du travail et de notre rapport au travail. Ce que l'on constate, c'est que, pour essayer de résumer, le travail était issu étymologiquement du tripalium, le poteau de torture : tu gagneras ta vie à la sueur de ton front, etc., c'est-à-dire la pénibilité physique. Or, on constate, et c'est un paradoxe, qu'en fait le temps de travail dans la vie a plutôt diminué, et la pénibilité physique a considérablement diminué dans la plupart des métiers, mais ça a été compensé ou transformé par une charge psychique, une mobilisation psychique et une pénibilité subjective.", "audio": "CO 19/038.MP3", "_test": "19", "_pos": 38, "_origlabel": "test19#38", "_sources": ["test19#38"]}, {"type": "document", "q": "Question 38. Qu'est-ce qui dérange la sociologue dans la conception actuelle du travail ?", "c": ["L'accès à la reconnaissance sociale est conditionné par le travail", "La réalisation de soi par le travail est devenue une obligation", "Les responsabilités au travail sont considérées comme des priorités absolues", "Le travail est systématiquement opposé à l'épanouissement personnel"], "a": 1, "k": "Il faut être complètement épanoui par le travail, forme de prescription à prendre du plaisir dans le travail.", "transcript": "Marianne Dujarier, vous êtes sociologue. Dans votre livre, L'idéal au travail, vous parlez d'un phénomène social que vous constatez dans des milieux très différents. Le travail, pour beaucoup, ressemble à un idéal qu'on n'atteint jamais. C'est cela.\n– Plus exactement le travail tel qu'il est prescrit est aujourd'hui idéal, c'est-à-dire qu'on ne peut pas déroger à cet idéal, non ? Autrement dit, l'idéal a perdu son statut d'idéal, il serait devenu une sorte de norme impossible, évidemment, à atteindre. Il faut être complètement épanoui par le travail, forme de prescription à prendre du plaisir dans le travail.", "audio": "CO 28/038.MP3", "_test": "28", "_pos": 38, "_origlabel": "test28#38", "_sources": ["test28#38"]}]}, "Education": {"cours": [{"type": "document", "q": "Quel est le principe pédagogique mis en œuvre dans ce lycée ?", "c": ["Apprendre à l'élève à se maîtriser sans la présence de professeurs.", "Imposer une progression précise à l'élève afin de l'aider à se structurer.", "Laisser l'élève progresser à son rythme en l'accompagnant patiemment.", "S'appuyer sur ce que l'élève a appris durant son parcours scolaire."], "a": 2, "k": "on leur a laissé le temps de tâtonner, de chercher, de se perdre", "transcript": "— Le seul mot d'ordre défendu par Anne-Marie Bonnisso, professeur de physique-chimie au lycée autogéré de Paris, et bien c'est : pas de pression. On a un certain nombre d'élèves qui arrivent ici après de très grandes pratiques d'absentéisme à l'école, de chahut, même d'aller en cours mais d'attendre que ça se passe, de pas avoir appris grand-chose. Et le projet, c'est qu'ils reprennent goût à la formation, qu'ils reprennent leur place dans un espace de formation. Donc on leur a laissé le temps de tâtonner, de chercher, de se perdre tout en sachant que nous, on était là pour les soutenir et que ce n'était pas, ils n'étaient pas perdus, ils étaient avec une structure derrière eux pour peu à peu trouver ce qu'ils voulaient faire.", "audio": "CO1/032.MP3", "_test": "1", "_pos": 32, "_origlabel": "test1#32", "_sources": ["test1#32"]}, {"type": "document", "q": "Question 30. Comment se prend l'étudiant pour réviser l'anglais ?", "c": ["Il parle toujours anglais avec ses amis anglais.", "Il bavarde régulièrement avec son voisin anglais.", "Il va souvent au café avec un groupe d'amis anglais.", "Il fait beaucoup d'exercices avec un ami anglais."], "a": 1, "k": "Le garçon qui a la chambre à côté de la mienne est anglais", "transcript": "– Dis, comment tu fais pour réviser ton anglais, toi ? Surtout l'oral. J'ai beau apprendre des centaines de mots, faire des exercices, je n'avance pas.\n– Moi, j'ai un truc. Pour l'oral, pas de livres, pas de cassettes. Le garçon qui a la chambre à côté de la mienne est anglais, alors on s'invite pour le café deux soirs par semaine et on parle moitié en anglais, moitié en français.\n– Ah mais c'est bien ça ! Et je pourrais venir aussi.\n– D'accord, mais tu viens avec une copine. À quatre, c'est plus amusant.", "audio": "CO 3/030.MP3", "_test": "3", "_pos": 30, "_origlabel": "test3#30", "_sources": ["test3#30"]}, {"type": "document", "q": "Question 32. Que propose le projet Capidou aux lycéens toulousains ?", "c": ["D'envisager des formations dans des secteurs de pointe.", "D'initier des programmes humanitaires.", "De concevoir des équipements technologiques.", "De prendre part à des expéditions scientifiques."], "a": 3, "k": "en les impliquant dans des expéditions sur le terrain", "transcript": "– Qui n'a pas rêvé de se glisser dans le sac d'un explorateur ? 18 lycéens toulousains ont la chance de réaliser ce rêve en participant au projet Capidou. L'explorateur Stéphane Leblanc a décidé de sensibiliser les jeunes aux problèmes de réchauffement climatique en les impliquant dans des expéditions sur le terrain.\n– Pour moi, c'est leur permettre de vivre une aventure extraordinaire.\n– Au total, 9 partenaires industriels spécialistes en recherche technologique soutiennent le projet.\n– Leur objectif est de tester en milieu extrême du matériel qui pourra servir lors de missions humanitaires. Les lycéens ont suivi un entraînement physique.", "audio": "CO 3/032.MP3", "_test": "3", "_pos": 32, "_origlabel": "test3#32", "_sources": ["test3#32"]}, {"type": "document", "q": "Question 30. De quoi traite ce reportage ?", "c": ["D'un appel à des projets imaginaires.", "D'un examen de fin d'études.", "D'un nouveau plan d'urbanisme.", "D'une rénovation d'un monument."], "a": 0, "k": "La consigne était de rêver", "transcript": "Jeunes sont complexes, se sont mesurés à cette forme unique qu'est la Tour Eiffel pour ce concours organisé par la fondation Eiffel adressé aux élèves des écoles d'architecture. La consigne était de rêver. Concevoir un édifice de très grande hauteur sur le Champ-de-Mars à Paris, à distance, accolée ou à la place de la Tour Eiffel. Trois étudiants suppriment donc carrément la tour. À la place, ils y construisent un aéroport vertical où creusent un puits de lumière avec de vastes plateaux, d'autres choisissent de la rendre habitable en comblant ses vides par des baies de couleur ou la doter d'un jardin suspendu.", "audio": "CO 5/030.MP3", "_test": "5", "_pos": 30, "_origlabel": "test5#30", "_sources": ["test5#30", "test18#31"]}, {"type": "document", "q": "Question 30. Quel est le rôle du sourire d'après ce docteur ?", "c": ["Il aide à lutter efficacement contre la tristesse.", "Il est indispensable pour l'activité de notre cerveau.", "Il montre les progrès dans l'apprentissage des émotions.", "Il permet d'entrer en relation avec les autres."], "a": 3, "k": "il participe à nos relations sociales", "transcript": "C'est un atout extraordinaire qui produit une grande confiance qui attire le regard des autres. En plus, il participe à nos relations sociales. Un sourire heureux nous rend heureux, un sourire triste nous rend triste, et toutes ces expressions de visage finalement pénètrent notre inconscient.", "audio": "CO 6/030.MP3", "_test": "6", "_pos": 30, "_origlabel": "test6#30", "_sources": ["test6#30", "test32#30"]}, {"type": "document", "q": "Question 31. Comment s'y prend l'étudiant pour réviser l'anglais ?", "c": ["Il apprend des centaines de mots par cœur.", "Il fait des exercices tous les soirs.", "Il regarde des films en anglais.", "Il parle avec son voisin de chambre, qui est anglais."], "a": 3, "k": "on parle moitié en anglais, moitié en français", "transcript": "Dis, comment tu fais pour réviser ton anglais, toi, surtout l'oral ?\n– J'ai un truc pour l'oral, pas de livre, pas de cassette. Le garçon qui a la chambre à côté de la mienne est anglais. Alors on s'invite pour le café deux soirs par semaine et on parle moitié en anglais, moitié en français.", "audio": "CO 6/031.MP3", "_test": "6", "_pos": 31, "_origlabel": "test6#31", "_sources": ["test6#31"]}, {"type": "document", "q": "Question 33. Selon la chroniqueuse, quelle est la particularité du journal Le Devoir ?", "c": ["C'est le tout dernier journal indépendant.", "Il offre un large panorama de l'actualité.", "Les articles s'adressent à un public éclairé.", "Ses lecteurs sont encouragés à réfléchir."], "a": 3, "k": "une information qui oblige à s'élever", "transcript": "Le Devoir est un de ces journaux qui est une manière pas banale de s'informer, qui brasse des idées, qui met des débats au cœur de ses cahiers, qui est une institution indépendante, ce qui est très rare en ces temps de convergence. C'est vraiment un truc très particulier qui a réussi à survivre. Je trouve que c'est un outil de démocratie. C'est une information qui oblige à s'élever. Ce n'est pas que c'est difficile de lire Le Devoir, mais en ces temps où l'information est très clipée, où les articles de journaux sont de plus en plus courts, de plus en plus prédigérés, il y a quand même un peu d'effort à faire, et c'est vrai que pour s'informer correctement, il ne faut pas croire que tout nous tombe tout cuit dans le bec. Il faut faire un effort pour s'informer, et Le Devoir, c'est ça.", "audio": "CO 8/033.MP3", "_test": "8", "_pos": 33, "_origlabel": "test8#33", "_sources": ["test8#33"]}, {"type": "document", "q": "Quel est le problème exposé ?", "c": ["Les jeunes diplômés privilégient le travail en milieu urbain.", "Les lauréats aux concours vétérinaires sont trop peu nombreux.", "Les soins aux animaux de ferme demandent une spécialisation.", "Les vétérinaires en activité refusent de former les nouveaux."], "a": 0, "k": "peu de jeunes diplômés sont attirés par le travail à la campagne", "transcript": "Bonjour et bienvenue à France Québec TV. On commence par les opportunités au Québec : figurez-vous qu'on recherche plus de 300 vétérinaires pour faire face à une certaine pénurie. Chaque année, 90 diplômés sortent des écoles vétérinaires, mais seulement 10 à 15 se consacrent aux soins des animaux de ferme. C'est que la pratique auprès des animaux d'élevage est particulièrement exigeante. Le travail demande beaucoup de déplacements, une bonne forme physique et une disponibilité 24 heures sur 24, 7 jours sur 7. Pour ces raisons, peu de jeunes diplômés sont attirés par le travail à la campagne, et les vétérinaires d'un certain âge continuent souvent parce qu'ils n'ont personne pour les remplacer.", "audio": "CO 24/033.MP3", "_test": "24", "_pos": 33, "_origlabel": "test24#33", "_sources": ["test24#33"]}, {"type": "document", "q": "Quelle hypothèse expliquerait les meilleurs résultats des garçons en mathématiques ?", "c": ["Ils bénéficient d'enseignements adaptés", "Ils se consacrent peu aux matières littéraires", "Ils sont dotés d'un esprit plus scientifique", "Ils sont encouragés lors de leur apprentissage"], "a": 3, "k": "les enseignants interrogent un petit peu moins les filles que les garçons", "transcript": "— L'idée reçue selon laquelle les filles sont moins douées pour les mathématiques que les garçons est tellement ancrée dans la tête des filles ou des femmes qu'elle vient perturber les résultats des tests, et du coup, elle auto-entretient cette idée reçue.\n— Alors, as-tu une idée, Daniel, de ce qui alimente cette idée reçue dans notre société ?\n— Alors, c'est vraiment insidieux. On peut entretenir ce stéréotype sans même s'en rendre compte. Par exemple, les enseignants en mathématiques eux-mêmes, en tout cas certains d'entre eux, pourraient avoir leur part de responsabilité. Des chercheurs ont mené des études dans des classes, ils ont observé que, dans cette discipline, statistiquement, les enseignants interrogent un petit peu moins les filles que les garçons, et que lorsque les filles prennent la parole, ils les incitent un peu moins à parler, et à parler un peu moins longtemps.", "audio": "CO 29/030.MP3", "_test": "29", "_pos": 30, "_origlabel": "test29#30", "_sources": ["test29#30"]}, {"type": "document", "q": "Question 32. Quelle mesure a été prise dans les années 80 ?", "c": ["Il a accepté les articles de presse dans les livres scolaires.", "Il a créé un journal quotidien dédié à l'éducation publique.", "Il a distribué des journaux aux établissements scolaires.", "Il a intégré l'étude de la presse à ses programmes."], "a": 3, "k": "le ministère de l'éducation nationale ne se décide à administrer l'enseignement de la presse à l'école", "transcript": "Les articles de journaux en tant qu'objets d'études dans les manuels scolaires existent depuis le XIXe siècle. En revanche, l'actualité des journaux est restée très longtemps interdite d'entrer dans les écoles. Ce n'est qu'en 1957 que le gouvernement a offert aux journaux quotidiens le droit de pénétrer tels quels dans les établissements scolaires. Ainsi, l'idée que la presse et l'école avaient quelque chose à faire ensemble, que la presse pouvait constituer un objet pédagogique, faisait son chemin. Il a fallu attendre 1983 pour que le ministère de l'éducation nationale ne se décide à administrer l'enseignement de la presse à l'école. C'est la création du CLEMI, le centre de liaison pour l'enseignement des moyens d'information.", "audio": "CO 22/032.MP3", "_test": "22", "_pos": 32, "_origlabel": "test22#32", "_sources": ["test22#32", "test29#32"]}, {"type": "document", "q": "Qu'est-ce qui ressort de l'interview concernant l'utilisation des jeux vidéo pour les élèves en décrochage ?", "c": ["C'est la solution actuellement la plus adaptée à ce problème scolaire.", "Elle permet de faire évoluer le regard des jeunes sur l'école.", "Il faut éviter de mélanger aspects éducatif et ludique à l'école.", "Les nouvelles technologies à l'école sont mal perçues par les familles."], "a": 1, "k": "inscrire l'école dans l'univers de jeunes", "transcript": "— Les jeux vidéo, ce sera le thème aujourd'hui, sont souvent, on le sait, la hantise des parents qui se plaignent qu'ils éloignent leurs enfants de la vie réelle, entre guillemets, et notamment de la scolarité. Or, une expérience qui vise à utiliser ces jeux pour ramener à l'école les décrocheurs scolaires vient de commencer à Bordeaux. Pensez-vous, Claude, que les jeux vidéo puissent être un outil efficace pour réconcilier des décrocheurs scolaires avec la scolarité ?\n— Le choix des jeux vidéo est une idée intéressante parce qu'elle permet d'inscrire l'école dans l'univers de jeunes qui ont souvent l'impression qu'elle se situe sur une planète à laquelle ils n'ont pas accès. Mais en matière de décrochage scolaire, il n'y a pas de gadget miracle, et un outil n'est efficace que s'il s'inscrit dans le cadre d'une prise en charge qui prend en compte les causes profondes du décrochage de chaque élève.", "audio": "CO 31/034.MP3", "_test": "31", "_pos": 34, "_origlabel": "test31#34", "_sources": ["test31#34"]}, {"type": "document", "c": ["Un programme sur l'agriculture.", "Un programme d'éducation pour les jeunes.", "Plus de divertissement pour les familles.", "Des émissions sur la rénovation de maison."], "a": 1, "transcript": "On trouve de tout dans le paysage visuel français. Choisir ses rosiers, comparer des voitures, repeindre sa maison, apprendre à cuisiner ou se marier avec un agriculteur. Mais on ne trouve rien, ou presque, sur l'éducation pour les 12 millions de jeunes fréquentant les établissements scolaires. Il est donc temps que le service public de télévision s'empare de ce domaine pour proposer des émissions, ou pourquoi pas une chaîne dédiée, sur tous les sujets qui préoccupent parents et éducateurs afin de leur offrir des pistes de réflexion et des réponses à leurs questions et à leurs difficultés.", "k": "on ne trouve rien, ou presque, sur l'éducation pour les 12 millions de jeunes", "q": "D'après ce journaliste, que manque-t-il à la télévision française ?", "audio": "CO 32/034.MP3", "_test": "32", "_pos": 34, "_origlabel": "test32#34", "_sources": ["test32#34"]}, {"type": "document", "q": "Question 33. Sur quoi s'opposent François Legault et Simon Tremblay-Pépin ?", "c": ["Sur l'amplitude de l'effet de la dette sur la croissance.", "Sur l'utilisation des recettes fiscales pour régler la dette.", "Sur l'acquittement de la dette par la vente du patrimoine de l'État.", "Sur le montant de la dette contractée par la province québécoise."], "a": 1, "k": "investir 100 % des redevances tirées des ressources naturelles", "transcript": "Il est en écoutant les gens maintenant. Jean-Philippe, la Coalition pour l'avenir du Québec veut aussi réduire la dette. Ce que propose François Legault, c'est d'investir 100 % des redevances tirées des ressources naturelles pour rembourser la dette. On pourrait la chercher environ 200 millions $ par année, mais pour Simon Tremblay-Pépin de l'Institut de recherche et d'information socio-économique, ce n'est pas du tout une bonne idée. Au lieu d'investir dans des services publics qui, évidemment, son dynamique qui aide à favoriser la croissance de l'économie et donc à réduire son rapport avec la dette, eh bien, là, on décide de le retirer du secteur de l'économie. Donc ça me semble tout à fait une très, très mauvaise idée de se tenter là-dedans. Sur quoi s'opposent François Legault et Simon Tremblay-Pépin ?", "audio": "CO 35/033.MP3", "_test": "35", "_pos": 33, "_origlabel": "test35#33", "_sources": ["test35#33"]}, {"type": "document", "q": "Question 30. Selon le locuteur, à quoi servent les notes à l'école ?", "c": ["À classer les établissements selon un taux de performance.", "À communiquer sur les progrès de l'élève dans chaque matière.", "À créer une échelle lisible de classification des élèves.", "À susciter chez l'élève l'envie de devenir le meilleur de la classe."], "a": 2, "k": "visibiliser les hiérarchies à l'intérieur de la classe", "transcript": "L'effet sur l'apprentissage est faible, mais les notes ont d'autres fonctions. Elles servent à visibiliser les hiérarchies à l'intérieur de la classe. Elles servent à savoir exactement à quel niveau se trouvent les élèves. Donc, elles donnent une indication très claire. Ensuite, elles permettent de faire le tri en termes de redoublement ou d'orientation. Et elles permettent aussi une objectification, une réification du jugement qu'on donne de l'élève. Par exemple, lorsqu'on communique les résultats aux parents, c'est numérique, c'est vrai, c'est objectif.\nSelon le locuteur, à quoi servent les notes à l'école ?", "audio": "CO 36/030.MP3", "_test": "36", "_pos": 30, "_origlabel": "test36#30", "_sources": ["test36#30"]}, {"type": "document", "q": "Question 30 : Que dénonce cette journaliste ?", "c": ["L'absence d'éducation financière à l'école.", "Le manque d'intérêt des jeunes pour l'argent.", "La difficulté à obtenir un crédit bancaire.", "Les dépenses excessives des familles."], "a": 0, "k": "aucune séance de travail n'est dédiée à cette question", "transcript": "Apprendre à gérer son argent n'est pas une priorité éducative, alors que l'argent nous accompagne toute notre vie. Construire un budget, ça s'apprend, mais trop souvent le sujet est considéré tabou par les adultes, donc pas question d'en parler avec les enfants. Dans la sphère de l'école, aucune séance de travail n'est dédiée à cette question, pourtant chacun est concerné dans sa vie professionnelle et personnelle par les principales notions que sont les coûts, les crédits, les prêts, les taux d'intérêt, l'endettement. L'économie à l'échelle de l'individu, voilà un domaine qui touche chaque Français sans que jamais celui-ci y soit vraiment initié.", "audio": "CO 38/030.MP3", "_test": "38", "_pos": 30, "_origlabel": "test38#30", "_sources": ["test38#30"]}, {"type": "document", "q": "Question 33 : Que font les jeunes Parisiens dont parle ce reportage ?", "c": ["Ils se baignent dans un canal de Paris.", "Ils organisent des fêtes en plein air.", "Ils pratiquent un sport nautique.", "Ils se retrouvent dans un parc municipal."], "a": 0, "k": "le canal de l'Ourcq est devenu notre espace de baignade", "transcript": "En fait, comme on habite tous le 19ème arrondissement de Paris, le canal de l'Ourcq est devenu notre espace de baignade quotidienne. Après une journée de travail, généralement on se retrouve au bord du canal, tous ensemble, et on se baigne. Aujourd'hui, on est entre 15 et 20 à se baigner régulièrement dans le canal de l'Ourcq. On est des jeunes étudiants fauchés, qui ont envie de s'amuser, qui n'ont pas forcément les moyens aussi de partir de Paris.", "audio": "CO 38/033.MP3", "_test": "38", "_pos": 33, "_origlabel": "test38#33", "_sources": ["test38#33"]}, {"c": ["La seule visée de cet enseignement est d'initier les enfants à la langue.", "Le temps imparti à cette discipline est trop court pour qu'il soit utile.", "Les élèves manquent de la maturité nécessaire pour cet apprentissage.", "Les professeurs sont opposés au concept d'une jeunesse plurilingue."], "a": 0, "q": "Pourquoi la personne interviewée minimise-t-elle l'importance de l'enseignement des langues en classe de maternelle ?", "transcript": "Et vous avez dit, je vous cite, nous sommes tous convaincus, nous tous, notamment des enseignants, des chercheurs, nous sommes tous convaincus que cet enseignement ne sert pas à grand-chose. Alors là où on était sur l'enseignement en maternelle, on parle davantage d'une sensibilisation mais pas d'un apprentissage, donc je crois qu'il faut vraiment faire la différence entre sensibilisation et apprentissage. À l'école élémentaire aujourd'hui, on est sur des créneaux de 2 x 45 minutes par exemple, par semaine, et il n'est pas question de faire des élèves bilingues. L'objectif, c'est de former des élèves qui savent communiquer.", "k": "on parle davantage d'une sensibilisation mais pas d'un apprentissage", "type": "document", "audio": "CO 39/034.MP3", "_test": "39", "_pos": 34, "_origlabel": "test39#34", "_sources": ["test39#34"]}, {"type": "document", "q": "Question 31. Que dénonce cette liste ?", "c": ["L'absence de formation sur l'élaboration d'un budget.", "Le désintérêt des jeunes pour les questions financières.", "Le manque de cours d'économie à l'université.", "Le peu d'informations des banques sur les crédits."], "a": 0, "k": "aucune séance de travail n'est dédiée à cette question", "transcript": "Apprendre à gérer son argent n'est pas une priorité éducative. Alors que l'argent nous accompagne toute notre vie, construire un budget, ça, ça s'apprend, mais trop souvent, le sujet est considéré tabou par les adultes. Donc la question d'en parler avec les enfants dans la sphère de l'école, aucune séance de travail n'est dédiée à cette question. Pourtant chacun est concerné dans sa vie professionnelle et personnelle par les principales notions que sont les coûts, les crédits, les prêts et tout l'intérêt, l'endettement, l'économie à l'échelle de l'individu. Voilà un domaine qui touche chaque Français sans que jamais celui-ci y soit vraiment initié.", "audio": "CO 11/031.MP3", "_test": "11", "_pos": 31, "_origlabel": "test11#31", "_sources": ["test11#31"]}, {"type": "document", "q": "Question 34. Que reproche le comité ministériel pour la ville aux clubs sportifs ?", "c": ["Leur habitude de privilégier les sports de combat au détriment des autres.", "Leur manque d'investissement dans des actions à caractère social.", "Leur nombre restreint dans les zones urbaines réputées difficiles.", "Leur réticence à travailler en collaboration avec le système éducatif."], "a": 1, "k": "le peu d'implication des clubs sportifs dans les réalités sociales des quartiers", "transcript": "Cette association qui se définit elle-même comme militante, s'est fixée comme objectif de favoriser l'éducation et l'insertion par le biais du sport, en particulier dans le quartier difficile. Elle défend l'idée que le sport est social et citoyen et qu'il peut s'inscrire dans un projet collectif d'éducation et d'insertion sociale et professionnelle. Elle est généreuse, mais elle ne va pas forcément de soi. Dans une étude menée avec le soutien de ce comité ministériel pour la ville, un groupe de chercheurs a mis en évidence le peu d'implication des clubs sportifs dans les réalités sociales des quartiers où ils sont pourtant implantés. Seules les minorités de ces clubs sous mot dirigés par des passionnés combatifs, cherchent à utiliser le sport comme un outil d'apprentissage de compétences sociales et professionnelles.", "audio": "CO 11/034.MP3", "_test": "11", "_pos": 34, "_origlabel": "test11#34", "_sources": ["test11#34"]}, {"type": "document", "q": "Question 35. Pourquoi le baccalauréat devrait-il être réformé selon celui qui s'exprime ?", "c": ["L'intérêt principal de sa mise en place a disparu.", "Le ministère manque de moyens pour l'organiser.", "Le taux de réussite des candidats est en baisse.", "Le nombre de fraudes constatées augmente."], "a": 0, "k": "il n'apporte plus aujourd'hui les garanties de sélection", "transcript": "Est-ce qu'il est irréformable ce baccalauréat ou on arrivera bien un jour à le réformer ? C'est obligatoire de toute façon, ce qu'on voit bien. C'est un examen qui est coûteux. Cher ça, tout le monde sait qu'il y a beaucoup d'inconvénients. En plus, il n'apporte plus aujourd'hui les garanties de sélection, parce qu'au fond, c'est ça le bac. C'est un examen. C'est bien pour sélectionner ceux qui ont de ceux qui ne sont pas jugés capables par l'éducation nationale, de sortir de ce système et d'aller vers l'enseignement supérieur. Donc, à partir du moment où il n'y a plus cette garantie-là, il faut le faire.", "audio": "CO 11/035.MP3", "_test": "11", "_pos": 35, "_origlabel": "test11#35", "_sources": ["test11#35"]}], "devoirs": [{"type": "document", "q": "En quoi consiste le défi à relever ?", "c": ["Mettre en place toutes les infrastructures d'accueil.", "Prendre en compte des aspects financiers du projet.", "Réussir l'intégration de la main-d'œuvre étrangère.", "Susciter l'adhésion de tous les habitants concernés."], "a": 0, "k": "il faut bâtir des routes, mais aussi des logements", "transcript": "— Pour faciliter l'installation des compagnies minières, il faut bâtir des routes, mais aussi des logements. Le nombre de citoyens à Fermont, une ville en plein boom minier, va doubler, comme l'explique sa mairesse.\n— Il y a des secteurs de rues qui vont ouvrir d'ici les prochaines semaines, d'ici le prochain mois. Pourquoi ? Ben pour répondre au besoin de construire des logements, des habitations, des bungalows, des appartements aussi pour les gens. C'est tout un défi qu'on a à relever.", "audio": "CO1/038.MP3", "_test": "1", "_pos": 38, "_origlabel": "test1#38", "_sources": ["test1#38", "test8#38"]}, {"type": "document", "q": "Question 36. Que recherche la cliente ?", "c": ["Un cours de musique à petit prix.", "Une école de danse pluridisciplinaire.", "Un professeur particulier.", "Un abonnement à une salle de sport."], "a": 1, "k": "Une école de danse pluridisciplinaire.", "transcript": "– Alors ce cours avec François, j'ai adoré. Il a vraiment le chic pour nous faire ressentir la musique. Ça m'a vraiment donné envie de continuer. Du coup, combien coûte le trimestre ?\n– C'est 15 € l'heure, mais si vous prenez un abonnement, ça vous reviendra moins cher.\n– Et quelles sont les conditions ?\n– Il faut prendre au moins 10 cours dans les 3 mois à venir ou 25 dans les 6 mois. Après, vous avez aussi la formule sur l'année qui revient à 8 € le cours.\n– Ah oui, c'est intéressant parce que je viens à la fois pour le classique et pour les claquettes. En même temps, il faut que je sois sûre de pouvoir m'engager.\n– À vous de voir. Cela dit, vous pouvez changer de formule à tout moment.", "audio": "CO 34/036.MP3", "_test": "4", "_pos": 36, "_origlabel": "test4#36", "_sources": ["test4#36"]}, {"type": "document", "q": "Quelle réserve le sociologue Renaud Epstein émet-il ?", "c": ["Les bâtiments restaurés sont en nombre insuffisant.", "Les cités réaménagées sont surtout résidentielles.", "Les municipalités privilégient les projets coûteux.", "Les réhabilitations ont une portée limitée."], "a": 3, "k": "ça ne change pas nécessairement les moyens qui sont mis à disposition de ces écoles", "transcript": "La rénovation urbaine est aujourd'hui plébiscitée par les élus locaux et les habitants des banlieues. Mais ce programme a aussi eu des effets pervers, selon Renaud Epstein, sociologue et spécialiste des politiques urbaines.\n– La mobilisation de milliards d'euros pour changer le bâti et changer l'urbanisme s'est faite au détriment d'autres domaines d'intervention dans ces mêmes quartiers. Parfois, on a pu rebâtir des écoles, mais ça ne change pas nécessairement les moyens qui sont mis à disposition de ces écoles pour réaliser leur mission. Il en va de même pour les équipements sociaux, culturels dans ces quartiers. Est-ce que l'enjeu ne devrait pas être plutôt d'améliorer la qualité de service dans ces quartiers ?", "audio": "CO 7/039.MP3", "_test": "7", "_pos": 39, "_origlabel": "test7#39", "_sources": ["test7#39"]}, {"type": "document", "q": "Question 36. Qu'explique cette chercheuse sur les jeux vidéos récréatifs ?", "c": ["Ils favorisent l'esprit de compétition.", "Ils influent sur les motivations des élèves.", "Ils s'appuient sur des théories éducatives.", "Ils sont adoptés par les enseignants."], "a": 2, "k": "les jeux vidéo ont importés de façon intelligente", "transcript": "Comme toute technologie pensée pour apprendre, il y a du bon et il y a du mauvais dans les écrans pour apprendre. Il faut sûrement les concevoir selon des principes pédagogiques solides. Et ce sont ces principes pédagogiques qui permettent d'apprendre : mettre des récompenses au bon moment, permettre à l'enfant de s'exercer sur du concret, de répéter ses tâches, d'avoir un défi à sa taille qui s'adapte à ses difficultés. Ce sont des principes pédagogiques qu'en réalité les jeux vidéo ont importés de façon intelligente pour nous accrocher et nous faire continuer à jouer et nous faire gagner à certains moments. Donc au fond, on pourrait dire l'inverse, c'est-à-dire que ce sont les jeux vidéo qui ont importé de bons principes de l'apprentissage.", "audio": "CO 9/036.MP3", "_test": "9", "_pos": 36, "_origlabel": "test9#36", "_sources": ["test9#36"]}, {"type": "document", "q": "Que regrette l'intervenant à propos de la construction des immeubles ?", "c": ["La mauvaise qualité des composants employés.", "L'absence de consultation des futurs occupants.", "Le manque d'audace des projets architecturaux.", "Les retards systématiques pris par les chantiers."], "a": 1, "k": "besoins de l'utilisateur", "transcript": "Il arrive très fréquemment qu'un immeuble soit livré, et dès la réception de l'ouvrage, dès la réception, qu'on change totalement l'intérieur d'un bâtiment parce que ça ne correspond pas aux besoins de l'utilisateur. Et c'est très souvent, très régulièrement lié à l'acoustique. L'acoustique n'a pas été prise en compte, ne correspond pas à l'usage du bâtiment que voulait en faire l'utilisateur, et on est obligé de changer tous les plafonds, tous les revêtements. Ça, ça coûte à la société. Si on avait en amont intégré un bureau d'études acoustiques, il aurait pu ajuster, choisir avec plus de précision les matériaux et adapter les prescriptions en fonction des besoins de l'utilisateur final.", "audio": "CO 31/038.MP3", "_test": "31", "_pos": 38, "_origlabel": "test31#38", "_sources": ["test31#38"]}, {"type": "document", "q": "D'après la personne interrogée, sur quoi repose la longévité des Alliances françaises?", "c": ["Sur l'étroite collaboration avec les équipes locales.", "Sur la formation des employés expatriés.", "Sur la prédominance de bénévoles dans chaque pays.", "Sur le montant élevé des bénéfices réalisés."], "a": 0, "k": "Il y a un conseil d'administration à caractère local", "transcript": "Bonjour, M. Le secrétaire général, le réseau Alliance Française, présent dans 136 pays du monde, existe depuis plus de 130 ans. Comment expliquez-vous une telle vitalité ? Tout d'abord, cela tient à son mode de fonctionnement original parmi à faire vivre ce qui travaille et n'a pas de but de faire des bénéfices. D'autre part, son principe, né du pari audacieux de ses fondateurs, est assez singulier. Le personnel des alliances, c'est principalement composé d'étrangers des détachés, des expatriés rejoints grâce à l'appui et au soutien du ministère des affaires étrangères. Néanmoins, il n'existe aucune alliance française strictement française dans ce pays. Il y a un conseil d'administration à caractère local parfaitement responsable en contact avec la fondation, mais dans une grande aut. Et pour autant que les principes mêmes de l'alliance française dans le monde soient respectés.", "audio": "CO 15/038.MP3", "_test": "15", "_pos": 38, "_origlabel": "test15#38", "_sources": ["test15#38"]}, {"type": "document", "q": "Question 38. Que souhaitent les grandes écoles ?", "c": ["Devenir plus attrayantes aux yeux des étrangers", "Diminuer le nombre d'inscrits d'origine française", "Diversifier les nationalités au sein de chaque cursus", "Intégrer de préférence des étudiants anglophones"], "a": 0, "k": "Devenir plus attrayantes aux yeux des étrangers", "transcript": "Les grandes écoles accueillent plus de 360 étudiants étrangers, soit 17 % de leurs effectifs. Ce chiffre est en progression avec une hausse très importante en provenance de deux régions du monde. La première, c'est la zone Asie-Pacifique. La deuxième région d'origine, c'est le Maghreb. La conférence des grandes écoles fait quelques propositions pour que la France soit plus attractive. Elle propose par exemple la possibilité d'enseigner en anglais. Mais là, on se heurte à la loi de défense de la langue française. Une autre idée est que le niveau de français de l'étranger ne soit plus une cause d'inadmissible dans une école, mais que l'on exige plutôt un niveau minimum de français.", "audio": "CO 18/038.MP3", "_test": "18", "_pos": 38, "_origlabel": "test18#38", "_sources": ["test18#38"]}, {"type": "document", "q": "Question 36. Pourquoi le baccalauréat devrait être réformé selon celui qui s'exprime ?", "c": ["L'intérêt principal de sa mise en place a disparu", "Le ministère manque de moyens pour l'organiser", "Le taux de réussite des candidats est en baisse", "Le nombre de fraudes constatées augmente"], "a": 0, "k": "il n'apporte plus aujourd'hui les garanties de sélection", "transcript": "Est-ce qu'il est irréformable, ce bac ? Car on y arrivera bien un jour à le réformer, c'est obligatoire de toute façon. Ce qu'on voit bien, c'est un examen qui coûte cher, tout le monde le sait, qui a beaucoup d'inconvénients. En plus, il n'apporte plus aujourd'hui les garanties de sélection, parce qu'au fond, c'est ça le bac : s'il y a un examen, c'est bien pour sélectionner ceux qui l'ont, de ceux qui ne sont pas jugés capables par l'Éducation nationale de sortir de ce système et d'aller vers l'enseignement supérieur. Donc, à partir du moment où il n'y a plus cette garantie-là, il faut le faire évoluer.", "audio": "CO 28/036.MP3", "_test": "28", "_pos": 36, "_origlabel": "test28#36", "_sources": ["test28#36"]}]}, "VieQuotidienne": {"cours": [{"type": "document", "q": "Question 33. Que doit faire cette personne pour vendre ses légumes ?", "c": ["Donner des conseils de préparation.", "Baisser ses prix.", "Vendre uniquement des légumes connus.", "Ouvrir un marché local."], "a": 0, "k": "Donner des conseils de préparation.", "transcript": "Il y a certains légumes qui sont moins bien connus que d'autres. La courge, entre autres, c'est quelque chose qui… vraiment, les gens la regardent avec un point d'interrogation. Qu'est-ce que je vais faire avec ça ? Donc il faut être imaginatif comme producteur pour tenter les gens de le cuisiner. Puis on comprend que le temps est tellement précieux, les gens n'ont pas le temps. Donc il faut essayer de leur trouver des trucs.", "audio": "CO 34/033.MP3", "_test": "4", "_pos": 33, "_origlabel": "test4#33", "_sources": ["test4#33"]}, {"type": "document", "q": "Question 35. Qu'est-ce qui a décidé Daniel Desmoulins à démarrer son activité ?", "c": ["La qualité croissante des résultats.", "L'aide financière du gouvernement.", "La demande des consommateurs.", "Le conseil d'un ami vigneron."], "a": 0, "k": "La qualité croissante des résultats.", "transcript": "Depuis quelques années, des vignerons ont investi des sommes importantes au Québec pour se lancer dans une nouvelle culture, comme Daniel Desmoulins qui a ouvert le vignoble L'Ange Gardien en face du fleuve Saint-Laurent. Faire du vin au Québec, c'est un challenge. Je serais peut-être pas parti là-dessus il y a 20 ans, mais je trouvais que les produits étaient de mieux en mieux, et c'est pour ça qu'il y a 10 ans avec ma femme, on a dit « On va se lancer dans le vin. » Je pense que l'on a des produits extrêmement intéressants parce qu'il y a un petit peu d'acidité. Puis il y a toujours le vin de glace. On a la température pour ça. On cueille le raisin fin décembre début janvier.", "audio": "CO 34/035.MP3", "_test": "4", "_pos": 35, "_origlabel": "test4#35", "_sources": ["test4#35"]}, {"type": "document", "q": "Question 31. Selon Hubert Reeve, pourquoi cette première observation d'un trou noir est-elle importante ?", "c": ["Elle annonce de futures découvertes.", "Elle confirme une théorie ancienne.", "Elle illustre les progrès du matériel scientifique.", "Elle permet la poursuite des travaux d'Einstein."], "a": 1, "k": "C'est une confirmation de la valeur de la science", "transcript": "– Là, on vient très récemment d'observer pour la première fois un trou noir Uber, ce quelle a été votre réaction.\n– C'est le moment où on découvre une chose pour la première fois et surtout le fait que cette idée des trous noirs qui a été inventée par Einstein dans les années 1910-15, je ne me souviens pas, c'était au départ une théorie et de trouver que le comportement de ces trous noirs existe. C'est une confirmation de la valeur de la science en général qui sont par exemple, des idées des trous noirs. Ça vous donne confiance dans la science.", "audio": "CO 5/031.MP3", "_test": "5", "_pos": 31, "_origlabel": "test5#31", "_sources": ["test5#31", "test7#31"]}, {"type": "document", "q": "D'après cette analyste, qu'est-ce qui fait le succès actuel des théories de Keynes ?", "c": ["Les contrôles systématiques imposés aux banques.", "Les interventions nécessaires des États dans l'économie.", "Les règles strictes régulant les marchés.", "Les taxes importantes appliquées aux entreprises."], "a": 1, "k": "la puissance publique est redevenue le recours", "transcript": "C'est donc le grand retour du keynésianisme ? Mais oui, cela ne se fera pas en un jour, pas plus que le libéralisme ne s'était imposé d'un coup. Mais le monde change d'époque, redécouvre les vertus de l'État et du grand économiste Keynes qui avait marqué les trois décennies d'après-guerre, parce que la déréglementation libérale a failli, que l'autorégulation des marchés est devenue difficile à préserver, que la puissance publique est redevenue le recours, et que les États, enfin, ont besoin d'argent et ne peuvent pas éluder inéluctablement une augmentation de la pression fiscale sans y soumettre d'abord les plus fortunés, entreprises ou particuliers.", "audio": "CO 7/035.MP3", "_test": "7", "_pos": 35, "_origlabel": "test7#35", "_sources": ["test7#35"]}, {"type": "document", "q": "Question 34. Qu'apprend-on sur le diamant ?", "c": ["Sa clientèle s'est diversifiée.", "Sa production s'est accélérée.", "Son estimation s'est complexifiée.", "Son prix en dollar s'est effondré."], "a": 0, "k": "Deux catégories de clients mangent les deux tiers du marché : les générations Y", "transcript": "Oui, les estimations viennent du maître du diamant, le premier producteur de la planète, l'anglo-américain De Beers. La demande mondiale de ce précieux caillou atteint le record de 82 milliards de dollars et ceux qui en raffolent poussent le diamant à battre ce record. Deux catégories de clients mangent les deux tiers du marché : les générations Y, autrement dit une population plutôt jeune, celle née dans les années 80 et dans les années 2000. Le diamant, à en croire le patron de De Beers, ce n'est plus un objet de luxe réservé à une élite aux cheveux gris.", "audio": "CO 9/034.MP3", "_test": "9", "_pos": 34, "_origlabel": "test9#34", "_sources": ["test9#34"]}, {"type": "document", "q": "Comment la personne considère-t-elle la marche ?", "c": ["C'est un temps de découverte et d'humanité", "C'est une occasion de dépenser son énergie", "C'est une opportunité d'apprécier la solitude", "C'est une possibilité quotidienne d'évasion"], "a": 0, "k": "On y rencontre à la fois le paysage, les autres, mais on se rencontre aussi soi-même.", "transcript": "Je suis un marcheur, et mes vacances se passent à marcher parce que ça me permet de réfléchir, que le rythme de la marche est musical pour les oreilles, éblouissant pour les paysages, et que les médecins m'ont démontré que l'activité musculaire permettait d'éviter des fractures des os importants, et que la vieillesse doit marcher. Je ne marche pas n'importe où, je marche sur des sentiers de grande randonnée, et j'y ai souvent fait des rencontres vraiment merveilleuses. On y rencontre à la fois le paysage, les autres, mais on se rencontre aussi soi-même.", "audio": "CO 10/031.MP3", "_test": "10", "_pos": 31, "_origlabel": "test10#31", "_sources": ["test10#31", "test40#31"]}, {"type": "document", "q": "Quel est le point développé par cet intervenant ?", "c": ["L'essor de langues internationales appauvrit la variété des langues.", "L'initiation à plusieurs langues étrangères est indispensable.", "La francophonie doit s'élargir à de nouvelles nations pour perdurer.", "Le français a trouvé sa place au carrefour du pluralisme linguistique."], "a": 3, "k": "le symbole de la diversité", "transcript": "– Vous êtes, d'un côté, un champion de la francophonie. Et, d'un autre côté, vous êtes partisan du plurilinguisme. Vous trouvez qu'il est très bon de pratiquer deux langues dès la petite enfance. N'est-ce pas contradictoire ?\n– Car le fait même que soient adhérents à la francophonie un certain nombre de pays extrêmement divers, qui représentent autant de langues, montre que ceux qui se regroupent autour de la francophonie se regroupent en fait au nom de la diversité. Le français est certes un point commun de ralliement entre eux. Mais le français n'ayant plus le moyen d'être une langue imposée aux gens comme autrefois, il est vite devenu, paradoxalement, le symbole de la diversité. C'est pourquoi je ne vis pas comme une contradiction le fait de défendre à la fois les deux.", "audio": "CO 24/032.MP3", "_test": "24", "_pos": 32, "_origlabel": "test24#32", "_sources": ["test24#32"]}, {"type": "document", "c": ["Elle est dans l'innovation constante.", "Elle est tournée vers l'exotisme.", "Elle fait la part belle à la tradition.", "Elle nécessite un service très rapide."], "a": 0, "transcript": "Des commentaires sur la gastronomie de Toronto ? On y mange très bien, mais c'est impossible d'y manger la même chose quatre ans plus tard. Comme à Québec, la gastronomie est très tendance. Qu'est-ce qui se passe aujourd'hui ? Qu'est-ce qui se passera demain ? Mais qu'est-ce qui s'est passé hier ? On ne veut plus rien savoir. Qu'est-ce qu'un restaurateur doit faire si sa cuisine n'est pas tendance, mais tout aussi bonne ? À Toronto, il doit la changer. C'est différent à Québec. J'ai l'impression qu'à Toronto, la capitale des affaires, on gère tout aux dépens des valeurs sûres.", "k": "c'est impossible d'y manger la même chose quatre ans plus tard", "q": "Que constate ce journaliste sur la gastronomie à Toronto ?", "audio": "CO 32/033.MP3", "_test": "32", "_pos": 33, "_origlabel": "test32#33", "_sources": ["test32#33"]}, {"type": "document", "q": "Question 30. Selon le chroniqueur, que permet la course par rapport à la marche ?", "c": ["De maigrir plus rapidement.", "De manger sans compter.", "De s'entraîner moins souvent.", "De vivre plus longtemps."], "a": 0, "k": "en ce qui concerne la perte de poids, c'est la course qui l'emporte", "transcript": "Marcher ou courir ? Ça dépend. C'est ce qui ressort de quelques études récentes qui ont opposé les deux exercices et mesuré leurs effets. L'une d'elles a été publiée le mois dernier dans la revue Medicine and Science in Sports and Exercise. Conclusion, en ce qui concerne la perte de poids, c'est la course qui l'emporte. Les coureurs sont plus minces, moins de surcharge pondérale que les marcheurs. Et passé l'âge de 55 ans, c'est encore plus vrai, même si le nombre de kilomètres parcourus à la course par semaine est minime, il y a une différence entre les coureurs et les marcheurs. Et la cause pourrait être l'effet de la course sur l'appétit.", "audio": "CO 37/030.MP3", "_test": "37", "_pos": 30, "_origlabel": "test37#30", "_sources": ["test37#30"]}, {"type": "document", "q": "Question 35 : Dans quel but a été fait ce reportage photo ?", "c": ["Pour documenter la vie quotidienne à M
