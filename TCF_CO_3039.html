ontréal.", "Pour comparer l'architecture de Chicago et Montréal.", "Pour conserver la mémoire des bâtiments menacés de démolition.", "Pour promouvoir le tourisme dans les quartiers historiques."], "a": 2, "k": "c'est voué, on va le démolir", "transcript": "– Quand vous revenez de Chicago, vous fondez d'abord Héritage Montréal. Pourquoi ? — Vous savez, quand je suis revenu de Chicago, j'étais là pendant quelques années à prendre des photographies des bâtiments en pierre grise à Montréal. Oui, parce que je trouvais ça formidable et ça délimitait, c'était une façon de marquer chaque quartier de Montréal. Alors, je faisais ça avec un photographe, très bien. Et puis, quand nous étions dans, par exemple, un des couvents, on nous a dit : mais pourquoi est-ce que vous êtes dans ce bâtiment, c'est voué, on va le démolir, ainsi, comme ça, partout. Alors finalement, on a compris qu'il fallait vraiment s'en occuper, surtout que je venais de Chicago et puis toutes les villes autour — Cincinnati, un peu partout — il y avait peut-être un bâtiment qui restait debout, le bâtiment victorien, et puis tout était aplati, c'était la période féroce.", "audio": "CO 38/035.MP3", "_test": "38", "_pos": 35, "_origlabel": "test38#35", "_sources": ["test38#35"]}, {"type": "document", "q": "Question 33. D'après ces journalistes, quel aspect du jeu les créateurs de la chouette d'or ont-ils mal évalué ?", "c": ["La lassitude du public pour ce genre de quête.", "Le manque d'attractivité de la récompense.", "Le temps nécessaire pour découvrir la cachette.", "Les distances à parcourir pour trouver des indices."], "a": 2, "k": "pensaient que l'énigme allait être résolue dans un délai de huit à 14 mois", "transcript": "Prenez les bottes, la carte, la boussole. Je vous emmène à la chasse au trésor, à la recherche de la chouette d'or et une sculpture qui vaut aujourd'hui 150 000 euros. Et les inventeurs de ce jeu diabolique ont concocté 11 énigmes bien difficiles du genre, le bon sens, c'est le sens du contresens et inversement, suivi d'une série de chiffres et d'un dessin et pensaient que l'énigme allait être résolue dans un délai de huit à 14 mois. Et 15 ans plus tard, malgré l'engouement suscité par le jeu, la chouette d'or n'a toujours pas été retrouvée. Enfin, du moins sa réplique en terre cuite. L'original, en effet, dans le coffre d'une banque.", "audio": "CO 11/033.MP3", "_test": "11", "_pos": 33, "_origlabel": "test11#33", "_sources": ["test11#33"]}, {"type": "document", "q": "Pour quelle raison François est-il arrivé en retard ?", "c": ["Il y a eu des problèmes de circulation automobile.", "Le réveille-matin n'a pas sonné.", "Il y a eu une panne d'électricité dans le métro.", "Le personnel du métro a fait grève."], "a": 2, "k": "il y a eu une panne de courant, et on a dû attendre que ça revienne", "transcript": "Alors François, c'est encore une fois ton réveil qui n'a pas sonné ? C'est facile pour quelqu'un qui, sans arrêt, utilise les embouteillages pour justifier ses retards au bureau. Quoi d'autre, François ? Tu es allé au travail en métro ? Non, pas cette fois. Si tu veux savoir, il y a eu une panne de courant, et on a dû attendre que ça revienne. Et aujourd'hui, si tu veux tout savoir, ça a pris plus d'un quart d'heure. Mais moi, monsieur, je ne pollue pas le matin et le soir avec ma voiture.", "audio": "CO 15/030.MP3", "_test": "15", "_pos": 30, "_origlabel": "test15#30", "_sources": ["test15#30"]}, {"type": "document", "q": "Question 30. Que recherchent les habitants de ces oasis ?", "c": ["Adopter un mode de vie collectif responsable", "Construire un réseau d'assainissement des eaux", "Faire la promotion de logements écologiques", "Mener une politique d'aménagement des villes"], "a": 0, "k": "Adopter un mode de vie collectif responsable", "transcript": "Si demain vous viviez dans une oasis, je ne vous parle pas d'un lac avec des petits palmiers au milieu du désert, mais d'une communauté, d'une petite communauté en France, en ville ou à la campagne où vos voisins seraient comme vous décidés à vivre de façon plus écolo. C'est ça les oasis, 500 petits groupes aujourd'hui, des familles qui vivent côte à côte, mais aussi ensemble et c'est peut-être avant-gardiste. Prenez par exemple au Nord-et-Loir, l'écho à mot du Plessis, 28 familles, soit 60 personnes qui vivent dans des bâtiments bioclimatiques, dont le chauffage, pour faire simple, ne pollue pas. Elles ont toutes renoncé à se brancher au tout-à-l'égout. Leurs eaux grises sont traitées dans des bassins plantés de roseaux qui dépolluent. C'est parfaitement légal et ça marche.", "audio": "CO 18/030.MP3", "_test": "18", "_pos": 30, "_origlabel": "test18#30", "_sources": ["test18#30"]}, {"type": "document", "q": "Question 33. Que doit faire cette personne pour vendre ses légumes ?", "c": ["Donner des conseils de préparation", "Éviter de faire attendre les acheteurs", "Faire connaitre des aliments oubliés", "Respecter le goût des consommateurs"], "a": 0, "k": "Donner des conseils de préparation", "transcript": "Et certains légumes qui sont moins bien connus que d'autres. Oui, la courge, entre autres, c'est quelque chose qui… Vraiment, les gens la regardent avec un point d'interrogation. Qu'est-ce que je vais faire avec ça ? Donc, il faut être imaginatif comme producteur pour tenter les gens de le cuisiner. Puis on comprend que le temps est tellement précieux. Les gens n'ont pas le temps. Donc, il faut essayer de leur trouver des trucs…", "audio": "CO 18/033.MP3", "_test": "18", "_pos": 33, "_origlabel": "test18#33", "_sources": ["test18#33"]}, {"type": "document", "q": "Question 35. Dans quel but a été fait ce reportage photo ?", "c": ["Pour accélérer la rénovation d'anciennes constructions.", "Pour comparer les styles des maisons nord-américaines.", "Pour conserver la trace du patrimoine architectural.", "Pour dénoncer la dégradation des logements urbains."], "a": 2, "k": "prendre des photographies des bâtiments, pierre grise à Montréal", "transcript": "Quand vous revenez de Chicago, vous fondez d'abord Héritage Montréal. Pourquoi ? Vous savez, quand je suis revenue de Chicago, j'étais là pendant quelques années à prendre des photographies des bâtiments, pierre grise à Montréal. Oui, parce que j'ai trouvé ça formidable et ça délimite. C'était une façon de marquer chaque quartier de Montréal. Alors je faisais ça avec un photographe. Et puis, quand nous étions par exemple dans un couvent, on m'a dit : mais pourquoi est-ce que vous êtes dans ce bâtiment, c'est voué à démolir comme ça partout. Alors finalement, j'ai compris qu'il fallait vraiment le faire, surtout que je venais de Chicago. Et puis toutes les villes autour, en trois ans, un peu partout, il y avait peut-être un bâtiment qui restait debout, le bâtiment Victoria, et puis tout était aplati. C'était une période féroce.", "audio": "CO 19/035.MP3", "_test": "19", "_pos": 35, "_origlabel": "test19#35", "_sources": ["test19#35"]}, {"type": "document", "q": "Qu'apprend-on sur la mise en place des circuits courts ?", "c": ["Elle se heurte aux systèmes existants.", "Elle est complexe à développer en Europe.", "Elle est soutenue par les grandes surfaces.", "Elle représente une solution d'avenir."], "a": 3, "k": "une alternative crédible à l'agriculture mondialisée", "transcript": "Au moment où l'on semble découvrir qu'il faut pour fabriquer un plat cuisiné, un traîneur aux Pays-Bas et un autre à Chypre, un atelier de découpe de viande en Roumanie, un grossiste des Pyrénées, une usine au Luxembourg, ne serait-il pas tant d'examiner d'un peu plus près ces fameux circuits courts ?\n– Les quoi ?\n– Les circuits courts des modes de distribution alimentaire qui limitent les intermédiaires et les distances parcourues entre le producteur et le consommateur. Réseau d'achat groupé et vente à commerce local. Et si le circuit court court-circuitait notre modèle agricole et si la consommation de proximité devenait une alternative crédible à l'agriculture mondialisée ?", "audio": "CO 20/033.MP3", "_test": "20", "_pos": 33, "_origlabel": "test20#33", "_sources": ["test20#33"]}, {"type": "document", "q": "Question 33. Selon ce journaliste, comment s'explique l'enrichissement des Escoffier ?", "c": ["Des recettes ont été baptisées en l'honneur de clients réputés.", "La promotion de son restaurant a été confiée à des personnalités.", "Un accueil chaleureux et généreux était réservé aux habitués.", "Un partenariat inédit entre hôtel et restaurant a été mis en place."], "a": 0, "k": "en dédiant par exemple, les nouveaux plats inventés par Escoffier aux convives célèbres", "transcript": "Auguste Escoffier, c'est le roi des cuisiniers, le cuisinier des rois, qui est connu pour ses innovations culinaires et son habitude de présenter à ses hôtes ses plats en salle. Une belle amitié et une incroyable complicité avec César Ritz ont, pendant l'hôtellerie, fait de leur association un des plus grands succès de la fin du 19ème siècle. Leur idée de séduire la clientèle et de lui offrir le rêve. En dédiant par exemple, les nouveaux plats inventés par Escoffier aux convives célèbres comme la pêche Melba ou la timbale Garibaldi a assuré leur fortune.", "audio": "CO 22/033.MP3", "_test": "22", "_pos": 33, "_origlabel": "test22#33", "_sources": ["test22#33"]}, {"type": "document", "q": "Question 33 : Pourquoi cette jeune femme a-t-elle été surprise ?", "c": ["La notice était impossible à lire", "La traduction était partielle", "L'emballage était défectueux", "Les céréales étaient périmées"], "a": 1, "k": "J'ai cherché en français", "transcript": "Alors, moi en fait, je préparais mon meeting, je voulais regarder quelle était la proposition du produit. C'était marqué « Le plein d'énergie naturelle ». J'étais en train de regarder un petit peu, et là j'ai remarqué une petite mention, sous l'effet de... enfin... qui parlait de femmes enceintes. J'ai cherché en français, ça m'a déçue de comprendre ce qui était mentionné. Là, j'ai eu une mauvaise surprise : il y a tellement de mots écrits en français, même en regardant sur tous les aspects du paquet... En fait, moi j'ai compris ce que ça voulait dire, c'est qu'on n'est pas ensemble, c'est... pour les femmes enceintes, ce produit n'était pas bien indiqué pour ces personnes-là.", "audio": "CO 26/033.MP3", "_test": "26", "_pos": 33, "_origlabel": "test26#33", "_sources": ["test26#33"]}, {"type": "document", "q": "Quelles sont les limites du recours au médiateur lors d'un conflit avec sa banque ?", "c": ["Le nombre de médiateurs est insuffisant pour répondre à la demande.", "Les banques influencent les décisions prises par les médiateurs.", "Les demandeurs trouvent que la procédure est trop longue et compliquée.", "Quelle que soit la nature du litige, le médiateur n'a qu'un pouvoir consultatif."], "a": 3, "k": "Le médiateur a deux mois pour rendre un avis", "transcript": "— Oui effectivement, la loi de 2001 a fait obligation aux banques de désigner un médiateur qui est là pour, justement, tenter de régler les problèmes. Et la FBF a fait voter à l'époque que les modalités pour saisir le médiateur doivent être précisées dans le relevé de banque et dans le contrat. Donc pour savoir comment saisir le médiateur, il faut lire le relevé de banque ou le contrat. On doit y avoir toutes les précisions. Le médiateur a deux mois pour rendre un avis. Ce n'est qu'un avis, hein, entendons-nous bien, et là, disons qu'il y a parfois un petit problème. C'est d'abord peu de clients ont recours au médiateur, il faudrait être beaucoup plus que disons nombreux. Et deuxièmement, ce sont parfois des renvoyeurs de balle, c'est-à-dire ceux qui s'adressent à eux ont le sentiment qu'ils n'ont pas été compris ni entendus.", "audio": "CO1/039.MP3", "_test": "1", "_pos": 39, "_origlabel": "test1#39", "_sources": ["test1#39", "test33#37"]}, {"type": "document", "q": "Question 37. De quoi s'étonne le premier interlocuteur ?", "c": ["De la mise en vente libre de jouets sans contrôle sanitaire.", "Du prix élevé des jouets.", "De l'absence de jouets éducatifs.", "Du manque de réglementation sur les matériaux."], "a": 0, "k": "De la mise en vente libre de jouets sans contrôle sanitaire.", "transcript": "Bonjour à tous. Noël est passé et bien maintenant on va s'intéresser aux jouets et à leur conception. Je pensais qu'on ne pouvait pas mettre un jouet sur le commerce s'il n'était pas sain pour les enfants et pour les grands aussi, parce qu'il y a des grands qui jouent aussi un petit peu normal. Alors il est vrai que pour les jouets, il existe des réglementations qui s'appliquent notamment sur l'interdiction de certaines substances chimiques qui ne doivent pas être présentes dans les jouets ou alors avec une limite de concentration à ne pas dépasser. Après, comme tous les produits de consommation mis sur le marché, il n'y a pas d'autorisation de mise sur le marché comme ça existe pour les médicaments.", "audio": "CO 34/037.MP3", "_test": "4", "_pos": 37, "_origlabel": "test4#37", "_sources": ["test4#37"]}], "devoirs": [{"type": "document", "q": "Question 38. Que recommande l'eurodéputée Evelyne Gebhardt ?", "c": ["Un durcissement des politiques relatives à la consommation.", "Un renforcement des pouvoirs de la Commission européenne.", "Une homogénéisation des règlementations internationales.", "Une législation dans le respect de la singularité des États."], "a": 3, "k": "nous laissons une flexibilité aux États membres", "transcript": "En Grande-Bretagne ? Quand un consommateur achète un produit défectueux, il a le choix entre la réparation, le remplacement ou le remboursement. En Allemagne, c'est le commerçant qui décide pour lui. Eh bien, la commission européenne veut mettre à plat toutes ces législations et proposer des règles communes en matière de protection des consommateurs, harmonisation maximale ou minimale au Parlement européen. Le débat dure depuis deux ans. L'eurodéputée socialiste allemande, Evelyne Gebhardt, redoute l'harmonisation maximale préconisée par Bruxelles. Elle estime que la commission doit respecter les usages en cours dans chaque pays. Nous avons des traditions, des cultures très différentes et les consommateurs ont des demandes différentes aussi dans les États membres, ce qui crée évidemment une différenciation assez grande dans le droit qui existe. C'est pour ça que jusqu'à maintenant, nous avons toujours dit que nous faisons une harmonisation minimale, un minimum de droits qui doivent être là et nous laissons une flexibilité aux États membres pour donner une réponse aux demandes des citoyens.", "audio": "CO 5/038.MP3", "_test": "5", "_pos": 38, "_origlabel": "test5#38", "_sources": ["test5#38"]}, {"type": "document", "q": "Question 37. Comment les médias utilisent les faits divers ?", "c": ["Comme un prétexte pour éviter de traiter les questions significatives.", "Comme une occasion de commenter ce qui ne va pas dans notre société.", "Comme un moyen de sensibiliser le public aux problèmes des individus.", "Comme une façon de distraire les individus de leurs petits soucis quotidiens."], "a": 0, "k": "les médias contournent gaillardement les problèmes majeurs collectifs", "transcript": "À leur donner tant d'importance sans les commenter, les médias contournent gaillardement les problèmes majeurs collectifs, qui, eux, ne sont pas divers. Ces catastrophes si diverses sont mises en avant pour faire diversion, pour détourner de ce qui est plus général et plus important.", "audio": "CO 6/037.MP3", "_test": "6", "_pos": 37, "_origlabel": "test6#37", "_sources": ["test6#37", "test14#38", "test30#38"]}, {"type": "document", "q": "Question 39. Que dénonce ce journaliste à propos des supermarchés ?", "c": ["L'absence d'éthique de certains produits.", "La qualité relative des aliments labellisés bio.", "L'influence de la publicité sur le choix du client.", "L'utilisation systématique d'emballage."], "a": 0, "k": "des produits issus de l'exploitation des hommes ou de la nature", "transcript": "Faisons un tour au supermarché. Comme tous ceux de son espèce, celui de mon quartier a entamé progressivement sa mutation en accordant de plus en plus de place aux produits bio, au commerce équitable, aux emballages recyclables. C'est encore timide, mais disons qu'il y a le choix. Je peux donc, comme l'explique le professeur Patel, choisir ce qui est bien plutôt que ce qui est mal. Mais je réalise à présent que le mal fait aussi partie du choix. Le mal, autrement dit des produits issus de l'exploitation des hommes ou de la nature, qui maltraitent les premiers et détruisent la seconde, sont en vente libre. À chaque individu, en somme, de se débrouiller avec sa conscience.", "audio": "CO 9/039.MP3", "_test": "9", "_pos": 39, "_origlabel": "test9#39", "_sources": ["test9#39"]}, {"type": "document", "q": "Quelle est l'opinion de cet homme au sujet des villes du futur ?", "c": ["Leur aménagement doit suivre un modèle vertical", "Leur conception doit s'affranchir des modes du passé", "Leur développement est une menace pour l'environnement", "Leur expansion est loin d'être un phénomène inéluctable"], "a": 1, "transcript": "L'urbaniste Jacques Ferrier : 'On va vivre dans un monde urbain. Ce monde urbain, ce n'est pas une fatalité que ça soit un monde repoussant. Mais pour ça, il faut changer la façon de voir la ville. Il faut arrêter de dessiner la ville comme sur du papier quadrillé, il faut dessiner la ville de façon autre et de façon beaucoup plus sensible.'", "k": "changer la façon de voir la ville", "audio": "CO 30/036.MP3", "_test": "30", "_pos": 36, "_origlabel": "test30#36", "_sources": ["test30#36"]}, {"type": "document", "q": "Que propose cette entreprise ?", "c": ["Des articles neufs à prix imbattable.", "Des chaussures en matières recyclées.", "Un mode de consommation durable.", "Un type inédit de magasin associatif."], "a": 2, "k": "location", "transcript": "Cette cliente achète en moyenne sept paires de chaussures à l'année. Pour ces nouvelles bottines, elle pourra même changer d'avis d'ici deux mois. Moyennant un abonnement mensuel de 39 euros, elle a opté pour la location.\n— Le budget se retrouve diminué, et on consomme plus... plus responsable, plutôt que d'avoir plein de paires que je stocke, et... et c'est pas bien.\nLa formule est testée auprès d'une trentaine de clientes de Bocage, la marque de moyen de gamme du groupe Éram. Le principe : au bout des deux mois, la paire peut être rachetée 60 % moins cher qu'au prix du neuf, ou bien restituée en magasin afin d'être portée par une nouvelle personne.", "audio": "CO 31/037.MP3", "_test": "31", "_pos": 37, "_origlabel": "test31#37", "_sources": ["test31#37", "test37#37"]}, {"type": "document", "q": "Question 39 : Quelle est la particularité de cohabitat ?", "c": ["La collaboration des futurs occupants des logements.", "La conception de logements dans un bâtiment préexistant.", "La production rapide d'un nombre important de logements.", "La rénovation de vieux logements par la municipalité."], "a": 1, "k": "Plutôt que de démolir, on a utilisé la structure", "transcript": "L'histoire de Cohabitat, depuis le début jusqu'à la mise en œuvre du chantier, c'est dix ans de réflexion, de mise en commun, d'élaboration de tout. L'historique de la construction est assez intéressante parce qu'ici où on est maintenant, c'était un ancien édifice gouvernemental. Plutôt que de démolir, on a utilisé la structure qui était de très bonne qualité pour pouvoir construire des logements neufs. La construction de Cohabitat a permis la création de 42 unités de logement pour pouvoir accommoder des personnes seuls et des retraité et des familles.", "audio": "CO 37/039.MP3", "_test": "37", "_pos": 39, "_origlabel": "test37#39", "_sources": ["test37#39"]}, {"type": "document", "q": "Qui est lésé d'après l'intervenant ?", "c": ["Les acheteurs.", "Les commerçants.", "Les entreprises.", "Les pouvoirs publics."], "a": 0, "k": "les consommateurs vont peut-être jeter des produits", "transcript": "Il y a le manque de clarté au niveau de la politique des dates de péremption au Canada, parce que souvent les consommateurs vont peut-être jeter des produits quand la date de « meilleure avant » est passée. Mais ça n'a pas nécessairement dire que le produit est insalubre. Le produit peut être encore bon. Il y a des forces démographiques qui jouent contre l'industrie. Il y a une soif de profit au sein de l'industrie. Pourquoi ? Parce que les gens mangent moins, les gens vieillissent au Canada. Donc, comment fait-on pour atteindre nos objectifs de vente ? Quand les gens mangent moins, il faut trouver des différents moyens pour augmenter ses recettes.", "audio": "CO 20/036.MP3", "_test": "20", "_pos": 36, "_origlabel": "test20#36", "_sources": ["test20#36"]}, {"type": "document", "q": "Question 37. Qui est à l'aise selon l'intervenant ?", "c": ["Les acheteurs.", "Les commerçants.", "Les entreprises.", "Les pouvoirs publics."], "a": 0, "k": "les consommateurs vont peut-être jeter des produits quand la date meilleure avant est passée", "transcript": "Il y a le manque de clarté au niveau de la politique des dates de péremption au Canada, parce que souvent les consommateurs vont peut-être jeter des produits quand la date meilleure avant est passée. Mais ça n'a pas nécessairement dire que le produit est insalubre. Le produit peut être encore bon. Il y a des forces démographiques qui jouent contre l'industrie. Il y a une soif de profit au sein de l'industrie. Pourquoi ? Parce que les gens mangent moins, les gens vieillissent au Canada. Donc, comment fait-on pour atteindre nos objectifs de vente ? Quand les gens mangent moins, il faut trouver des différents moyens pour augmenter ses recettes.", "audio": "CO 22/037.MP3", "_test": "22", "_pos": 37, "_origlabel": "test22#37", "_sources": ["test22#37"]}]}, "Famille": {"cours": [{"type": "document", "q": "Question 30. Qu'est-ce qui différencie les moins de 30 ans des générations précédentes ?", "c": ["Ils habitent plus longtemps en location.", "Ils perçoivent un salaire plus élevé.", "Ils s'investissent dans des associations.", "Ils sont tentés par les dépenses."], "a": 3, "k": "Ils sont tentés par les dépenses.", "transcript": "Les moins de 30 ans ne représentent que 10 % des locataires. Pourtant, ils dépensent plus pour se loger, en moyenne 6 000 € par an, soit 42 % de plus que les autres. Ils ont également des revenus plus faibles que leurs parents au même âge, alors qu'ils sont nettement plus diplômés. Et la différence en France est nettement plus importante que dans les pays européens comparables. Mais ça ne freine pas leur envie de consommer. Leur appétit de consommation est plus important que celui de leurs aînés, d'autant plus que, peu intéressés par les structures sociales existantes, les jeunes s'identifient à des groupes dont le point commun est justement la consommation. C'est le règne de la consommation symbole et le triomphe du marketing.", "audio": "CO 2/030.MP3", "_test": "2", "_pos": 30, "_origlabel": "test2#30", "_sources": ["test2#30"]}, {"type": "document", "q": "Question 31. Qu'est-ce qui différencie les moins de 30 ans des générations précédentes ?", "c": ["Ils gagnent plus que leurs parents.", "Ils épargnent davantage.", "Ils sont moins diplômés.", "Ils sont tentés par les dépenses."], "a": 3, "k": "Ils sont tentés par les dépenses.", "transcript": "Les moins de 30 ans ne représentent que 10 % des locataires. Pourtant, ils dépensent plus pour se loger, en moyenne 6 000 € par an, soit 42 % de plus que les autres. Ils ont également des revenus plus faibles que leurs parents au même âge, alors qu'ils sont nettement plus diplômés. Mais ça ne freine pas leur envie de consommer. Leur appétit de consommation est plus important que celui de leurs aînés. D'autant plus que, peu intéressés par les structures sociales existantes, les jeunes s'identifient à des groupes dont le point commun est justement la consommation. C'est le règne de la consommation symbole et le triomphe du marketing.", "audio": "CO 34/031.MP3", "_test": "4", "_pos": 31, "_origlabel": "test4#31", "_sources": ["test4#31"]}, {"type": "document", "q": "Question 34. Qu'est-ce qui explique le comportement des enfants en matière de vêtements ?", "c": ["L'influence des publicités télévisées.", "Les conseils de leurs parents.", "Le besoin de ressembler aux autres.", "Le goût pour les vêtements de luxe."], "a": 2, "k": "Le besoin de ressembler aux autres.", "transcript": "Déjà à l'âge de 4-5 ans, on peut dire, ils sont attirés par des marques, ils veulent avoir leur look. C'est quand même terrible de s'apercevoir que tout petit déjà, on est sous influence. L'âge à partir duquel les enfants commencent à s'intéresser à cette notion de marque a diminué. Le phénomène n'est pas nouveau, mais l'âge décroît sensiblement. Évidemment, la socialisation joue un rôle puisque l'enfant vit toujours sous l'influence de ses pairs. Il va vouloir faire comme les autres parce qu'il y a l'effet de groupe. On ne veut pas être mis à l'écart.", "audio": "CO 34/034.MP3", "_test": "4", "_pos": 34, "_origlabel": "test4#34", "_sources": ["test4#34"]}, {"type": "document", "q": "Question 34. Quel conseil est donné aux parents pour faciliter le retour en France de leurs enfants ?", "c": ["De choisir une école avec un petit nombre de classes.", "De permettre aux jeunes de parler de leur chagrin.", "De placer les enfants dans une école internationale.", "D'expliquer le système scolaire français aux enfants."], "a": 1, "k": "de laisser l'enfant exprimer son mal-être", "transcript": "Le retour en France peut ne pas être évident pour les enfants d'expatriés. Le succès passe souvent par l'accueil de l'école, comme en témoigne Marie Leblanc dont les enfants ont intégré une petite école de quartier. Chaque maîtresse avait préparé les enfants à la venue des nouveaux en disant qu'ils avaient vécu à l'étranger. Les enfants étaient valorisés, avaient plein de choses à raconter. Mais l'adaptation présente parfois des difficultés, comme ce fut le cas pour les enfants de Françoise Casalis. Eux, ils ont eu beaucoup de mal à s'adapter au système scolaire français, assez rigide. Un des conseils que l'on peut donner aux parents, c'est de laisser l'enfant exprimer son mal-être. Il faut que l'enfant puisse faire son deuil.", "audio": "CO 8/034.MP3", "_test": "8", "_pos": 34, "_origlabel": "test8#34", "_sources": ["test8#34"]}, {"type": "document", "q": "À quoi sera confrontée la famille dans le futur ?", "c": ["A la baisse de l'intérêt manifesté pour le mariage", "A la difficulté de retrouver dans un même lieu", "A l'augmentation des tarifs des transports aériens", "Aux problèmes relationnels rencontrés par les enfants"], "a": 1, "k": "La possibilité de se réunir devrait être diminuée par le coût des transports", "transcript": "Si on en croit ce que disent certains sociologues, je crois qu'on peut oublier les dimanches en famille l'hiver au coin du feu. Dans 10 ans, les parents auront de grandes chances de se rencontrer à l'étranger. Du coup, les enfants auront des grands-parents de pays différents, ils voyageront plus souvent, plus jeunes. Et tout ça est le résultat d'une plus grande mobilité dans le monde du travail. La possibilité de se réunir devrait être diminuée par le coût des transports. Alors, les familles auront sûrement un réseau internet très développé, mais d'une certaine manière, ça va les éloigner. On peut imaginer qu'il y aura une tension entre la valorisation de la famille en tant que groupe et le désir de s'investir dans son travail.", "audio": "CO 29/031.MP3", "_test": "29", "_pos": 31, "_origlabel": "test29#31", "_sources": ["test29#31"]}, {"type": "document", "q": "En quoi la biennale acta est-elle originale ?", "c": ["Elle donne l'occasion de découvrir de jeunes talents", "Elle offre une expérience à un public de tous âges", "Elle permet de jouer sur scène avec son enfant", "Elle présente la même pièce en différentes langues"], "a": 1, "transcript": "Alors même les bébés vont au théâtre. Dès les premiers jours de leur vie, c'est possible. J'ai découvert cette biennale acta où des artistes venus de Finlande, d'Espagne, d'Allemagne, d'Italie, de France proposent des temps de représentation très troublant où le bébé assis sur les genoux des parents partage vraiment à égalité avec l'adulte des émotions liées à des questions métaphysiques.", "k": "le bébé partage vraiment à égalité avec l'adulte", "audio": "CO 30/032.MP3", "_test": "30", "_pos": 32, "_origlabel": "test30#32", "_sources": ["test30#32"]}, {"type": "document", "q": "Qu'est-ce qui ressort de ce reportage consacré à un jeu en réseau ?", "c": ["L'assujettissement insidieux des mineurs", "L'insuffisance d'information des parents", "La fatigue occasionnée chez les enfants", "Le manque d'intérêt éducatif de l'activité"], "a": 0, "transcript": "C'est une nouvelle façon de jouer à la poupée, un jeu en réseau totalement virtuel, mais qui peut coûter très cher à 11 ans et demi. Tu crées ta poupée, et on a envie de monter des niveaux. Il faut acheter des choses avec de l'argent. Les prélèvements passent inaperçus au début, et l'addiction aux jeux s'installe très vite.", "k": "addiction aux jeux s'installe très vite", "audio": "CO 30/033.MP3", "_test": "30", "_pos": 33, "_origlabel": "test30#33", "_sources": ["test30#33"]}, {"type": "document", "q": "Question 32. Quelle est la conclusion de cette intervenante sur les femmes au foyer ?", "c": ["Elles garantissent l'épanouissement des enfants.", "Elles permettent à la société de fonctionner.", "Elles profitent du système qui les soutient.", "Elles représentent une charge pour leur famille."], "a": 1, "k": "tout le système ne tient que par le travail invisible", "transcript": "Vous bien, un peu ces femmes au foyer qui ne vivent que par et pour leurs enfants, diriez-vous que ce sont des poids morts économiques entre guillemets pour la société ou qu'elles contribuent à leur façon à l'économie du pays ? Et je manque des femmes humiliées par leurs enfants au poids de pensée qui sont le centre du monde et au point de faire l'impasse sur leur propre désir. Cela dit, les femmes au foyer ne sont pas des poids morts. Au contraire, tout le système ne tient que par le travail invisible, donc non rémunéré de personnes, souvent des femmes qui s'occupent des enfants, des vieux, des malades, etc.", "audio": "CO 11/032.MP3", "_test": "11", "_pos": 32, "_origlabel": "test11#32", "_sources": ["test11#32"]}, {"type": "document", "q": "Selon cette intervenante, qu'est-ce qui modifie la gestion de l'argent au sein de la famille ?", "c": ["L'attribution d'aides financières.", "Les inégalités salariales.", "Les modes de consommation.", "L'essor du travail féminin."], "a": 3, "k": "les femmes de l'argent maintenant une possibilité maintenant de gérer séparément", "transcript": "Une grande action sur la façon d'aller l'argent. Mais on retrouve quand même deux grandes logiques dans lesquelles à peu près tout le monde, une logique de mise en commun des revenus. Donc c'est tout ce qui le plus au revenu familial, le concept qu'on voit dans une politique sociale, c'est vraiment une mise en commun des revenus. Ça donne l'impression aussi que les deux ont cet argent et que les deux aussi partagent une redistribution, mais pas que les femmes et de plus en plus de gens gèrent séparément. On voit les études internationales aussi, comme vous, justement parce que les femmes de l'argent maintenant une possibilité maintenant de gérer séparément.", "audio": "CO 15/032.MP3", "_test": "15", "_pos": 32, "_origlabel": "test15#32", "_sources": ["test15#32"]}, {"type": "document", "q": "Question 39. Que faisait cet homme quand il était enfant ?", "c": ["Il concevait des histoires originales.", "Il participait au journal de l'école.", "Il récupérait des albums d'occasion.", "Il s'amusait à illustrer ses cours."], "a": 0, "k": "c'est d'en fabriquer moi-même", "transcript": "Le meilleur moyen d'augmenter ma collection de bandes dessinées, c'est d'en fabriquer moi-même. Je prenais des papiers de cahiers scolaires quadrillés, je les agrafais, je faisais une couverture spécialement pour, et j'avais un volume de plus dans ma collection sans avoir dépensé un centime.", "audio": "CO 6/039.MP3", "_test": "6", "_pos": 39, "_origlabel": "test6#39", "_sources": ["test6#39"]}, {"type": "document", "q": "Qu'explique Charles Brassard à propos de la langue originelle ?", "c": ["Le consensus à ce sujet semble impossible.", "Le nombre de données complexifie l'analyse.", "Les études existantes doivent être révisées.", "Les thèses avancées varient selon les pays."], "a": 0, "k": "je doute qu'on puisse un jour prouver, déterminer qui a tort ou qui a raison", "transcript": "La recherche de la langue originelle a longtemps occupé les esprits des linguistes. Est-ce une quête toujours pertinente aujourd'hui ?\n– Non. Enfin, oui et non, parce que comme on l'a dit tout à l'heure, il n'y a plus de trace, à moins de 10 000 ans à peu près, à peu de choses près, à la louche, on n'a plus aucune trace de ce qui était parlé. Il y a des théories qui disent que toutes les langues du monde viennent d'une seule langue, et il y a autant de théories à côté qui disent que non, la langue est née en divers endroits du globe, et qu'il n'y a donc pas une famille de langues mais plusieurs. Et en l'état actuel des choses, je doute qu'on puisse un jour prouver, déterminer qui a tort ou qui a raison.", "audio": "CO 7/038.MP3", "_test": "7", "_pos": 38, "_origlabel": "test7#38", "_sources": ["test7#38"]}, {"type": "document", "q": "Question 37. Quelle est l'opinion de l'intervenante sur la mesure proposée ?", "c": ["Appliquée seule, elle est contre-productive.", "C'est une proposition vraiment innovante.", "Elle a déjà montré ses limites dans le passé.", "Il faudrait la tester avant sa mise en place."], "a": 0, "k": "à condition qu'elle s'inscrive dans un processus de prise en charge", "transcript": "La violence en milieu scolaire, on le sait, est un problème aussi récurrent que préoccupant. La question de la responsabilité des parents est régulièrement posée, et la possibilité vient d'être à nouveau évoquée cette semaine par le ministre de l'éducation de supprimer les allocations familiales aux familles des enfants violents. La décision sera prise fin janvier. Alors, pensez-vous, Claude, qu'une mesure de ce type puisse être efficace ?\n– Je pense qu'elle ne peut pas l'être et qu'elle peut même avoir des effets négatifs, parce qu'en fait, elle est une fausse réponse à une vraie question. Une sanction peut être utile, mais à condition qu'elle s'inscrive dans un processus de prise en charge. Si on a essayé de comprendre les difficultés qu'ont les parents à éduquer, si on les a vraiment accompagnés pour les aider à y arriver, et que rien ne change, on peut les sanctionner.", "audio": "CO 8/037.MP3", "_test": "8", "_pos": 37, "_origlabel": "test8#37", "_sources": ["test8#37"]}, {"type": "document", "q": "Qu'affirme cette spécialiste au sujet des écrans dans la vie des enfants ?", "c": ["Ils favorisent les interactions avec les adultes.", "Ils permettent d'apprendre de façon ludique.", "Ils peuvent compenser les absences des parents.", "Ils sont utiles pour l'accompagnement scolaire."], "a": 1, "k": "ils peuvent apprendre des choses", "transcript": "Dire que les écrans sont un poison pour les enfants, c'est vraiment excessif. Il ne faut pas voir les choses de cette façon. Il faut être un peu plus nuancé. Évidemment, un usage excessif, ça n'est absolument pas constructif pour l'enfant. Un usage pondéré et accompagné par les parents, c'est différent. Les écrans ont un impact sur les enfants : ils peuvent apprendre des choses, ils peuvent jouer — ça, c'est l'impact positif. Et l'impact négatif, c'est quand il y a trop d'écran, quand on se ferme aux interactions, quand on est passif à recevoir l'information — ça, c'est plutôt négatif.", "audio": "CO 24/036.MP3", "_test": "24", "_pos": 36, "_origlabel": "test24#36", "_sources": ["test24#36", "test39#36"]}, {"type": "document", "q": "Question 39. Que constate l'intervenant à propos des séries ?", "c": ["Elles entrainent des dépendances maladives.", "Elles nuisent aux capacités d'apprentissage.", "Elles perturbent la perception de la réalité.", "Elles provoquent un isolement dangereux."], "a": 0, "k": "ce qui est un des critères de l'addiction", "transcript": "Et c'est tout l'art d'une série que de captiver son public. La place que peut prendre une série dans la vie de jeunes gens, ou moins jeunes, peut inquiéter Jean-Pierre Couteron, psychologue clinicien spécialiste des addictions. On commence à avoir, dans des entretiens avec des familles, avec des jeunes, ce problème qui est abordé, ce qui est un des critères de l'addiction sur le mode de « je n'arrive pas à faire autrement, je n'arrive pas à contrôler » et ça crée de la souffrance. C'est la thématique de l'hyperconnexion, c'est la thématique de la technologie sans limite. Donc c'est à l'humain de s'arrêter lui-même et c'est toujours plus difficile. On a toute une réflexion à partager avec les parents, parce que la première réponse, c'est quand même la réponse éducative.", "audio": "CO 23/039.MP3", "_test": "23", "_pos": 39, "_origlabel": "test23#39", "_sources": ["test23#39", "test35#39"]}, {"type": "document", "q": "Que dit Nadia Belawi au sujet du service civique ?", "c": ["C'est aux parents de choisir pour leurs enfants.", "Il faut l'étendre à toutes les générations.", "Le dispositif fonctionne bien tel qu'il est.", "L'État doit l'imposer à la population."], "a": 2, "k": "on n'a pas idée de remercier quelqu'un pour un service qu'il n'a pas choisi", "transcript": "Aujourd'hui le service est plébiscité par les jeunes qui le font, puisqu'il fait du bien aux jeunes, pourquoi ne pas le rendre obligatoire ? Le service civique fait du bien aux jeunes précisément parce qu'ils ont décidé de rendre un service à la nation, ils en sont parfaitement conscients. Vous savez, on n'a pas idée de remercier quelqu'un pour un service qu'il n'a pas choisi de rendre.", "audio": "CO 40/036.MP3", "_test": "40", "_pos": 36, "_origlabel": "test40#36", "_sources": ["test40#36"]}, {"type": "document", "q": "De quoi s'étonne le premier interlocuteur ?", "c": ["De la mise en vente libre de jouets sans contrôle sanitaire.", "De la tendance des adultes à s'approprier les jouets des enfants.", "De l'intérêt croissant suscité par les jouets tout au long de l'année.", "Du niveau de toxicité maximal toléré dans la fabrication des jouets."], "a": 0, "k": "il n'y a pas d'autorisation mise sur le marché comme ça existe pour les médicaments", "transcript": "Bonjour à tous, Noël est passé, et bien maintenant on va s'intéresser aux jouets et à leur conception. Je pensais qu'on ne pouvait pas mettre un jouet sur le commerce s'il n'était pas sain pour les enfants et pour les grands aussi, parce qu'il y a des grands qui jouent aussi un petit peu, non ? Alors, il est vrai que pour les jouets, il existe des réglementations qui s'appliquent, notamment sur l'interdiction de certaines substances chimiques qui ne doivent pas être présentes dans les jouets, ou alors avec une limite de concentration à ne pas dépasser. Après, comme tous les produits de consommation mis sur le marché, il n'y a pas d'autorisation mise sur le marché comme ça existe pour les médicaments.", "audio": "CO 15/037.MP3", "_test": "15", "_pos": 37, "_origlabel": "test15#37", "_sources": ["test15#37"]}, {"type": "document", "q": "Question 36. Quelle est la particularité de ces interventions ?", "c": ["Elles abordent les traitements des enfants.", "Elles s'appuient sur la complicité des parents.", "Elles sont animées par le personnel hospitalier.", "Elles tiennent compte de l'avis des médecins."], "a": 3, "k": "ces clowns professionnels prennent le temps de discuter avec l'équipe médicale du cas de chaque enfant", "transcript": "Et ces clowns travaillent Bruno en étroite collaboration avec les équipes soignantes.\n– Oui, parce qu'ils ne peuvent pas débarquer dans la chambre d'un enfant sans connaître précisément son état. Alors, avant d'enfiler leurs costumes, ces clowns professionnels prennent le temps de discuter avec l'équipe médicale du cas de chaque enfant. C'est un moment indispensable pour préparer la journée car selon l'humeur, l'état de santé de chaque enfant, ces acteurs qui sont rompus à l'improvisation, vont adapter leur intervention dans un but, permettre à un enfant, mais aussi à ses parents d'oublier pendant quelques minutes l'hôpital de retrouver l'envie de rire.", "audio": "CO 22/036.MP3", "_test": "22", "_pos": 36, "_origlabel": "test22#36", "_sources": ["test22#36"]}], "devoirs": []}, "Loisirs": {"cours": [{"type": "document", "q": "Question 31. À quel moment cet entraîneur préfère-t-il intervenir en général ?", "c": ["Pendant le match, sur le terrain.", "Ils préfèrent intervenir après la fin du match.", "À chaque pause de jeu.", "Exclusivement à la mi-temps."], "a": 1, "k": "Ils préfèrent intervenir après la fin du match.", "transcript": "– En tant qu'entraîneur d'une équipe de football, comment réagissez-vous pendant un match ?\n– Ben moi, je suis toujours très attendu.\n– Et vous intervenez quand auprès des joueurs ?\n– Pas sur le terrain pendant le match, mais de temps en temps à la mi-temps, j'essaie d'expliquer les problèmes. Ça dépend du match, mais enfin la plupart du temps, je préfère attendre que le match soit fini.\n– Le résultat d'un match, ce n'est pas un peu de chance ?\n– Non, non, il n'y a pas de hasard. Au football, pour gagner, il faut savoir se battre.", "audio": "CO 2/031.MP3", "_test": "2", "_pos": 31, "_origlabel": "test2#31", "_sources": ["test2#31"]}, {"type": "document", "q": "Question 33. Pourquoi Luc Château dessine-t-il au cours de ses voyages ?", "c": ["Pour illustrer des brochures touristiques.", "Pour s'imprégner des rencontres effectuées.", "Pour s'occuper pendant la durée des trajets.", "Pour repérer des itinéraires de promenade."], "a": 1, "k": "je veux créer des liens avec les gens", "transcript": "On voit souvent parmi les meilleures ventes de livres les carnets de voyage. Mais qui sont réellement ces auteurs, artistes voyageurs ? Écoutons l'impression de Luc Château.\n– Pendant mes séjours à l'étranger, quand je dessine, je veux créer des liens avec les gens, instaurer un dialogue avec la personne que je dessine et apprendre son mode de vie. En même temps, j'intègre des petits textes avec mes croquis. Ça ressemble un peu à un journal de bord, c'est spontané, mais il arrive que je les retravaille à mon retour. Ces parcours d'artistes inspirent aussi les voyagistes qui proposent des formules randonnée et carnet de voyage.", "audio": "CO 3/033.MP3", "_test": "3", "_pos": 33, "_origlabel": "test3#33", "_sources": ["test3#33"]}, {"type": "document", "q": "Question 32. Pourquoi la journaliste reste-t-elle prudente ?", "c": ["La conférence qui a eu lieu est uniquement symbolique.", "La secrétaire d'État a fait part de son pessimisme.", "Les discussions s'annoncent longues et difficiles.", "Tous les points de l'accord ont déjà été traités sans succès."], "a": 2, "k": "c'est maintenant que les choses démarrent réellement", "transcript": "C'est au cours de cette réunion internationale qu'un premier accord a été trouvé in extremis entre les deux pays et de nouvelles négociations commencent aujourd'hui, mais sur le fond, rien n'est encore fait. En effet, il aura fallu deux jours de négociations marathon pour parvenir à accoucher de ce document conjoint. Cela marque donc le début d'un processus, mais il faut rester prudent car c'est maintenant que les choses démarrent réellement. Alors amorce d'un processus de paix ou conférence symbolique. La secrétaire d'État a d'ailleurs précisé hier soir que l'échec n'était pas une option. En fait, on n'est pas encore rentré dans le vif du sujet. Beaucoup de points n'ont pas encore été abordés et n'ont pas été détaillés dans le document conjoint, car les deux parties n'ont pas réussi à se mettre d'accord sur la formulation.", "audio": "CO 5/032.MP3", "_test": "5", "_pos": 32, "_origlabel": "test5#32", "_sources": ["test5#32", "test10#33"]}, {"type": "document", "q": "Question 32. Que permet le tourisme selon l'intervenant ?", "c": ["De côtoyer des cultures et coutumes différentes.", "De mettre le monde à la portée de tout budget.", "De partager une aventure avec les siens.", "De participer à l'essor économique d'un endroit."], "a": 0, "k": "découverte d'autres cultures", "transcript": "Dans cette idée de voyage, il y a la notion d'exploration, de découverte d'autres cultures, de découverte d'autres normes, et finalement aussi d'émancipation par rapport aux normes qui sont celles de notre quotidien.", "audio": "CO 6/032.MP3", "_test": "6", "_pos": 32, "_origlabel": "test6#32", "_sources": ["test6#32"]}, {"type": "document", "q": "Sur quel sujet économique la rubrique porte-t-elle ?", "c": ["Le coût de l'entretien d'une voiture.", "Les tendances en matière de loisirs.", "L'évolution des tarifs des transports.", "L'intérêt de partager des services."], "a": 3, "k": "c'est ça, l'économie collaborative", "transcript": "Catherine Boulet, bonjour. Ce matin, le succès de l'économie collaborative. Après Blablacar, le site de covoiturage pour partager la fatigue en voiture et le coût du trajet, et bien voici le partage des loisirs et des vacances. Alors, Tripenco, comment ça marche ?\n– D'abord, vous montez votre projet ou vous vous inscrivez au projet d'un autre. L'avantage, c'est de pouvoir bénéficier de tarifs de groupe.\n– C'est ça, l'économie collaborative.", "audio": "CO 7/034.MP3", "_test": "7", "_pos": 34, "_origlabel": "test7#34", "_sources": ["test7#34"]}, {"type": "document", "q": "Question 30. De quoi parle cet intervenant ?", "c": ["D'une compétition sportive", "D'une croisière maritime", "D'une histoire familiale", "D'une rencontre amoureuse"], "a": 2, "k": "nos ancêtres viennent de La Rochelle", "transcript": "On fait un petit tour de France, c'est-à-dire qu'on est parti vers le sud et on s'est arrêté à La Rochelle parce que nos ancêtres viennent de La Rochelle. Ils sont partis au XVIIe siècle pour le Québec du port de La Rochelle. Donc, on est venu voir le port et essayer de trouver une trace de nos ancêtres. Ce qu'on a commencé par trouver, c'est que c'était plutôt compliqué d'avoir des traces écrites, surtout quand notre ancêtre n'était pas un capitaine de bateau ou quelque chose comme ça.", "audio": "CO 33/030.MP3", "_test": "33", "_pos": 30, "_origlabel": "test33#30", "_sources": ["test33#30"]}, {"type": "document", "q": "Question 32. Que font les jeunes parisiens, dont parle ce reportage ?", "c": ["Ils nagent en plein air dans la capitale.", "Ils s'amusent dans un parc d'attraction.", "Ils se retrouvent à la piscine municipale.", "Ils sont en vacances au bord de la mer."], "a": 0, "k": "le canal de l'eau est devenu notre espace de baignade quotidien", "transcript": "En fait, comme on invite tout l'arrondissement de Paris, le canal de l'eau est devenu notre espace de baignade quotidien après une journée de travail. Généralement, on se retrouve au bord du canal tous ensemble et on se baigne. Aujourd'hui, on est entre 15 et 20 à se baigner régulièrement dans le canal de l'eau. On est déjà étudiant, fauché, on vit pour s'amuser, on n'a pas forcément les moyens de partir de Paris.", "audio": "CO 23/032.MP3", "_test": "23", "_pos": 32, "_origlabel": "test23#32", "_sources": ["test23#32", "test33#31"]}, {"type": "document", "q": "Question 30. D'après cette chronique, en France, quel est l'objet qu'il est à la mode de rapporter de voyage ?", "c": ["Un bijou d'artisanat local.", "Un guide touristique illustré.", "Un modèle réduit de bateau.", "Un album de souvenirs personnels."], "a": 3, "k": "carnet de voyage", "transcript": "Aujourd'hui, quand le voyageur rentre de Bamako, de Sarajevo ou de Québec, il rapporte un trésor très précieux, le carnet de voyage. Composé d'aquarelles, de croquis, de descriptions de petits riens, de photos, de textes ou de collages, de sable ou de coquillages, ces petits objets de mémoire et d'évasion sont à la mode en France, notamment depuis le succès des carnets de voyage du navigateur titouant l'Amazon. D'après cette chronique, en France, quel est l'objet qu'il est à la mode de rapporter de voyage ?", "audio": "CO 35/030.MP3", "_test": "35", "_pos": 30, "_origlabel": "test35#30", "_sources": ["test35#30"]}, {"type": "document", "q": "Question 33. Que dénonce cette journaliste ?", "c": ["La télévision touche des droits importants sur les compétitions.", "Les comportements machistes perdurent dans l'univers sportif.", "Les fédérations sont souvent impliquées dans des scandales.", "Les grandes équipes concentrent la majorité des financements."], "a": 1, "k": "les médias ont souvent tendance à détourner caméras et micros", "transcript": "Le monde bouge, partout, trop lentement, certes, mais enfin il bouge même quand on parle de sport féminin. Non que nous ne célébrions depuis longtemps nos championnes. Une médaille d'or aux JO n'a pas de sexe. C'est une médaille d'or pour la France, un point c'est tout. Mais dès qu'il s'agit de s'intéresser à l'actualité des équipes féminines de sport collectif et de retransmettre leur compétition, bah là, les médias ont souvent tendance à détourner caméras et micros. Et quand on scrute d'un peu près les instances dirigeantes des clubs et des fédérations, là encore, beaucoup de testostérone et encore bien peu de parité.\nQue dénonce cette journaliste ?", "audio": "CO 36/033.MP3", "_test": "36", "_pos": 33, "_origlabel": "test36#33", "_sources": ["test36#33"]}, {"type": "document", "q": "Question 32. Pourquoi la journaliste reste-t-elle prudente ?", "c": ["La conférence qui a eu lieu est uniquement symbolique.", "La secrétaire d'État a fait part de son pessimisme.", "Les modes de consommation.", "Tous les points de l'accord ont déjà été traités sans succès."], "a": 0, "k": "sur le fond, rien n'est encore fait", "transcript": "– C'est au cours de cette réunion internationale qu'un premier accord a été trouvé in extremis entre les deux pays et de nouvelles négociations commencent aujourd'hui, mais sur le fond, rien n'est encore fait. En effet, il aura fallu deux jours de négociations marathon pour parvenir à accoucher de ce document conjoint. Cela marque donc le début d'un processus, mais il faut rester prudent car c'est maintenant que les choses démarrent réellement.\n– Alors amorce d'un processus de paix ou conférence symbolique ?\n– La secrétaire d'État a d'ailleurs précisé hier soir que l'échec n'était pas une option. En fait, on n'est pas encore rentré dans le vif du sujet. Beaucoup de points n'ont pas encore été abordés et n'ont pas été détaillés dans le document conjoint, car les deux parties n'ont pas réussi à se mettre d'accord sur la formulation.", "audio": "CO 17/032.MP3", "_test": "17", "_pos": 32, "_origlabel": "test17#32", "_sources": ["test17#32"]}, {"type": "document", "q": "Question 30. D'après cette chronique, quel est l'objet à la mode que l'on rapporte de voyage ?", "c": ["Un bijou d'artisanat local.", "Un guide touristique illustré.", "Un modèle réduit de bateau.", "Un album de souvenirs personnels."], "a": 3, "k": "le carnet de voyages, composé d'aquarelles, de croquis", "transcript": "Et aujourd'hui, quand le voyageur rentre de Bamako, de Sarajevo ou de Québec, il rapporte un trésor très précieux : le carnet de voyages, composé d'aquarelles, de croquis, de descriptions de petits riens, de photos, de textes ou de collages, de sable ou de coquillages. Ces petits objets de mémoire et d'évasion sont à la mode en France, notamment depuis le succès des carnets de voyage du navigateur Quitou L'Am.", "audio": "CO 23/030.MP3", "_test": "23", "_pos": 30, "_origlabel": "test23#30", "_sources": ["test23#30"]}, {"type": "document", "q": "Question 31 : De quoi parle ce témoignage ?", "c": ["D'une compétition sportive", "D'une croisière maritime", "D'une histoire familiale", "D'une rencontre amoureuse"], "a": 2, "k": "essayer de trouver une trace de nos ancêtres", "transcript": "On fait un petit tour de France, c'est-à-dire qu'on est parti vers le sud et on s'est arrêté à La Rochelle parce que nos ancêtres viennent de La Rochelle. Ils sont partis au XVIIe siècle pour le Québec du port de La Rochelle. Donc, on est venu voir le port et essayer de trouver une trace de nos ancêtres.", "audio": "CO 26/031.MP3", "_test": "26", "_pos": 31, "_origlabel": "test26#31", "_sources": ["test26#31"]}, {"type": "document", "q": "Question 38. Que peut offrir un propriétaire de gîte rural ?", "c": ["De la tranquillité et de l'intimité.", "Des facilités de réservation.", "Un contact privilégié avec son hôte.", "Un tarif intéressant toute l'année."], "a": 0, "k": "le vacancier va séjourner en toute autonomie", "transcript": "Ouvrir une chambre d'hôte, c'est d'abord opter pour un mode de vie bien particulier, où vous partagez l'avis de votre quotidien avec des gens de passage, soit toute l'année ou une partie de l'année. Et c'est une formule conviviale qui a du succès puisqu'on en compte plus de 110 000 en France. Est-ce qu'il y a moins de contraintes pour les gîtes ruraux ?\n– Oui, tout à fait. Si vous êtes moins disponible, le gîte rural pour cela, il vous suffit d'être là à l'arrivée au départ des vacanciers. Et en fait, il suppose au contraire un logement qui est vraiment indépendamment du vôtre, qui est généralement situé à proximité de celui du propriétaire, mais où le vacancier va séjourner en toute autonomie pendant la semaine ou pour le week-end.", "audio": "CO 22/038.MP3", "_test": "22", "_pos": 38, "_origlabel": "test22#38", "_sources": ["test22#38", "test36#38"]}, {"type": "document", "q": "Quel est l'intérêt pour les personnes âgées de jouer ?", "c": ["Elles réapprennent certains gestes.", "Elles rencontrent d'autres joueurs.", "Elles se réintègrent à la communauté.", "Elles stimulent leurs facultés cérébrales."], "a": 3, "k": "jouer peut-être pour maintenir ses aspects cognitifs, donc maintenir la vivacité d'esprit", "transcript": "« Il y a une qualité de vie qui n'est pas toujours excellente chez nos personnes âgées. Alors on se disait : comme la population du Québec joue à des jeux, pourquoi n'utiliserait-on pas ces jeux-là pour améliorer leur qualité de vie ? Ça présente quand même des difficultés. Le jeu pour les personnes qui sont plus âgées, quelquefois ils ont des difficultés de divers ordres. Comment est-ce que vous essayez de prévenir le fait qu'ils ne puissent pas jouer ? On pourrait à la limite être une personne complètement inactive et pouvoir encore jouer — jouer peut-être pour maintenir ses aspects cognitifs, donc maintenir la vivacité d'esprit. »", "audio": "CO 14/036.MP3", "_test": "14", "_pos": 36, "_origlabel": "test14#36", "_sources": ["test14#36"]}, {"type": "document", "q": "Question 36. De quel type de bateau est-il question ?", "c": ["De voiliers destinés à des particuliers", "De navires pour la marine marchande", "De paquebots adaptés au tourisme de masse", "De bateaux de pêches traditionnels"], "a": 0, "k": "De voiliers destinés à des particuliers", "transcript": "Alors, un chantier de construction navale ici pour qui ? Pour l'export, principalement en raison de la politique sénégalaise, qui depuis quelques années, avec le changement de gouvernement, favorise l'implantation d'investisseurs étrangers. Cela nous permet d'exporter et d'importer hors taxes, sans douane. Nos bateaux sont évidemment des bateaux de plaisance et notre clientèle est à l'étranger. Nous travaillons donc uniquement pour l'exportation.\n– Qu'est-ce que vous construisez comme bateau ?\n– Un catamaran de 12 mètres dessiné par Éric, le rouge, en collaboration avec les ateliers du Cap Vert, pour un couple de Français qui partira voyager pendant un an et demi pour faire un tour du monde avec.", "audio": "CO 18/036.MP3", "_test": "18", "_pos": 36, "_origlabel": "test18#36", "_sources": ["test18#36"]}], "devoirs": []}, "Environnement": {"cours": [{"type": "document", "q": "Quelle solution propose Jacques Avignon ?", "c": ["Accroître les zones agricoles en déforestation.", "Améliorer le rendement des parcelles cultivées.", "Exploiter différemment les terres endommagées.", "Rendre productifs les terrains vagues urbains."], "a": 2, "k": "les reconquérir sur des territoires qui sont actuellement dégradés", "transcript": "— Produire plus et mieux en respectant la capacité de renouvellement de nos ressources alimentaires et en tenant compte des évolutions climatiques, Jacques Arrignon, est-ce possible et réaliste ?\n— C'est, à mon avis, possible et réaliste. Toutefois, je ne pense pas qu'il faille détruire de la forêt pour regagner des terres cultivables. Je pense qu'on peut les reconquérir sur des territoires qui sont actuellement dégradés. Et c'est ainsi que je vois donc produire davantage, et produire mieux, à condition de bien connaître les milieux auxquels on va s'appliquer, et à condition d'être extrêmement vigilant sur les procédures employées pour produire davantage.", "audio": "CO1/034.MP3", "_test": "1", "_pos": 34, "_origlabel": "test1#34", "_sources": ["test1#34"]}, {"type": "document", "q": "Question 33. Qu'affirme-t-on au sujet du réchauffement climatique ?", "c": ["Il affecte uniquement les régions polaires.", "Il change notre quotidien et menace des saisons entières.", "Il est un phénomène lointain sans impact direct.", "Il peut être complètement évité si on agit maintenant."], "a": 1, "k": "Il change notre quotidien et menace des saisons entières.", "transcript": "On voulait parler autrement des changements climatiques. On voulait pas seulement des chiffres qui font ça commence à créer des impacts chez nous, près de nous, dans des choses qui nous tiennent à cœur. Par exemple, ce qui fond dans la région, dans le sud du Québec, dans la région de Montréal — si on continue avec un réchauffement tel qu'on le prévoit, l'hiver va disparaître complètement et donc c'est toute une culture qui se perd. Ben moi je pense que plus on rapproche les impacts de ce qui est près des gens, on dit voici ce que nous aimons l'hiver et voici pourquoi nous allons agir pour les changements climatiques. Tout d'un coup, on n'est plus en train de parler d'une catastrophe qui est en cours, on est en train de parler d'un monde à construire.", "audio": "CO 2/033.MP3", "_test": "2", "_pos": 33, "_origlabel": "test2#33", "_sources": ["test2#33"]}, {"type": "document", "q": "Question 35. À quelle conclusion arrive ce représentant de l'industrie forestière québécoise ?", "c": ["Le lien avec la forêt n'est pas encore rétabli.", "Le lien avec la forêt est bien établi grâce aux efforts continus.", "Les associations forestières sont suffisamment réparties pour couvrir les besoins de sensibilisation.", "La population urbaine est totalement engagée avec l'industrie forestière."], "a": 0, "k": "Le lien avec la forêt n'est pas encore rétabli.", "transcript": "– Est-ce que vous pensez que la population s'est réappropriée ses forêts ou renoue un lien de conscience avec l'industrie forestière ?\n– Moi je dirais que le lien n'est pas encore refait à l'heure actuelle. On a beaucoup de travail à faire et on met beaucoup d'espoir sur nos associations forestières régionales dans chacune des régions. Mais le gros point c'est que la moitié de la population est autour de Montréal, la couronne de Montréal. Il y a même pas d'association forestière ici. Donc on a presque aucun moyen de sensibiliser la population sur les valeurs écologiques, les valeurs économiques du milieu forestier comme tel et de vivre aussi de cette forêt.", "audio": "CO 2/035.MP3", "_test": "2", "_pos": 35, "_origlabel": "test2#35", "_sources": ["test2#35"]}, {"type": "document", "q": "Que propose cette spécialiste pour éviter une catastrophe écologique ?", "c": ["Durcir les normes appliquées à la fabrication de voitures", "Inciter les usagers à pratiquer d'autres modes de déplacement", "Pousser les industriels à employer des technologies innovantes", "Rendre obligatoire l'utilisation de carburants propres"], "a": 1, "k": "Il faut donc nous affranchir de ce modèle de civilisation qui repose sur le transport individuel.", "transcript": "Les constructeurs automobiles préparent leur modèle écologique pour profiter de ce nouveau marché. Où en est-on au niveau de la pollution ? Si on regarde la moyenne des émissions des véhicules vendus en France, ça va dans le bon sens grâce à une série de mesures législatives. On voit apparaître des véhicules de moins en moins polluants dont l'émission est inférieure à 140 grammes. Malheureusement, ça ne résout pas le problème du développement de la civilisation automobile. Si le taux d'équipement augmente à l'échelle mondiale, on se retrouve face à une catastrophe écologique considérable. Il faut donc nous affranchir de ce modèle de civilisation qui repose sur le transport individuel.", "audio": "CO 10/034.MP3", "_test": "10", "_pos": 34, "_origlabel": "test10#34", "_sources": ["test10#34"]}, {"type": "document", "q": "Quel est l'objectif de cette entreprise ?", "c": ["Accompagner les clients dans une démarche d'achat responsable.", "Défendre les intérêts économiques des petits producteurs.", "Fournir un débouché aux agriculteurs en reconversion dans le bio.", "Obtenir des engagements politiques en matière d'écologie."], "a": 0, "k": "donner les moyens au consommateur de faire les choix les plus éthiques", "transcript": "Les consommateurs sont de plus en plus conscients de l'impact qu'ils ont sur l'environnement, et on souhaitait leur donner une information pertinente pour qu'ils puissent, à travers leurs actes... les actes de consommation quotidiens, réduire leur impact carbone. N'oublions pas que l'agriculture génère jusqu'à la moitié du CO2 en tant qu'individuel. On va dire que c'est l'ADN de notre entreprise, c'était depuis le début de pousser à la consommation responsable. Et pousser à la consommation responsable, c'est non seulement faire une sélection des producteurs les plus engagés, mais aussi donner les moyens au consommateur de faire les choix les plus éthiques. C'est à travers ce genre d'informations qu'on va pouvoir non seulement sensibiliser les consommateurs, mais les... les aider à faire les bons choix.", "audio": "CO 31/030.MP3", "_test": "31", "_pos": 30, "_origlabel": "test31#30", "_sources": ["test31#30"]}, {"type": "document", "q": "À quelle conclusion arrive ce représentant de l'industrie forestière québécoise ?", "c": ["La multiplication des intervenants nuit à l'efficacité de sa communication.", "Les actions d'information ont rouvert le dialogue avec les Québécois.", "Les habitants sont indifférents à l'une des richesses du Québec.", "L'expansion urbaine contrarie l'exploitation industrielle du bois."], "a": 2, "k": "on n'a presque aucun moyen de sensibiliser la population", "transcript": "— Est-ce que vous pensez que la population s'est réapproprié ces forêts, ou a renoué un lien de conscience avec l'industrie forestière ?\n— Je crois que le lien n'est pas encore refait à l'heure actuelle. On a beaucoup de travail à faire. Puis on met beaucoup d'espoir sur, notamment, nos associations forestières régionales dans chacune des régions. Mais le gros point, c'est que la moitié de la population est autour de Montréal. La couronne de Montréal, il n'y a même pas d'association forestière ici. Donc, on n'a presque aucun moyen de sensibiliser la population sur les valeurs écologiques, les valeurs économiques du milieu forestier comme tel, puis de vivre aussi de cette forêt-là.", "audio": "CO 31/035.MP3", "_test": "31", "_pos": 35, "_origlabel": "test31#35", "_sources": ["test31#35"]}, {"type": "document", "q": "Question 33. Que regrette l'intervenant dans ce type de relation ?", "c": ["La fragilité de l'engagement", "La multiplicité des contacts", "La pauvreté des échanges", "L'absence du face à face"], "a": 0, "k": "les liens se créent d'un clic, se défont d'un clic", "transcript": "Dans les relations d'amitié virtuelle, bien souvent les liens se créent d'un clic, se défont d'un clic. Il y a une précarité de la relation humaine dans ces réseaux-là. Et puis même aussi, dans les rencontres, on est appelé à faire sur le mode de l'instantanéité, speed dating, toutes les formes de speed meeting, qui fait qu'on cède à l'affect du moment pour décider si on maintient une relation ou pas. Quant au caractère durable et vertueux des amitiés à l'échelle de notre vie, on peut se poser la question de leur existence à la journée.", "audio": "CO 33/033.MP3", "_test": "33", "_pos": 33, "_origlabel": "test33#33", "_sources": ["test33#33"]}, {"type": "document", "q": "Question 35. Quelle est la position du chercheur Denis Gilbert ?", "c": ["Il considère que le phénomène doit être analysé", "Il conteste les méthodes de collecte des données", "Il partage la vision catastrophiste des écologistes", "Il s'oppose aux décisions du gouvernement"], "a": 0, "k": "il faut savoir dépasser les simples manchettes alarmistes", "transcript": "20 % du bassin arctique canadien est devenu corrosif pour certains de ses habitants. On s'inquiète beaucoup aussi de l'élargissement de ces fameuses zones mortes dans les océans, là où l'oxygène et la vie se sont retirés. Elles sont particulièrement nombreuses le long de la côte ouest océanique canadienne, donc le long de la province de la Colombie-Britannique. Denis Gilbert est chercheur scientifique au ministère canadien des Pêches et Océans Canada. Selon lui, il faut savoir dépasser les simples manchettes alarmistes des journaux, basées souvent sur les cris d'alarme des environnementalistes. Le phénomène des zones mortes ou de l'hypoxie n'est pas nouveau, et ce n'est pas obligatoirement une mauvaise chose. La preuve en tout cas reste à faire.", "audio": "CO 33/035.MP3", "_test": "33", "_pos": 35, "_origlabel": "test33#35", "_sources": ["test33#35"]}, {"type": "document", "q": "Question 34. Sur quoi porte le projet de recherche mentionné par l'intervenante ?", "c": ["Un aménagement territorial en fonction des données météorologiques.", "Un programme de réduction des différentes sources de pollution.", "Une analyse comparative entre les modes de vie citadins et ruraux.", "Une proposition de prévention renforcée des grands cataclysmes."], "a": 0, "k": "l'adaptation du milieu urbain au changement climatique", "transcript": "Dans le cadre du CRAB, je coordonne un projet de recherche justement sur l'adaptation du milieu urbain au changement climatique. L'adaptation, ça veut dire non pas l'atténuation nécessairement des gaz à effet de serre, mais plutôt, puisque le climat change, il faut s'y adapter. Il faut voir à ce que la ville s'y adapte pour anticiper les changements plutôt qu'y réagir et avoir à payer pour tout ce que ça veut dire comme bris et catastrophes et désorganisation, déstructuration. Alors ce qu'on fait nous, c'est depuis trois ans, on mène une démarche participative pour savoir sur quoi se fonder pour justement planifier l'adaptation.\nSur quoi porte le projet de recherche mentionné par l'intervenante ?", "audio": "CO 36/034.MP3", "_test": "36", "_pos": 34, "_origlabel": "test36#34", "_sources": ["test36#34"]}, {"type": "document", "q": "Question 31 : Quel aspect de ce projet est mis en avant ?", "c": ["L'influence sur l'aménagement urbain.", "La portée socio-environnementale.", "La solide formation des salariés.", "Le poids des retombées économiques."], "a": 1, "k": "alliant économie circulaire et économie sociale", "transcript": "Notre prochain arrêt va nous faire découvrir une initiative qui innove en alliant économie circulaire et économie sociale. Car si le projet de voie publique vise à recycler le bois des arbres malades pour en faire des pièces de mobiliers urbains, sa force repose sur sa collaboration avec des ateliers des ébénisteries qui misent sur l'insertion sociale. Un véritable travail d'équipe qui permet à la communauté qui a perdu ses arbres de les retrouver sous une autre forme.", "audio": "CO 37/031.MP3", "_test": "37", "_pos": 31, "_origlabel": "test37#31", "_sources": ["test37#31"]}, {"type": "document", "q": "Question 33 : Quel est l'objectif de la conférence sur les catastrophes naturelles ?", "c": ["Se faire rapidement connaître auprès du grand public.", "Définir des politiques pour tenter de les enrayer.", "Informer sur leur dangerosité et leur accroissement.", "Soutenir financièrement les pays les plus touchés."], "a": 1, "k": "l'accent soit mis sur les actions de prévention", "transcript": "Actuellement, 90% des catastrophes naturelles sont liées à des phénomènes extrêmes météorologiques. Inondations, tsunamis ou bien ouragans. Et pour la plupart de ces phénomènes, il est possible de fournir des alertes pour des actions de prévention, pour sauver des vies mais aussi pour minimiser l'impact économique. C'est l'enjeu de la conférence qui se réunit en ce moment à Genève. C'est de faire en sorte que l'accent soit mis sur les actions de prévention, de telle sorte qu'on ait moins à faire après. Parce que, n'oublions pas qu'avec le changement climatique, ces phénomènes extrêmes vont devenir plus fréquents, et pour un certain nombre d'entre eux, plus intenses.", "audio": "CO 37/033.MP3", "_test": "37", "_pos": 33, "_origlabel": "test37#33", "_sources": ["test37#33"]}, {"type": "document", "q": "Question 32 : Selon ce journaliste, quel risque peut avoir la neige pour les plantes ?", "c": ["Elle peut casser les branches sous son poids.", "Elle peut empêcher la photosynthèse.", "Elle peut geler les racines des plantes.", "Elle peut provoquer des maladies fongiques."], "a": 0, "k": "le poids ne casse les branches", "transcript": "Encore une question qui est liée au temps. Pauline habite dans le sud et la neige est tombée en grosse quantité, elle a peur que le poids ne casse les branches de ses arbres et de ses arbustes, elle voudrait savoir donc s'il est conseillé de les agiter pour faire tomber la neige. — À une condition, une seule, qu'il ne gèle pas, c'est-à-dire que si vraiment la température était un petit peu comme ce matin, le bois est extrêmement cassant, on attend donc le redoux des températures et l'on peut effectivement agiter pour laisser tomber la neige et éviter que le poids ne casse les branches. Malheureusement, quantité de plantes, je pense aux gros cèdres, vont souffrir du poids de la neige, car la neige représente un poids énorme qui risque de causer quantité de dommages.", "audio": "CO 38/032.MP3", "_test": "38", "_pos": 32, "_origlabel": "test38#32", "_sources": ["test38#32"]}, {"c": ["L'industrie du plastique.", "Les activités agricoles.", "Les pièges de braconniers.", "Les pratiques de pêcheurs."], "a": 3, "q": "Que dénonce Greenpeace ?", "transcript": "Le chiffre est impressionnant. Chaque année, 6400 tonnes de matériel de pêche finissent sous l'eau. Des filets, des casiers et autres pièges en tout genre sont perdus ou abandonnés au fond des mers. Des chiffres révélés par Greenpeace reprenant un comptage de la FAO, l'organisation de l'ONU pour l'agriculture et l'alimentation. Alors une pollution qui se rajoute au milieu de tonnes de déchets qui forment, vous savez, les fameux continents plastiques, ces agrégations de déchets qui flottent à travers les océans. Alors justement, les animaux marins, ce sont eux les premières victimes de ce matériel de pêche abandonné. Les casiers dérivants prennent au piège les tortues, les phoques, les baleines, bref, 100 000 animaux faisant des galipettes dans l'eau salée en sont victimes chaque année.", "k": "ce matériel de pêche abandonné", "type": "document", "audio": "CO 39/033.MP3", "_test": "39", "_pos": 33, "_origlabel": "test39#33", "_sources": ["test39#33"]}, {"type": "document", "q": "Qu'explique cette utilisatrice des produits cosmétiques bio ?", "c": ["Ils dégagent une odeur agréable.", "Ils ont des résultats spectaculaires.", "Ils ont l'avantage d'être peu chers.", "Ils répondent à ses convictions."], "a": 3, "k": "c'est en accord avec mes idées", "transcript": "J'avoue qu'au début j'étais très décontenancée par les textures des cosmétiques bio. Les parfums quasi inexistants m'ont également déstabilisé. Mais les marques ont fait des progrès considérables depuis. Au final je choisis mieux mes produits, j'en achète moins, et donc je dépense moins. Et surtout c'est en accord avec mes idées. À quoi bon manger des fruits et légumes bio si l'on continue à se tartiner de crèmes enrichies aux produits chimiques ?", "audio": "CO 40/035.MP3", "_test": "40", "_pos": 35, "_origlabel": "test40#35", "_sources": ["test40#35"]}, {"type": "document", "q": "Quelle est l'opinion de cet intervenant ?", "c": ["L'action politique doit s'appuyer sur les conclusions scientifiques.", "La criminalité est en baisse dans les agglomérations modernes.", "La croissance urbaine est un danger pour l'écologie.", "La violence est indépendante de la densité humaine."], "a": 3, "k": "Le Japon, hautement industrialisé et urbanisé, a néanmoins un taux de criminalité très faible", "transcript": "Nous vivons dans des nations urbaines, mais nous avons peur des villes. La concentration des hommes et des activités, répète-t-on, est en soi génante, et on cite invariablement les mêmes expériences sur les rats de laboratoire dont l'agressivité augmente avec le nombre et la densité. Mais on ignore volontiers l'histoire humaine. Le Japon, hautement industrialisé et urbanisé, a néanmoins un taux de criminalité très faible — le plus faible du monde industriel. Il faut se garder de tirer trop vite des enseignements pour la politique criminelle en prônant, comme une panacée, le retour à un habitat moins dense.", "audio": "CO 14/035.MP3", "_test": "14", "_pos": 35, "_origlabel": "test14#35", "_sources": ["test14#35"]}, {"type": "document", "q": "Question 34. Pourquoi développe-t-on l'habillage sonore des voitures en France ?", "c": ["Pour réduire la pollution sonore des voitures.", "Pour améliorer le confort et le plaisir des conducteurs.", "Pour augmenter la sécurité et la performance des voitures.", "Pour respecter les réglementations européennes."], "a": 1, "k": "Transformer les bruits que produisent les voitures en sons utiles et agréables", "transcript": "– L'équipe d'Interception vous propose de découvrir le travail d'habillage sonore qui entre aujourd'hui dans la conception des véhicules automobiles, aussi bien ceux qui sont équipés d'un moteur à explosion que les autres. Transformer les bruits que produisent les voitures en sons utiles et agréables, c'est un métier, et la France est plutôt bien placée dans ce domaine, planchant sur la mise au point d'un environnement sonore à la carte d'un clic. Tout conducteur pourra bientôt choisir le bruit de son moteur ou de ses clignotants. Il en changera même au gré de ses humeurs.", "audio": "CO 17/034.MP3", "_test": "17", "_pos": 34, "_origlabel": "test17#34", "_sources": ["test17#34"]}, {"type": "document", "q": "Question 35. Quel risque peut avoir la neige pour les plantes ?", "c": ["De geler et de se briser.", "De fondre et de noyer les racines.", "De peser et de casser les branches.", "De brûler et de dessécher les feuilles."], "a": 2, "k": "éviter que le poids casse les branches", "transcript": "– Encore une question qui est liée au temps. Pauline habite dans le sud et la neige est tombée en grosse quantité. Elle a peur que son poids ne casse les branches de ses arbres et de ses arbustes. Elle voudrait savoir s'il est conseillé de les agiter pour faire tomber la neige.\n– À une condition, une seule : qu'il ne gèle pas, c'est-à-dire que si vraiment la température demain dehors est un peu comme ce matin, le bois est extrêmement cassant. On attend donc le redoux des températures. Et là, on peut effectivement agiter pour laisser tomber la neige et éviter que le poids casse les branches. Malheureusement, quantité de plantes, je pense aux grosses haies, vont souffrir du poids de la neige, car la neige représente un poids énorme qui risque de poser quantité de dommages.", "audio": "CO 17/035.MP3", "_test": "17", "_pos": 35, "_origlabel": "test17#35", "_sources": ["test17#35"]}, {"type": "document", "q": "Question 32. Selon ce journaliste, quel risque la neige peut-elle avoir pour les plantes ?", "c": ["Elle peut rompre les branches.", "Elle peut geler les racines.", "Elle peut surcharger les branches.", "Elle peut empêcher la lumière du soleil"], "a": 0, "k": "son poids ne casse les branches", "transcript": "Encore une question qui est liée au temps. Pauline habite dans le sud et la neige est tombée en grosse quantité. Elle a peur que son poids ne casse les branches de ses arbres et de ses arbustes, et voudrait savoir s'il est conseillé de les agiter pour faire tomber la neige, à une condition, une seule : qu'il ne gèle pas. C'est-à-dire que si vraiment la température demain dehors est un peu comme ce matin, le bois est extrêmement cassant. On attend donc le redoux des températures, et là, on peut effectivement agiter pour laisser tomber la neige et éviter que le poids ne casse les branches. Malheureusement, quantité de plantes, je pense aux grosses haies, vont souffrir du poids de la neige, car la neige représente un poids énorme qui risque de poser quantité de dommages.", "audio": "CO 19/032.MP3", "_test": "19", "_pos": 32, "_origlabel": "test19#32", "_sources": ["test19#32"]}, {"type": "document", "q": "Question 37. De qui parle la journaliste ?", "c": ["D'un citadin original.", "D'un cuisinier renommé.", "D'un historien passionné.", "D'un homme préhistorique."], "a": 0, "k": "D'un citadin original.", "transcript": "Il est comme les autres sauf que lui, pour dire les choses, a l'âme d'un Cro-Magnon. Il vit en mode paléo, comme dans Paléolithique, une époque où les hommes vivaient principalement de chasse et de cueillette. Les adeptes du paléo font des exercices intensifs et se nourrissent uniquement d'aliments crus — fruits, légumes, poissons et viandes — selon eux plus adaptés à l'homme que les graines ou les céréales. Il achète uniquement bio et très important pour lui, il aime sa viande extrêmement fraîche.", "audio": "CO 2/037.MP3", "_test": "2", "_pos": 37, "_origlabel": "test2#37", "_sources": ["test2#37"]}, {"type": "document", "q": "Question 39. D'après cet extrait, quelle est l'origine du mouvement de transition ?", "c": ["Un désir de changement face à l'immobilisme des élus.", "Un questionnement des pratiques du secteur industriel.", "Une convention écologique internationale.", "Une volonté d'aider les citoyens démunis."], "a": 0, "k": "une réponse au manque d'imagination des élus", "transcript": "– En 2015, le film « Demain » de Cyril Dion et Mélanie Laurent propulsait l'idée de transition auprès du grand public. Et aujourd'hui, où en est le mouvement ?\n– Ça marche bien. Il existe dans plus de 50 pays, avec des milliers de communautés qui ont imaginé des initiatives qui vont de l'autosuffisance alimentaire au principe de tirage au sort des citoyens pour prendre des décisions. Ce mouvement se veut une réponse au manque d'imagination des élus. Rob Hopkins déplore d'ailleurs que les pouvoirs publics ne soutiennent pas cet activisme local comme ils soutiennent les grands groupes industriels. Il souhaite maintenant créer un bureau de l'imagination citoyenne et même une loi sur l'imagination nationale.", "audio": "CO 3/039.MP3", "_test": "3", "_pos": 39, "_origlabel": "test3#39", "_sources": ["test3#39"]}], "devoirs": [{"type": "document", "q": "Question 39. Que cherche à étudier cette personne à propos des algues ?", "c": ["Le processus d'attractivité des cellules femelles.", "Les différences avec la reproduction des plantes terrestres.", "La constitution de certains organismes aquatiques.", "L'influence de la météorologie sur leur fécondation."], "a": 0, "k": "attirent les cellules mâles pour les féconder", "transcript": "– Tes recherches sur les algues ? Ça avance, oui, pas mal.\n– Mais tu étudies quoi au juste ?\n– Leur système de reproduction dans un milieu aquatique, le vent ou l
