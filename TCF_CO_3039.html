<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF CO · NCLC 7 (30–39) · 9 thèmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:52px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#185FA5;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#185FA5;color:#185FA5;font-weight:600;background:#fff}
.btn-results:hover{background:#e6f1fb}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{display:inline-block;background:#E6F1FB;color:#0C447C;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem;font-weight:500}
.src-label{display:inline-block;background:#f0f0f0;color:#666;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
.img-wrap{text-align:center;margin-bottom:1rem}
.img-wrap img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid #e0ddd5}
.audio-row{display:flex;align-items:center;gap:10px;background:#f0f6fe;border:1px solid #B5D4F4;border-radius:8px;padding:.65rem 1rem;margin-bottom:1rem}
.play-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid #185FA5;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:background .15s}
.play-btn:hover{background:#e6f1fb}
.audio-label{flex:1;font-size:13px;color:#185FA5;font-weight:500}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong):not(.disabled){background:#f5f4f0}
.choice.disabled{cursor:default}
.choice .badge{font-weight:700;min-width:22px;flex-shrink:0;color:#185FA5;font-size:15px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.correct .badge{color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.wrong .badge{color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.transcript-box{background:#f0f6fe;border:1px solid #B5D4F4;border-radius:0 0 8px 8px;padding:.9rem 1.1rem;font-size:13.5px;line-height:1.85;color:#1a1a1a;font-style:italic}
.transcript-box mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.5rem}
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#185FA5}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:8px 18px;border-radius:8px;border:1px solid #B5D4F4;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#185FA5}
.sum-btn:hover{background:#e6f1fb}
.sum-btn.red{border-color:#F0997B;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-btn.pdf{border-color:#639922;color:#3B6D11;background:#EAF3DE}
.sum-btn.pdf:hover{background:#c0dd97}
.sum-note{font-size:11px;color:#aaa;margin-top:.75rem}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.report-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.qnum{font-size:13px;font-weight:700;color:#185FA5;margin-bottom:.6rem}
.report-choice{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:5px}
.report-choice.neutral{background:#f5f4f0}
.report-choice.correct{background:#E1F5EE;color:#085041;font-weight:600}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C}
/* level select screen */
.level-select{display:flex;flex-direction:column;gap:10px}
.level-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s}
.level-card:hover{border-color:#185FA5;background:#f0f6fe}
.level-name{font-size:20px;font-weight:700;color:#185FA5;min-width:48px}
.level-desc{flex:1;font-size:13px;color:#555;padding:0 10px}
.level-count{font-size:12px;color:#888;white-space:nowrap}
@media print {
  body{background:#fff;padding:0}
  #app{max-width:100%}
  .nav,.sum-actions,.prog-bar,.prog-labels{display:none!important}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid;margin-bottom:.5rem;padding:.75rem}
  .summary{border:none}
  .grid-btn{width:28px;height:28px;font-size:10px}
  .print-section{display:block!important}
  .no-print{display:none!important}
}
.print-section{display:none}
.fs-btn{position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:9px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.10);transition:background .15s,border-color .15s}
.fs-btn:hover{background:#f5f4f0;border-color:#185FA5}
@media print{.fs-btn{display:none!important}}

/* ── ZOOM BAR (added) ── */
.zoombar{display:flex;align-items:center;justify-content:center;gap:.55rem;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:.55rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.zoombar .zlabel{font-size:12px;font-weight:600;color:#0C447C}
.zoombar input[type=range]{-webkit-appearance:none;appearance:none;width:180px;max-width:55vw;height:4px;border-radius:2px;background:#dfe6ec;outline:none;cursor:pointer;accent-color:#185FA5}
.zoombar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#185FA5;cursor:pointer}
.zoombar input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#185FA5;border:none;cursor:pointer}
.zoombar .zval{font-size:12px;font-weight:700;color:#0C447C;min-width:42px;text-align:center}
.zoombar .zbtn{width:26px;height:26px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#0C447C;line-height:1;display:flex;align-items:center;justify-content:center}
.zoombar .zbtn:hover{background:#f5f4f0}
#zoomStage{transform-origin:top center;transition:transform .12s ease}
/* ── QUESTION JUMP BUTTONS (added) ── */
.qjump{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;padding:.55rem .7rem;margin-bottom:.85rem}
.qjump .qjlabel{width:100%;font-size:11px;color:#888;margin-bottom:2px}
.qjump .qj{min-width:30px;height:30px;padding:0 4px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555}
.qjump .qj:hover{background:#f5f4f0}
.qjump .qj.current{background:#0C447C;border-color:#0C447C;color:#fff}
.qjump .qj.answered{border-color:#185FA5;color:#0C447C}
.qjump .qj.answered.current{color:#fff}
@media print{.zoombar,.qjump{display:none!important}}

.theme-select{display:flex;flex-direction:column;gap:12px}
.theme-card{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:12px;padding:1rem 1.1rem}
.theme-head{display:flex;align-items:center;gap:12px;margin-bottom:.7rem}
.theme-emo{font-size:26px;line-height:1}
.theme-name{font-size:18px;font-weight:700;color:var(--tc,#2E8B62)}
.theme-desc{font-size:12.5px;color:#666;margin-top:2px}
.theme-actions{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#444}
.tbtn:hover{background:#f5f4f0;border-color:var(--tc,#2E8B62)}
.tbtn-cours{border-color:#BFE6D3;color:#0F5C3E;background:#F0FAF5}
.tbtn-cours:hover{background:#dcf3e8}
.tbtn-voc{border-color:#FCD34D;color:#92400E;background:#FEF9EC}
.tbtn-voc:hover{background:#fdf0cf}
.lvl-banner{background:linear-gradient(90deg,#0F5C3E,#2E8B62);color:#fff;border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-size:13.5px;font-weight:600;letter-spacing:.3px}
.voc-intro{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:10px;padding:.8rem 1rem;font-size:13.5px;color:#333;margin-bottom:1rem;line-height:1.6}
.voc-list{display:flex;flex-direction:column;gap:9px}
.voc-item{background:#fff;border:1px solid #e0ddd5;border-left:4px solid var(--tc,#2E8B62);border-radius:10px;padding:.75rem .95rem}
.voc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.voc-term{font-size:15.5px;font-weight:700;color:#1a1a1a}
.voc-en{font-size:13px;color:#777;margin:3px 0 6px;font-style:italic}
.voc-ex{font-size:14px;color:#0F5C3E;background:#F5FAF7;border-radius:7px;padding:7px 10px;line-height:1.55}
.voc-tag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.voc-tag.ee{background:#E8EEFF;color:#274690}
.voc-tag.eo{background:#FDE8EF;color:#9B1B47}
.voc-tag.both{background:#E1F5EE;color:#0F6E56}
@media print{.voc-ex,.voc-tag,.lvl-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<button class="fs-btn" id="fsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
<script>
(function(){
  var b=document.getElementById('fsBtn');
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
  b.addEventListener('click',function(){
    if(!fsEl()){
      var el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }
  });
  function upd(){
    var on=!!fsEl();
    b.textContent=on?'✕':'⛶';
    b.title=on?'Quitter le plein écran':'Plein écran';
  }
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<script type="application/json" id="qdata">{"Culture": {"cours": [{"type": "document", "q": "Pourquoi Jacques veut-il aller à Gaspé ?", "c": ["Pour mieux connaître la région.", "Pour aller voir un festival.", "Pour s'acheter une maison.", "Pour rendre visite à un ami."], "a": 2, "k": "j'ai décidé de me trouver une petite maison", "transcript": "— Allô Pierre ? Ici Jacques. Je t'appelle pour te dire que pendant les vacances scolaires, je vais à Gaspé comme tous les ans. Ça t'intéresse de venir avec moi ?\n— Écoute, a priori il n'y a pas de problème. Il faut que je vérifie quand se déroule le festival du cinéma ici, mais sinon, oui !\n— D'abord, il faut que je te dise, cette année, j'y vais pas vraiment pour me balader. J'ai décidé de me trouver une petite maison. J'adore y aller, et depuis le temps que j'y vais, il vaut mieux que je me décide à investir. En plus, j'ai beaucoup d'amis là-bas.\n— Je te préviens mon petit Jacques : moi, j'y vais pour me balader et visiter la région. Les agences immobilières, tu te débrouilleras sans moi, hein ?", "audio": "CO1/030.MP3", "_test": "1", "_pos": 30, "_origlabel": "test1#30", "_sources": ["test1#30"]}, {"type": "document", "q": "Qu'apprend-on sur l'équipe des Canadiens de Montréal ?", "c": ["C'est un exemple de réussite par le sport.", "C'est un modèle rare de mixité culturelle.", "C'est un symbole fort de cette province.", "C'est une référence pour son style de jeu."], "a": 2, "k": "ses héros sur glace ont été francophones", "transcript": "— Fondés en 1909, les Canadiens de Montréal est la plus ancienne équipe de hockey toujours en activité. Les joueurs qui ont composé cette ancestrale franchise ont longtemps été en grande majorité d'origine canadienne, puis nord-américaine. Mais ce qui a marqué longtemps l'histoire de ce fameux club de hockey, c'est que ses héros sur glace ont été francophones. Dans un Québec dont les destinées étaient surtout menées par des compagnies anglaises et où l'étiolement de la communauté minoritaire semblait inexorable, le fait d'avoir des joueurs de hockey francophones héroïques parmi les meilleurs du monde a été pour les Québécois un tremplin extraordinaire et un encouragement à décrocher leur propre succès.", "audio": "CO1/035.MP3", "_test": "1", "_pos": 35, "_origlabel": "test1#35", "_sources": ["test1#35", "test9#35"]}, {"type": "document", "q": "Question 35. D'après cette interview, qu'attend le public d'un artiste ?", "c": ["Un festival d'improvisations.", "Un récital de nouveautés.", "Une interprétation sincère.", "Une performance impeccable."], "a": 2, "k": "les gens vont le sentir", "transcript": "La scène, c'est un lieu sacré. Elle vous donne beaucoup et elle autorise beaucoup, parce que vous avez le droit, sur scène, de débuter. Vous avez le droit d'apprendre, vous avez le droit d'être maladroit, de chercher vos marques. Par contre, il y a un truc qu'elle ne pardonne pas : c'est que vous ne soyez pas toujours au meilleur de vous-même. Et les gens vont le sentir. C'est pas du blabla, ça, c'est très, très concret. On ne peut pas faire ce métier d'artiste par devoir, on ne peut pas se laisser installer la routine. Moi, je me suis toujours battu contre ça, parce que j'ai toujours le même plaisir de chanter sur scène.", "audio": "CO 3/035.MP3", "_test": "3", "_pos": 35, "_origlabel": "test3#35", "_sources": ["test3#35"]}, {"type": "document", "q": "Question 33. Quelle est la particularité de l'établissement de Philippe ?", "c": ["C'est la reproduction d'un café du siècle dernier.", "Il contient un dépôt-vente de meubles design.", "C'est à la fois un restaurant et une galerie d'art.", "Il y organise un festival de musique électronique."], "a": 2, "k": "j'ai accroché des tableaux, des œuvres contemporaines", "transcript": "– Alors, Philippe, est-ce que vous pouvez nous apprendre plus sur votre établissement ?\n– Quand j'ai récupéré l'endroit, il s'agissait d'un lieu qui était ancien à Montréal au début du 19e siècle. J'ai donc gardé ce qui était d'époque et j'ai rajouté une touche moderne, design, pour créer un espace particulier où des styles se mélangent. Comme je suis un passionné des meubles design, j'ai acheté des pièces qui me plaisent, et en plus d'y manger, on peut assister à des soirées musicales. Il y a un DJ très connu internationalement dans le domaine de la musique électronique. Enfin, étant donné qu'on est dans un lieu très haut plafond, j'ai accroché des tableaux, des œuvres contemporaines, mais on organise ici des expos temporaires. Toutes les formes de l'expression nous intéressent.", "audio": "CO 5/033.MP3", "_test": "5", "_pos": 33, "_origlabel": "test5#33", "_sources": ["test5#33", "test40#32"]}, {"type": "document", "q": "Question 34. Quelle forme de littérature cherche à promouvoir le festival Hors Limite ?", "c": ["Une littérature axée sur les débats avec le public.", "Une littérature expérimentée à travers le jeu.", "Une littérature interprétée par les comédiens.", "Une littérature portée sur l'interdisciplinarité."], "a": 3, "k": "La littérature peut croiser la danse, le graphisme ou le cinéma", "transcript": "– C'est la quatrième édition de ce rendez-vous qui s'échelonne sur deux semaines avec une cinquantaine d'auteurs invités. Pourquoi l'avoir appelé hors limite ? Ça n'évoque pas du tout la littérature.\n– Alors par contre, ça parle de l'ouverture. Je dirais que ce festival littéraire veut prouver que la littérature est ouverte de deux points de vue : sur le fond, le maître mot du festival, c'est les croisements et l'ouverture des formes. Le festival propose des lectures croisées. Il y a énormément de rencontres avec plusieurs auteurs. La littérature peut croiser la danse, le graphisme ou le cinéma. Je dirai aussi que hors limite, c'est l'ouverture sur le fond puisque on veut prouver que la littérature n'est pas nombriliste, qu'elle est ouverte aux questions qui agitent notre temps.", "audio": "CO 5/034.MP3", "_test": "5", "_pos": 34, "_origlabel": "test5#34", "_sources": ["test5#34"]}, {"type": "document", "q": "Question 31. Selon la présentatrice, quel est le but de cette émission ?", "c": ["Favoriser l'apprentissage de chansons françaises.", "Montrer la variété de la langue française.", "Promouvoir de nouveaux événements musicaux.", "Faire le tour du monde des festivals francophones."], "a": 1, "k": "différents parlers québécois, ivoiriens, belges qui donnent la couleur à notre langue française", "transcript": "C'est un nouveau rendez-vous radiophonique que nous vous proposons ce soir sur notre chaîne internationale avec notre émission consacrée à la chanson francophone. À travers la chanson, c'est surtout à la découverte de ces différents parlers québécois, ivoiriens, belges qui donnent la couleur à notre langue française que nous partirons ce soir, avec bien sûr la rencontre aussi de voix, de musique, de chanteurs, de textes, de culture, sans oublier pour terminer un petit tour au festival des chorales francophones.", "audio": "CO 8/031.MP3", "_test": "8", "_pos": 31, "_origlabel": "test8#31", "_sources": ["test8#31"]}, {"type": "document", "q": "Question 35. Pour l'auteur, de quoi les gens cultivés doivent-ils se rendre compte ?", "c": ["De l'absurdité qu'il y a à valoriser leur manque de culture scientifique.", "De la nécessité de mieux défendre les acquis de la culture classique.", "Du besoin qu'ont les mathématiciens d'avoir une culture générale.", "Du refus des valeurs humanistes par les milieux scientifiques."], "a": 0, "k": "en se vantant de ne rien connaître aux mathématiques", "transcript": "On l'a dit, la culture générale a tout son défaut, mais en plus elle a le défaut d'ignorer les sciences. Ça, c'est assez facile à faire comme constat. Oui, assez facile à faire comme constat, mais ce qui est déplorable, c'est que ça n'est pas incorporé, cette idée-là, il me semble. C'est-à-dire qu'on peut très bien aujourd'hui se prétendre cultivé, et les gens qui parlent de culture générale sont très souvent, ou typiquement, des humanistes qui ont une culture littéraire, être cultivés sans avoir de connaissances scientifiques, et j'irais même jusqu'à dire pire, en méprisant, ou en trouvant que ça ne pose absolument pas problème de ne pas avoir de culture scientifique, ou, pour prendre un exemple que j'aime beaucoup, en se vantant de ne rien connaître aux mathématiques. Et là, je pense que c'est une profonde erreur. Et puis le livre se veut une défense passionnée, j'irais dire, de l'importance d'incorporer des notions de culture scientifique.", "audio": "CO 8/035.MP3", "_test": "8", "_pos": 35, "_origlabel": "test8#35", "_sources": ["test8#35"]}, {"type": "document", "q": "Quel est le concept de cette librairie ?", "c": ["Animer des ateliers d'écriture thématiques", "Faire connaitre de jeunes philosophes talentueux", "Organiser des lectures pendant les repas du midi", "Trouver des solutions aux difficultés quotidiennes"], "a": 3, "k": "Cette librairie a pour objectif d'aider les gens avec leurs problèmes de tous les jours en apportant de nouvelles pistes de réflexion.", "transcript": "C'est une idée originale et réussie qu'a eue un philosophe. Créer l'école de la vie. L'endroit est accueillant, rempli de livres, de fleurs, on peut y boire et manger. Cette librairie a pour objectif d'aider les gens avec leurs problèmes de tous les jours en apportant de nouvelles pistes de réflexion. On y vient au petit déjeuner ou le week-end pour des ateliers. On y pratique aussi des consultations littéraires, d'où l'on repart avec une ordonnance de livres.", "audio": "CO 10/035.MP3", "_test": "10", "_pos": 35, "_origlabel": "test10#35", "_sources": ["test10#35"]}, {"type": "document", "q": "Qu'ose cette association ?", "c": ["D'équiper des bris pour pique-niquer les zones urbaines.", "De partager un déjeuner avec des personnes sans ressources.", "De proposer aux cheminots de participer à une manifestation culturelle.", "D'organiser des repas collectifs dans un lieu inhabituel."], "a": 3, "k": "dans un endroit qui n'est pas fait pour ça", "transcript": "L'Association des Urbanités vous invite à pique-niquer en ville. C'est une tendance, et surtout une manière différente et festive de vivre la ville. Marcel est un inconditionnel des pique-niques urbains.\n– Comment organisez-vous ce genre de manifestation ?\n– Ici, on est près d'une gare. On pourrait imaginer un pique-nique sur les rails ?\n– Exactement, mais sur les quais, avec plaisir. L'idée, c'est de faire quelque chose dans un endroit qui n'est pas fait pour ça.", "audio": "CO 24/030.MP3", "_test": "24", "_pos": 30, "_origlabel": "test24#30", "_sources": ["test24#30"]}, {"type": "document", "q": "Quel changement annonce l'homme interviewé ?", "c": ["Un accès plus large aux fonds de la bibliothèque municipale", "Un contrat permettant de combiner différents types d'abonnements", "Un contrôle renforcé de l'identité des usagers des services de la ville", "Une modernisation des procédures d'emprunt des documents"], "a": 3, "transcript": "— Au lieu de passer au guichet de prêt muni de vos livres ou vidéos, en présentant votre carte d'abonné habituelle manuscrite et cartonnée, vous montrerez cette carte magnétique, format carte de crédit, qui identifie automatiquement l'emprunteur. — Quels en sont les avantages ? — Réduire l'attente au guichet et la facilité de rangement.", "k": "carte magnétique, format carte de crédit", "audio": "CO 30/034.MP3", "_test": "30", "_pos": 34, "_origlabel": "test30#34", "_sources": ["test30#34"]}, {"type": "document", "c": ["Gio Sen a inclus des questions des auditeurs.", "Les auditeurs ont envoyé des commentaires en direct.", "Les auditeurs ont participé à l'émission.", "Il y a eu un vote des auditeurs sur les sujets."], "a": 2, "transcript": "Bonjour à tous, bienvenue pour cette nouvelle émission. Il y a quelques personnes qui sont avec moi et qui vont se présenter. Gilocène, bonjour. Bonjour à tous. Alors moi, c'est Gilocène. Je suis l'un des fondateurs et webmaster historique du site. Et au quotidien, je me charge de la majorité des chroniques de romans ainsi que des brèves de l'actualité.", "k": "il y a quelques personnes qui sont avec moi", "q": "Qu'apprend-on sur ce podcast ?", "audio": "CO 32/031.MP3", "_test": "32", "_pos": 31, "_origlabel": "test32#31", "_sources": ["test32#31"]}, {"type": "document", "c": ["La capacité à vivre au paradis.", "Le pouvoir magique de la poésie.", "La capacité à révéler une certaine vérité.", "Le fait d'être un romancier raté."], "a": 2, "transcript": "Le poète va entrer au paradis au cœur de l'enfer. Je ne possède pas ce pouvoir magique. Je ne serai jamais un poète, je suis romancier, c'est-à-dire un poète raté. Oui, c'est clair. Parce qu'un poète, il est un vrai, il peut expliquer le monde, il peut donner des sons. Moi, ce sont des petits verbes de rien qui m'ont accompagné toute ma vie... parce que tout simplement, ils se cachent à l'abri de cette vérité, essayer d'expliquer sans vraiment expliquer.", "k": "ils se cachent à l'abri de cette vérité", "q": "D'après l'auteur, qu'est-ce qui caractérise le poète ?", "audio": "CO 32/032.MP3", "_test": "32", "_pos": 32, "_origlabel": "test32#32", "_sources": ["test32#32"]}, {"type": "document", "q": "Question 34. De quoi parle cet artiste ?", "c": ["De la particularité de sa voix.", "De la reprise d'une oeuvre.", "De sa nouvelle tournée.", "De son dernier rôle au cinéma."], "a": 1, "k": "j'ai chanté cette chanson-là", "transcript": "C'est une des plus grandes chansons qui aient été faites dans toute l'histoire de la chanson francophone. C'est un court métrage, c'est même un long métrage en quelques minutes. Et arriver à dépeindre tout un univers où on comprend la complexité du personnage, où on peut tout mettre dans un contexte social, où on a même presque des parfums... on a tout dans cette chanson-là. Donc oui, pour moi, c'est comme si j'avais chanté une grammaire. Si j'étais un classique, j'aurais joué Bach. J'ai chanté à Saint-Paul, j'ai chanté cette chanson-là.", "audio": "CO 19/034.MP3", "_test": "19", "_pos": 34, "_origlabel": "test19#34", "_sources": ["test19#34", "test33#32"]}, {"type": "document", "q": "Question 35. Qu'évoque cette personne ?", "c": ["Des fouilles archéologiques dans un sanctuaire.", "La construction d'un édifice emblématique.", "Le tourisme religieux au cours des siècles.", "Une visite lors des journées du patrimoine."], "a": 1, "k": "construire un sanctuaire", "transcript": "Aujourd'hui, le Mont Saint-Michel est au patrimoine mondial de l'humanité. L'histoire et la légende veulent qu'une nuit d'octobre 708, Aubert, évêque d'Avranches, soit réveillé par l'archange Saint-Michel, lui ordonnant de construire un sanctuaire sur le Mont Tombe, au milieu de cette baie. Le chantier va durer dix siècles et aux travaux des bâtisseurs ont succédé depuis cent ans les plans de restauration des architectes des bâtiments historiques. Qu'évoque cette personne ?", "audio": "CO 35/035.MP3", "_test": "35", "_pos": 35, "_origlabel": "test35#35", "_sources": ["test35#35"]}, {"type": "document", "q": "Question 32 : Quel était l'objectif de Georges Moustaki avec cette chanson ?", "c": ["Appeler à la fraternité dans le monde entier.", "Envoyer un message à tous les jeunes immigrés.", "Raconter un épisode sentimental de sa propre vie.", "Se faire rapidement connaître auprès du grand public."], "a": 2, "k": "il ne s'agissait que d'une chanson sur un amour déçu", "transcript": "Georges Moustaki tente de séduire une jeune femme. Les parents de celle-ci sont furieux et traitent le courtisan de Métec. Une malheureuse aventure qui lui inspire la chanson Le Métec. Elle a eu un succès immédiat. C'était absolument imprévisible. C'est une bonne chanson. Enfin, j'en étais assez content. Mais ce qu'elle racontait ne me paraissait pas être appelé à devenir universel. Or, je ne compte plus les pays qui l'ont adoptée. Elle existe en... en italien, portugais, espagnol, turc. Je ne pensais pas que cette chanson ferait une carrière. La diffusion du METEC intervenant un an après mai 68, le public y entend un chant libertaire, alors qu'au départ, il ne s'agissait que d'une chanson sur un amour déçu.", "audio": "CO 37/032.MP3", "_test": "37", "_pos": 32, "_origlabel": "test37#32", "_sources": ["test37#32"]}, {"type": "document", "q": "Question 35 : Selon l'intervenant, quel est le rôle de la littérature ?", "c": ["Aider à une réflexion sur l'existence.", "Contribuer à l'évasion du quotidien.", "Dévoiler les sentiments d'un auteur.", "Solliciter l'imagination du public."], "a": 0, "k": "C'est un miroir renvoyé en permanence à celui qui lit", "transcript": "En des temps comme les nôtres, quel rôle peut jouer la littérature, justement ? La littérature, c'est au fond une sorte de machine à décrypter le réel. L'outil de travail de la littérature, c'est l'émotion que vous créez chez le lecteur. C'est-à-dire que c'est parce que le lecteur va ressentir une émotion, positive ou négative, ça va de l'attachement à la détestation, c'est grâce à ça qu'il va comprendre des choses, ce qui se passe dans le roman, ce qui se passe dans les personnages, et d'une certaine manière, ça va refléter ce qui se passe dans sa vie. C'est un miroir renvoyé en permanence à celui qui lit.", "audio": "CO 37/035.MP3", "_test": "37", "_pos": 35, "_origlabel": "test37#35", "_sources": ["test37#35"]}, {"type": "document", "q": "Question 34 : De quoi parle cet artiste ?", "c": ["D'un film qu'il vient de tourner.", "D'une chanson qu'il admire.", "D'un concert mémorable.", "D'un roman qu'il a lu."], "a": 1, "k": "une des plus grandes chansons qui a été faite", "transcript": "C'est une des plus grandes chansons qui a été faite dans toute l'histoire de la chanson francophone. C'est, on a accès, c'est un court métrage, en fait, c'est même un long métrage en quelques minutes, et d'arriver à dépeindre tout un univers où on comprend la complexité du personnage, où on peut le mettre dans un contexte social, où on peut... on a même presque des parfums, on a tout dans cette chanson-là.", "audio": "CO 38/034.MP3", "_test": "38", "_pos": 34, "_origlabel": "test38#34", "_sources": ["test38#34"]}, {"c": ["Elle aborde des sujets de fonds.", "Elle crée de la concurrence entre auteurs.", "Elle est encadrée par des normes strictes.", "Elle s'adresse à un public averti."], "a": 2, "q": "Qu'explique l'interlocuteur à propos de la bande dessinée ?", "transcript": "Parce que la bande dessinée est un exercice qui demande une telle rigueur, une telle discipline. La pratique de la bande dessinée nous impose une grammaire, une grammaire tellement étroite. Déjà le dessin est enfermé dans les cases la plupart du temps. Donc tout est là pour que le dessin s'ankylose, se raidisse, s'amidonne. Tous les éléments sont là pour que notre dessin se dessèche. Donc à l'intérieur de cet exercice domestiqué qui est la bande dessinée, essayer de rendre un dessin vivant ou simplement plaisant à exécuter, ce n'est pas gagné, en fait.", "k": "une grammaire, une grammaire tellement étroite", "type": "document", "audio": "CO 39/035.MP3", "_test": "39", "_pos": 35, "_origlabel": "test39#35", "_sources": ["test39#35"]}, {"type": "document", "q": "Quelle est l'hypothèse de la police sur les œuvres volées ?", "c": ["Elles ont été revendues.", "Elles seront abandonnées.", "Elles sont stockées à l'étranger.", "Elles vont être falsifiées."], "a": 0, "k": "les enquêteurs pensent que la revente était déjà conclue", "transcript": "C'est l'un des plus importants vols jamais réalisés dans une galerie de peinture en Europe. Il concerne quatre tableaux de certains des plus grands maîtres de la peinture européenne : Manet, Renoir, Sisley et Chaal. Le montant du préjudice s'élève à plusieurs centaines de millions d'euros. Ces tableaux sont tellement connus que les enquêteurs pensent que la revente était déjà conclue avant que les trafiquants ne passent à l'acte. Il faut faire vite car ces œuvres sont fragiles. Toutes les polices européennes coopèrent afin de retrouver les malfaiteurs et les tableaux dans les plus brefs délais.", "audio": "CO 14/031.MP3", "_test": "14", "_pos": 31, "_origlabel": "test14#31", "_sources": ["test14#31"]}, {"type": "document", "q": "Selon l'intervenant, comment la photographie a-t-elle influencé la représentation de l'Italie ?", "c": ["En supprimant complètement la peinture comme moyen de représentation.", "En rendant les beautés italiennes moins accessibles au public.", "En favorisant la diffusion des images italiennes à travers des albums de souvenirs.", "En éliminant toute individualité chez les photographes italiens."], "a": 2, "k": "en favorisant par exemple, le développement des albums de souvenirs", "transcript": "Peinture, photographie, l'Italie fut un modèle sans cesse renouvelé, ce dont témoigne l'exposition qui pourrait être thématique s'articule également autour de deux temps avant et après Au Maroc l'invention de la photographie, laquelle découverte permettra de vulgariser les beautés architecturales, naturelles et humaines de ce pays, en favorisant par exemple, le développement des albums de souvenirs. Et si les premières images s'inscrivent plutôt dans la tradition du paysage hérité de la pratique picturale peu à peu des individualités émergeront associées qui à une région qui a une préoccupation qui a une technique que l'on songe à Giorgio, au sommet, qui sera le témoin des deux éruptions du Vésuve depuis 1888 et des découvertes à la même époque décident de Pompéi et d'Herculanum près de Naples ou au frère à Linari installé eux à Florence.", "audio": "CO 15/035.MP3", "_test": "15", "_pos": 35, "_origlabel": "test15#35", "_sources": ["test15#35"]}], "devoirs": [{"type": "document", "q": "Question 30. Dans quel but la journaliste Christine Pellé est-elle invitée à cette émission ?", "c": ["Pour donner des conseils pratiques pour sortir de la routine.", "Pour présenter son dernier livre sur la psychologie.", "Pour raconter son expérience personnelle de changement de vie.", "Pour analyser les causes et les conséquences de la routine."], "a": 0, "k": "il suffit de peu de choses pour déprogrammer cette routine", "transcript": "– Bonjour.\n– Bonjour. Vous êtes journaliste à Psychologie Magazine et vous venez aujourd'hui nous parler de notre routine de vie.\n– On se lève à la même heure, on se rend dans les mêmes lieux. On accomplit les mêmes gestes, ce qui entraîne souvent ennui, fatigue, manque d'énergie et surtout fermeture au reste du monde. Mais parfois, il suffit de peu de choses pour déprogrammer cette routine.\n– Expliquez-nous, Christine.\n– Vraiment peu de choses. Il suffit simplement de faire un petit pas de côté, de sortir de notre perception habituelle pour expérimenter de nouvelles sensations, de nouvelles émotions.", "audio": "CO 17/030.MP3", "_test": "17", "_pos": 30, "_origlabel": "test17#30", "_sources": ["test17#30"]}, {"type": "document", "q": "Quel problème est associé au développement des festivals ?", "c": ["Ils desservent l'image des vedettes.", "Ils génèrent des profits insuffisants.", "Ils programment les mêmes musiciens.", "Ils sont tous organisés pendant l'été."], "a": 2, "k": "des têtes d'affiche sont pratiquement toujours les mêmes", "transcript": "Le problème des festivals, c'est très bien que les festivals se développent. Mais moi, j'ai l'impression qu'il y a beaucoup de festivals, mais en même temps, il n'y a pas plus de groupes qui jouent sur scène. C'est-à-dire qu'on assiste en fait à un phénomène où des têtes d'affiche sont pratiquement toujours les mêmes. Et puis ensuite, on fait appel à des groupes locaux et les artistes qui ne sont pas considérés comme des stars ont plutôt du mal à trouver des festivals parce qu'il y a un peu la course aujourd'hui. Je crois que j'ai l'impression que le festival, c'est un peu aussi la course aux chiffres et on fait passer au second plan l'artistique.", "audio": "CO 20/035.MP3", "_test": "20", "_pos": 35, "_origlabel": "test20#35", "_sources": ["test20#35"]}, {"type": "document", "q": "Question 33. Pourquoi la journaliste a-t-elle été touchée de rencontrer Raoul Sosa ?", "c": ["Parce qu'elle admire l'orchestre du conservatoire et qu'elle espère y jouer.", "Parce qu'elle aspire à rencontrer tous les grands interprètes classiques du moment.", "Parce qu'elle connait la discipline dont il faut faire preuve pour bien jouer.", "Parce qu'elle est elle-même migrante et sait combien peut lui être utile."], "a": 2, "k": "j'ai étudié le piano et donc n'ai aucun mal à imaginer ce que ça prend", "transcript": "On rend hommage aujourd'hui à un grand pianiste, chef d'orchestre, compositeur canadien et d'origine argentine, qui est considéré comme un des musiciens actuels les plus importants.\n– Oui, j'ai eu ce grand privilège de rencontrer Raoul Sosa au conservatoire de Montréal, où il donne des cours au futur grand pianiste canadien. Et vous savez, Raymond, ce sujet me tient particulièrement à cœur parce que j'ai étudié le piano et donc n'ai aucun mal à imaginer ce que ça prend pour arriver au niveau de cet artiste originaire de Buenos Aires. Il a quitté son pays à l'âge de 20 ans pour étudier en Europe, et en 1978 il a reçu le prix de la meilleure émission radiophonique d'un soliste canadien par le Conseil canadien de la musique à Ottawa.", "audio": "CO 23/033.MP3", "_test": "23", "_pos": 33, "_origlabel": "test23#33", "_sources": ["test23#33"]}, {"type": "document", "q": "Question 33. Sur quel registre cette rétrospective joue-t-elle ?", "c": ["L'humour : elle met en scène des produits ménagers.", "La provocation : elle présente des tableaux scandaleux.", "La répétition : elle montre des toiles absolument identiques.", "Le paradoxe : elle expose une absence d'œuvres."], "a": 3, "k": "espace entièrement vide", "transcript": "Journaliste : Il faut passer devant plusieurs tableaux de la collection permanente avant d'arriver à un seuil métallique qui marque l'entrée dans un espace entièrement vide. Il s'agit de l'exposition Vide, une rétrospective présentée actuellement à Paris. 50 ans auparavant, un artiste lessivait pour la première fois une salle de musée. C'était en 1958. Yves Klein, célèbre notamment pour ses monochromes, avait alors présenté une salle de musée déserte. L'an dernier, le Vide en art contemporain a donc soufflé ses 50 bougies. L'occasion de faire le point sur cette histoire particulière. Le musée parisien consacre donc une rétrospective aux artistes qui, depuis un demi-siècle, ont proposé une autre approche du lieu d'exposition.", "audio": "CO 25/033.MP3", "_test": "25", "_pos": 33, "_origlabel": "test25#33", "_sources": ["test25#33"]}, {"type": "document", "q": "Question 32. Qu'est-ce qui caractérise l'écriture théâtrale de cet auteur ?", "c": ["La diversité des parlers régionaux des personnages", "La mise en relief des formules figées de la langue", "Le recours constant au registre familier", "Les jeux de mots récurrents dans les titres"], "a": 1, "k": "il y a énormément de langue de bois qui est pointée du doigt", "transcript": "C'est assez étonnant de lire les titres des textes de Nathalie Sarraute, des pièces de théâtre, parce que ce sont toujours des structures de phrases très stéréotypées. Vous les entendez : « C'est beau », « Pour un oui ou pour un non », elle est là, on ne peut pas faire plus simple. Et en fait, derrière, il y a des gouffres, en effet, oui. Et puis en plus, elle est très sensible à ce qui, dans le langage, sert de, je dirais, de costume prêt-à-porter. Il y a énormément de langue de bois qui est pointée du doigt dans « Lieux communs ». On a eu « Lieux communs », elle adore ça et elle le fait partager. Donc les personnages qu'elle met en scène ont des forces énormes, mais qui sont canalisées par ce travail avec les mots, et elle se débrouille avec ça.", "audio": "CO 28/032.MP3", "_test": "28", "_pos": 32, "_origlabel": "test28#32", "_sources": ["test28#32"]}, {"type": "document", "q": "Question 33. Quelle était la préoccupation de la comédienne au début de sa carrière ?", "c": ["Augmenter la fréquentation des théâtres", "Créer une troupe de théâtre indépendante", "Déterminer les nouveaux enjeux du théâtre", "Jouer dans des pièces de théâtre inédites"], "a": 2, "k": "Je me demandais moins comment il fallait le faire, mais surtout pourquoi il fallait le faire", "transcript": "Est-ce que vous pouvez nous décrire votre itinéraire ? Oui, j'ai fait mes études de comédienne à Montréal, à l'École nationale de théâtre, dans les années 70. Et puis quand je suis sortie de l'école avec mon diplôme de comédienne, c'était la grande époque héroïque des créations collectives et du théâtre qu'on appelait engagé, à l'époque. Et moi, j'étais tout à fait dans ce courant-là. J'étais très passionnée par le sens, justement, et par le pourquoi du théâtre. Je me demandais moins comment il fallait le faire, mais surtout pourquoi il fallait le faire, et à qui on s'adressait. À ce moment-là, c'était une question très importante : à qui s'adresse le théâtre ? Et moi, j'ai fait partie de ce grand mouvement qui a voulu aller porter le théâtre aux gens.", "audio": "CO 28/033.MP3", "_test": "28", "_pos": 33, "_origlabel": "test28#33", "_sources": ["test28#33"]}, {"type": "document", "q": "Question 36. Quelle est la particularité de l'œuvre présentée ?", "c": ["Des partitions musicales ponctuent les chapitres.", "Elle réunit des textes de musiciens sur le thème de la peur.", "L'éditeur a choisi d'accompagner le livre d'un DVD.", "Sa mise en page est comparable à celle du livret d'un disque."], "a": 3, "k": "cette présentation-là qu'on trouve dans les jaquettes des CD", "transcript": "Et on est rendu à notre chronique littéraire avec Audrey Manet. Tout d'abord, Daniel Bélanger, un musicien, guitariste aguerri. Mais Daniel Bélanger, c'est d'abord un compositeur, c'est l'auteur de ses chansons. Et c'est ce pan de son travail qu'on retrouve ici. On a d'ailleurs cette présentation-là qu'on trouve dans les jaquettes des CD, vous savez, le texte qui est centré au milieu de la page. On a des renvois à la ligne à chaque strophe. Ici, c'est la même chose. On connaît cette maison d'édition pour ses parutions souvent étrangères, aussi poétiques. Mais les Allusifs sortent une nouvelle collection de petits livres qu'ils appellent Les Peurs, avec comme adage : un auteur, une peur, un livre.", "audio": "CO 3/036.MP3", "_test": "3", "_pos": 36, "_origlabel": "test3#36", "_sources": ["test3#36"]}, {"type": "document", "q": "Question 37. Que permet la musique de chambre selon Renaud Capuçon ?", "c": ["D'affiner l'écoute entre musiciens.", "D'exprimer l'originalité d'une interprétation.", "De faire varier le répertoire des concerts.", "De perfectionner la technique du violoniste."], "a": 0, "k": "parvenir à une symbiose", "transcript": "– Renaud Capuçon, ce que je me demande, c'est comment vous, en tant que violoniste, vous arrivez à vous accorder si bien avec les autres instruments.\n– C'est le grand bonheur de la musique de chambre. Et c'est justement ce plaisir d'essayer, non pas de tirer la couverture à soi ou de jouer solo, mais de parvenir à une symbiose. Je trouve que cela remet vraiment les pendules à l'heure. Parfois, on joue peu avec un orchestre, ou bien on passe d'un orchestre à un autre. Au contraire, la musique de chambre permet d'aller au fond des choses. On ne peut pas tricher sur scène. Le dialogue est absolument sans limite.", "audio": "CO 3/037.MP3", "_test": "3", "_pos": 37, "_origlabel": "test3#37", "_sources": ["test3#37", "test23#37"]}, {"type": "document", "q": "Question 38. Quel jugement cette personne porte-t-elle sur les lieux culturels ?", "c": ["Elle déplore le manque de structures pour accueillir et réunir les jeunes.", "Elle désapprouve la disparition d'endroits consacrés aux pratiques culturelles.", "Elle estime insuffisantes les tentatives des cinémas de mélanger les publics.", "Elle regrette le désintérêt des publics pour les espaces et les échanges culturels."], "a": 0, "k": "Je regrette qu'il n'y ait pas plus de lieux", "transcript": "On voit vraiment que les pratiques culturelles sont suivies. Malheureusement, aujourd'hui, même au niveau de la jeunesse, qui pourrait être fédérée par le phénomène générationnel, les pratiques culturelles sont très séparées. Je regrette qu'il n'y ait pas plus de lieux qui permettent aux jeunes de se retrouver sur des terrains festifs. C'est vrai que ce sont des moments de se retrouver, de vivre ensemble, mais sans être dans une posture d'affrontement. Cela manque. Il y a des salles de cinéma, même dans les multiplexes. On voit que selon les films, les publics ne sont pas les mêmes.", "audio": "CO 3/038.MP3", "_test": "3", "_pos": 38, "_origlabel": "test3#38", "_sources": ["test3#38", "test6#38", "test11#39", "test31#39"]}, {"type": "document", "q": "Question 38. Selon le chroniqueur, pourquoi l'expression « États-Unis d'Europe » est-elle taboue ?", "c": ["Elle est incompréhensible pour les citoyens.", "Elle est utilisée par des partis extrémistes.", "Elle fait ressurgir des rivalités ou des antagonismes oubliés.", "Elle est contraire aux traités européens."], "a": 2, "k": "Elle fait ressurgir des rivalités ou des antagonismes oubliés.", "transcript": "Avant-hier, dans une tribune officielle, une élue française a brisé un tabou et sans doute heureusement. En parlant des États-Unis d'Europe comme de l'objectif ultime du processus d'unification européenne, elle a d'un coup redonné une clarté à cette entreprise si complexe qu'elle en est devenue obscure à tant d'Européens. De crainte de passer pour de doux rêveurs romantiques, même les plus déterminés des partisans de l'unité de l'Europe n'osaient plus employer l'expression de Victor Hugo. « On ne peut pas », dit-on. « Ce serait briser net un consensus, ce serait rompre avec certaines nations, susciter de nouvelles querelles bien plus violentes encore que celle du traité constitutionnel. »", "audio": "CO 34/038.MP3", "_test": "4", "_pos": 38, "_origlabel": "test4#38", "_sources": ["test4#38"]}, {"type": "document", "q": "Question 39. Comment l'exposition sur Monet a-t-elle été conçue ?", "c": ["En regroupant les œuvres selon un ordre chronologique.", "En regroupant les tableaux dans une même salle.", "En regroupant les toiles autour d'un même sujet.", "En regroupant ses créations avec celles d'autres artistes."], "a": 2, "k": "on voulait vraiment mettre en valeur ce qu'était peindre des impressions", "transcript": "On a voulu faire une salle qui s'appelle « Monet entre des impressions » pour vraiment mettre en valeur l'aspect très original de Monet parmi les impressionnistes. Dans la salle précédente, on a mis ses premiers paysages, qui sont les paysages d'Argenteuil. On y voit donc les paysages les plus classiques du peintre qui va devenir le chef de file de l'impressionnisme. Mais dans la salle « peindre des impressions », on voulait vraiment mettre en valeur ce qu'était peindre des impressions. Donc évidemment, on a « Impression, soleil levant », qui a le titre qu'il porte et qui met en valeur le côté impressionniste du paysage. C'est une vue du Havre, mais on ne peut presque plus reconnaître Le Havre, tant ce paysage montre ce qu'est une atmosphère lumineuse, finalement cette atmosphère de crépuscule qui est mise en valeur par ces nouvelles couleurs et ces nouvelles petites touches de peinture.", "audio": "CO 8/039.MP3", "_test": "8", "_pos": 39, "_origlabel": "test8#39", "_sources": ["test8#39", "test30#39", "test32#39"]}, {"type": "document", "q": "Quel est l'objectif de l'intervention de cette journaliste ?", "c": ["Favoriser la visibilité des ouvrages peu accessibles", "Intervenir dans le choix des publications à venir", "Modifier notre regard sur les livres « grand public »", "Soutenir les petits éditeurs et leurs parutions"], "a": 0, "k": "Nous espérons que cette intervention radiophonique vous donnera envie de découvrir ce joyau méconnu de la littérature mondiale.", "transcript": "Bonjour à tous. Vous écoutez radio culture, l'émission qui vous fait découvrir des livres méconnus ou difficiles à trouver. Aujourd'hui, nous allons vous parler d'un ouvrage exceptionnel, mais hélas, introuvable en librairie, les mémoires d'un chat de Natsume Soseki. Il s'agit d'un roman japonais publié en 1905, qui raconte la vie d'un chat domestique, observant avec ironie et tendresse les mœurs de ses maîtres. Ce livre est un chef-d'œuvre de la littérature japonaise, mais il n'a jamais été réédité en français depuis sa première traduction. En 1939, nous avons eu la chance de dénicher un exemplaire dans une bouquinerie et nous allons vous en lire quelques extraits. Si vous êtes intéressé par ce livre, vous pouvez le commander sur internet ou le chercher dans les bibliothèques spécialisées. Nous espérons que cette intervention radiophonique vous donnera envie de découvrir ce joyau méconnu de la littérature mondiale.", "audio": "CO 10/036.MP3", "_test": "10", "_pos": 36, "_origlabel": "test10#36", "_sources": ["test10#36"]}, {"type": "document", "q": "Sur quoi porte l'intervention ?", "c": ["La relation liant Camille Claudel et Rodin", "La richesse du musée Auguste Rodin", "Les difficultés rencontrées par Rodin", "Les sources d'inspiration de Rodin"], "a": 0, "k": "Camille Claudel restera pour la postérité une élève de Rodin.", "transcript": "Camille Claudel restera pour la postérité une élève de Rodin. Elle est exposée dans le musée Auguste Rodin. Elle est connue comme telle. Elle a beaucoup reçu de Rodin, mais elle s'en est servie pour créer une œuvre totalement différente. On connaît évidemment la fameuse phrase « Je lui ai montré où trouver de l'or, mais l'or qu'elle trouvait bien à elle ». C'est très flagrant quand on compare plusieurs œuvres. À côté du Penseur, qui est, c'est vrai, d'une puissance ramassée, tout en muscles, et qui dégage une force presque brute, l'homme penché, lui, est construit comme presque un arbre dont on voit les nervures, dont on saisit les muscles, les nerfs, l'attitude, et presque plus la pensée que chez le Penseur.", "audio": "CO 10/037.MP3", "_test": "10", "_pos": 37, "_origlabel": "test10#37", "_sources": ["test10#37", "test40#37"]}, {"type": "document", "q": "Pourquoi le locuteur nuance-t-il son appréciation du film ?", "c": ["La réalisation est trop extravagante", "L'actrice principale est omniprésente", "Le montage manque de cohérence", "Le scénario manque de singularité"], "a": 3, "k": "je trouve qu'on ne retrouve pas dans son long métrage l'originalité qu'il y avait dans les courts métrages.", "transcript": "– Est-ce qu'on peut ne pas aimer un film quand on a une comédienne aussi extraordinaire que Karine Viard ?\n– J'aime aussi beaucoup cette comédienne qui joue sa mère. Karine Viard est tellement extraordinaire que, effectivement, dans les scènes de radio, par exemple, elle est formidable, elle est formidable tout le temps, à chaque séquence, et en même temps, je trouve que le film... C'est cette histoire de recherche de la mère, j'ai vraiment, je n'ai pas été très passionné, c'est dommage parce que Pinault avait fait des courts métrages de grande qualité, je trouve qu'on ne retrouve pas dans son long métrage l'originalité qu'il y avait dans les courts métrages. Là, on est vraiment dans une histoire, encore une fois, une sorte de réalisme à la française, elle va retrouver la famille, les scènes de banlieue et tout ça, on est dans une sorte de naturalisme, un peu, vraiment sans relief.", "audio": "CO 10/039.MP3", "_test": "10", "_pos": 39, "_origlabel": "test10#39", "_sources": ["test10#39"]}, {"type": "document", "q": "Selon cette analyse, qu'est-ce qui nuit à la lecture dans le monde contemporain ?", "c": ["L'effervescence continuelle.", "La vie de couple fusionnelle.", "Le côté désuet des livres.", "Le manque de temps."], "a": 0, "k": "saturé de bruit", "transcript": "À mes yeux, les méthodes de lecture n'ont rien à voir avec la désertion du livre par les adolescents, mais tout à voir avec un univers qui est désormais saturé de bruit. Or, on peut écouter de la musique ensemble. On ne peut pas lire ensemble. On peut lire côte à côte — c'est même un très grand plaisir quand on découvre la personne avec laquelle on peut lire côte à côte. Et c'est une activité quand même solitaire, comme la solitude et le silence, qui sont désormais devenus des biens luxueux dans ce monde agité. Il est normal que la lecture passe au profit d'autres loisirs ou d'autres occupations.", "audio": "CO 24/038.MP3", "_test": "24", "_pos": 38, "_origlabel": "test24#38", "_sources": ["test24#38"]}, {"type": "document", "c": ["Elle aborde des sujets de fond.", "Elle crée de la concurrence entre auteurs.", "Elle est encadrée par des normes strictes.", "Elle s'adresse à un public averti."], "a": 2, "transcript": "Parce que la bande dessinée est un exercice qui demande une telle rigueur, une telle discipline. La pratique de la bande dessinée nous impose une grammaire tellement étroite que le dessin est enfermé dans des cadres. Donc tout est là pour que le dessin s'ankylose, se rigidifie. Tous les éléments sont là pour que le dessin se dessèche. Donc, à l'intérieur de cet exercice domestiqué qu'est la bande dessinée, essayer de rendre un dessin vivant ou plaisant à exécuter, ce n'est pas gagné en fait.", "k": "une grammaire tellement étroite que le dessin est enfermé dans des cadres", "q": "Qu'explique l'intervenant à propos de la bande dessinée ?", "audio": "CO 32/036.MP3", "_test": "32", "_pos": 36, "_origlabel": "test32#36", "_sources": ["test32#36"]}, {"type": "document", "q": "Question 38. Quelle solution l'expert juge-t-il préférable concernant les éléments architecturaux que le temps a détruits ?", "c": ["Les remplacer par des copies de qualité", "Les rénover selon les techniques originales", "Les reproduire avec des matériaux identiques", "Leur substituer des créations contemporaines"], "a": 3, "k": "concevoir une œuvre moderne selon les standards actuels", "transcript": "– Gérard Laurent, vous vous occupez de la restauration de monuments historiques. Comment s'y prend-on lorsqu'il faut refaire des éléments dont il ne reste quasiment aucune trace ?\n– Nécessité fait loi en la matière, et lorsqu'une peinture ou un vitrail par exemple ont complètement disparu dans une église, nous n'avons pas d'autre choix que de concevoir une œuvre moderne selon les standards actuels. On ne fait pas un pastiche ou une imitation. Ce serait la pire des choses sur un tel monument. On sait que le faux contamine le vrai et aujourd'hui il règne une suspicion sur certains monuments parce qu'on a voulu faire du faux à mauvais escient, sans avoir le talent de ceux qui créaient les originaux aux périodes antérieures.", "audio": "CO 33/038.MP3", "_test": "33", "_pos": 38, "_origlabel": "test33#38", "_sources": ["test33#38"]}, {"type": "document", "q": "Question 39. Selon le chroniqueur, pourquoi l'expression « États-Unis d'Europe » est-elle taboue ?", "c": ["Elle est trop éloignée des orientations politiques actuelles", "Elle fait référence à des événements historiques douloureux", "Elle fait resurgir des rivalités ou des antagonismes oubliés", "Elle remet en cause la domination de fait de certains pays"], "a": 2, "k": "ce serait rompre avec certaines nations, susciter de nouvelles querelles", "transcript": "Avant-hier, dans une tribune officielle, une élue française a brisé un tabou, et sans doute heureusement, en parlant des États-Unis d'Europe comme de l'objectif ultime du processus d'unification européenne. Elle a d'un coup redonné une clarté à cette entreprise si complexe, qu'elle en était devenue obscure à tant d'Européens de crainte de passer pour de doux rêveurs romantiques, utopistes ignorants des réalités politiques. Même les plus déterminés des partisans de l'unité de l'Europe n'osaient plus employer l'expression de Victor Hugo. On ne peut pas, dit-on, ce serait briser net un consensus, ce serait rompre avec certaines nations, susciter de nouvelles querelles, bien plus violentes encore que celles du traité constitutionnel. L'idée véhiculée par les États-Unis d'Europe, c'est-à-dire des états soumis à un pouvoir fédéral, n'est pas du tout à l'ordre du jour.", "audio": "CO 28/039.MP3", "_test": "28", "_pos": 39, "_origlabel": "test28#39", "_sources": ["test28#39", "test35#38"]}, {"type": "document", "q": "Question 36. Quelle est la particularité du groupe Émile Dubois ?", "c": ["Ses créations sont très romantiques.", "Ses décors sont créés par des artistes américains.", "Ses membres sont d'origines variées.", "Ses spectacles sont donnés dans des sites insolites."], "a": 3, "k": "des lieux de la ville où on ne s'attendait pas à voir de la danse", "transcript": "Au milieu des années 70, à Grenoble, un étudiant des Beaux-Arts se convertit à la danse, par amour pour une danseuse qui deviendra sa muse et sa compagne. Après avoir suivi pendant deux ans les cours de Merce Cunningham à New York, il crée, en 1979, le groupe Émile Dubois. Groupes, tribus, hordes, un désordre qui investit des lieux de la ville où on ne s'attendait pas à voir de la danse. Piscines vides, carrefours, parcs, gymnases. Les lieux ne sont pas attendus et cette danse-là encore moins.\nQuelle est la particularité du groupe Émile Dubois ?", "audio": "CO 36/036.MP3", "_test": "36", "_pos": 36, "_origlabel": "test36#36", "_sources": ["test36#36"]}, {"type": "document", "q": "Question 39. Selon l'intervenant, qu'est-ce qui caractérise nos vies contemporaines ?", "c": ["L'absence de temps morts.", "L'ennui des distractions.", "L'insuffisance de repos.", "Le manque d'action."], "a": 0, "k": "vont être expulsées de nos journées, tous les temps d'attente, de non-action", "transcript": "On part du principe que nos vies contemporaines étant ce qu'elles sont, peu à peu, si on n'y prend pas garde, vont être expulsées de nos journées, tous les temps d'attente, de non-action. On est sans arrêt soit en train de nous engager dans des actions, faire des choses avec nos mains ou avec notre cerveau, soit nous nous reposons dans des distractions. On regarde si on a des messages sur internet, on écoute de la musique, on se passe un film, mais à aucun moment notre cerveau n'entre sur un mode très simple qui est d'être là, conscient que je suis vivant, conscient que j'appartiens à un ordre naturel, et juste contempler et ressentir ce phénomène.\nSelon l'intervenant, qu'est-ce qui caractérise nos vies contemporaines ?", "audio": "CO 36/039.MP3", "_test": "36", "_pos": 39, "_origlabel": "test36#39", "_sources": ["test36#39"]}, {"type": "document", "q": "Question 37 : Sur quoi porte l'intervention ?", "c": ["La relation artistique entre Camille Claudel et Rodin.", "La carrière de Rodin au musée qui lui est dédié.", "Les difficultés de la vie de Camille Claudel.", "Les techniques de sculpture utilisées par Rodin."], "a": 0, "k": "elle s'en est servie pour créer une œuvre totalement différente", "transcript": "Camille Claudel restera pour la postérité une élève de Rodin, elle est exposée dans le musée Auguste-Rodin, elle est connue comme telle, elle a beaucoup reçu de Rodin, mais elle s'en est servie pour créer une œuvre totalement différente. On connaît évidemment la fameuse phrase : « Je lui ai montré où trouver de l'or, mais l'or qu'elle trouvait était bien à elle. » C'est très flagrant quand on compare plusieurs œuvres. À côté du Penseur, qui est, c'est vrai, une puissance ramassée, toute en muscles, et qui dégage une force presque brute, l'Homme penché, lui, est construit comme presque un arbre dont on voit les nervures, dont on saisit les muscles, les nerfs, l'attitude, et presque plus la pensée que chez le Penseur.", "audio": "CO 38/037.MP3", "_test": "38", "_pos": 37, "_origlabel": "test38#37", "_sources": ["test38#37"]}, {"c": ["Il conseille d'augmenter la productivité.", "Il milite pour la création d'un label qualité.", "Il s'efforce de moderniser sa profession.", "Il valorise les méthodes traditionnelles."], "a": 3, "q": "Quelle est la position de ce boucher ?", "transcript": "C'est un des bouchers les plus médiatisés de Paris. On le surnomme le boucher des stars. Il défend les races de boucherie, les viandes vieillies. Il défend les artisans. Et puis le printemps dernier, il a publié L'effet bœuf. C'est un livre dans lequel il s'inquiète des changements qui surviennent dans les élevages. Où maintenant la rapidité, l'efficacité changent, les pratiques changent, même la saveur, semble-t-il, des viandes. Il continue de s'intéresser aux élevages dans lesquels les animaux sont nourris à l'herbe.", "k": "les animaux sont nourris à l'herbe", "type": "document", "audio": "CO 39/037.MP3", "_test": "39", "_pos": 37, "_origlabel": "test39#37", "_sources": ["test39#37"]}, {"c": ["À l'occasion d'une entrevue.", "En côtoyant des auteurs connus.", "Grâce à des relations amicales.", "Lors d'une émission de radio."], "a": 0, "q": "Comment s'est révélée la vocation de cet écrivain ?", "transcript": "C'est une dame que je ne connaissais pas du tout. Une des deux filles d'Irène Némirovsky. Une dame qui est décédée maintenant et qui s'appelle Elisabeth Gille, qui est éditrice chez Julliard, qui un jour m'a appelée en me disant... Voilà, ça fait des années que je vous entends à la télé, ça fait des années que je me dis qu'en fait, vous êtes un écrivain qui ne le savez pas. Et quand je suis arrivé dans son bureau, elle m'a expliqué qu'en fait, je n'avais rien à faire à la télé et que ce n'était pas mon métier. Mais vous croyez au hasard de la vie, aux rencontres, vous, essentiellement ? À moi, ça m'est tout le temps arrivé, ça oui. J'ai beaucoup de chance.", "k": "quand je suis arrivé dans son bureau", "type": "document", "audio": "CO 39/038.MP3", "_test": "39", "_pos": 38, "_origlabel": "test39#38", "_sources": ["test39#38"]}, {"type": "document", "q": "Que représente la musique dans la vie de cet artiste ?", "c": ["Un désir d'enfance satisfait spontanément.", "Un moyen de devenir rapidement célèbre.", "Un souhait de ses parents qu'il a assumé.", "Une passion née du hasard de rencontres."], "a": 2, "k": "ça faisait partie de l'éducation", "transcript": "« Pourquoi vous avez choisi la musique ? » « Je pense que ce n'était pas vraiment un choix. J'ai commencé la musique très tôt. Bien sûr, à la maison, c'était que de la musique, tout le temps. Le piano à six ans — j'ai jamais dit que je voulais faire du piano, mais ça faisait partie de l'éducation. Et voilà, c'était la voie naturelle. J'avais peut-être des envies à l'adolescence de faire d'autres choses, mais ce n'était pas très sérieux. »", "audio": "CO 14/039.MP3", "_test": "14", "_pos": 39, "_origlabel": "test14#39", "_sources": ["test14#39"]}, {"type": "document", "q": "Quelle conclusion la journaliste tire-t-elle de sa visite dans cette librairie ?", "c": ["Acheter des livres sur le bonheur rend heureux.", "Chacun de nous est prédisposé au bonheur.", "Des cours de bonheur s'imposent dès l'enfance.", "L'accès au bonheur nécessite du travail."], "a": 3, "k": "pour être heureux, il faut faire des efforts", "transcript": "– Peut-être aurais-je dû, moi aussi, faire l'acquisition de l'un de ces nombreux manuels du bonheur proposés par la librairie Errol.\n– Cela m'aurait peut-être aidé à positiver, à voir les choses autrement, comme le prônent justement ces ouvrages.\n– Ainsi, je ne serais pas rentrée avec la sensation un peu déprimante, je dois le dire, que pour être heureux, il faut faire des efforts.\n– Le bonheur n'est pas inné, nous disent les spécialistes, il s'apprend.\n– Et donc, au rayon bonheur de la librairie — je n'invente pas, il y a bien une étiquette « bonheur » sur un rayon —, les manuels proposent leur aide à grands coups d'exercices, de conseils, rédigés généralement à l'impératif. On y lit : « Ne vous souciez pas du regard des autres. »", "audio": "CO 16/039.MP3", "_test": "16", "_pos": 39, "_origlabel": "test16#39", "_sources": ["test16#39"]}, {"type": "document", "q": "Question 39. Comment s'est révélée la vocation de cet écrivain ?", "c": ["Par un concours de nouvelles.", "Par un appel d'une éditrice.", "Par un voyage à l'étranger.", "Par un coup de foudre littéraire."], "a": 1, "k": "qui était éditrice chez Julliard, m'a un jour appelé", "transcript": "– C'est une dame que je ne connaissais pas du tout. Une des deux filles d'Irène Némirovsky, une dame qui est décédée maintenant et qui s'appelle Élisabeth Gille, qui était éditrice chez Julliard, m'a un jour appelé en me disant : « Voilà, ça fait des années que je vous entends à la télé. Ça fait des années que je me dis qu'en fait, vous êtes un écrivain qui ne le savait pas. » Et quand je suis arrivé dans son bureau, elle m'a expliqué qu'en fait, je n'avais rien à faire à la télé, que ce n'était pas mon métier.\n– Mais vous croyez au hasard de la vie ou des rencontres ?\n– Essentiellement à moi, ça m'est tout le temps arrivé, ça. Oui, j'ai beaucoup de chance.", "audio": "CO 17/039.MP3", "_test": "17", "_pos": 39, "_origlabel": "test17#39", "_sources": ["test17#39"]}, {"type": "document", "q": "Question 36. De quoi l'auteur s'est-elle inspirée pour choisir le titre de son livre ?", "c": ["De sa propre personnalité.", "D'un ouvrage scientifique.", "D'une action humanitaire.", "D'une période de sa vie."], "a": 0, "k": "je voulais me résumer moi-même", "transcript": "Auteure : Biographie de la faim est un livre que j'ai écrit il y a quelques années, c'était en 2005, ou en 2004. Ça répondait à une question assez énorme. Je voulais, de même que les physiciens essaient de résumer toute la loi de la nature à une seule loi, je voulais me résumer moi-même en un seul mot. Je me suis demandé quel était le mot le plus susceptible de me résumer. Après avoir quelque peu réfléchi, j'en suis arrivée à la conclusion que le mot « faim » était celui qui me résumait le mieux. Bien sûr, « faim » est à prendre à son sens le plus large, non seulement la faim des aliments, mais aussi la faim de tout : la faim des êtres humains, la faim des livres, la faim de la beauté, la faim de tout ce qui existe.", "audio": "CO 25/036.MP3", "_test": "25", "_pos": 36, "_origlabel": "test25#36", "_sources": ["test25#36"]}, {"type": "document", "q": "Question 37. Quelle inquiétude exprime l'intervenante concernant les musées ?", "c": ["Que les œuvres d'art y soient dégradées.", "Que leur taux de fréquentation chute.", "Qu'ils deviennent des espaces désuets.", "Qu'ils soient détournés de leurs objectifs."], "a": 3, "k": "ne plus voir l'œuvre", "transcript": "Journaliste : Les musées sont de moins en moins ces lieux morts et poussiéreux qui habitent encore votre imaginaire. Décors vivants, animations son et lumière, chasses aux trésors, jeux de rôles, tout en exposant les collections, les musées innovent et proposent aussi de se divertir. Mais se divertir jusqu'où ? Jusqu'à ne plus voir l'œuvre et seulement son emballage ? C'est le risque que pointent certains dans cette course à l'attractivité.", "audio": "CO 25/037.MP3", "_test": "25", "_pos": 37, "_origlabel": "test25#37", "_sources": ["test25#37"]}, {"type": "document", "q": "Question 39. Selon la journaliste, en Afrique, quelle tendance suit la littérature destinée à la jeunesse ?", "c": ["Elle tend à devenir une forme d'expression spécifique.", "Elle reste cantonnée aux frontières du continent africain.", "Elle réunit plusieurs générations au sein d'un même lectorat.", "Elle soutient la popularité du français auprès des enfants."], "a": 0, "k": "commençait à avoir une identité propre", "transcript": "Journaliste : Au mois de mars dernier, l'AUF (Agence Universitaire de la Francophonie) organisait à Dakar ses journées scientifiques autour du thème de « L'appropriation du français par les écrivains d'Afrique ». L'occasion de rencontrer un certain nombre de spécialistes et plus précisément deux écrivains qui s'intéressent à la littérature d'enfance. Il s'agit d'Abdallah Madaria Alaoui et de Guy Missodey. Depuis longtemps, ils essaient de cerner l'évolution de cette littérature destinée à la jeunesse, qui au départ ne se différenciait peut-être pas tellement de ce qui est production littéraire, et puis en prenant de l'ampleur, commençait à avoir une identité propre.", "audio": "CO 25/039.MP3", "_test": "25", "_pos": 39, "_origlabel": "test25#39", "_sources": ["test25#39"]}, {"type": "document", "q": "Question 36 : Selon cet artiste, comment s'exprime la folie d'un compositeur ?", "c": ["Par l'originalité dont est marquée sa personnalité", "Par la modernité avec laquelle il joue des airs célèbres", "Par la place que la musique occupe dans son quotidien", "Par le côté imprévisible des mélodies qu'il invente"], "a": 3, "k": "un sous-harmonique qui peut démarrer et s'échapper vers le futur", "transcript": "La folie dont on parle se situe peut-être dans l'espace qui rend un compositeur intéressant. C'est qu'il y a un sous-harmonique qui peut démarrer et s'échapper vers le futur, vers ailleurs. C'est cela qui fait l'intérêt des personnes présentes. Cette folie, je pense, n'est à aucun moment perçue comme une phobie. Je pense que lorsque je suis au théâtre, elle devient palpable.", "audio": "CO 26/036.MP3", "_test": "26", "_pos": 36, "_origlabel": "test26#36", "_sources": ["test26#36"]}]}, "Profession": {"cours": [{"type": "document", "q": "Que propose le Parlement pour renforcer la sécurité routière ?", "c": ["Contrôler l'aptitude à la conduite d'une certaine catégorie d'usagers.", "Obliger les fautifs d'accidents à repasser l'examen du permis.", "Réduire la vitesse réglementaire pour les automobilistes séniors.", "Simplifier les panneaux de signalisation les plus complexes."], "a": 0, "k": "un certificat médical pour permettre aux seniors de conduire", "transcript": "— Grand angle. Pourquoi pas un certificat médical pour permettre aux seniors de conduire au-delà de 70 ans ? Au motif que passé 75 ans, le taux de responsabilité présumé des seniors dans les accidents corporels augmenterait considérablement. Une proposition de loi sera débattue cet après-midi au Sénat. Reportage de Noureddine Zidane.\n— Même si j'ai réduit mon kilométrage par 10 depuis que je suis retraité, Bernard estime toujours être un bon conducteur, mais à 71 ans, cet ancien ingénieur vient tout de même de passer un stage de remise à niveau théorique. Parce que c'est vrai que quand j'ai passé mon permis en 61, la conduite actuelle, c'est complètement différent. Et j'avoue qu'il y a beaucoup de panneaux, je me disais : qu'est-ce que ça veut dire ?", "audio": "CO1/033.MP3", "_test": "1", "_pos": 33, "_origlabel": "test1#33", "_sources": ["test1#33"]}, {"type": "document", "q": "Question 31. Qu'est-ce qui participe à la charge mentale des salariés ?", "c": ["L'inégalité dans la répartition des tâches.", "La surabondance de sollicitations.", "Le manque de fonctionnalité des locaux.", "Les interventions des collègues."], "a": 1, "k": "dérangés par des notifications ou par des mails", "transcript": "Aujourd'hui, on parle beaucoup des effets négatifs des écrans pour les enfants. Les psychologues s'accordent à dire que les enfants qui sont trop soumis aux écrans ont des troubles de l'apprentissage, de la concentration, voire des difficultés de sommeil. En fait, pour les adultes, c'est exactement la même chose. On voit des salariés aujourd'hui qui ont du mal à se concentrer parce qu'ils sont en permanence dérangés par des notifications ou par des mails. Il y a beaucoup de salariés qui, aujourd'hui, se plaignent de cette charge mentale. Un tiers des salariés se sentent surchargés par l'information sur leur travail.", "audio": "CO 3/031.MP3", "_test": "3", "_pos": 31, "_origlabel": "test3#31", "_sources": ["test3#31", "test31#31"]}, {"type": "document", "q": "Question 34. Qu'est-ce qui intéresse le plus cette femme dans son métier ?", "c": ["Avoir un bon salaire en fabriquant de beaux objets.", "Exercer une activité intellectuellement enrichissante.", "Rencontrer des célébrités et travailler avec elles.", "Travailler avec ses collègues et développer ses projets."], "a": 1, "k": "J'ai vraiment la possibilité d'être dans une recherche artistique qui me motive", "transcript": "J'aime bien cet aspect du travail, du travail en équipe. C'est plus agréable qu'un travail en atelier où on est tout seul sur ses plans, un côté plus calme, plus cérébral. Là, ça bouge partout, il y a du monde partout. Souvent, on travaille la nuit. Ça a des côtés sympas, mais ça peut être franchement fatigant. Et puis, dans ce métier, les perspectives d'évolution sont diverses. On peut entrer dans une carrière type star système, où on va devenir très connu et gagner beaucoup d'argent. Moi, c'est pas trop mon cas. J'ai vraiment la possibilité d'être dans une recherche artistique qui me motive.", "audio": "CO 3/034.MP3", "_test": "3", "_pos": 34, "_origlabel": "test3#34", "_sources": ["test3#34", "test12#34"]}, {"type": "document", "q": "Question 32. Qu'est-ce qui pousse les jeunes à travailler dans les métiers des métaux ?", "c": ["Les salaires attractifs.", "L'aspect magique de la métamorphose de la matière.", "La sécurité de l'emploi.", "La simplicité des techniques."], "a": 1, "k": "L'aspect magique de la métamorphose de la matière.", "transcript": "Je sais que vous allez fréquemment à la rencontre des jeunes au sein de l'association qui tente de promouvoir les métiers des métaux. Est-ce que ce sont des métiers qui font rêver aujourd'hui les jeunes ?\n– Il y a une dimension mystique autour de ces artisanats du fer. La transformation de la barre de métal au feu a toujours fasciné le profane. L'alchimie qui permet de voir la transformation d'un lingot de métal en une œuvre finie a toujours émerveillé. Et donc on attire assez facilement les jeunes vers ces savoir-faire, notamment en ce qui concerne la ferronnerie d'art. Il y a une dimension artistique de créativité en plus.", "audio": "CO 34/032.MP3", "_test": "4", "_pos": 32, "_origlabel": "test4#32", "_sources": ["test4#32"]}, {"type": "document", "q": "Question 33. Dans ce reportage, qu'apprend-on sur les seniors ?", "c": ["Ils consomment plus que la jeune génération.", "Ils dépensent beaucoup pour la santé.", "Ils profitent peu des effets de la croissance.", "Ils sont à l'origine de créations d'emplois."], "a": 3, "k": "un formidable gisement de croissance et d'emploi", "transcript": "Les plus de 60 ans sont près d'un milliard sur la planète, 15 millions en France. Un marché juteux pour les entreprises et un formidable gisement de croissance et d'emploi. On considère qu'il faut 220 000 emplois de plus d'ici 2020 dans le secteur de l'aide à domicile.", "audio": "CO 6/033.MP3", "_test": "6", "_pos": 33, "_origlabel": "test6#33", "_sources": ["test6#33", "test33#34", "test40#34"]}, {"type": "document", "q": "Question 30. Quel est le métier de Jean-Pierre ?", "c": ["Metteur en scène.", "Explorateur.", "Photographe.", "Journaliste."], "a": 3, "k": "vous mettez en scène les mots et non les images", "transcript": "– Jean-Pierre, pouvez-vous nous parler de votre métier, qui est une vraie passion pour vous ?\n– Oui, eh bien, ce qui me plaît le plus, c'est que je voyage beaucoup. Je dois toujours me déplacer si je veux que les gens soient informés au moment même où les événements se produisent.\n– On vous connaît comme un voyageur infatigable qui ne se sépare jamais de son appareil photo alors que vous ne vous en servez même pas.\n– J'ai toujours rêvé d'être reporter photographe et avoir cet appareil avec moi me donne l'impression que mon rêve est presque réel.\n– En réalité, vous mettez en scène les mots et non les images. C'est ce qui caractérise votre métier et vous a rendu célèbre.", "audio": "CO 9/030.MP3", "_test": "9", "_pos": 30, "_origlabel": "test9#30", "_sources": ["test9#30"]}, {"type": "document", "q": "Question 31. Quel est l'objectif de l'activité actuelle de Fatoumata ?", "c": ["Comparer les mouvements des galaxies.", "Étudier les trajectoires des déchets cosmiques.", "Prévenir les risques de chute de météorites.", "S'entraîner pour des voyages interplanétaires."], "a": 1, "k": "Je regarde comment ces 40 000 débris vont évoluer avec le temps", "transcript": "Fatoumata a 29 ans. Elle termine actuellement son doctorat en astronomie et vient aussi de passer un an au Japon pour se préparer à son futur métier d'astronome. Fatoumata veut être « femme de ménage de l'espace ». Des objets sont vraiment retombés sur terre, au Zimbabwe et en Arabie Saoudite. Plusieurs entreprises et agences ont proposé des solutions de nettoyage de l'espace, mais aucune n'a vraiment été testée dans des conditions réelles. Tout le monde se prépare à aller nettoyer l'espace parce que la NASA prévoit qu'à l'horizon 2025, on ne pourra plus envoyer d'objets dans l'espace tellement ce sera encombré de débris.\n– Donc en fait, je simule des explosions et des collisions dans l'espace. Par exemple, vous avez deux objets, ils entrent en collision, ça crée 40 000 débris. Je regarde comment ces 40 000 débris vont évoluer avec le temps autour de la terre. Voilà, mon travail.", "audio": "CO 9/031.MP3", "_test": "9", "_pos": 31, "_origlabel": "test9#31", "_sources": ["test9#31", "test24#31"]}, {"type": "document", "q": "À quel type d'entreprise appartient ce service ?", "c": ["Un groupe de centres d'appels téléphoniques", "Un service de livraison express du courrier", "Un spécialiste de création de sites internet", "Un fournisseur pour la restauration à domicile"], "a": 1, "k": "Nous acheminons chaque jour plus de 75 millions de plis.", "transcript": "Coli.com, toujours à votre service. Nous acheminons chaque jour plus de 75 millions de plis. Si, malgré tous nos efforts, un envoi n'est pas parvenu à son destinataire, des professionnels sont à votre disposition pour réaliser les recherches nécessaires et s'engagent à vous tenir informés dans les plus brefs délais. Pour ce faire, connectez-vous à notre site www.coli.com ou appelez le 08 67 35 35 35. Nous serons toujours à votre écoute.", "audio": "CO 10/030.MP3", "_test": "10", "_pos": 30, "_origlabel": "test10#30", "_sources": ["test10#30", "test14#30"]}, {"type": "document", "q": "Comment Monique Lerou explique-t-elle le succès des entreprises coopératives ?", "c": ["Elles appuient leur gestion sur la concertation", "Elles garantissent des évolutions de carrière", "Elles œuvrent dans des secteurs traditionnels", "Elles s'engagent dans des projets audacieux"], "a": 0, "k": "En grande partie grâce à la gouvernance démocratique, avec un grand nombre de personnes qui, très souvent, participent et contribuent à la prise de décision.", "transcript": "Les chiffres parlent d'eux-mêmes. Selon une étude internationale, près de la moitié des 300 plus grandes coopératives de la planète ont 70 ans et plus. Elles créent souvent davantage d'emplois et font faillite moins souvent que les entreprises capitalistes classiques. Monique Leroux : De façon générale, on constate que les entreprises coopératives sont plus résilientes. Leur prise de risque, globalement, qu'elle soit petite, moyenne ou grande, se fait d'une façon généralement plus prudente. En grande partie grâce à la gouvernance démocratique, avec un grand nombre de personnes qui, très souvent, participent et contribuent à la prise de décision.", "audio": "CO 10/032.MP3", "_test": "10", "_pos": 32, "_origlabel": "test10#32", "_sources": ["test10#32"]}, {"type": "document", "q": "Qu'explique la créatrice Agnès b. ?", "c": ["Elle cherche à privilégier le travail avec des entreprises françaises", "Elle organise régulièrement des réunions avec ses couturiers", "Elle s'apprête à signer un nouveau contrat avec un atelier de dentellerie", "Elle souhaite modifier ses commandes avec les usines partenaires"], "a": 0, "k": "on continue à fabriquer en France", "transcript": "— Est-ce que la marque Agnès b. que nous connaissons tous est tellement encore fabriquée dans notre pays ? Et dans quelle proportion ?\n— Oui, on continue à fabriquer en France, et on a commencé ça il y a très longtemps. Je le continue autant que je peux. On en est à entre 40 et 50 % de fabriqué en France, avec les usines
