<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLI · Entraînement A1 — Série 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --blue:   #3AABDC;
  --green:  #5DB88A;
  --orange: #EE5818;
  --amber:  #D4840A;
  --purple: #A18CD0;
  --dark:   #2A2D35;
  --grey:   #6E7E8A;
  --bg:     #DDE4EC;
  --white:  #FFFFFF;
  --acc:    #22c55e;
}
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:'Nunito','Century Gothic',sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.app-header{
  background:var(--white);
  border-bottom:3px solid #22c55e;
  padding:0 1.2rem;
  display:flex; align-items:center; justify-content:space-between;
  height:54px; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  position:sticky; top:0; z-index:100;
}
.hdr-left{display:flex;align-items:center;gap:.8rem;}
.hdr-logo{height:30px;width:auto;}
.hdr-sep{width:1px;height:24px;background:#D0DDE8;}
.hdr-title{font-size:.82rem;font-weight:700;color:var(--dark);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-badge{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .65rem;border-radius:20px;background:#22c55e;color:white;white-space:nowrap;}

.hdr-zoom-wrap{display:flex;align-items:center;gap:.5rem;position:absolute;left:50%;transform:translateX(-50%);}
.zoom-label{font-size:.65rem;font-weight:700;color:var(--grey);min-width:34px;text-align:right;}
.zoom-slider{
  -webkit-appearance:none;appearance:none;
  width:80px;height:4px;border-radius:2px;
  background:#D0DDE8;outline:none;cursor:pointer;
}
.zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#22c55e;cursor:pointer;}
.zoom-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#22c55e;cursor:pointer;border:none;}

.nav-bar{
  width:100%; max-width:920px; margin:0 auto;
  display:flex; align-items:center; gap:.8rem;
  padding:.55rem 1.5rem;
  background:var(--bg);
  border-bottom:1px solid #C8D8E4;
  position:sticky; top:54px; z-index:90;
}
.nav-btn{
  display:flex;align-items:center;justify-content:center;
  background:var(--white);border:1.5px solid #C0D0DC;
  color:var(--grey);font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:700;
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  transition:all .18s;box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0;
}
.nav-btn:hover:not(:disabled){border-color:#22c55e;color:#22c55e;background:#22c55e0d;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.done{background:var(--green);color:white;border-color:var(--green);cursor:default;}
.prog-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;}
.prog-track{width:100%;height:5px;background:#C8D8E4;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#22c55e,#5DB88A);transition:width .35s cubic-bezier(.4,0,.2,1);}
.prog-label{font-size:.65rem;font-weight:700;color:var(--grey);}

.stage{
  display:flex; flex-direction:column; align-items:center;
  padding:.8rem 1.2rem 2rem;
}

.slide-scale-wrap{
  width:100%; max-width:920px;
  overflow:visible;
}

.slide-wrap{
  width:100%;
  border-radius:16px;
  box-shadow:0 6px 28px rgba(0,0,0,.13);
  background:var(--white);
  transition:opacity .15s ease;
  overflow:visible;
  min-height:500px;
}
.slide-wrap.fade{opacity:0;}

.cover-slide{
  position:relative; background:#FFF;
  border-top:6px solid #22c55e;
  display:flex; flex-direction:column;
  min-height:480px; overflow:hidden;
}
.cover-glow{position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,#22c55e28 0%,transparent 70%);pointer-events:none;}
.cover-logo-wrap{padding:1.2rem 2rem .8rem;background:#F8FAFB;border-bottom:1px solid #E4EDF3;flex-shrink:0;}
.cover-logo{height:34px;}
.cover-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 3rem;}
.cover-badge{display:inline-block;padding:.28rem 1rem;border-radius:20px;font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;border:1.5px solid transparent;margin-bottom:1rem;}
.cover-icon{font-size:3.5rem;line-height:1;margin-bottom:.8rem;}
.cover-title{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:800;color:#2A2D35;line-height:1.25;margin-bottom:.5rem;}
.cover-sub{font-size:.88rem;color:#6E7E8A;font-weight:400;margin-bottom:.4rem;}
.cover-plan{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
.cover-plan-item{background:#EEF4F8;border:1px solid #C8D8E4;color:#2A2D35;font-size:.72rem;font-weight:700;padding:.3rem .8rem;border-radius:20px;}
.cover-bar{height:4px;flex-shrink:0;background:linear-gradient(90deg,#22c55e,#5DB88A);}

.content-slide{
  display:flex; flex-direction:column;
  min-height:480px;
}
.section-div{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2.5rem 2rem;min-height:300px;}
.section-div-inner{max-width:500px;}
.section-icon{font-size:2.8rem;margin-bottom:.8rem;}
.section-title{font-size:1.5rem;font-weight:800;margin-bottom:.4rem;}
.section-sub{font-size:.9rem;color:var(--grey);font-style:italic;}
.section-chips{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem;}
.section-chip{font-size:.72rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;}

.slide-hdr{
  display:flex; align-items:center; justify-content:space-between;
  padding:.65rem 1.4rem; flex-shrink:0; border-bottom:1px solid #EDF2F7;
}
.slide-hdr-left{display:flex;align-items:center;gap:.75rem;}
.slide-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:.7rem;font-weight:800;flex-shrink:0;}
.slide-lnum{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);}
.slide-title{font-size:.93rem;font-weight:800;color:var(--dark);line-height:1.2;}
.type-pill{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}

.slide-body{padding:1rem 1.5rem 1.5rem;display:flex;flex-direction:column;}

.density-sparse .slide-body{ justify-content:center; }
.density-sparse .body-p,.density-sparse .em-item,.density-sparse .big-q{ margin-bottom:1.2rem;font-size:1rem;line-height:2; }
.density-normal .slide-body{ justify-content:flex-start; }
.density-dense .body-p{ margin-bottom:.35rem;font-size:.84rem;line-height:1.65; }

.sec-h3{font-size:.9rem;font-weight:800;margin:1rem 0 .4rem;padding-bottom:.3rem;border-bottom:2px solid currentColor;}
.sec-h3:first-child{margin-top:0;}
.body-p{font-size:.9rem;line-height:1.8;margin-bottom:.55rem;color:var(--dark);}
.body-p strong{font-weight:700;}
ul{list-style:none;padding:0;margin:.4rem 0;}
li{font-size:.88rem;line-height:1.7;padding:.32rem 0 .32rem 1.5rem;position:relative;border-bottom:1px solid #F0F4F8;}
li:last-child{border-bottom:none;}
li::before{content:'›';position:absolute;left:.3rem;color:var(--acc);font-size:1.1rem;font-weight:700;line-height:1.5;}
.em-item{font-size:.95rem;line-height:1.75;padding:.5rem 0;border-bottom:1px solid #F0F4F8;}
.big-q{font-size:clamp(.95rem,2vw,1.1rem);font-weight:600;line-height:1.65;padding:.7rem 1rem;margin:.35rem 0;background:var(--tint,#EAF7F0);border-left:5px solid var(--acc);border-radius:0 10px 10px 0;}
.num-head{display:flex;align-items:flex-start;gap:.7rem;}

.qcat-title{font-size:.9rem;font-weight:800;letter-spacing:.03em;color:var(--acc);margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;padding-bottom:.4rem;border-bottom:2px solid var(--acc);}
.qcat-grid{display:flex;flex-direction:column;gap:.4rem;}
.q-item{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .9rem;background:var(--tint,#EAF7F0);border-radius:8px;border-left:4px solid var(--acc);line-height:1.55;}
.q-bullet{font-size:1.1rem;color:var(--acc);font-weight:800;flex-shrink:0;margin-top:.05rem;}
.q-text{color:var(--dark);font-size:.93rem;}
.q-variants{font-size:.78rem;color:var(--grey);margin-top:.15rem;font-style:italic;line-height:1.4;}

.student-q-section{margin-top:.6rem;padding-top:.6rem;border-top:2px dashed var(--acc);}
.student-q-label{font-size:.74rem;font-weight:800;letter-spacing:.04em;margin-bottom:.4rem;}
.student-q-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;}
.student-q-num{width:20px;height:20px;border-radius:50%;background:var(--acc);color:white;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.student-q-input{flex:1;min-height:30px;background:#FAFCFF;border:2px dashed #C8D8E4;border-radius:6px;padding:.28rem .8rem;font-family:'Nunito',sans-serif;font-size:.86rem;line-height:1.5;outline:none;cursor:text;color:var(--dark);}
.student-q-input:focus{border-color:var(--acc);background:#fff;}

.subject-header{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:.6rem;}
.subject-num{display:inline-block;background:var(--acc);color:white;font-size:.7rem;font-weight:800;padding:.18rem .6rem;border-radius:20px;margin-bottom:.7rem;}
.scenario-box{border:2px solid var(--acc);border-radius:12px;padding:1.2rem 1.6rem;font-size:.95rem;font-weight:600;line-height:1.9;background:var(--tint);margin-bottom:.9rem;}
.prep-row{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.8rem;}
.prep-hint{flex:1;font-size:.78rem;color:var(--grey);font-style:italic;padding:.5rem .8rem;background:#F7F9FB;border-radius:8px;border-left:3px solid #C8D8E4;line-height:1.6;}
.timer-badge{background:var(--acc);color:white;font-size:.72rem;font-weight:800;padding:.35rem .8rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.notes-area{flex:1;min-height:90px;background:#FAFCFF;border:2px dashed #C8D8E4;border-radius:10px;padding:.9rem 1.1rem;font-family:'Nunito',sans-serif;font-size:.88rem;line-height:1.8;outline:none;cursor:text;color:var(--dark);}

.example-label{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:.8rem;}
.dialogue-list{display:flex;flex-direction:column;gap:.5rem;}
.dline{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .9rem;border-radius:8px;font-size:.88rem;line-height:1.65;}
.dline.exam{background:#EAF7F0;border-left:3px solid var(--acc);}
.dline.cand{background:#EAF5FB;border-left:3px solid var(--blue);}
.drole{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .4rem;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:.12rem;}
.exam .drole{background:var(--acc);color:white;}
.cand .drole{background:var(--blue);color:white;}
.dtext{color:var(--dark);}

.idea-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.5rem;}
.idea-col{display:flex;flex-direction:column;gap:.4rem;}
.idea-label{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:5px;}
.pour .idea-label{background:#EAF7F0;color:#1E6B4A;}
.contre .idea-label{background:#FEF0E8;color:#9B3210;}
.idea-area{min-height:80px;background:#FAFCFF;border:2px dashed #C8D8E4;border-radius:8px;padding:.8rem 1rem;font-family:'Nunito',sans-serif;font-size:.86rem;line-height:1.7;outline:none;cursor:text;}

.num-head{display:flex;align-items:flex-start;gap:.7rem;padding:.55rem 0;border-bottom:1px solid #F0F4F8;}
.num-head:last-child{border-bottom:none;}
.num-circle{width:28px;height:28px;border-radius:50%;background:var(--acc);color:white;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.1rem;}
.num-content{flex:1;}
.num-title{font-size:.9rem;font-weight:800;margin-bottom:.2rem;color:var(--dark);}
.num-detail{font-size:.82rem;color:var(--grey);line-height:1.6;}

.fill-blank{display:inline-block;border-bottom:2px solid var(--acc);min-width:80px;color:var(--acc);font-weight:700;padding:0 .2rem;}
.write-placeholder{color:#B0C0CC;font-style:italic;pointer-events:none;}
[contenteditable]:focus .write-placeholder{display:none;}
.kbd-hint{font-size:.58rem;color:#A0B4C0;text-align:center;padding:.3rem 0 .6rem;}
.opinion-box{border:2px solid var(--acc);border-radius:12px;padding:1.2rem 1.6rem;font-size:.95rem;font-weight:600;line-height:1.9;background:var(--tint);margin-bottom:.9rem;}

.fill-in{display:inline;background:#FFF3DC;border-bottom:2.5px solid #F0A020;border-radius:3px 3px 0 0;padding:.05rem .35rem;color:#C87700;font-weight:700;font-style:italic;min-width:50px;}
.fill-label{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#C87700;background:rgba(200,119,0,.1);border:1px solid rgba(200,119,0,.3);border-radius:20px;padding:.1rem .5rem;margin-bottom:.4rem;}

@media(max-width:600px){
  .stage{padding:.5rem .6rem 2rem;}
  .nav-bar{padding:.5rem .8rem;}
  .hdr-title{max-width:120px;font-size:.72rem;}
  .cover-body{padding:1.5rem 1.5rem;}
  .cover-title{font-size:1.3rem;}
  .slide-body{padding:.8rem 1rem 1.2rem;}
  .hdr-zoom-wrap{gap:.3rem;}
  .zoom-slider{width:60px;}
}


/* ── PLEIN ÉCRAN / MODE PRÉSENTATION ── */
.hdr-right{display:flex;align-items:center;gap:.7rem;}
.fs-btn{display:flex;align-items:center;gap:.35rem;background:#FFF;border:1.5px solid #C0D0DC;color:#6E7E8A;font-family:'Nunito','Century Gothic',sans-serif;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.34rem .75rem;border-radius:20px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.fs-btn:hover{border-color:#3AABDC;color:#3AABDC;background:#F4FAFE;}
body.present .app-header{display:none;}
body.present .kbd-hint{display:none;}
body.present .slide-wrap{max-width:none;border-radius:0;box-shadow:none;}
body.present .slide-scale-wrap{max-width:none;width:100%;}
body.present .slide-body{justify-content:safe center;}
body.present .nav-bar{position:fixed;left:50%;bottom:0;top:auto;transform:translateX(-50%);width:auto;max-width:none;margin:0;background:rgba(10,18,27,.78);backdrop-filter:blur(6px);border:none;border-radius:26px 26px 0 0;padding:.45rem 1.3rem;gap:1rem;z-index:120;opacity:.18;transition:opacity .25s;}
body.present .nav-bar:hover{opacity:1;}
body.present .prog-wrap{min-width:170px;}
body.present .prog-label{color:#FFF;}
body.present .prog-track{background:rgba(255,255,255,.25);}
body.present .nav-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#FFF;}
.size-ctrl{display:none;}
body.present .size-ctrl{display:flex;align-items:center;gap:.3rem;flex-shrink:0;}
.size-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#FFF;font-family:'Nunito','Century Gothic',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.size-btn:hover{background:rgba(255,255,255,.28);}
.size-val{font-size:.64rem;font-weight:800;color:#FFF;min-width:38px;text-align:center;}
.fs-exit{display:none;}
body.present .fs-exit{display:block;position:fixed;top:12px;right:16px;z-index:120;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:.24rem .7rem;cursor:pointer;}
/* ── DÉBORDEMENT DE TEXTE ── */
.slide-body>*{flex-shrink:0;}
[contenteditable]{overflow-wrap:break-word;}
.slide-body::-webkit-scrollbar{width:9px;}
.slide-body::-webkit-scrollbar-thumb{background:#C8D8E4;border-radius:5px;}
.slide-body::-webkit-scrollbar-track{background:transparent;}
/* ── CLAVIER D'ACCENTS FLOTTANT + COMPTEUR ── */
.acc-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:200;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:.26rem;max-width:min(94vw,880px);background:rgba(255,255,255,.97);border:1.5px solid #C8D8E4;box-shadow:0 8px 30px rgba(0,0,0,.2);border-radius:26px;padding:.45rem .8rem;}
.acc-bar.on{display:flex;}
body.present .acc-bar{bottom:78px;}
.acc-key{font-family:'Nunito','Century Gothic',sans-serif;font-size:.9rem;font-weight:700;color:#2A2D35;background:#FFF;border:1.5px solid #C8D8E4;border-radius:7px;min-width:31px;height:31px;padding:0 .35rem;cursor:pointer;line-height:1;transition:all .12s;}
.acc-key:hover{border-color:#3AABDC;color:#3AABDC;background:#F6FBFE;}
.acc-key:active{transform:translateY(1px);}
.acc-sep{width:1px;height:19px;background:#D8E4EC;margin:0 .18rem;}
.acc-count{font-size:.7rem;font-weight:800;color:#6E7E8A;background:#EEF4F9;border-radius:20px;padding:.26rem .7rem;white-space:nowrap;margin-left:.35rem;}
.acc-count.ok{background:#E6F6EC;color:#33805A;}
.acc-count.under{background:#FEF6E6;color:#A9781A;}
.acc-count.over{background:#FDECEC;color:#C0392B;}
body.present{background:#0A121B;}
body.present .stage{padding:0;}
body.present .slide-wrap{display:flex;flex-direction:column;}
body.present .content-slide,body.present .cover-slide{flex:1;display:flex;flex-direction:column;min-height:0;}
body.present .slide-body{flex:1;}

/* ==== MLI exercise components ==== */
.slide-body{gap:.15rem;}
.obj-lead{font-size:.95rem;line-height:1.7;margin-bottom:.6rem;color:var(--dark);}
.vchip{display:inline-block;background:var(--tint);border:1.5px solid var(--acc);color:#2A2D35;border-radius:20px;padding:.28rem .75rem;font-size:.8rem;font-weight:700;margin:.22rem .22rem 0 0;}
.exo-note{background:var(--tint);border:1px solid var(--acc);border-radius:10px;padding:.6rem .9rem;font-size:.9rem;line-height:1.55;color:#2A2D35;margin:.5rem 0;}
.exo-note b{color:var(--acc);}
.note-cn{background:#FFF8E6;border:1px solid #F0D98A;border-radius:8px;padding:.5rem .8rem;font-size:.84rem;color:#8A6400;margin:.5rem 0;line-height:1.55;}
.note-cn b{color:#B8860B;}
.audio-cue{display:flex;align-items:center;gap:.6rem;background:#EEF6FF;border:1.5px solid var(--acc);border-radius:10px;padding:.55rem .9rem;margin:.15rem 0 .6rem;font-weight:700;color:var(--acc);font-size:.9rem;flex-wrap:wrap;}
.audio-cue .ico{font-size:1.15rem;}
.audio-cue .track{font-family:'SFMono-Regular',Consolas,monospace;background:#fff;border:1px solid var(--acc);border-radius:6px;padding:.12rem .55rem;font-size:.82rem;color:var(--dark);}
.audio-cue .once{margin-left:auto;font-size:.72rem;font-weight:700;color:#B45309;background:#FEF3C7;border:1px solid #FCD34D;border-radius:20px;padding:.15rem .6rem;}
.q-prompt{font-size:1rem;font-weight:800;margin:.35rem 0 .5rem;color:var(--dark);}
.choices{display:flex;flex-direction:column;gap:.4rem;margin:.35rem 0 .2rem;}
.choice{display:flex;gap:.6rem;align-items:flex-start;background:#F6F9FC;border:1.5px solid #E1E9F0;border-radius:10px;padding:.5rem .8rem;font-size:.93rem;line-height:1.45;}
.choice .lt{font-weight:800;color:var(--acc);flex-shrink:0;width:1.1rem;}
.reveal-btn{margin-top:.75rem;background:var(--acc);color:#fff;border:none;border-radius:22px;padding:.48rem 1.15rem;font-weight:800;cursor:pointer;font-family:inherit;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:filter .15s;}
.reveal-btn:hover{filter:brightness(1.07);}
.corrige{display:none;margin-top:.7rem;background:#EAF7F0;border-left:4px solid #22c55e;border-radius:0 10px 10px 0;padding:.7rem .9rem;font-size:.9rem;}
.corrige.show{display:block;animation:fadein .25s;}
@keyframes fadein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.corrige .ans{font-weight:800;color:#178a54;margin-bottom:.3rem;font-size:.95rem;}
.corrige .trl{font-weight:700;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:#6E7E8A;margin:.5rem 0 .25rem;}
.corrige .tr{white-space:pre-line;color:#2A2D35;font-size:.86rem;background:#fff;border:1px dashed #b7e3cb;border-radius:8px;padding:.5rem .7rem;line-height:1.55;}
.img-listen{max-width:100%;max-height:250px;border-radius:10px;border:1px solid #E1E9F0;display:block;margin:.2rem auto .5rem;}
.speak-lead{font-size:.95rem;line-height:1.65;margin:.2rem 0 .55rem;color:var(--dark);}
.model-box{background:#F6F9FC;border:1.5px solid #E1E9F0;border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;font-size:.92rem;line-height:1.8;}
.model-box .mh{font-weight:800;color:var(--acc);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem;}
.model-box .fr{color:#2A2D35;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.5rem 0;}
.role-col{background:#FAFBFD;border:1.5px solid #E1E9F0;border-radius:12px;padding:.7rem .85rem;}
.role-col .rh{font-weight:800;font-size:.84rem;color:var(--acc);margin-bottom:.4rem;}
.role-col ul{margin:0;padding:0;list-style:none;}
.role-col li{font-size:.86rem;padding:.28rem 0 .28rem 1.1rem;line-height:1.45;position:relative;border-bottom:1px solid #F0F4F8;}
.role-col li:last-child{border-bottom:none;}
.role-col li::before{content:'›';position:absolute;left:.1rem;color:var(--acc);font-weight:800;}
.drill-list{display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0;}
.drill{background:#F6F9FC;border:1.5px solid #E1E9F0;border-radius:10px;padding:.5rem .8rem;font-size:.93rem;display:flex;gap:.55rem;align-items:baseline;}
.drill .n{font-weight:800;color:var(--acc);flex-shrink:0;}
.read-passage{white-space:pre-line;background:#FAFBFD;border:1px solid #E1E9F0;border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:.8rem 1rem;font-size:.96rem;line-height:1.65;margin:.4rem 0 .55rem;color:#2A2D35;}
.write-task{background:var(--tint);border:1.5px solid var(--acc);border-radius:10px;padding:.65rem .9rem;font-size:.95rem;line-height:1.6;margin:.3rem 0 .55rem;}
.write-task .wc{font-weight:800;color:var(--acc);}
.write-zone{background:repeating-linear-gradient(#fff,#fff 30px,#EDF2F7 31px,#fff 32px);border:1.5px dashed #C0D0DC;border-radius:10px;min-height:150px;padding:.4rem .9rem;margin:.35rem 0;}
.recap-grid{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0;}
.recap-item{background:#F6F9FC;border:1.5px solid #E1E9F0;border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.9rem;line-height:1.5;}
.recap-item b{color:var(--acc);}
.dialogue-box{white-space:pre-line;background:#FFFFFF;border:1.5px solid var(--acc);border-radius:12px;padding:.75rem 1rem;font-size:1rem;line-height:1.7;margin:.15rem 0 .6rem;color:#1C2333;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.dialogue-box .dlab{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:.35rem;}
.easy-tag{margin-left:auto;font-size:.72rem;font-weight:800;color:#178a54;background:#E5F7EE;border:1px solid #9BE0BE;border-radius:20px;padding:.15rem .6rem;}
.listen-task{font-size:.9rem;font-weight:700;color:var(--acc);margin:.1rem 0 .5rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;}
.hdr-info{display:flex;flex-direction:column;line-height:1.2;gap:1px;}
.hdr-num{font-size:.66rem;font-weight:800;letter-spacing:.05em;color:#93A1AD;text-transform:uppercase;}
.hdr-info .hdr-title{max-width:280px;}
/* audio player */
.mli-audio{width:100%;height:40px;margin:.15rem 0 .7rem;border-radius:22px;outline:none;}
.mli-audio::-webkit-media-controls-panel{background:var(--tint);}
.audio-wrap{display:flex;align-items:center;gap:.6rem;margin:.15rem 0 .55rem;}
.audio-wrap .trk{font-family:'SFMono-Regular',Consolas,monospace;font-size:.74rem;color:#93A1AD;background:#F6F9FC;border:1px solid #E1E9F0;border-radius:6px;padding:.1rem .5rem;white-space:nowrap;flex-shrink:0;}
/* letters only (before reveal) */
.choice.letter-only{justify-content:flex-start;background:#FBFCFE;border-style:dashed;}
.choice.letter-only .blank{color:#C0CAD4;font-style:italic;}
.exo-note.easy{background:#FFF8E6;border-color:#F0D98A;color:#7A5B00;font-size:.85rem;}
.exo-note.easy b{color:#B8860B;}
/* reveal options */
.corrige .rq{font-size:.9rem;margin:.15rem 0 .5rem;color:#2A2D35;}
.corrige .ropts{display:flex;flex-direction:column;gap:.3rem;margin:.3rem 0;}
.corrige .ropt{display:flex;gap:.55rem;align-items:flex-start;background:#fff;border:1px solid #D8E2EA;border-radius:8px;padding:.4rem .7rem;font-size:.88rem;}
.corrige .ropt .lt{font-weight:800;color:#93A1AD;width:1.1rem;flex-shrink:0;}
.corrige .ropt.ok{background:#E9F9F0;border-color:#7ED4A6;}
.corrige .ropt.ok .lt{color:#12925a;}
.corrige .ropt.ok span:last-child{font-weight:700;color:#12925a;}
.note-fr{background:#EFF6FF;border:1px solid #BBD6F5;border-radius:8px;padding:.5rem .8rem;font-size:.85rem;color:#1E4E79;margin:.5rem 0;line-height:1.55;}
.note-fr b{color:#0F63C4;}
/* interactive answering */
.choice{cursor:pointer;transition:background .12s,border-color .12s;}
.choice:hover{border-color:var(--acc);}
.choice.answered{cursor:default;}
.choice.correct{background:#E9F9F0;border-color:#7ED4A6;}
.choice.correct .lt{color:#12925a;}
.choice.correct span:last-child{font-weight:700;color:#12925a;}
.choice.wrong{background:#FDEDED;border-color:#F1A9A9;}
.choice.wrong .lt{color:#C0392B;}
.qblock{margin:0;}
.write-input,.speak-input{width:100%;box-sizing:border-box;border:1.5px solid #C0D0DC;border-radius:10px;padding:.6rem .8rem;font-family:inherit;font-size:.95rem;line-height:1.6;resize:vertical;background:#fff;color:#1C2333;}
.write-input{min-height:150px;margin:.35rem 0;}
.speak-input{min-height:64px;margin:.15rem 0 .2rem;}
.write-input:focus,.speak-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--tint);}
.answer-label{font-size:.82rem;font-weight:800;color:var(--acc);margin:.6rem 0 .1rem;display:flex;align-items:center;gap:.35rem;}
</style></head>

lass=\"choice letter-only\" data-l=\"C\" data-txt=\"Oui, cherchez dans la bibliothèque.\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"D\" data-txt=\"Oui, prenez la première rue à droite.\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span class=\"blank\">écoutez…</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : D. Oui, prenez la première rue à droite.</div><div class=\"trl\">Transcription</div><div class=\"tr\">– Excusez-moi, je suis perdue. Je veux aller à la mairie.</div></div></div><div class=\"exo-note easy\">❕ Ici, seules les <b>propositions</b> s’écoutent (A, B, C, D). Au vrai TCF, la <b>question</b> aussi s’écoute et on n’écoute qu’<b>une seule fois</b>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">2</span><div><div class=\"slide-lnum\">🎧 Compréhension orale</div><div class=\"slide-title\">Écoutez et répondez</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🎧 Écoute</span></div><div class=\"slide-body\"><div class=\"audio-wrap\"><audio class=\"mli-audio\" controls preload=\"none\" data-audio=\"CO 6/002.MP3\"></audio><span class=\"trk\">🔊 CO 6/002.MP3</span></div><div class=\"q-prompt\">Question 2 — Écoutez, puis choisissez : A, B, C ou D.</div><div class=\"dialogue-box\"><span class=\"dlab\">🗨️ Le dialogue (vous pouvez le lire)</span>– Salut Elsa, tu viens prendre un café avec moi ?</div><div class=\"answer-label\">👉 Cliquez sur la proposition entendue :</div><div class=\"qblock\" data-qid=\"q37\" data-correct=\"C\"><div class=\"choices\"><div class=\"choice letter-only\" data-l=\"A\" data-txt=\"D&#x27;accord, bonne soirée.\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"B\" data-txt=\"Merci, au revoir.\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"C\" data-txt=\"Oui, avec plaisir.\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"D\" data-txt=\"Très bien, à demain.\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span class=\"blank\">écoutez…</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : C. Oui, avec plaisir.</div><div class=\"trl\">Transcription</div><div class=\"tr\">– Salut Elsa, tu viens prendre un café avec moi ?</div></div></div><div class=\"exo-note easy\">❕ Ici, seules les <b>propositions</b> s’écoutent (A, B, C, D). Au vrai TCF, la <b>question</b> aussi s’écoute et on n’écoute qu’<b>une seule fois</b>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">🎧 Compréhension orale</div><div class=\"slide-title\">Écoutez et répondez</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🎧 Écoute</span></div><div class=\"slide-body\"><div class=\"audio-wrap\"><audio class=\"mli-audio\" controls preload=\"none\" data-audio=\"CO 37/003.MP3\"></audio><span class=\"trk\">🔊 CO 37/003.MP3</span></div><div class=\"q-prompt\">Question 3 — Écoutez, puis choisissez : A, B, C ou D.</div><div class=\"dialogue-box\"><span class=\"dlab\">🗨️ Le dialogue (vous pouvez le lire)</ te</span></div><div class=\"slide-body\"><div class=\"audio-wrap\"><audio class=\"mli-audio\" controls preload=\"none\" data-audio=\"CO 21/004.MP3\"></audio><span class=\"trk\">🔊 CO 21/004.MP3</span></div><div class=\"q-prompt\">Question 4 — Écoutez, puis choisissez : A, B, C ou D.</div><div class=\"dialogue-box\"><span class=\"dlab\">🗨️ Le dialogue (vous pouvez le lire)</span>Je ne sais pas quel dessert préparer pour le dîner avec Marc ce soir. Qu&#x27;est-ce que tu penses d&#x27;une salade de chouettes ?</div><div class=\"answer-label\">👉 Cliquez sur la proposition entendue :</div><div class=\"qblock\" data-qid=\"q39\" data-correct=\"A\"><div class=\"choices\"><div class=\"choice letter-only\" data-l=\"A\" data-txt=\"Oui, bonne idée. C&#x27;est facile à préparer.\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"B\" data-txt=\"Oui, fais-nous une tarte au citron.\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"C\" data-txt=\"Oui, il aime bien le chocolat chaud.\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span class=\"blank\">écoutez…</span></div><div class=\"choice letter-only\" data-l=\"D\" data-txt=\"Oui, on peut manger au restaurant.\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span class=\"blank\">écoutez…</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : A. Oui, bonne idée. C&#x27;est facile à préparer.</div><div class=\"trl\">Transcription</div><div class=\"tr\">Je ne sais pas quel dessert préparer pour le dîner avec Marc ce soir. Qu&#x27;est-ce que tu penses d&#x27;une salade de chouettes ?</div></div></div><div class=\"exo-note easy\">❕ Ici, seules les <b>propositions</b> s’écoutent (A, B, C, D). Au vrai TCF, la <b>question</b> aussi s’écoute et on n’écoute qu "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">🗣️</div><div class=\"section-title\" style=\"color:#EE5818\">Expression orale</div><div class=\"section-sub\">Beaucoup de pratique — à vous de parler !</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Monologue</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Jeu de rôle</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Décrire</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Questions rapides</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">1</span><div><div class=\"slide-lnum\">🗣️ Expression orale</div><div class=\"slide-title\">La météo, mes vêtements &amp; la santé</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🌦️ Monologue</span></div><div class=\"slide-body\"><div class=\"speak-lead\">Décrivez le temps aujourd’hui, ce que vous portez, et dites comment vous allez.</div><div class=\"model-box\"><div class=\"mh\">Phrases utiles</div><div class=\"fr\">• Aujourd’hui, il fait <b>beau / froid / chaud</b>. Il <b>pleut</b> / il y a du <b>soleil</b>.</div><div class=\"fr\">• Je porte <b>un manteau / une robe / des chaussures</b>.</div><div class=\"fr\">• Ça va bien. / Je suis un peu malade, j’ai <b>mal à la tête</b>.</div><div class=\"fr\">• Demain, je <b>vais</b> rester à la maison. (futur proche)</div></div><div class=\"answer-label\">✍️ Préparez votre réponse (puis dites-la à l’oral) :</div><textarea class=\"speak-input\" data-fid=\"s11\" oninput=\"saveText(this)\" placeholder=\"Notez vos idées ici…\"></textarea><div class=\"note-fr\">💡 Astuce : parlez du temps, de vos vêtements et de votre santé. « avoir mal à » + partie du corps (j’ai mal à la tête / au ventre).</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">2</span><div><div class=\"slide-lnum\">🗣️ Expression orale</div><div class=\"slide-title\">Jeu de rôle — Au restaurant / au marché</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🍽️ Dialogue</span></div><div class=\"slide-body\"><div class=\"speak-lead\">À deux. A commande / achète, B est le serveur / le vendeur.</div><div class=\"role-grid\"><div class=\"role-col\"><div class=\"rh\">🙋 A — Le client</div><ul><li>Bonjour, je voudrais <b>le menu à 16 €</b>.</li><li>Qu’est-ce que vous avez comme <b>dessert</b> ?</li><li>Je prends <b>1 kilo de tomates</b>, s’il vous plaît.</li><li>Ça fait combien ?</li></ul></div><div class=\"role-col\"><div class=\"rh\">👨‍🍳 B — Le serveur / vendeur</div><ul><li>Bonjour ! Vous désirez ?</li><li>Comme dessert, il y a <b>une tarte</b> ou <b>une glace</b>.</li><li>Et avec ça ?</li><li>Ça fait <b>12 euros</b>, s’il vous plaît.</li></ul></div></div><div class=\"answer-label\">✍️ Préparez votre réponse (puis dites-la à l’oral) :</div><textarea class=\"speak-input\" data-fid=\"s12\" oninput=\"saveText(this)\" placeholder=\"Notez vos idées ici…\"></textarea><div class=\"note-fr\">💡 Astuce : pour commander ou acheter — je voudrais…, combien ?, un kilo de…, une bouteille de…</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">🗣️ Expression orale</div><div class=\"slide-title\">Décrire &amp; comparer</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">⚖️ Description</span></div><div class=\"slide-body\"><div class=\"speak-lead\">Comparez deux choses (deux plats, deux vêtements, deux villes). Utilisez plus / moins / aussi.</div><div class=\"model-box\"><div class=\"mh\">Pour comparer</div><div class=\"fr\">• Le manteau rouge est <b>plus</b> cher <b>que</b> le bleu.</div><div class=\"fr\">• Cette robe est <b>moins</b> grande <b>que</b> l’autre.</div><div class=\"fr\">• Le thé est <b>aussi</b> bon <b>que</b> le café.</div><div class=\"fr\">• J’aime <b>mieux</b> … / Je <b>préfère</b> …</div></div><div class=\"answer-label\">✍️ Préparez votre réponse (puis dites-la à l’oral) :</div><textarea class=\"speak-input\" data-fid=\"s13\" oninput=\"saveText(this)\" placeholder=\"Notez vos idées ici…\"></textarea><div class=\"note-fr\">💡 Astuce : comparez avec plus… que, moins… que, aussi… que. Puis dites ce que vous préférez.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">4</span><div><div class=\"slide-lnum\">🗣️ Expression orale</div><div class=\"slide-title\">Questions-réponses rapides</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">⚡ Tour de table</span></div><div class=\"slide-body\"><div class=\"speak-lead\">Réponse rapide à l’oral. On balaye tout le programme A1 !</div><div class=\"drill-list\"><div class=\"drill\"><span class=\"n\">1</span><span>Quel temps fait-il aujourd’hui ?</span></div><div class=\"drill\"><span class=\"n\">2</span><span>Qu’est-ce que vous portez ?</span></div><div class=\"drill\"><span class=\"n\">3</span><span>Où avez-vous mal ?</span></div><div class=\"drill\"><span class=\"n\">4</span><span>Qu’est-ce que vous aimez manger ?</span></div><div class=\"drill\"><span class=\"n\">5</span><span>Vous préférez le thé ou le café ?</span></div><div class=\"drill\"><span class=\"n\">6</span><span>Quand est votre anniversaire ?</span></div><div class=\"drill\"><span class=\"n\">7</span><span>Qu’est-ce qu’on offre comme cadeau ?</span></div><div class=\"drill\"><span class=\"n\">8</span><span>Le métro ou le vélo : lequel est plus rapide ?</span></div></div><div class=\"answer-label\">✍️ Préparez votre réponse (puis dites-la à l’oral) :</div><textarea class=\"speak-input\" data-fid=\"s14\" oninput=\"saveText(this)\" placeholder=\"Notez vos idées ici…\"></textarea><div class=\"note-fr\">💡 Astuce : réponses rapides sur la météo, la santé, les repas, les fêtes et la comparaison.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">📖</div><div class=\"section-title\" style=\"color:#EE5818\">Compréhension écrite</div><div class=\"section-sub\">Lisez le texte, puis répondez</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Messages</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Affiches</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Petites annonces</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">1</span><div><div class=\"slide-lnum\">📖 Compréhension écrite</div><div class=\"slide-title\">Texte court</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📖 Lecture</span></div><div class=\"slide-body\"><div class=\"read-passage\">Faites confiance à l&#x27;entreprise Rapid&#x27;paquet pour tous vos envois urgents !\n\nNous prenons vos paquets à domicile ou dans les bureaux de poste. Nous les livrons dans le monde entier.</div><div class=\"q-prompt\">Que propose cette entreprise ?</div><div class=\"answer-label\">👉 Choisissez votre réponse :</div><div class=\"qblock\" data-qid=\"r42\" data-correct=\"B\"><div class=\"choices\"><div class=\"choice\" data-l=\"A\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span>De stocker des marchandises</span></div><div class=\"choice\" data-l=\"B\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span>De transporter des colis</span></div><div class=\"choice\" data-l=\"C\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span>De vendre des cartons</span></div><div class=\"choice\" data-l=\"D\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span>De voyager à l&#x27;étranger</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : B. De transporter des colis</div><div class=\"note-fr\">🔑 Indice dans le texte : « Nous prenons vos paquets à domicile ou dans les bureaux de poste. Nous les livrons dans le monde entier. »</div></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">2</span><div><div class=\"slide-lnum\">📖 Compréhension écrite</div><div class=\"slide-title\">Texte court</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📖 Lecture</span></div><div class=\"slide-body\"><div class=\"read-passage\">Heures d&#x27;ouverture du service consulaire :\nLe service consulaire est ouvert au public les lundis, mercredis et jeudis de 8h30 à 14h et les mardis et vendredis de 14h30 à 18h</div><div class=\"q-prompt\">Quand le service est-il fermé au public ?</div><div class=\"answer-label\">👉 Choisissez votre réponse :</div><div class=\"qblock\" data-qid=\"r43\" data-correct=\"B\"><div class=\"choices\"><div class=\"choice\" data-l=\"A\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span>A) Le lundi matin</span></div><div class=\"choice\" data-l=\"B\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span>B) Le mardi matin</span></div><div class=\"choice\" data-l=\"C\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span>C) Le mercredi matin</span></div><div class=\"choice\" data-l=\"D\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span>D) Le jeudi matin</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : B. B) Le mardi matin</div><div class=\"note-fr\">🔑 Indice dans le texte : « les mardis et vendredis de 14h30 à 18h »</div></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">📖 Compréhension écrite</div><div class=\"slide-title\">Texte court</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📖 Lecture</span></div><div class=\"slide-body\"><div class=\"read-passage\">Nous informons notre aimable clientèle que nous sommes actuellement en vacances jusqu&#x27;au dimanche 1er septembre. Nous aurons le plaisir de vous retrouver à partir du 2. Le magasin ouvrira comme tous les lundis à 11h.\nBonnes vacances à tous !</div><div class=\"q-prompt\">Qu&#x27;apprend-on sur le magasin ?</div><div class=\"answer-label\">👉 Choisissez votre réponse :</div><div class=\"qblock\" data-qid=\"r44\" data-correct=\"D\"><div class=\"choices\"><div class=\"choice\" data-l=\"A\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span>Il va avoir de nouveaux horaires</span></div><div class=\"choice\" data-l=\"B\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span>Il va changer de propriétaire</span></div><div class=\"choice\" data-l=\"C\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span>Il va déménager en septembre</span></div><div class=\"choice\" data-l=\"D\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span>Il va fermer pendant l&#x27;été</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : D. Il va fermer pendant l&#x27;été</div><div class=\"note-fr\">🔑 Indice dans le texte : « nous sommes actuellement en vacances jusqu&#x27;au dimanche 1er septembre. »</div></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">4</span><div><div class=\"slide-lnum\">📖 Compréhension écrite</div><div class=\"slide-title\">Texte court</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📖 Lecture</span></div><div class=\"slide-body\"><div class=\"read-passage\">Pierre,\nN&#x27;oubliez pas notre déjeuner au restaurant. Je vous attends devant l&#x27;ascenseur.\n\nAlice</div><div class=\"q-prompt\">Pourquoi est-ce qu&#x27;Alice attend Pierre ?</div><div class=\"answer-label\">👉 Choisissez votre réponse :</div><div class=\"qblock\" data-qid=\"r45\" data-correct=\"B\"><div class=\"choices\"><div class=\"choice\" data-l=\"A\" onclick=\"pick(this)\"><span class=\"lt\">A.</span><span>Pour des courses</span></div><div class=\"choice\" data-l=\"B\" onclick=\"pick(this)\"><span class=\"lt\">B.</span><span>Pour un repas</span></div><div class=\"choice\" data-l=\"C\" onclick=\"pick(this)\"><span class=\"lt\">C.</span><span>Pour un travail</span></div><div class=\"choice\" data-l=\"D\" onclick=\"pick(this)\"><span class=\"lt\">D.</span><span>Pour une réunion</span></div></div><button class=\"reveal-btn\" onclick=\"tc(this)\">✅ Voir le corrigé</button><div class=\"corrige\"><div class=\"ans\">✅ Bonne réponse : B. Pour un repas</div><div class=\"note-fr\">🔑 Indice dans le texte : « N&#x27;oubliez pas notre déjeuner au restaurant. »</div></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">✍️</div><div class=\"section-title\" style=\"color:#EE5818\">Expression écrite</div><div class=\"section-sub\">Écrivez un court message (40–60 mots)</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Message</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">Invitation</span><span class=\"section-chip\" style=\"background:#FCEEE6;color:#EE5818;border:1px solid #EE581855\">40–60 mots</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">✍</span><div><div class=\"slide-lnum\">✍️ Expression écrite</div><div class=\"slide-title\">Rédaction A1</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📝 Écrire</span></div><div class=\"slide-body\"><div class=\"write-task\">✍️ <span class='wc'>Tâche :</span> C’est votre anniversaire. Écrivez un message pour inviter un ami à votre fête. <b>(40–60 mots)</b></div><div class=\"q-prompt\" style=\"font-size:.9rem\">✅ Pensez à :</div><ul style=\"margin-top:0\"><li>la date et l’heure</li><li>le lieu (chez moi, au restaurant…)</li><li>ce qu’on va manger / faire</li><li>une demande (Tu peux apporter… ?)</li><li>une formule de fin (À samedi !)</li></ul><div class=\"answer-label\">✍️ Écrivez votre réponse :</div><textarea class=\"write-input\" data-fid=\"w15\" oninput=\"saveText(this)\" placeholder=\"Écrivez ici… (40–60 mots)\"></textarea><div class=\"note-fr\">💡 Astuce : 40 à 60 mots — date, heure, lieu, ce qu’on va manger, et une demande. Futur proche : « on va manger… ».</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FCEEE6\"><div class=\"slide-hdr\" style=\"background:#FCEEE6;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">✓</span><div><div class=\"slide-lnum\">🏁 Récap</div><div class=\"slide-title\">Auto-contrôle</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">✅ Bilan</span></div><div class=\"slide-body\"><div class=\"speak-lead\">Avant de finir, vérifiez que vous savez :</div><div class=\"recap-grid\"><div class=\"recap-item\">🌦️ <b>La météo</b> : il fait beau / froid, il pleut.</div><div class=\"recap-item\">🩺 <b>La santé</b> : j’ai mal à la tête / au ventre.</div><div class=\"recap-item\">🍽️ <b>Commander / acheter</b> : je voudrais…, ça fait combien ?</div><div class=\"recap-item\">⚖️ <b>Comparer</b> : plus / moins / aussi … que.</div><div class=\"recap-item\">✍️ <b>Écrire</b> une invitation d’anniversaire de 40–60 mots.</div></div><div class=\"note-fr\">💡 Tout est clair ? Si un point est difficile, revenez à la page correspondante et réécoutez.</div></div></div>"];
const N=S.length;
let cur=0;

function clearPH(el){
  el.addEventListener('focus',()=>{const p=el.querySelector('.write-placeholder');if(p)p.style.display='none';});
  el.addEventListener('blur',()=>{const p=el.querySelector('.write-placeholder');if(p&&el.innerText.trim()==='')p.style.display='';});
}

function render(idx,smooth){
  cur=idx;
  const sw=document.getElementById('sw');
  sw.classList.add('fade');
  setTimeout(()=>{
    sw.innerHTML=S[cur];
    sw.querySelectorAll('[contenteditable]').forEach(clearPH);
    layout();sw.classList.remove('fade');
    document.getElementById('pf').style.width=((cur+1)/N*100)+'%';
    document.getElementById('pl').textContent=(cur+1)+' / '+N;
    document.getElementById('bp').disabled=cur===0;
    const bn=document.getElementById('bn');
    if(cur===N-1){bn.className='nav-btn done';bn.textContent='✓';bn.disabled=true;}
    else{bn.className='nav-btn';bn.textContent='→';bn.disabled=false;}
    layout();
    if(smooth!==false)window.scrollTo({top:0,behavior:inPresent()?'auto':'smooth'});
  },130);
}

function go(d){const n=cur+d;if(n>=0&&n<N)render(n);}

document.addEventListener('keydown',e=>{
  if(['ArrowRight',' '].includes(e.key)&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(-1);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55&&!document.activeElement.isContentEditable)go(dx<0?1:-1);
},{passive:true});

const zr=document.getElementById('zr');
const zl_el=document.getElementById('zl');
const sw_el=document.getElementById('sw');
function applyZoom(v){
  zl_el.textContent=v+'%';
  const scale=v/100;
  sw_el.style.transform='scale('+scale+')';
  sw_el.style.width=Math.round(920*(1/scale))+'px';
  sw_el.style.transformOrigin='top center';
}
zr.addEventListener('input',()=>applyZoom(parseInt(zr.value)));

/* ══ MODE PRÉSENTATION + CLAVIER FRANÇAIS + COMPTEUR DE MOTS ══ */
const SW=document.getElementById('sw'),SSW=document.getElementById('ssw'),DESIGN_W=1120;
const CARD=false;
let pz=1;
function inPresent(){return document.body.classList.contains('present');}
function restoreNormal(){
  SW.style.width='';SW.style.height='';SW.style.minHeight='';SW.style.maxWidth='';SW.style.flex='';
  SW.style.transform='';SW.style.transformOrigin='top center';SW.style.margin='';
  if(SSW){SSW.style.height='';SSW.style.width='';SSW.style.maxWidth='';SSW.style.overflow='';}
  if(typeof zr!=='undefined'&&zr)zr.dispatchEvent(new Event('input'));
}
function layout(){
  if(!inPresent()){restoreNormal();return;}
  const s=Math.min(window.innerWidth/DESIGN_W,2.4)*pz;
  const w=window.innerWidth/s;
  SW.style.maxWidth='none';SW.style.transformOrigin='top center';SW.style.margin='0 auto';
  SW.style.width=w+'px';SW.style.transform='scale('+s+')';
  if(CARD){
    SW.style.flex='none';SW.style.height=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height='100vh';SSW.style.overflow='hidden';}
  }else{
    SW.style.minHeight=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height=SW.getBoundingClientRect().height+'px';}
  }
}
function setSize(d){
  pz=Math.min(2.2,Math.max(.8,Math.round((pz+d*.1)*10)/10));
  const v=document.getElementById('szv');if(v)v.textContent=Math.round(pz*100)+'%';
  layout();
}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  const d=document.documentElement;
  if(!document.body.classList.contains('present')){
    const r=d.requestFullscreen||d.webkitRequestFullscreen;
    if(r){try{const p=r.call(d);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    document.body.classList.add('present');
  }else{
    const x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x){try{x.call(document);}catch(e){}}
    document.body.classList.remove('present');
  }
  setTimeout(layout,120);setTimeout(layout,450);
}
function onFsChange(){
  document.body.classList.toggle('present',!!fsElement());
  const b=document.getElementById('fsb');
  if(b)b.querySelector('.fs-txt').textContent=fsElement()?'Quitter':'Plein écran';
  setTimeout(layout,120);setTimeout(layout,450);
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',()=>layout());
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
  if(e.key==='Escape'&&document.body.classList.contains('present')&&!fsElement()){document.body.classList.remove('present');layout();}
  if(inPresent()){
    if(e.key==='+'||e.key==='='){e.preventDefault();setSize(1);}
    if(e.key==='-'||e.key==='_'){e.preventDefault();setSize(-1);}
    if(e.key==='0'){e.preventDefault();pz=1;const v=document.getElementById('szv');if(v)v.textContent='100%';layout();}
  }else if(typeof zr!=='undefined'&&zr){
    if(e.key==='+'||e.key==='='){e.preventDefault();zr.value=Math.min(+zr.max,+zr.value+10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='-'||e.key==='_'){e.preventDefault();zr.value=Math.max(+zr.min,+zr.value-10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='0'){e.preventDefault();zr.value=100;zr.dispatchEvent(new Event('input'));}
  }
});
/* ── clavier d'accents flottant : toutes les zones de saisie ── */
const ACC=['é','è','ê','ë','à','â','î','ï','ô','û','ù','ç','œ','æ','|','É','È','À','Ç','|','« ',' »','’'];
const accBar=document.createElement('div');accBar.className='acc-bar';
const accCount=document.createElement('span');accCount.className='acc-count';
let curEd=null;
ACC.forEach(ch=>{
  if(ch==='|'){const s=document.createElement('span');s.className='acc-sep';accBar.appendChild(s);return;}
  const b=document.createElement('button');b.type='button';b.className='acc-key';b.textContent=ch.trim()||ch;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(!curEd)return;
    const p=curEd.querySelector?curEd.querySelector('.write-placeholder'):null;if(p)p.style.display='none';
    curEd.focus();
    if(curEd.tagName==='INPUT'||curEd.tagName==='TEXTAREA'){
      const s=curEd.selectionStart||0,e2=curEd.selectionEnd||0;
      curEd.value=curEd.value.slice(0,s)+ch+curEd.value.slice(e2);
      curEd.selectionStart=curEd.selectionEnd=s+ch.length;
    }else{document.execCommand('insertText',false,ch);}
    updCount();
  });
  accBar.appendChild(b);
});
accBar.appendChild(accCount);
document.body.appendChild(accBar);
function edText(el){
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return el.value||'';
  const p=el.querySelector('.write-placeholder');
  let t=el.innerText||'';
  if(p&&p.offsetParent!==null&&p.innerText)t=t.split(p.innerText).join('');
  return t;
}
function updCount(){
  if(!curEd)return;
  const m=edText(curEd).match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  const n=m?m.length:0;
  const mn=parseInt(curEd.dataset.min||0),mx=parseInt(curEd.dataset.max||0);
  accCount.className='acc-count';
  if(mn&&mx){
    accCount.textContent=n+' / '+mn+'–'+mx+' mots';
    const st=(n===0?'':(n<mn?'under':(n>mx?'over':'ok')));
    if(st)accCount.classList.add(st);
  }else{accCount.textContent=n+(n>1?' mots':' mot');}
}
function edOf(t){return t&&t.closest?t.closest('[contenteditable],input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
/* en plein écran : empêche le focus d'une zone de saisie de faire remonter la diapo */
document.addEventListener('focusin',()=>{
  if(!inPresent())return;
  setTimeout(()=>{document.querySelectorAll('.stage,.slide-scale-wrap').forEach(el=>{el.scrollTop=0;el.scrollLeft=0;});},0);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!edOf(document.activeElement))accBar.classList.remove('on');},160);});
document.addEventListener('input',e=>{const ed=edOf(e.target);if(ed){curEd=ed;updCount();}});

render(0,false);layout();



function tc(btn){var c=btn.nextElementSibling;var o=c.classList.toggle('show');btn.textContent=o?'\uD83D\uDE48 Cacher le corrig\u00e9':'\u2705 Voir le corrig\u00e9';}

// === Audio source ===
// The MP3 files load from the same folder as this file, e.g. "CO 5/001.MP3".
// If your audio is hosted online, set AUDIO_BASE to the base URL, e.g.
//   const AUDIO_BASE = "https://raw.githubusercontent.com/USER/REPO/main/";
const AUDIO_BASE = "";
function bindAudio(){
  document.querySelectorAll('#sw audio[data-audio]').forEach(function(a){
    if(!a.getAttribute('src')){
      a.setAttribute('src', AUDIO_BASE + encodeURI(a.getAttribute('data-audio')));
    }
  });
}
var _sw = document.getElementById('sw');
if(_sw){ new MutationObserver(function(muts){ var swap=muts.some(function(m){ return [].some.call(m.addedNodes,function(n){ return n.nodeType===1 && n.classList && n.classList.contains('content-slide'); }); }); if(swap){ bindAudio(); restoreState(); } }).observe(_sw, {childList:true, subtree:true}); }
bindAudio(); restoreState();

// === Answering (listening + reading) and input persistence ===
var STATE = {};
function applyPick(box, chosen){
  var correct = box.getAttribute('data-correct');
  box.querySelectorAll('.choice').forEach(function(c){
    c.classList.add('answered');
    var l = c.getAttribute('data-l');
    c.classList.remove('correct','wrong');
    if(l===correct) c.classList.add('correct');
    if(l===chosen && chosen!==correct) c.classList.add('wrong');
    var bl = c.querySelector('.blank'); var tx = c.getAttribute('data-txt');
    if(bl && tx){ bl.textContent = tx; bl.classList.remove('blank'); }
  });
  var cor = box.querySelector('.corrige'); if(cor){ cor.classList.add('show'); }
  var btn = box.querySelector('.reveal-btn'); if(btn){ btn.textContent = '🙈 Cacher le corrigé'; }
}
function pick(el){
  var box = el.closest('.qblock'); if(!box) return;
  var chosen = el.getAttribute('data-l');
  STATE[box.getAttribute('data-qid')] = chosen;
  applyPick(box, chosen);
}
function saveText(ta){ STATE[ta.getAttribute('data-fid')] = ta.value; }
function restoreState(){
  document.querySelectorAll('#sw .qblock').forEach(function(box){
    var v = STATE[box.getAttribute('data-qid')];
    if(v){ applyPick(box, v); }
  });
  document.querySelectorAll('#sw textarea[data-fid]').forEach(function(ta){
    var v = STATE[ta.getAttribute('data-fid')]; if(v!=null){ ta.value = v; }
  });
}
</script>
