e refuse de garder le chien.", "transcript": "– Au fait, est-ce que je peux compter sur toi pour garder Moki pendant les vacances ? Promis, c'est la dernière fois que je te demande un tel service.\n– Jamais de la vie, c'est hors de question cette fois-ci. La dernière fois que je l'ai gardé, il a été insupportable.\n– Oh non ! Comment je vais faire ? Je croyais pouvoir compter sur toi.", "audio": "CO 2/022.MP3", "_test": "2", "_pos": 22, "_origlabel": "test2#22", "_sources": ["test2#22"]}, {"type": "document", "q": "Question 28. Que permettent les sites internet dont parle le document ?", "c": ["D'établir un diagnostic en ligne.", "D'éviter des pertes de temps.", "De réduire les frais de santé.", "De vérifier la qualité des soins."], "a": 1, "k": "fini les longues minutes d'attente", "transcript": "Ces sites internet ont tout changé. Et pour tout le monde, oui, grâce à eux, fini les longues minutes d'attente au bout du fil sur un air de musique classique. Fini aussi les secrétariats médicaux injoignables. Désormais, il est possible de prendre rendez-vous en un clic à n'importe quelle heure du jour et de la nuit chez son dentiste, son ostéopathe et même à l'hôpital. La révolution est en marche. Tout le monde semblait y gagner.", "audio": "CO 3/028.MP3", "_test": "3", "_pos": 28, "_origlabel": "test3#28", "_sources": ["test3#28", "test6#27"]}, {"type": "document", "q": "Question 26. Sur quoi portent les réflexions de la personne interviewée ?", "c": ["L'entretien des liens d'amitié à distance.", "La comparaison de moyens de mobilité.", "La sociabilité à l'ère du numérique.", "Les échanges dans les transports."], "a": 2, "k": "un effet certain sur une redéfinition de la relation des personnes à autrui", "transcript": "Ces nouvelles technologies, la présence d'internet a un effet certain sur une redéfinition de la relation des personnes à autrui. On peut être complètement hypnotisé par ce petit outil technologique qui est le téléphone ou la tablette. On peut être beaucoup plus connecté avec quelqu'un qui est à 10 000 kilomètres de nous qu'avec quelqu'un qui est assis à côté de nous.", "audio": "CO 6/026.MP3", "_test": "6", "_pos": 26, "_origlabel": "test6#26", "_sources": ["test6#26"]}, {"type": "document", "q": "Quel est le but de miammiam.fr ?", "c": ["Conseiller gratuitement des régimes minceur.", "Faciliter la consommation de produits sains.", "Livrer des spécialités régionales à domicile.", "Proposer une émission de cuisine sur Internet."], "a": 1, "k": "miammiam.fr va vous y aider", "transcript": "Manger cinq fruits et légumes par jour, c'est bon pour la santé, on le sait, mais on ne le fait pas. Avouez, vous avez essayé mais vous n'y arrivez pas. Miammiam.fr va vous y aider. Ce site propose des paniers avec des produits frais et de saison. Le tout livré gratuitement partout dans le pays, chez vous ou sur votre lieu de travail.", "audio": "CO 7/028.MP3", "_test": "7", "_pos": 28, "_origlabel": "test7#28", "_sources": ["test7#28", "test20#28"]}, {"type": "document", "q": "Question 20. Pourquoi cette dame va-t-elle finalement envoyer son colis le lendemain ?", "c": ["Elle a décidé de changer d'emballage.", "Elle a laissé son portefeuille chez elle.", "Elle a mal rempli la fiche de douane.", "Elle a oublié l'adresse du destinataire."], "a": 0, "k": "je vais refaire le colis chez moi avec une de vos boîtes", "transcript": "– Bonjour, je voudrais envoyer ce colis en outre-mer en express.\n– D'accord, alors ça vous fera 20 euros s'il vous plaît.\n– 20 euros ?\n– Oui, mais si vous préférez, nous proposons des boîtes standards qui coûtent moins cher.\n– Je pense que je vais refaire le colis chez moi avec une de vos boîtes et revenir demain.\n– N'oubliez pas de détailler le contenu du colis pour la douane.\n– Oui, je m'en suis occupée. J'ai également la fiche avec les coordonnées du destinataire.", "audio": "CO 9/020.MP3", "_test": "9", "_pos": 20, "_origlabel": "test9#20", "_sources": ["test9#20"]}, {"type": "document", "q": "Pourquoi l'entreprise Facebook a-t-elle modifié son code de conduite ?", "c": ["Pour améliorer la cohésion des équipes.", "Pour empêcher la diffusion de rumeurs.", "Pour éviter les sollicitations abusives.", "Pour limiter les distractions au travail."], "a": 2, "k": "on ne peut pas l'inviter une seconde fois", "transcript": "Une affaire révélée par le Wall Street Journal fait beaucoup de bruit dans la presse anglo-saxonne. Désormais, chez Facebook, on ne peut proposer à un ou une collègue de sortir, de boire un verre, qu'une seule fois. Si il ou elle refuse, on ne peut pas l'inviter une seconde fois. Cela figure désormais dans le code de conduite de l'entreprise. Aller plus loin peut exposer à des sanctions disciplinaires. La direction de Facebook est entrée dans les détails : un refus n'a pas à être totalement explicite. Si vous entendez « Je suis occupé ce soir » ou « Je ne suis pas disponible », cela suffit. Vous n'avez pas le droit de réitérer votre invitation.", "audio": "CO 24/027.MP3", "_test": "24", "_pos": 27, "_origlabel": "test24#27", "_sources": ["test24#27", "test35#27"]}, {"type": "document", "q": "À quoi servent ces applications ?", "c": ["Comparer les prix selon les marques.", "Donner une note en tant qu'utilisateur.", "Obtenir des réductions sur les achats.", "Vérifier les caractéristiques des aliments."], "a": 3, "k": "permet d'évaluer la qualité nutritionnelle des produits", "transcript": "Aujourd'hui, le bien manger est devenu la priorité au point de bouleverser nos habitudes de consommation. Notre façon de faire des courses est en même... est en train même... et même, pardonnez-moi, en pleine révolution. Dans les rayons des supermarchés, plus d'un Français sur six utilise désormais une application qui permet d'évaluer la qualité nutritionnelle des produits. Bonjour Hugo de Turenne.\n— Bonjour. Bonjour Yves, bonjour à tous.\n— Eh bien pour comprendre, je vous emmène tester l'une de ces applications la plus téléchargée. Justine, trentenaire, place son smartphone face à cette bouteille de jus de fruit.\n— J'ouvre l'application, je scanne le code-barres... Et donc, là, j'ai un score qui apparaît : 59 sur 100 pour le jus de fruit pomme-poire-pêche. C'est considéré comme « bon ».", "audio": "CO 31/026.MP3", "_test": "31", "_pos": 26, "_origlabel": "test31#26", "_sources": ["test31#26"]}, {"c": ["Développer sa coopération industrielle.", "Favoriser l'embauche de profils créatifs.", "Financer des projets de recherche innovants.", "Renforcer la formation numérique des jeunes."], "a": 3, "q": "D'après cet intervenant, que doit faire le Québec ?", "transcript": "Nous vivons aujourd'hui au rythme d'une quatrième révolution industrielle, celle du numérique. La mécanisation, l'électrification et l'industrialisation ont transformé le monde au cours des derniers siècles. Les technologies transforment actuellement l'ensemble des sociétés. Nous devons préparer le Québec : soutenons les apprenants pour qu'ils développent les compétences qui leur seront nécessaires pour être des citoyens responsables dans le monde de demain, favorisant leur autonomie. Adaptons l'intégration du numérique à leur façon de penser, de réfléchir et de résoudre des problèmes de manière créative et innovante.", "k": "soutenons les apprenants pour qu'ils développent les compétences", "type": "document", "audio": "CO 39/026.MP3", "_test": "39", "_pos": 26, "_origlabel": "test39#26", "_sources": ["test39#26"]}, {"type": "document", "q": "Qu'est-ce que Patrick était le seul à vouloir faire ?", "c": ["Jouer aux cartes.", "Aller se promener.", "Regarder la télévision.", "Visiter la région."], "a": 1, "k": "Il n'y a que moi qui voulais encore marcher malgré la pluie.", "transcript": "– Alors, Patrick, ce stage d'informatique à la Tulipe ?\n– Oh, ne m'en parle pas. Horrible ! Je suis ravi d'être au boulot.\n– D'abord, il a plu toute la semaine, avec une tempête, t'aurais vu ça. On pensait pouvoir faire des balades en fin de journée.\n– Il n'y a que moi qui voulais encore marcher malgré la pluie. Les autres se retrouvaient au bord pour jouer aux cartes ou refaire le monde.\n– D'autres ont passé leur temps devant la télé.\n– Eh bien, bravo ! Pour prendre le bon air, c'est réussi. Et je ne te décris pas le trou que c'était. Rien à voir à des kilomètres à la ronde.", "audio": "CO 16/029.MP3", "_test": "16", "_pos": 29, "_origlabel": "test16#29", "_sources": ["test16#29"]}], "devoirs": []}}</script>

  var val = document.getElementById("zoomVal");

function esc(s) {
  var t = String(s);
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hlText(text, key) {
  var h = esc(text).replace(/\n/g,"<br>");
  if (!key) return h;
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0,idx) + "<mark>" + h.substring(idx, idx+ek.length) + "</mark>" + h.substring(idx+ek.length);
    }
  } catch(e) {}
  return h;
}

function formatTimeJS(s) {
  if (!s || !isFinite(s) || s < 0) return "0:00";
  var m = Math.floor(s/60);
  var sec = Math.floor(s%60);
  return m + ":" + (sec<10?"0":"") + sec;
}

function pauseAllAudio() {
  for (var k in audioObjs) {
    var a = audioObjs[k];
    if (a && !a.paused) {
      a.pause();
      var icon = document.getElementById("play-icon-"+k);
      if (icon) icon.textContent = "▶";
    }
  }
}

function getOrCreateAudio(qi) {
  if (audioObjs[qi]) return audioObjs[qi];
  var q = QQ[qi];
  var a = new Audio(q.audio);
  audioObjs[qi] = a;
  a.addEventListener("loadedmetadata", function(){
    var seekEl = document.getElementById("seek-"+qi);
    var durEl = document.getElementById("time-dur-"+qi);
    if (seekEl) seekEl.max = a.duration;
    if (durEl) durEl.textContent = formatTimeJS(a.duration);
  });
  a.addEventListener("timeupdate", function(){
    var curEl = document.getElementById("time-cur-"+qi);
    var seekEl = document.getElementById("seek-"+qi);
    if (curEl) curEl.textContent = formatTimeJS(a.currentTime);
    if (seekEl) seekEl.value = a.currentTime;
  });
  a.addEventListener("ended", function(){
    var icon = document.getElementById("play-icon-"+qi);
    if (icon) icon.textContent = "▶";
  });
  return a;
}

function playAudio(qi) {
  var a = getOrCreateAudio(qi);
  var icon = document.getElementById("play-icon-"+qi);
  if (!a.paused) {
    a.pause();
    if (icon) icon.textContent = "▶";
    return;
  }
  pauseAllAudio();
  a.play().catch(function(){});
  icon = document.getElementById("play-icon-"+qi);
  if (icon) icon.textContent = "⏸";
}

function seekAudio(qi, val) {
  var a = getOrCreateAudio(qi);
  a.currentTime = parseFloat(val);
}

    "<div class='audio-row' style='flex-direction:column;align-items:stretch;gap:8px'>" +
      "<div style='display:flex;align-items:center;gap:10px'>" +
        "<button class='play-btn' onclick='playAudio("+i+")'>"+
          "<span id='play-icon-"+i+"'>"+(isPlaying?"⏸":"▶")+"</span>"+
        "</button>" +
        "<span class='audio-label'>Écouter le document</span>" +
      "</div>" +
      "<div style='display:flex;align-items:center;gap:8px'>" +
        "<span style='font-size:11px;color:#185FA5;min-width:30px;text-align:right' id='time-cur-"+i+"'>"+formatTimeJS(curT)+"</span>" +
        "<input type='range' min='0' max='"+(durT||100)+"' step='0.1' value='"+curT+"' id='seek-"+i+"' oninput='seekAudio("+i+",this.value)' style='flex:1;height:4px;accent-color:#185FA5'>" +
        "<span style='font-size:11px;color:#888;min-width:30px' id='time-dur-"+i+"'>"+formatTimeJS(durT)+"</span>" +
      "</div>" +
    "</div>";

  var choicesHtml = "";
  for (var ci=0; ci<q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      cls += " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    var txt;
    if (q.type === "document") {
      txt = "<span>" + esc(q.c[ci]) + "</span>";
    } else {
      txt = done ? "<span>" + esc(q.c[ci]) + "</span>" : "";
    }
    choicesHtml += "<button class='"+cls+"' onclick='pick("+i+","+ci+")'><span class='badge'>"+labels[ci]+"</span>"+txt+"</button>";
  }

  var feedbackHtml = "";
  if (done) {
    feedbackHtml = ua.ok
      ? "<div class='feedback ok'>✅ Bonne réponse !</div>"
      : "<div class='feedback ko'>❌ Réponse incorrecte. La bonne réponse est <strong>"+labels[q.a]+". "+esc(q.c[q.a])+"</strong></div>";
  }

  var transcriptHtml = "";
  if (done && q.transcript) {
    var tContent = hlText(q.transcript.replace(/^— /gm,""), q.k);
    var questionLine = (q.type === "document" && q.q) ? ("<div style='margin-top:.7rem;font-weight:500;font-style:normal'>" + esc(q.q) + "</div>") : "";
    transcriptHtml =
      "<div class='transcript-box' style='margin-top:.85rem'>" +
        tContent + questionLine +
      "</div>";
    if (q.k) {
      transcriptHtml += "<div class='key-label' style='margin-top:.6rem'>🔑 Phrase-clé surlignée</div>";
    }
  }

  var prevDis = i===0 ? " disabled" : "";
  var nextDis = i===QQ.length-1 ? " disabled" : "";
  var srcLabel = (q._sources && q._sources.length) ? "<span class='src-label'>Présent dans : "+q._sources.join(" · ")+"</span>" : (q._origlabel ? "<span class='src-label'>Source : "+q._origlabel+"</span>" : "");

  document.getElementById("view").innerHTML =
    "<div class='nav'>" +
      "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "<button class='btn'"+prevDis+" onclick='render("+(i-1)+")'>← Précédente</button>" +
      "<button class='btn'"+nextDis+" onclick='render("+(i+1)+")'>Suivante →</button>" +
      "<button class='btn btn-results' onclick='summary()'>Résultats</button>" +
    "</div>" +
    buildJumpBar(i) +
    "<div class='card'>" +
      "<div class='q-type-label'>"+getTypeLabel(q.type)+"</div>" + srcLabel +
      imgHtml + audioHtml +
      "<div class='question'>Q"+(i+1)+". " + (
        q.type === "document"
          ? "Écoutez le document sonore et la question, choisissez la bonne réponse."
          : q.type === "extrait"
          ? "Écoutez l'extrait sonore et les 4 propositions. Choisissez la bonne réponse."
          : "Écoutez les 4 propositions, choisissez celle qui correspond à l'image."
      ) + "</div>" +
      "<div class='choices'>"+choicesHtml+"</div>" +
      feedbackHtml + transcriptHtml +
    "</div>";

  updateHeader();
}

function buildJumpBar(cur_i) {
  if (!QQ || !QQ.length) return "";
  var h = "<div class='qjump'><span class='qjlabel'>Aller à la question :</span>";
  for (var j = 0; j < QQ.length; j++) {
    var cls = "qj";
    if (ans[j] !== undefined) cls += " answered";
    if (j === cur_i) cls += " current";
    h += "<button class='" + cls + "' onclick='render(" + j + ")'>" + (j + 1) + "</button>";
  }
  h += "</div>";
  return h;
}
function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  return { ok:ok, total: QQ.length, pct: Math.round(ok/QQ.length*100) };
}

function summary() {
  pauseAllAudio();
  var r = calcScore();
  var gridHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var cls = "grid-btn na";
    var ua = ans[i];
    if (ua) cls = ua.ok ? "grid-btn ok" : "grid-btn ko";
    gridHtml += "<button class='"+cls+"' onclick='render("+i+")' title='Q"+(i+1)+"'>"+(i+1)+"</button>";
  }
  document.getElementById("view").innerHTML =
    "<div class='summary'>" +
      "<h2>📊 Résultats – "+LEVEL_LABEL[CUR_LEVEL]+"</h2>" +
      "<div class='score-block'>" +
        "<div class='score-correct'>"+r.ok+" / "+r.total+" ✓ ("+r.pct+"%)</div>" +
      "</div>" +
      "<div class='grid'>"+gridHtml+"</div>" +
      "<div class='sum-actions'>" +
        "<button class='sum-btn' onclick='showReport()'>📋 Erreurs fréquentes</button>" +
        "<button class='sum-btn pdf' onclick='printPDF()'>🖨️ Exporter PDF</button>" +
        "<button class='sum-btn red' onclick='reset()'>↺ Recommencer cette catégorie</button>" +
        "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "</div>" +
      "<div class='sum-note'>* Banque de pratique regroupée par catégorie (type de question / position), pas un test officiel complet · Score = pourcentage de bonnes réponses</div>" +
    "</div>";
  updateHeader();
}

function showReport() {
  pauseAllAudio();
  var labels = ["A","B","C","D"];
  var wrongItems = [];
  var html = "";
  for (var i=0; i<QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    wrongItems.push(i);
    var q = QQ[i];
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
      else if (ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = q.transcript ? hlText(q.transcript, q.k) : "";
    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    html +=
      "<div class='report-item'>" +
        "<div class='qnum'>Question "+(i+1)+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.6rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.6rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }
  if (!html) html = "<div style='text-align:center;padding:2rem;color:#185FA5;font-weight:600'>🎉 Aucune erreur ! Bravo !</div>";
  document.getElementById("view").innerHTML =
    "<div class='report-header no-print'>" +
      "<strong style='font-size:16px'>📋 Rapport des erreurs ("+wrongItems.length+" question"+(wrongItems.length!==1?"s":"")+")</strong>" +
      "<button class='btn btn-results' onclick='summary()'>← Retour aux résultats</button>" +
    "</div>" +
    html;
}

function printPDF() {
  var r = calcScore();
  var labels = ["A","B","C","D"];
  var allQHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var q = QQ[i];
    var ua = ans[i];
    var done = ua !== undefined;
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (done) {
        if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
        else if (ua && ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = q.transcript ? hlText(q.transcript, q.k) : "";
    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    var statusBadge = done ? (ua.ok ? " ✅" : " ❌ (→"+labels[q.a]+")") : " —";
    allQHtml +=
      "<div class='report-item'>" +
        "<div class='qnum'>Q"+(i+1)+statusBadge+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.5rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.5rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }

  var pw = window.open("","_blank");
