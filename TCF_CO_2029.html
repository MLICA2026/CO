ollègues pour fêter ma nomination comme directeur.", "audio": "CO 24/029.MP3", "_test": "24", "_pos": 29, "_origlabel": "test24#29", "_sources": ["test24#29"]}, {"type": "document", "q": "Qu'est-ce qui inquiète cette mère de famille ?", "c": ["La fréquence des compétitions sportives", "Le contenu des programmes sportifs", "Les contraintes liées aux pratiques sportives", "L'insuffisance des résultats sportifs"], "a": 2, "k": "on fait plusieurs faux pas à l'hygiène de vie parfois pour réussir à rencontrer les horaires", "transcript": "— Est-ce que c'est toujours compatible, ça, d'avoir beaucoup d'heures de sport comme ça et de pouvoir concilier les études aussi ?\n— Non, spontanément, c'est pas toujours compatible et puis c'est un grand paradoxe qui s'installe dans ce jeu, parce qu'on fait faire du sport à nos enfants pour développer des valeurs... des valeurs de rigueur, de saines habitudes de vie, de qualité de vie. Et puis on se retrouve à devoir composer avec des habitudes qui ne sont pas très très de grande qualité. Alors, on va faire manger les enfants dans la voiture en s'en allant à l'aréna, on va faire des devoirs deux ou trois fois plus parce que on sait que tel ou tel jour on n'aura pas le temps de les faire. Donc, on fait plusieurs faux pas à l'hygiène de vie parfois pour réussir à rencontrer les horaires.", "audio": "CO 29/022.MP3", "_test": "29", "_pos": 22, "_origlabel": "test29#22", "_sources": ["test29#22"]}, {"type": "document", "q": "D'après cette personne, que permet la cuisine au sein d'une famille ?", "c": ["De conforter le rôle de chacun.", "De faire des économies.", "De renforcer les relations.", "De transmettre des savoir-faire."], "a": 2, "k": "ce plaisir-là, ce partage-là et ce lien familial et social doit être sauvegardé", "transcript": "Je suis une militante de la cuisine. Non seulement ce plaisir, j'éprouve le besoin de le partager, et surtout, je considère que cette place dans les familles ne peut pas rester vacante. On est à une époque où on a la chance de bénéficier de l'industrie alimentaire, des livraisons... on peut manger indien, thaï, français, enfin tout, voilà. D'accord, sauf malheureusement ceux pour qui c'est beaucoup trop cher, et pour qui la cuisine est encore une contrainte. Mais il me semble que cette place doit être occupée par un des membres de la famille, l'homme, la femme, les enfants, peu importe. Mais que ce plaisir-là, ce partage-là, et ce lien familial et social doit être sauvegardé.", "audio": "CO 31/021.MP3", "_test": "31", "_pos": 21, "_origlabel": "test31#21", "_sources": ["test31#21", "test39#21"]}, {"type": "document", "q": "Pourquoi la situation de Marie-Odile est-elle difficile ?", "c": ["Parce que l'éducation des enfants coûte cher.", "Parce que la famille a des revenus irréguliers.", "Parce que le théâtre a cessé de lui passer commande.", "Parce que son mari a perdu son travail récemment."], "a": 1, "k": "elle n'a donc pas de revenus fixes tous les mois", "transcript": "— Bonjour chers auditeurs. Aujourd'hui, nous rencontrons Marie-Odile, chez elle, à Samois-sur-Seine dans la banlieue parisienne. Elle travaille à son domicile de manière intermittente. Son activité principale est de confectionner des costumes pour différents théâtres. Elle est donc couturière de formation. En outre, elle accepte d'autres menus travaux de couture pour des particuliers. Elle n'a donc pas de revenus fixes tous les mois. Marie-Odile, qu'est-ce qui est le plus difficile dans votre vie d'intermittente ?\n— C'est souvent difficile de joindre les deux bouts chaque mois. Car avec deux enfants à élever et les revenus de mon mari qui est dans la même situation que moi, puisqu'il est décorateur pour le théâtre, nous n'arrivons pas toujours à faire des économies.", "audio": "CO 31/022.MP3", "_test": "31", "_pos": 22, "_origlabel": "test31#22", "_sources": ["test31#22"]}, {"type": "document", "c": ["Pour changer de profession.", "Pour découvrir de nouveaux lieux.", "Pour se rapprocher de sa famille.", "Pour suivre son compagnon."], "a": 3, "transcript": "Bonjour monsieur. J'ai vu votre annonce, vous cherchez toujours une vendeuse ? Oui, cela vous intéresse ? Vous avez de l'expérience ? J'ai été vendeuse pendant 15 ans à Québec, mais mon petit ami a été muté à Montréal, alors j'ai dû démissionner. Vous habitez encore là-bas ? Non, nous sommes chez mes parents en attendant de trouver un logement. Vous parlez anglais ? Bien sûr. Bien, vous pouvez revenir demain pour un essai ? Avec plaisir.", "k": "mon petit ami a été muté à Montréal", "q": "Pourquoi la personne cherche-t-elle du travail à Montréal ?", "audio": "CO 32/024.MP3", "_test": "32", "_pos": 24, "_origlabel": "test32#24", "_sources": ["test32#24"]}, {"type": "document", "q": "Question 25. Selon la personne interrogée, qu'est-ce qui retient les jeunes adultes chez leurs parents ?", "c": ["La peur de faire de la peine à leur entourage familial", "Le confort que leur procure leur structure familiale", "Le plaisir de voir leur famille comme ils le souhaitent", "L'obligation de soutenir financièrement leur famille"], "a": 1, "k": "On est bien à la maison. Maman et papa prennent soin de tout", "transcript": "À peine a-t-on le temps de s'habituer à être parents que l'on doit préparer nos enfants à devenir autonomes puis à partir. Ce moment où le jeune adulte quitte la maison est difficile.\n– Effectivement, ce moment est difficile tant pour le parent que pour l'enfant. Les adolescents qui ont attendu parfois très longtemps ce temps de liberté, eux-mêmes peuvent se retrouver démunis au moment de franchir la porte de la maison. Aujourd'hui, les jeunes adultes vivent de plus en plus longtemps chez leurs parents.\n– Tout à fait. On invoque des raisons économiques pour rester à la maison plus longtemps. Ceci est lié aussi à une question d'immaturité. On est bien à la maison. Maman et papa prennent soin de tout. Pratique quand même, hein ?", "audio": "CO 33/025.MP3", "_test": "33", "_pos": 25, "_origlabel": "test33#25", "_sources": ["test33#25"]}, {"type": "document", "q": "Question 27. Qu'apprend-on sur l'attitude des jeunes Français face à leur avenir ?", "c": ["Ils espèrent obtenir une allocation de l'Etat.", "Ils voient leur futur de manière positive.", "Ils comptent sur le soutien de leurs proches.", "Ils refusent d'habiter chez leurs parents"], "a": 1, "k": "les jeunes ont plutôt confiance en l'avenir", "transcript": "Comment les jeunes Français envisagent-ils leur avenir ? La réponse est à lire dans le sondage publié aujourd'hui par le tout nouvel observatoire des jeunes et des familles. 1000 jeunes de 18 à 25 ans et 1000 familles ont été interrogés. Première surprise, les jeunes ont plutôt confiance en l'avenir, à 52 %. Et même si les difficultés économiques créent des angoisses, huit sur dix estiment qu'ils obtiendront ce qu'ils veulent. Mais les principaux obstacles seront le travail et le logement.", "audio": "CO 19/027.MP3", "_test": "19", "_pos": 27, "_origlabel": "test19#27", "_sources": ["test19#27", "test33#26"]}, {"type": "document", "q": "Question 26. Quelle relation le père entretenait-il avec sa fille ?", "c": ["Il avait du mal à accepter ses choix.", "Il essayait souvent de rivaliser avec elle.", "Il était attentif à ses centres d'intérêt.", "Il lui interdisait les activités intellectuelles."], "a": 0, "k": "Il s'énervait de me voir à longueur de journée dans les livres", "transcript": "– Quel rapport aviez-vous avec votre père ? Je ne lui parlais plus de mes études. Il avait toujours la peur ou peut-être le désir que je n'y arrive pas. Il s'énervait de me voir à longueur de journée dans les livres. Je crois qu'il pensait que j'étais malheureuse. Comment se comportait-il avec vous face au monde extérieur ? Devant la famille, les clients, de la gêne. Presque de la honte que je ne gagne pas encore ma vie à 17 ans. Il craignait qu'on ne me prenne pour une paresseuse et lui pour un crâneur. Il disait que j'apprenais bien, jamais que je travaillais bien. Quelle était pour lui la définition du mot travail ? Travailler, c'était seulement travailler de ses mains. Quelle relation le père entretenait-il avec sa fille ?", "audio": "CO 35/026.MP3", "_test": "35", "_pos": 26, "_origlabel": "test35#26", "_sources": ["test35#26"]}], "devoirs": [{"type": "document", "q": "Question 27 : Qu'apprend-on sur l'attitude des jeunes Français face à leur avenir ?", "c": ["Ils sont majoritairement pessimistes.", "Ils sont globalement confiants malgré les difficultés.", "Ils ne s'intéressent pas aux questions économiques.", "Ils comptent surtout sur le soutien de leur famille."], "a": 1, "k": "les jeunes ont plutôt confiance en l'avenir", "transcript": "Comment les jeunes Français envisagent-ils leur avenir ? La réponse est à lire dans le sondage publié aujourd'hui par le tout nouvel observatoire des jeunes et des familles. 1 000 jeunes de 18 à 25 ans et 1 000 familles ont été interrogés. 1ère surprise, les jeunes ont plutôt confiance en l'avenir à 52 %, et même si les difficultés économiques, les angoisses, 8 sur 10 estiment qu'ils obtiendront ce qu'ils veulent, mais les principaux obstacles seront le travail et le logement.", "audio": "CO 38/027.MP3", "_test": "38", "_pos": 27, "_origlabel": "test38#27", "_sources": ["test38#27"]}, {"type": "document", "q": "Qu'apprend-on sur cette jeune femme ?", "c": ["Elle a gardé des enfants dans une famille britannique.", "Elle a passé son enfance dans un pays étranger.", "Elle a suivi des études dans un lycée bilingue.", "Elle a travaillé avec une institutrice américaine."], "a": 3, "k": "J'étais l'assistante d'une institutrice dans une école maternelle", "transcript": "— Pouvez-vous me parler de votre expérience aux États-Unis ?\n— Oui, beaucoup. Je suis restée là-bas un an. J'étais l'assistante d'une institutrice dans une école maternelle.\n— C'était votre premier long séjour à l'étranger ?\n— Aussi long, oui, mais je suis déjà partie plusieurs fois en Grande-Bretagne. Nous avons de la famille à Londres.\n— Vous n'avez pas eu de difficultés pour communiquer en anglais ?\n— Non, je suis parfaitement bilingue.", "audio": "CO 40/028.MP3", "_test": "40", "_pos": 28, "_origlabel": "test40#28", "_sources": ["test40#28"]}, {"type": "document", "q": "Question 25. Quels problèmes évoquent les interlocuteurs à propos des enfants ?", "c": ["Ils abusent de repas très caloriques", "Ils consomment peu de produits frais", "Ils ignorent l'origine de leurs plats", "Ils refusent de manger des légumes"], "a": 2, "k": "ne savent pas à quoi ressemble une betterave", "transcript": "87 % des gamins ne savent pas à quoi ressemble une betterave. Un tiers n'ont jamais vu de poireau et un cinquième ne reconnaît pas un abricot. En ce qui concerne les pâtes, 72 % ne savent pas ce qu'il y a dedans. Ça nous parle de nous aujourd'hui. Oui, oui, tout à fait. C'est évidemment un des grands problèmes. Il faut redonner des repères sur les aliments, savoir d'où ils viennent, comment ils poussent, à quoi ça sert. Pour ça, faut emmener les enfants sur les marchés, faire les courses. Il faut leur montrer quand on fait la cuisine, les ingrédients que l'on met. Donc il faut réapprendre la culture alimentaire qui est quand même dans nos traditions en français.", "audio": "CO 12/025.MP3", "_test": "12", "_pos": 25, "_origlabel": "test12#25", "_sources": ["test12#25", "test17#24"]}, {"type": "document", "q": "Pourquoi cette musicienne a-t-elle choisi le violoncelle ?", "c": ["Elle a été habituée très tôt par ses parents à écouter des œuvres pour violoncelle.", "Elle a été impressionnée par le son des cordes qu'on peut faire vibrer longtemps.", "Elle a privilégié un instrument qu'elle pouvait transporter plus facilement qu'un piano.", "Elle a rencontré des amis musiciens de ses parents qui l'ont convaincue."], "a": 1, "k": "je recherchais en fait un instrument avec lequel je puisse faire durer le son", "transcript": "– Ève Pansky, vous êtes musicienne. Est-ce que vous avez toujours voulu jouer du violoncelle ?\n– Quand j'étais petite, il y avait un piano chez des amis sur lequel je pianotais. Ensuite, j'ai essayé le banjo, la guitare — je m'approchais des cordes et je recherchais en fait un instrument avec lequel je puisse faire durer le son. Un jour, je jouais avec mes copains d'école chez moi et j'ai mis un disque au hasard. C'était du violoncelle. Et là, ça m'a totalement aimantée. J'ai arrêté de jouer. J'étais aspirée par ce son.", "audio": "CO 14/024.MP3", "_test": "14", "_pos": 24, "_origlabel": "test14#24", "_sources": ["test14#24"]}, {"type": "document", "q": "Comment la jeune fille a-t-elle passé sa soirée ?", "c": ["Elle est sortie en boîte de nuit.", "Elle a dîné avec sa famille.", "Elle est restée toute seule.", "Elle a vu un mauvais film."], "a": 2, "k": "Alors je suis rentrée. Je me suis couchée.", "transcript": "– Salut Marie. Alors finalement, qu'est-ce que tu as fait samedi soir ?\n– Je n'avais pas le moral. J'étais invitée chez ma sœur. Je n'y suis pas allée.\n– Il y a des amis qui m'ont appelée pour aller danser au dernier moment. Je n'ai pas eu envie.\n– Tu as fait quoi ?\n– Alors finalement, j'ai voulu aller au cinéma. La séance était annulée pour raisons techniques. Alors je suis rentrée. Je me suis couchée.\n– Si j'avais su, je serais venu te chercher. On est allés jouer au bowling. On a passé une super soirée.", "audio": "CO 16/028.MP3", "_test": "16", "_pos": 28, "_origlabel": "test16#28", "_sources": ["test16#28"]}, {"type": "document", "q": "Question 24. De quoi parlent les deux amis ?", "c": ["De conseils pour mieux dormir.", "De difficultés à calmer les enfants.", "De la relation entre fille et mère.", "Des premiers mois d'un bébé."], "a": 3, "k": "elle n'a que trois mois", "transcript": "– Allô ? Salut. C'est Julie. Ça va ? Je voulais prendre des nouvelles et aussi de Sarah. Ça va ?\n– Je suis fatiguée, mais tout se passe bien. Sarah a bien grandi. Elle est très mignonne, mais les nuits sont encore difficiles. Je ne dors pas beaucoup. Et oui, elle n'a que trois mois.\n– Il faut attendre encore un peu. Tu feras moins de nuits difficiles.\n– Mais heureusement, ma mère vient souvent m'aider pendant la journée. Ça me permet de faire une sieste et Sarah adore voir sa grand-mère. Les nuits sont difficiles, mais on y arrivera.\n– Génial. Je viendrai vous voir bientôt.", "audio": "CO 21/024.MP3", "_test": "21", "_pos": 24, "_origlabel": "test21#24", "_sources": ["test21#24"]}, {"type": "document", "q": "Question 25. Quel changement de société est observé dans ce reportage ?", "c": ["Les gens cherchent davantage à être heureux.", "Les gens deviennent de plus en plus égoïstes.", "Les gens se préoccupent moins de leur famille.", "Les gens sont peu demandeurs de sensations."], "a": 0, "k": "il y a le droit au bonheur", "transcript": "Jadis, on mettait plus l'accent sur les devoirs de l'individu, il fallait être un bon père, une bonne mère, etc. Et aujourd'hui, on met beaucoup plus l'accent sur les droits, et parmi ces droits, il y a le droit au bonheur. Et donc ce droit, d'ailleurs, qui est inscrit dans la constitution, dans la déclaration des droits de l'homme, a bien créé petit à petit, oui, une sorte de pression sociale. On l'observe depuis une dizaine d'années et c'est vrai que les gens veulent du coup apprendre à mieux vivre avec leurs émotions qu'ils considèrent d'ailleurs parfois comme encombrantes.", "audio": "CO 21/025.MP3", "_test": "21", "_pos": 25, "_origlabel": "test21#25", "_sources": ["test21#25"]}]}, "Loisirs": {"cours": [{"type": "document", "q": "Que souhaite ce touriste ?", "c": ["Acheter un guide.", "Réserver une table.", "Trouver une chambre.", "Visiter une ville."], "a": 3, "k": "je m'inscris donc au circuit gastronomie", "transcript": "— Bonjour, je suis un client de l'Hôtel Royal, et j'aimerais découvrir Montréal.\n— Le plus simple est de vous inscrire sur une des listes suivantes. Ce sont des itinéraires touristiques dans les différents quartiers. Vous avez le choix entre plusieurs thèmes, comme par exemple : histoire, architecture.\n— D'accord. J'écris donc mon nom et mon numéro de téléphone, c'est bien ça ?\n— Oui. Vous pouvez aussi nous donner votre courriel.\n— Parfait. Je m'inscris donc au circuit gastronomie. À demain !", "audio": "CO1/020.MP3", "_test": "1", "_pos": 20, "_origlabel": "test1#20", "_sources": ["test1#20"]}, {"type": "document", "q": "Question 23. Qu'est-ce qui fait rire la femme ?", "c": ["Que l'homme soit parti seul en vacances.", "Que l'homme ait progressé au golf.", "Que l'homme lui ait envoyé une carte.", "Que l'homme se soit mis à faire du sport."], "a": 3, "k": "Que l'homme se soit mis à faire du sport.", "transcript": "– Allô Denis, c'est Joël. Merci pour ta carte. Alors ces vacances en célibataire, tu es parti tout seul vers du golf, c'est ça ?\n– Oui, j'avais envie de connaître le golf. C'était super. Pas facile mais super.\n– Ah bon ? Mais tu n'es pas vraiment sportif toi ? Le golf, quand j'ai lu ta carte, j'en revenais pas.\n– Non mais j'ai bien l'intention de recommencer. Pas toute l'année hein. Un stage l'été c'est suffisant.\n– Et bien, à ce rythme, tu ne vas pas progresser très vite.\n– Qu'est-ce que tu crois ? Je ne suis pas si mauvais.", "audio": "CO 2/023.MP3", "_test": "2", "_pos": 23, "_origlabel": "test2#23", "_sources": ["test2#23"]}, {"type": "document", "q": "Question 21. Qu'est-ce que Frédéric a trouvé difficile pendant son voyage ?", "c": ["Le comportement des habitants.", "Le sentiment de solitude.", "Les conditions météorologiques.", "Les obstacles linguistiques."], "a": 2, "k": "par 40 degrés à l'ombre", "transcript": "– Alors Frédéric, ce voyage en Inde.\n– Très intéressant, mais c'était dur. J'ai traversé des paysages magnifiques et des régions très pittoresques, mais par 40 degrés à l'ombre. Je ne recommencerai pas. Puis, ce n'est pas vraiment prévu pour un voyage à vélo. Beaucoup de circulation sur les routes et pratiquement pas de voies cyclables. Par contre, l'accueil des gens a été partout très chaleureux.", "audio": "CO 3/021.MP3", "_test": "3", "_pos": 21, "_origlabel": "test3#21", "_sources": ["test3#21"]}, {"type": "document", "q": "Question 24. Qu'apprend-on sur le camping ?", "c": ["Il est de moins en moins populaire.", "Il offre des services de qualité supérieure.", "Il est réservé aux personnes à faibles revenus.", "Il se pratique uniquement en été."], "a": 1, "k": "Il offre des services de qualité supérieure.", "transcript": "Les Français sont de plus en plus nombreux à rechercher les loisirs de plein air et le camping n'est plus seulement choisi pour de simples raisons économiques puisque l'on trouve des terrains 5 étoiles qui proposent même des restaurants gastronomiques et des salles de bain privées. Le mot camping commence d'ailleurs à laisser la place à « hôtellerie de plein air ».", "audio": "CO 34/024.MP3", "_test": "4", "_pos": 24, "_origlabel": "test4#24", "_sources": ["test4#24"]}, {"type": "document", "q": "Qu'apprend-t-on sur Corinne ?", "c": ["Elle est en congé.", "Elle est tombée malade.", "Elle travaille la nuit.", "Elle voyage souvent."], "a": 3, "k": "elle repart pour une conférence au Canada la semaine prochaine", "transcript": "– Stéphane, est-ce que Corinne est rentrée de sa mission au Japon ?\n– Oui, elle était au bureau hier et aujourd'hui, mais elle est très fatiguée.\n– La pauvre, sa mission a été plus difficile que d'habitude.\n– Oui, elle a eu des réunions dans plusieurs villes. Elle n'a pas arrêté de circuler.\n– C'est sympa. Elle a pu découvrir plein de lieux différents.\n– Pas du tout. Elle terminait très tard le soir. Elle devrait prendre des vacances.\n– Impossible. Elle repart pour une conférence au Canada la semaine prochaine.", "audio": "CO 7/021.MP3", "_test": "7", "_pos": 21, "_origlabel": "test7#21", "_sources": ["test7#21", "test17#20"]}, {"type": "document", "q": "En quoi cette plateforme est-elle utile aux femmes qui voyagent ?", "c": ["Elle fournit une carte de lieux dangereux à éviter.", "Elle leur enseigne des techniques d'autodéfense.", "Elle leur permet de se loger en toute sécurité.", "Elle propose une liste de numéros d'urgence."], "a": 2, "k": "une plateforme d'hébergement réservée aux femmes qui hébergent d'autres femmes", "transcript": "Votre chronique s'adresse aux globe-trotteuses ce matin, à toutes les femmes qui parcourent le monde en solitaire. Une toute nouvelle plateforme vient d'être créée exprès pour elles. Et oui, voyager seule a ses avantages, Mathilde, mais peut aussi faire un peu peur quand on est une femme. Du moins, c'est ce qu'a pu constater Christina Boisière, habituée au voyage en solo depuis 17 ans. Son expérience lui a appris que dormir chez l'habitant était la meilleure façon de découvrir la culture d'un pays. Toutefois, cette formule n'est pas forcément de tout repos, pour ne pas dire sans risque. C'est pourquoi elle a eu l'idée de monter une plateforme d'hébergement réservée aux femmes qui hébergent d'autres femmes.", "audio": "CO 7/024.MP3", "_test": "7", "_pos": 24, "_origlabel": "test7#24", "_sources": ["test7#24"]}, {"type": "document", "q": "Question 26. Selon le reportage, que font les touristes pendant les grandes chaleurs ?", "c": ["Ils annulent leurs activités.", "Ils partent à la montagne.", "Ils préfèrent sortir la nuit.", "Ils sortent en train à l'extérieur."], "a": 1, "k": "pendant la nuit, les températures vont de 12 à 15 degrés", "transcript": "Il va faire chaud cette semaine, très chaud. La chaleur va de nouveau être difficile à supporter. Cette situation fait les affaires des professionnels du tourisme de la montagne. Là-bas, pendant la nuit, les températures vont de 12 à 15 degrés, ce qui permet de mieux se reposer. Pendant la journée, il est possible de faire des activités nautiques dans de l'eau bien fraîche. C'est ce dont tout le monde rêve actuellement.", "audio": "CO 9/026.MP3", "_test": "9", "_pos": 26, "_origlabel": "test9#26", "_sources": ["test9#26"]}, {"type": "document", "q": "Qu'apprend-on sur le camping ?", "c": ["Il intéresse très peu les vacanciers", "Il offre des services de qualité supérieure", "Il permet le développement des campagnes", "Il souffre d'une augmentation des tarifs"], "a": 1, "k": "des terrains 5 étoiles qui proposent même des restaurants gastronomiques", "transcript": "Les Français sont de plus en plus nombreux à rechercher les loisirs de plein air. Et le camping n'est plus seulement choisi pour de simples raisons économiques, puisqu'on trouve des terrains 5 étoiles qui proposent même des restaurants gastronomiques et des salles de bain privées. Le mot camping commence d'ailleurs à laisser la place à « hôtellerie de plein air ».", "audio": "CO 29/024.MP3", "_test": "29", "_pos": 24, "_origlabel": "test29#24", "_sources": ["test29#24"]}, {"type": "document", "q": "Que propose la guide aux touristes ?", "c": ["Un tour de la capitale en bus découvert", "Un parcours à pied le long des quais", "Une visite guidée du musée du Louvre", "Une croisière-promenade sur la Seine"], "a": 3, "k": "bienvenue sur le bateau de la société Safrane", "transcript": "Mesdames, messieurs, bienvenue sur le bateau de la société Safrane au service de notre clientèle ukrainienne. Nous allons découvrir ensemble Paris au gré de la Seine. Voici votre programme : de 10h à 12h, nous allons longer les quais et passer sous de nombreux ponts. Nous nous arrêterons devant Notre-Dame de Paris, le musée du Louvre et d'Orsay. Enfin, nous arriverons au Trocadéro. Pour vous remettre de toutes ces émotions, un déjeuner est prévu ici même à 12h30. Un bus viendra vous reprendre à 13h30 pour vous conduire à votre hôtel. Passez un très agréable moment en notre compagnie.", "audio": "CO 29/028.MP3", "_test": "29", "_pos": 28, "_origlabel": "test29#28", "_sources": ["test29#28"]}, {"type": "document", "q": "Que propose cette agence de voyages ?", "c": ["Des circuits respectueux de l'environnement", "Des formules adaptées à chaque client", "Des tarifs plus bas que la concurrence", "Des voyages à caractère humanitaire"], "a": 1, "transcript": "— En quoi votre agence est-elle différente des autres ? — Je cherche à définir les motivations des personnes qui viennent me voir afin de les orienter vers des formules auxquelles ils n'ont pas forcément pensé. En général, ils s'aperçoivent qu'un séjour classique ne coûte pas moins cher qu'un séjour sur mesure.", "k": "orienter vers des formules auxquelles ils n'ont pas forcément pensé", "audio": "CO 30/024.MP3", "_test": "30", "_pos": 24, "_origlabel": "test30#24", "_sources": ["test30#24", "test33#22"]}, {"type": "document", "q": "Pourquoi la femme refuse-t-elle d'aller dans les Laurentides ?", "c": ["Parce qu'elle craint les grosses chaleurs de l'été", "Parce qu'elle pense que les Vaillancourt sont ennuyeux", "Parce qu'elle souhaite changer de destination estivale", "Parce qu'elle trouve les chalets inconfortables"], "a": 2, "transcript": "— Qu'est-ce que tu veux faire pour les prochaines vacances ? Il faut qu'on s'organise. — Ah oui, sinon ce sera difficile de trouver un chalet disponible. J'aimerais bien aller dans les Laurentides. Les Vaillancourt y seront tout le mois d'août. — Ah non ! On y passe tous nos étés depuis 10 ans.", "k": "On y passe tous nos étés depuis 10 ans", "audio": "CO 30/025.MP3", "_test": "30", "_pos": 25, "_origlabel": "test30#25", "_sources": ["test30#25"]}, {"type": "document", "q": "D'après cet intervenant, à quoi peut prétendre le meilleur chasseur d'une communauté ?", "c": ["À un poste de responsable du village.", "À un temps de loisir plus étendu.", "À une place spéciale dans l'histoire.", "À une plus grosse part de nourriture."], "a": 0, "k": "Le meilleur chasseur, c'est celui qui va devenir le chef du village", "transcript": "Le sport aurait commencé, d'après les anthropologues, d'après les historiens, d'abord d'après les archéologues, quand la chasse est devenue un sport. C'est-à-dire quand on a cessé de chasser pour se nourrir, et chasser pour le loisir, chasser pour le symbolique. Le meilleur chasseur, c'est celui qui va devenir le chef du village. Celui qui rapporte le plus de têtes d'animaux, c'est le plus fort physiquement, donc il s'impose symboliquement. Donc, le lien entre la chasse et la guerre est direct. Parce que si on fait encore un autre lien, celui qui est un bon chasseur va être un bon guerrier.", "audio": "CO 31/023.MP3", "_test": "31", "_pos": 23, "_origlabel": "test31#23", "_sources": ["test31#23"]}, {"type": "document", "q": "Question 20. Pourquoi Jean-Paul n'a-t-il pas envie d'aller à la campagne ?", "c": ["Il ne fera pas beau durant le week-end.", "La maison est mal chauffée.", "Le voyage est trop long.", "Il n'aime pas rester enfermé."], "a": 2, "k": "faire tous ces kilomètres pour rester à peine deux jours", "transcript": "– Dis, Jean-Paul, t'as pas l'air d'avoir très envie d'aller à la campagne ce week-end. En tout cas, moi j'ai peur d'avoir froid. Le chauffage marche si mal. Moi, c'est pas ça. Ce qui m'ennuie, c'est de faire tous ces kilomètres pour rester à peine deux jours. Oh, la route, c'est pas grave. Mais la météo n'est pas très bonne. Ça ne me dit rien d'être bloqué tout le week-end dans la maison. Pourquoi Jean-Paul n'a-t-il pas envie d'aller à la campagne ?", "audio": "CO 35/020.MP3", "_test": "35", "_pos": 20, "_origlabel": "test35#20", "_sources": ["test35#20"]}, {"type": "document", "q": "Que propose ce reportage ?", "c": ["D'apprendre à élaborer des itinéraires de visites.", "D'expérimenter une manière différente de voyager.", "De découvrir des adresses d'hôtel à l'étranger.", "De participer à des actions de solidarité internationale."], "a": 1, "k": "Imaginez pouvoir faire le tour du monde sans avoir à payer pour l'hébergement.", "transcript": "Imaginez pouvoir faire le tour du monde sans avoir à payer pour l'hébergement. Imaginez partager des cultures différentes avec des personnes totalement gratuitement. Arrêtez d'imaginer, ça existe depuis 2000. Près de 30 000 personnes l'ont déjà fait à bon marché et hors des services touristiques programmés, grâce à l'hospitalité des membres d'un réseau social qui s'étend sur les cinq continents. Son fondateur, un étudiant de 22 ans, a pour objectif de promouvoir la paix par l'échange interculturel.", "audio": "CO 15/029.MP3", "_test": "15", "_pos": 29, "_origlabel": "test15#29", "_sources": ["test15#29", "test36#29"]}, {"type": "document", "q": "Question 24. Que déplore cet invité concernant les footballeuses ?", "c": ["L'inégalité salariale avec les hommes.", "Le manque de sérieux dans la sélection.", "Les discours discriminants stéréotypés.", "Les rares retransmissions des matchs."], "a": 2, "k": "des remarques sexistes, voire misogynes", "transcript": "La première des choses pour médiatiser les footballeuses de façon appropriée, ce serait de se centrer uniquement sur leur performance sur le terrain, ce qui n'est clairement pas le cas actuellement. On entend régulièrement encore des remarques sexistes, voire misogynes. D'ailleurs, vous parlez de foot féminin et de coupe du monde féminine. Pour moi, c'est déjà un problème que d'aborder cette question de cette façon-là. D'une part parce que quand on dit football féminin, on sous-entend que finalement c'est une autre discipline, un autre football. Parce qu'on ne dit jamais football masculin, comme si c'était la norme, le dogme. Et la deuxième chose c'est que quand on dit football féminin, ça sous-entend encore une fois l'injonction à la féminité.", "audio": "CO 37/024.MP3", "_test": "37", "_pos": 24, "_origlabel": "test37#24", "_sources": ["test37#24"]}, {"type": "document", "q": "Question 21 : Pour quelle raison la fille refuse-t-elle de jouer au volley ?", "c": ["Elle préfère faire de la natation.", "Elle n'aime pas le volley.", "Elle trouve le vent trop fort.", "Elle se sent fatiguée."], "a": 2, "k": "Vous avez vu ce vent, vous n'attraperez jamais le ballon", "transcript": "– Venez, on va faire un volley, et après on ira nager. Tu viens, Véro ? — Mais ce n'est pas possible par ce temps. Vous avez vu ce vent, vous n'attraperez jamais le ballon. — N'exagère pas, ce n'est pas grave. Allez, viens, tu adores ça. — Non, allez-y sans moi, j'aime mieux aller me baigner.", "audio": "CO 38/021.MP3", "_test": "38", "_pos": 21, "_origlabel": "test38#21", "_sources": ["test38#21"]}, {"type": "document", "q": "Quelle est l'intention de cette personne ?", "c": ["Découvrir une région de France.", "Partir vivre sur la Côte d'Azur.", "Rejoindre son épouse dans le Sud.", "Rendre visite à un ami français."], "a": 0, "k": "visiter le sud de la France avec mon épouse", "transcript": "— Bonjour monsieur, puis-je vous renseigner ?\n— Bonjour, je souhaiterais visiter le sud de la France avec mon épouse.\n— Eh bien, nous pouvons vous proposer un séjour sur la Côte d'Azur. Voici la brochure du séjour.\n— Je vais en parler à ma femme et je reviendrai demain.", "audio": "CO 40/024.MP3", "_test": "40", "_pos": 24, "_origlabel": "test40#24", "_sources": ["test40#24"]}, {"type": "document", "q": "Question 25. Selon l'intervenant, qu'est-ce qu'un poète ?", "c": ["Quelqu'un qui invente de nouveaux termes.", "Quelqu'un qui utilise un langage complexe.", "Quelqu'un qui joue avec les sonorités.", "Quelqu'un qui idéalise le monde."], "a": 0, "k": "Le mot signifie créateur, un fabricant.", "transcript": "Vous savez sans doute ce que signifie le mot poète. Le mot poète est apparu assez rapidement, et il désignait une sorte de référent qui parle d'une certaine manière avec un cœur, disons, une imagination. Je ne sais pas… Non, non, le mot ne signifie pas cela. Le mot signifie créateur, un fabricant. C'est ça, le fabricant, le fabricant de langue. Et lorsqu'on parle de fabricant de langue, je pense aux hommes que j'ai vus tout à l'heure. L'un a créé dans le domaine du tourisme, par exemple, et d'autres qui font tout.", "audio": "CO 11/025.MP3", "_test": "11", "_pos": 25, "_origlabel": "test11#25", "_sources": ["test11#25"]}, {"type": "document", "q": "Question 27. D'après son ami, à quoi Didier s'était-il engagé ?", "c": ["Partir en voyage en province", "Acheter les bougies d'anniversaire", "Acheter le cadeau pour leur amie", "S'occuper du gâteau d'anniversaire"], "a": 3, "k": "Tu devais même apporter le dessert", "transcript": "Salut Didier. Tu te souviens qu'on dîne chez Xavier samedi soir ? Mais non, je pars en Normandie avec mon frère. Oh non, pas de Normandie, en fait, l'anniversaire de Martine. Elle serait très déçue que tu ne viennes pas. Ben non, c'était même pas sûr. Arrête. Tu avais promis. Tu devais même apporter le dessert, mais as-tu te débrouilles. On sera 12. Tu choisis un dessert sur lequel on peut mettre 25 bougies. Je m'occupe du cadeau et des bougies. Bon, je vais essayer de, non, non, pas essayer.", "audio": "CO 12/027.MP3", "_test": "12", "_pos": 27, "_origlabel": "test12#27", "_sources": ["test12#27"]}, {"type": "document", "q": "Pourquoi le voyage en Corse est-il impossible le 3 août ?", "c": ["Il n'y a plus de place en seconde classe.", "Il n'y a plus de place pour la voiture.", "Il n'y a plus de place pour quatre personnes.", "Il n'y a plus de cabines pour quatre personnes."], "a": 1, "k": "C'est complet le véhicule.", "transcript": "Monsieur, bonjour. Bonjour. Je voudrais réserver pour la Corse le 3 août au soir, deux adultes, deux enfants, un chien, une voiture et quatre places. Je regrette monsieur, mais pour cette date, ce ne sera pas possible. C'est complet le véhicule. Il y a une possibilité pour le 5 août, mais en cabinet seulement, pas pour le 5, je vous maintenant, non ? Pour lors de l'embarquement, je vous rappelle qu'il faut présenter à la guerre maritime de ce et que le chien devrait être devenu en laisse tout le temps du trajet. C'était quel nom. Serviller. Voilà votre billet. Bon séjour en place. Merci.", "audio": "CO 15/023.MP3", "_test": "15", "_pos": 23, "_origlabel": "test15#23", "_sources": ["test15#23"]}], "devoirs": [{"type": "document", "q": "Que font les touristes pendant les grandes chaleurs ?", "c": ["Ils annulent leurs activités.", "Ils partent à la montagne.", "Ils préfèrent sortir la nuit.", "Ils restent au frais à l'intérieur."], "a": 1, "k": "Cette situation fait les affaires des professionnels du tourisme de la montagne.", "transcript": "Il va faire chaud cette semaine, très chaud. La chaleur va de nouveau être difficile à supporter. Cette situation fait les affaires des professionnels du tourisme de la montagne. Là-bas, pendant la nuit, les températures vont de 12 à 15 degrés, ce qui permet de mieux se reposer. Pendant la journée, il est possible de faire des activités nautiques dans de l'eau bien fraîche. C'est ce dont tout le monde rêve actuellement.", "audio": "CO 15/026.MP3", "_test": "15", "_pos": 26, "_origlabel": "test15#26", "_sources": ["test15#26", "test19#26"]}, {"type": "document", "q": "Question 21. Que dit Théo à propos de ses vacances ?", "c": ["Il était déçu de la durée de ses vacances.", "Il est parti en Espagne avec ses amis.", "Il a séjourné dans un camping en bord de mer.", "Il n'a pas pu partir en vacances d'été."], "a": 2, "k": "on avait réservé dans un camping pas cher près de la plage", "transcript": "– Alors Théo, comment se sont passées tes vacances ?\n– Super. Une semaine, c'était un peu court, mais je suis content.\n– Tu es parti avec tes amis ?\n– Non, au dernier moment, ils ont préféré aller en Espagne. J'ai donc proposé à mon cousin de m'accompagner et il a accepté.\n– Vous avez dormi à l'hôtel ?\n– Non, on avait réservé dans un camping pas cher près de la plage. On a fait de la planche à voile tous les jours.", "audio": "CO 17/021.MP3", "_test": "17", "_pos": 21, "_origlabel": "test17#21", "_sources": ["test17#21"]}, {"type": "document", "q": "Question 28. Quel est le but poursuivi par ce photographe ?", "c": ["Faire découvrir la Riviera à travers ses couleurs et sa lumière.", "Faire connaître l'histoire et la culture de la Côte d'Azur.", "Faire voyager le lecteur dans les paysages de la Riviera.", "Faire apprécier le soleil et la douceur de la Riviera."], "a": 0, "k": "en partant de la lumière au point du jour ou au couchant", "transcript": "– Monsieur Jacquemin, parlez-nous de votre dernier ouvrage.\n– Mon objectif avec ces photos était de mettre en scène les paysages et les villages de la Riviera en partant de la lumière au point du jour ou au couchant et de dérouler la palette qu'offrent les panoramas, les villes et les façades de la Côte d'Azur. Je suis toujours subjugué de voir les roches s'habiller de mauve et les murs de rose dans la douceur des soirs d'été, toujours tenté de faire halte devant les maisons aux enduits chauds de l'ancien comté de Nice. C'est à ce voyage que j'ai voulu inviter le lecteur.\n– Merci pour cette présentation alléchante. Grâce à vos photos, nous redécouvrons ce territoire aux 1000 facettes où le soleil joue le premier rôle.", "audio": "CO 17/028.MP3", "_test": "17", "_pos": 28, "_origlabel": "test17#28", "_sources": ["test17#28"]}, {"type": "document", "q": "Question 20. Pour quelle raison la fille refuse-t-elle de jouer au volley ?", "c": ["Elle veut faire du vélo", "Elle a horreur du volley", "Elle trouve le vent trop fort", "Elle se sent fatiguée"], "a": 2, "k": "Elle trouve le vent trop fort", "transcript": "Vous venez, on va faire un volley. Et après on ira nager. Tu viens, Véro ?\n– Mais ce n'est pas possible. Par ce temps, vous avez vu ce vent. Vous n'attraperez jamais le ballon.\n– N'exagère pas. Ce n'est pas grave. Allez, viens. Tu adores ça.\n– Non, allez-y sans moi. J'aime mieux aller me baigner.", "audio": "CO 18/020.MP3", "_test": "18", "_pos": 20, "_origlabel": "test18#20", "_sources": ["test18#20"]}]}, "Environnement": {"cours": [{"type": "document", "q": "Question 22. Quel est le phénomène évoqué ?", "c": ["La disparition des abeilles à la campagne.", "L'interdiction des pesticides en agriculture.", "La mutation de l'habitat des abeilles.", "La production de miel en ville."], "a": 2, "k": "La mutation de l'habitat des abeilles.", "transcript": "Parmi les victimes de la folie destructrice de l'homme, les abeilles. En cause, l'utilisation dans l'agriculture de pesticides très puissants qui sont des poisons mortels pour les essaims d'abeilles, et conséquence inattendue, c'est finalement en ville que les abeilles finissent par trouver refuge. C'est le monde à l'envers. Aujourd'hui, les abeilles préfèrent la ville à la campagne car sur les toits, l'apiculteur n'a pas à craindre les effets des pesticides. En ville, les abeilles meurent moins vite et elles produisent du miel en grande quantité. Paradoxe assez incroyable, on perd moins d'essaims et les apiculteurs demandent au gouvernement d'interdire tous les pesticides qui peuvent nuire à la santé des abeilles.", "audio": "CO 34/022.MP3", "_test": "4", "_pos": 22, "_origlabel": "test4#22", "_sources": ["test4#22"]}, {"type": "document", "q": "Question 25. Que nous apprend l'intervenante sur l'économie circulaire ?", "c": ["C'est une pratique récente.", "Elle concerne uniquement le secteur alimentaire.", "Elle est coûteuse à mettre en place.", "Elle permet la réduction du gaspillage."], "a": 3, "k": "Elle permet la réduction du gaspillage.", "transcript": "L'économie circulaire, c'est le réemploi, la réparation, le partage, la location et le recyclage des matériaux. Lorsque la matière redevient matière, la boucle, le cercle est bouclé. Et c'est le cas du secteur textile. Depuis 30 ans, l'entreprise Le Relais collecte et trie les vêtements que vous ne voulez plus porter et depuis 30 ans elle fait de l'économie circulaire en fait, sans le savoir, car à l'origine, il s'agissait surtout de réinsérer des personnes en difficulté.", "audio": "CO 34/025.MP3", "_test": "4", "_pos": 25, "_origlabel": "test4#25", "_sources": ["test4#25"]}, {"type": "document", "q": "Qu'est-ce que cette personne cherche à savoir ?", "c": ["Comment protéger ses végétaux.", "Comment recycler son sapin.", "Comment replanter un arbre.", "Comment scier une branche."], "a": 1, "k": "vous sauriez ce que je dois faire de mon arbre de Noël pour qu'il soit ramassé", "transcript": "– Bonjour, je suis nouveau à Charlebourg. Vous sauriez ce que je dois faire de mon arbre de Noël pour qu'il soit ramassé ?\n– Vous n'avez qu'à déneiger devant chez vous et puis le laisser dans la rue. La collecte a lieu demain matin.\n– Il est grand votre arbre ?\n– Regardez, je l'ai mis dans le jardin. Il fait bien 3 m de haut.\n– Alors il faut le couper en deux et aussi enlever tout ce qui est dessus.", "audio": "CO 7/023.MP3", "_test": "7", "_pos": 23, "_origlabel": "test7#23", "_sources": ["test7#23"]}, {"type": "document", "q": "Question 24. De quoi parle le journaliste ?", "c": ["De conservation des plantes.", "De nettoyage d'espaces verts.", "De procédés de recyclage.", "De techniques de culture."], "a": 2, "k": "elles sont triées dans l'usine de méthanisation", "transcript": "Eh bien à Amiens, les aspirateurs des agents de la voirie avalent 500 tonnes de feuilles chaque année. Celles-ci, une fois ramassées, sont d'abord stockées dans plusieurs lieux de la ville, puis elles sont triées dans l'usine de méthanisation Picardie Environnement. Elles ne vont pas toutes subir le même sort. Toutes ne sont pas traitées de la même manière. Les feuilles les plus propres, généralement celles ramassées dans les parcs et jardins, sont transformées en compost.", "audio": "CO 9/024.MP3", "_test": "9", "_pos": 24, "_origlabel": "test9#24", "_sources": ["test9#24", "test39#23"]}, {"type": "document", "q": "Question 27. Qu'apprend-on sur Thierry Gras ?", "c": ["Il commercialise des filets de pêche fabriqués à partir de cheveux.", "Il dénonce la toxicité de certains traitements pour les cheveux.", "Il propose un produit pour protéger les cheveux des particuliers.", "Il récupère les cheveux de ses clients pour nettoyer les océans."], "a": 3, "k": "il va envoyer... sa collecte dans des centres de réinsertion afin qu'elle soit transformée... en barrière anti-pollution", "transcript": "Cette initiative nous emmène dans le Var, où Thierry Gras est coiffeur depuis 30 ans, installé à Saint-Zacharie, à côté d'Aubagne. Cela fait des années qu'il stocke les cheveux qu'il coupe. Dans quelques jours, il va envoyer pour la première fois sa collecte dans des centres de réinsertion afin qu'elle soit transformée, je cite, en barrière anti-pollution. La fibre capillaire aurait comme effet de pouvoir retenir certains polluants comme les huiles solaires ou les hydrocarbures, deux importantes causes de pollution marine. Avec un kilo de cheveux, on peut pomper huit litres de pétrole, annonce le Varois. Ces boudins, une fois réalisés, seront revendus à des ports, à des communautés de communes. Plusieurs d'entre eux se déclarent déjà intéressés.", "audio": "CO 9/027.MP3", "_test": "9", "_pos": 27, "_origlabel": "test9#27", "_sources": ["test9#27"]}, {"type": "document", "q": "Que se passe-t-il dans la région ?", "c": ["Des habitants ont voté pour un maire écologiste", "Les écologistes refusent la construction d'une autoroute", "L'Union européenne veut faire construire une autoroute", "Un maire propose d'ouvrir une réserve naturelle"], "a": 1, "k": "il est obligé d'affronter les écologistes et même l'Union européenne.", "transcript": "– Tu as entendu les informations ? Il paraît que le maire veut faire construire une autoroute qui passe par la réserve naturelle de la région.\n– Ah bon ? Et il va vraiment le faire.\n– Pour l'instant, il est obligé d'affronter les écologistes et même l'Union européenne.", "audio": "CO 10/021.MP3", "_test": "10", "_pos": 21, "_origlabel": "test10#21", "_sources": ["test10#21"]}, {"type": "document", "q": "Que propose le site dans lequel cet intervenant travaille ?", "c": ["Des activités en faveur du développement durable", "Des formations aux nouveaux métiers de l'éducation", "Des sorties équestres pour les écoliers de la région", "Des stages à destination des animateurs jeunesse"], "a": 0, "transcript": "Être éco-éducateur, c'est être à cheval entre l'éducateur et le pédagogue. On va sensibiliser le public aux problématiques environnementales. La plupart du temps, on accueille un public d'enfants ou de scolaires. Ici, au Clos des Blancs Manteaux, notre entrée thématique, c'est l'écologie au quotidien : les éco-gestes, les astuces qu'on peut mettre en place dans notre vie de tous les jours pour participer à la préservation de la planète.", "k": "l'écologie au quotidien", "audio": "CO 30/022.MP3", "_test": "30", "_pos": 22, "_origlabel": "test30#22", "_sources": ["test30#22"]}, {"type": "document", "q": "Que nous apprend l'intervenante sur l'économie circulaire ?", "c": ["Elle a d'abord une vocation caritative.", "Elle concerne une seule branche d'activité.", "Elle est issue d'une initiative régionale.", "Elle permet la réduction du gaspillage."], "a": 0, "k": "il s'agissait surtout de réinsérer des personnes en difficulté", "transcript": "— L'économie circulaire, c'est le réemploi, la réparation, le partage, la location et le recyclage des matériaux. Lorsque la matière redevient matière, la boucle, le cercle est bouclé.\n— Oui, alors, et c'est le cas du secteur textile.\n— En effet, depuis 30 ans, l'entreprise Le Relais collecte et trie les vêtements que vous ne voulez plus porter. Et depuis 30 ans, elle fait de l'économie circulaire, en fait, sans le savoir, car à l'origine, il s'agissait surtout de réinsérer des personnes en difficulté.", "audio": "CO 31/024.MP3", "_test": "31", "_pos": 24, "_origlabel": "test31#24", "_sources": ["test31#24"]}, {"type": "document", "q": "Question 24. Quelle piste est envisagée pour améliorer la production agricole ?", "c": ["Augmenter les espaces de terre cultivables", "Moderniser les machines de production agricole", "Privilégier une agriculture sans produit chimique", "Utiliser des semences génétiquement modifiées"], "a": 2, "k": "recycler les déchets dans le champ pour fertiliser", "transcript": "Les agronomes travaillent beaucoup sur l'agroécologie. Notre modèle est très dépendant du pétrole et du gaz pour les engrais, le transport des denrées, l'énergie pour l'irrigation. Et avec un pétrole qui devient plus rare et plus cher, il s'agit donc de trouver des techniques moins gourmandes, comme l'explique Olivier De Schutter, rapporteur spécial des Nations Unies pour l'alimentation. Dans beaucoup de zones qui ne sont pas encore développées selon les méthodes agro-industrielles de production, il faut effectivement mettre l'accent sur des pratiques agroécologiques qui, par exemple, permettent de recycler les déchets dans le champ pour fertiliser le champ, ou qui permettent de combiner l'agroforesterie avec des cultures alimentaires pour économiser les engrais chimiques grâce à la fertilisation des sols par les arbres.", "audio": "CO 33/024.MP3", "_test": "33", "_pos": 24, "_origlabel": "test33#24", "_sources": ["test33#24"]}, {"type": "document", "q": "Question 28. Quel est le sujet de cette émission ?", "c": ["L'état actuel de la biodiversité.", "L'existence de plantes menaçantes.", "La découverte de nouvelles espèces menacées.", "Le rôle de l'ONU dans la préservation des espèces."], "a": 0, "k": "la biodiversité est aujourd'hui menacée par les activités humaines", "transcript": "S'il est normal que des espèces apparaissent et disparaissent au gré de l'évolution, il est par contre inédit qu'une seule espèce, la nôtre, mette en danger l'existence de l'ensemble du vivant. Les spécialistes sont en effet unanimes pour dire que la biodiversité est aujourd'hui menacée par les activités humaines. Une récente étude britannique estime ainsi qu'une plante sur cinq dans le monde est menacée. L'ONU affirme de son côté que le rythme annuel des disparitions d'espèces est désormais cent fois plus élevé que ce qu'il devrait être naturellement. Il y a donc urgence à réagir pour préserver la vie sur terre et préserver l'existence de notre propre espèce.\nQuel est le sujet de cette émission ?", "audio": "CO 36/028.MP3", "_test": "36", "_pos": 28, "_origlabel": "test36#28", "_sources": ["test36#28"]}, {"type": "document", "q": "Question 29 : Qu'explique la journaliste ?", "c": ["Les déchets abandonnés rendent les pistes très dangereuses.", "Les skieurs contribuent en partie à la pollution des océans.", "Les stations veulent interdire la vente de certains produits.", "Les touristes doivent participer aux opérations de nettoyage."], "a": 1, "k": "sur une plage en Camargue des emballages en plastique", "transcript": "La saison de ski se termine. Les dernières stations encore ouvertes vont fermer ce week-end. Place au nettoyage. Des associations vont organiser des ramassages de déchets car au pied des télésièges, on trouve des choses qui n'ont rien à y faire. Oui, des papiers de barres chocolatées, des canettes, des tubes vides de crème solaire jetés au pied des sapins. Mais avec la fonte des neiges, ces déchets se retrouvent souvent dans un ruisseau qui mène à une rivière qui mène jusqu'à la mer. Donc on peut retrouver sur une plage en Camargue des emballages en plastique jetés depuis un télésiège en Savoie et apportés par le Rhône.", "audio": "CO 37/029.MP3", "_test": "37", "_pos": 29, "_origlabel": "test37#29", "_sources": ["test37#29"]}, {"type": "document", "q": "Question 22 : Que se passe-t-il dans la région ?", "c": ["Les écologistes ont élu un nouveau maire.", "Un projet d'autoroute suscite des oppositions.", "L'Union européenne finance une réserve naturelle.", "Le maire a annulé un projet de construction."], "a": 1, "k": "le maire veut faire construire une autoroute", "transcript": "– Tu as entendu les informations ? Il paraît que le maire veut faire construire une autoroute qui passe par la réserve naturelle de la région. — Ah bon ? Et il va vraiment le faire ? — Pour l'instant, il est obligé d'affronter les écologistes et même l'Union européenne.", "audio": "CO 38/022.MP3", "_test": "38", "_pos": 22, "_origlabel": "test38#22", "_sources": ["test38#22"]}, {"type": "document", "q": "Pourquoi Jeanne évite-t-elle de se baigner ?", "c": ["Elle déteste les bains de mer.", "Elle développe des allergies cutanées.", "Elle est angoissée par le risque de se noyer.", "Elle est terrorisée par les animaux aquatiques."], "a": 3, "k": "je n'ose même pas aller me baigner par peur de ce qu'il y a dans l'eau", "transcript": "– Et vous, Jeanne, avez-vous des phobies ?\n– Peut-être la même que vous, les requins — en réalité, la vie sous-marine dans son ensemble. Parfois, je n'ose même pas aller me baigner par peur de ce qu'il y a dans l'eau.\n– Et si on vous disait qu'il y a des prédateurs dans toutes les mers et même ici au Canada ?\n– J'éviterai les mers et j'irai dans les lacs.\n– Mais la menace est la même dans les lacs, d'autres espèces aquatiques qui grouillent. Ça ne vous gêne pas ?\n– C'est vrai. Je crois que je vais me contenter des piscines.", "audio": "CO 14/022.MP3", "_test": "14", "_pos": 22, "_origlabel": "test14#22", "_sources": ["test14#22"]}, {"type": "document", "q": "Question 26. À quoi aboutit l'initiative collective ?", "c": ["La création de meubles à partir du recyclage.", "La distribution d'emballages non polluants.", "La promotion des marques peu connues.", "L'achat en gros d'aliments labellisés bio."], "a": 0, "k": "en faire des tables ou des bancs en plastique", "transcript": "Une initiative vient de voir le jour. Elle s'appelle Collectif Bio. Oui, c'est un collectif de 13 marques bio qui a mis ce projet sur pied en partenariat avec des magasins spécialisés bio. Il y a des indépendants et des magasins en réseau. Au total, il y a quand même plus de 650 points de collecte implantés en France. En pratique, en fait, vous êtes invités à ramener vos emballages non recyclables en magasin pour les déposer dans des box, pour que l'opérateur recycle ces déchets pour en faire des tables ou des bancs en plastique, par exemple. Alors, on peut même déposer des emballages de marques qui ne sont pas partenaires de cette opération ? Eh oui, absolument, même s'il en a coûté 175 000 € aux 13 pionniers pour rendre possible cette initiative. D'ailleurs, on peut se demander si ça n'aura pas un impact sur le prix des produits.", "audio": "CO 21/026.MP3", "_test": "21", "_pos": 26, "_origlabel": "test21#26", "_sources": ["test21#26"]}, {"type": "document", "q": "Question 21. Que se passe-t-il dans la région ?", "c": ["Des habitants ont voté pour un maire écologiste.", "Les écologistes refusent la construction d'une autoroute.", "Le ministère des Transports veut faire construire une autoroute.", "Un maire propose d'ouvrir une réserve naturelle."], "a": 1, "k": "affronter les écologistes", "transcript": "Femme : Tu as entendu les informations ? Il paraît que le maire veut faire construire une autoroute qui passe par la réserve naturelle de la région.\nHomme : Ah bon ? Et il va vraiment le faire ?\nFemme : Pour l'instant, il est obligé d'affronter les écologistes et même le ministère des transports.", "audio": "CO 25/021.MP3", "_test": "25", "_pos": 21, "_origlabel": "test25#21", "_sources": ["test25#21"]}], "devoirs": []}, "Sante": {"cours": [{"type": "document", "q": "Que doit faire le médecin ?", "c": ["Conseiller des médicaments.", "Établir un certificat médical.", "Examiner une radiographie.", "Traiter un problème de poids."], "a": 1, "k": "j'ai besoin de votre autorisation pour m'inscrire dans un club de sport", "transcript": "— Bonjour docteur. Je voudrais faire de l'escalade, et j'ai besoin de votre autorisation pour m'inscrire dans un club de sport.\n— De l'escalade ? Mais, c'est très mauvais pour votre dos ! Je vous conseille plutôt de faire de la natation.\n— La natation ? Ce n'est pas bon pour ma peau ! Et puis j'adore la montagne.\n— Eh bien, faites plutôt de la randonnée.\n— Ah oui ! La randonnée, c'est une idée. Ça peut m'aider à maigrir.", "audio": "CO1/028.MP3", "_test": "1", "_pos": 28, "_origlabel": "test1#28", "_sources": ["test1#28"]}, {"type": "document", "q": "Quel a été l'élément décisif dans la lutte contre le paludisme dans le village de Thiénaba ?", "c": ["L'obligation d'acheter des moustiquaires.", "La coopération avec les autorités publiques.", "Le recensement des malades par l'association.", "L'implication active de tous les habitants."], "a": 3, "k": "toute la localité s'est mobilisée pour lutter contre le paludisme", "transcript": "— Au coup de sifflet, elles commencent à se rassembler, les femmes de Tienaba avec leurs outils, et la ferme intention de barrer la route aux moustiques. Cela s'appelle une séance de nettoyage. El Hadji Diop, le président de l'association Socé Mouhammed, a de quoi être satisfait. De 3 459 cas de paludisme à Tienaba, il n'y en a aujourd'hui plus que 52. Les habitants se sont organisés en comité de salubrité chargé de mettre en place les séances de nettoyage, mais aussi les séances d'information dans les lieux publics. À force d'être sensibilisée, la population a pris l'habitude d'utiliser les moustiquaires imprégnées, des moustiquaires que certains s'offrent même désormais en cadeau de mariage ou lors d'une naissance. Le véritable succès de cette initiative est que toute la localité s'est mobilisée pour lutter contre le paludisme.", "audio": "CO1/029.MP3", "_test": "1", "_pos": 29, "_origlabel": "test1#29", "_sources": ["test1#29", "test32#29"]}, {"type": "document", "q": "Question 20. Qu'explique Marie à Benjamin ?", "c": ["Elle va assister à un match de rugby.", "Elle va faire une promenade à vélo.", "Elle va passer la soirée à la maison.", "Elle va voir un ami malade à l'hôpital."], "a": 2, "k": "On va rester à la maison ce soir", "transcript": "– Allô Marie, qu'est-ce que vous faites ? On vous attend pour commencer le repas.\n– Ah, Benjamin, excuse-moi, j'ai oublié de t'appeler. On sort juste de l'hôpital. Mathieu a fait une chute de vélo et s'est cassé le bras. On l'a conduit aux urgences et il a été plâtré. On va rester à la maison ce soir, car il n'a pas le moral. Il a sa finale de rugby demain et il ne pourra pas jouer.\n– Ah mince, ne t'inquiète pas. Nous nous verrons un autre jour. Souhaite-lui un bon rétablissement de notre part.", "audio": "CO 3/020.MP3", "_test": "3", "_pos": 20, "_origlabel": "test3#20", "_sources": ["test3#20"]}, {"type": "document", "q": "Question 22. Dans ce dialogue, quelle est l'intention du monsieur ?", "c": ["Il fait des compliments.", "Il formule une invitation.", "Il cherche à convaincre.", "Il donne des conseils."], "a": 2, "k": "il faut y aller", "transcript": "– Tiens, c'est le salon de l'agriculture la semaine prochaine. Il faut que vous y alliez, Françoise. Je suis sûr que vous allez adorer.\n– Vous savez, moi, je n'y connais rien. Ce n'est pas le genre de salon que je fréquente.\n– Vous avez tort. Moi, j'y vais tous les ans. Imaginez la plus grande ferme du monde qui s'installe en plein Paris pour 10 jours.\n– Oui, bien sûr. Mais il y a plein d'autres choses intéressantes à faire à Paris.\n– Oui, bien sûr. Mais il faut y aller. Vous allez voir les animaux, par exemple. C'est incroyable. Vous pourrez les caresser et je ne vous parle pas des spécialités gastronomiques. Un régal !\n– Vous savez, moi, les animaux... Cependant, vous avez éveillé ma curiosité. Mais il faudra venir avec moi.", "audio": "CO 3/022.MP3", "_test": "3", "_pos": 22, "_origlabel": "test3#22", "_sources": ["test3#22", "test23#23"]}, {"type": "document", "q": "Question 20. De quoi traite le reportage de Yann Gallic ?", "c": ["D'un projet de recrutement.", "D'une campagne d'action sociale.", "D'une formation professionnelle.", "D'une opération publicitaire."], "a": 1, "k": "Il offre des soins gratuits aux femmes isolées", "transcript": "Le grand-angle nous emmène ce matin à bord d'un bus transformé en salon de beauté. Il sillonne actuellement les communes rurales et les quartiers défavorisés de l'Île-de-France et de l'Oise. Il offre des soins gratuits aux femmes isolées ou en situation de précarité. Reportage de Yann Gallic à la Ferté-sous-Jouarre, en Seine-et-Marne. Femme de ménage et mère de cinq enfants, Brigitte n'est pas une habituée des salons de beauté, faute de temps et de moyens. Mais aujourd'hui, elle va pouvoir prendre soin d'elle pendant une heure.", "audio": "CO 6/020.MP3", "_test": "6", "_pos": 20, "_origlabel": "test6#20", "_sources": ["test6#20", "test24#20"]}, {"type": "document", "q": "Qu'explique cet arbitre ?", "c": ["Elle a décidé d'adopter une attitude agressive.", "Elle a eu des problèmes pour se faire une place.", "Elle est harcelée par des plaisanteries sexistes.", "Elle est respectée pour son professionnalisme."], "a": 3, "k": "on n'est plus venu me voir comme la femme mais bien comme l'arbitre", "transcript": "J'ai toujours été bien intégrée, que ça soit par les clubs, par les dirigeants ou par les joueurs. L'objectif, c'était de prendre les bonnes décisions. Donc une fois qu'on a vu que j'avais les compétences, voilà, on n'est plus venu me voir comme la femme mais bien comme l'arbitre. Les joueurs ne sont pas forcément surpris parce que ce sont des compétiteurs, donc ce qu'ils veulent, c'est qu'on siffle juste. Après, c'est peut-être souvent, on m'appelle monsieur l'arbitre, mais bon, voilà, c'est plus dans la boutade et on en rigole après sur le terrain. Mais eux, ils veulent qu'on siffle juste, qu'on soit une femme ou un homme.", "audio": "CO 7/026.MP3", "_test": "7", "_pos": 26, "_origlabel": "test7#26", "_sources": ["test7#26"]}, {"type": "document", "q": "Question 28. Quelle conclusion le savant a-t-il tirée en observant les abeilles ?", "c": ["Elles ont la notion du temps chronologique.", "Elles redoutent de s'approcher des humains.", "Elles sont attirées par la lumière du soleil.", "Elles sont un cas à part chez les animaux."], "a": 0, "k": "elles sont quand même venues la chercher à l'heure où on la sert normalement", "transcript": "Et le premier à avoir eu la première indication que les organismes, et en particulier les animaux, avaient une horloge interne, on le doit à un biologiste, un médecin en fait, suisse, qui observait les abeilles en prenant son petit-déjeuner à la terrasse de son chalet. Elles venaient, elles étaient attirées par la confiture, et puis un jour il faisait mauvais, il a pris son petit-déjeuner à l'intérieur. Donc les abeilles ne pouvaient pas sentir la confiture, mais elles sont quand même venues la chercher à l'heure où on la sert normalement. Voilà, donc ça c'est une indication que il y avait pas juste un rythme, mais un mécanisme de mesure du temps.", "audio": "CO 8/028.MP3", "_test": "8", "_pos": 28, "_origlabel": "test8#28", "_sources": ["test8#28"]}, {"type": "document", "q": "Que fait la doctoresse ?", "c": ["Elle conseille une activité physique", "Elle propose un arrêt maladie", "Elle rédige un certificat médical", "Elle remplit une feuille de soins"], "a": 0, "transcript": "— Vous pratiquez un sport ? — Je n'ai plus le temps à cause de mon travail. — C'est dommage. Ça permet de garder une bonne hygiène de vie. Vous devriez essayer de trouver du temps. — D'accord, je vais y réfléchir. — Tenez, voici votre ordonnance. Prenez ces deux médicaments matin et soir pendant huit jours.", "k": "Vous devriez essayer de trouver du temps", "audio": "CO 30/021.MP3", "_test": "30", "_pos": 21, "_origlabel": "test30#21", "_sources": ["test30#21"]}, {"type": "document", "q": "Question 23. En quoi consiste le projet évoqué ?", "c": ["La construction de villes sur l'eau.", "La création d'un lieu de vie sous-marin.", "Le développement de bateaux aménagés.", "L'installation de digues sur les côtes."], "a": 0, "k": "cités flottantes", "transcript": "Si la mer monte beaucoup, ceux qui vivent sur les petites îles, ils vont où ? Ce que je peux dire, c'est qu'il y a des architectes qui réfléchissent déjà à créer des cités flottantes qui seraient autosuffisantes pour accueillir jusqu'à 5000 habitants. Donc c'est un projet qui est un peu utopiste, mais en même temps, on s'est dit, est-ce qu'on ne sera pas amenés à développer ce genre de projet pour accueillir justement les réfugiés climatiques ? En quoi consiste le projet évoqué ?", "audio": "CO 35/023.MP3", "_test": "35", "_pos": 23, "_origlabel": "test35#23", "_sources": ["test35#23"]}, {"type": "document", "q": "Question 26 : Selon l'intervenante, à quoi sont principalement liés les problèmes de santé des coiffeurs ?", "c": ["À l'emploi de produits chimiques.", "Au manque de considération des patrons.", "Aux conversations intimes avec les clients.", "Aux horaires de travail en décalé."], "a": 2, "k": "Une sollicitation émotionnelle trop forte peut les fragiliser", "transcript": "Trois coiffeurs sur quatre déclarent avoir au moins un problème de santé. Alors il y a bien sûr le fait de travailler le dos courbé, la tête penchée, le coude levé. Il y a aussi les produits utilisés, teintures ou autres. Enfin, il y a aussi la charge mentale, comprenez. Les clients, beaucoup, n'hésitent pas à se décharger sur leur coiffeur. Infidélité du conjoint, problème au boulot, maladie incurable ou encore soucis financiers. Les coiffeurs se transforment de plus en plus souvent en psy face à des clients en mal de confident. Et ça a des répercussions sur leur santé, à eux. Une sollicitation émotionnelle trop forte peut les fragiliser. La patronne d'un salon confiant s'y être épuisée à la fin de sa journée, non pas par son travail en tant que tel, mais pour avoir écouté ses clientes.", "audio": "CO 37/026.MP3", "_test": "37", "_pos": 26, "_origlabel": "test37#26", "_sources": ["test37#26"]}, {"type": "document", "q": "Question 27 : Que dit le journaliste sur la lumière artificielle ?", "c": ["Elle assure la sécurité en ville.", "Elle empêche d'admirer le ciel.", "Elle est indispensable à l'organisme.", "Elle est insuffisante à la campagne."], "a": 1, "k": "contempler à nouveau les étoiles", "transcript": "Pourquoi ne pas réclamer le droit au noir, qui permettrait de contempler à nouveau les étoiles, une manière de transporter les villes à la campagne, puisqu'à chaque fois que je suis à la campagne, je suis frappé par la richesse du ciel, et après tout, voir Jupiter, ça vaut bien des paysages. Ce n'est plus à démontrer, la lumière perpétuelle est une agression, c'est une manière de dérégler notre organisme, dit-on, qui a besoin de ne rien voir un moment pour pouvoir voir à d'autres moments. Voilà pourquoi on pourrait songer à demander une extinction des feux, pour toutes les raisons d'ailleurs. Nos plus claires idées sont filles d'un travail obscur, disait Paul Valéry. Alors éteignez les lumières, il ne fait pas encore jour.", "audio": "CO 37/027.MP3", "_test": "37", "_pos": 27, "_origlabel": "test37#27", "_sources": ["test37#27"]}, {"type": "document", "q": "Question 26 : De quoi cette femme accuse-t-elle les entreprises agroalimentaires ?", "c": ["De pratiquer des prix trop élevés.", "De vouloir vendre des produits de mauvaise qualité.", "De polluer l'environnement.", "De ne pas respecter les règles d'hygiène."], "a": 1, "k": "nous voulons des denrées de bonne qualité", "transcript": "– Le Parlement européen a également voté contre certaines pratiques qui peuvent faire peur, je pense notamment à cette colle à viande qui était réclamée par l'industrie agroalimentaire. — Oui, l'industrie agroalimentaire, elle voudrait pouvoir tout vendre comme étant de la viande, et nous sommes arrivés à les en empêcher. Nous avons dit très clairement non, ce n'est pas possible, nous voulons des denrées de bonne qualité.", "audio": "CO 38/026.MP3", "_test": "38", "_pos": 26, "_origlabel": "test38#26", "_sources": ["test38#26"]}, {"c": ["Elle encourage des propos stéréotypés en société.", "Elle masque les inégalités de la société.", "Elle perpétue des usages de la société médiévale.", "Elle reflète une vision sexiste de la société."], "a": 3, "q": "Quel est le point de vue de cette intervenante sur la langue française ?", "transcript": "L'écriture inclusive, le langage inclusif est parfois caricaturé, alors qu'en fait, tout simplement, ça revient à dire que quand on parle d'hommes et de femmes dans un texte, quand dans un discours on s'adresse à des hommes et des femmes, on ne peut pas accorder systématiquement au masculin et invisibiliser complètement les femmes. On dit souvent aujourd'hui de transformer la langue. En fait, il ne s'agit pas de transformer la langue, mais c'est de revenir au fait que les académiciens, les linguistes, progressivement, ont effacé la place des femmes dans l'histoire. La règle selon laquelle le masculin l'emporte sur le féminin n'a pas toujours existé, ça a été instaurée à partir du XVIIe siècle. En fait, c'est au fil du temps qu'on a invisibilisé les femmes dans la langue et que ça a aussi contribué à ce qu'on invisibilise leur place dans l'histoire.", "k": "ont effacé la place des femmes dans l'histoire", "type": "document", "audio": "CO 39/027.MP3", "_test": "39", "_pos": 27, "_origlabel": "test39#27", "_sources": ["test39#27"]}, {"c": ["Aider les consommateurs à mieux acheter.", "Faire la publicité des produits biologiques.", "Garantir l'origine de certains aliments.", "Identifier les emballages recyclables."], "a": 0, "q": "Quelle est la fonction de ce logo ?", "transcript": "Retour sur le Nutri-Score. Vous savez, c'est ce logo qui est apposé sur les produits alimentaires. Il y a tout juste un an, l'arrêté qui recommande son utilisation a été signé en grande pompe au ministère de la Santé. Une étude qui vient d'être réalisée dans 12 pays vient de prouver qu'il est le meilleur logo, le plus efficace parmi les cinq testés. C'est en fait celui qui permet d'orienter le plus facilement les consommateurs vers des aliments de meilleure qualité nutritionnelle. Concrètement, c'est un logo à cinq couleurs qui est apposé sur la face avant des emballages avec une lettre associée. Cela va de la lettre A sur fond vert pour les aliments d'excellente qualité nutritionnelle à la lettre E sur fond rouge pour les plus mauvais.", "k": "orienter le plus facilement les consommateurs vers des aliments de meilleure qualité nutritionnelle", "type": "document", "audio": "CO 39/028.MP3", "_test": "39", "_pos": 28, "_origlabel": "test39#28", "_sources": ["test39#28"]}, {"type": "document", "q": "Question 20. Qu'apprend-on selon lui ?", "c": ["Il a besoin de beaucoup de sommeil.", "Il déteste tous les types de sport.", "Il travaille pour plusieurs entreprises.", "Il va souvent danser en discothèque."], "a": 2, "k": "vous êtes cuisinier le jour et vous travaillez dans une discothèque la nuit", "transcript": "Rémi, vous avez deux activités. Ce n'est pas trop difficile ? Non, ça va, vous savez, 35h, ce n'est pas pour moi. Alors vous êtes cuisinier le jour et vous travaillez dans une discothèque la nuit. Vous arrivez à tout faire sans problème ? Oui, mais je dois préciser que pour me sentir bien, quatre heures de sommeil suffisent et je fais du sport dès que je peux.", "audio": "CO 11/020.MP3", "_test": "11", "_pos": 20, "_origlabel": "test11#20", "_sources": ["test11#20"]}, {"type": "document", "q": "Question 21. Que recommande Cédric Oriol pour développer la consommation d'insectes en Europe ?", "c": ["Des déclarations rassurantes des autorités sanitaires.", "Des études de spécialistes sur leur apport nutritionnel.", "L'implication des professionnels de la gastronomie.", "Une mise en valeur par les producteurs eux-mêmes."], "a": 2, "k": "des chefs vont être capables d'adapter les insectes à la cuisine européenne", "transcript": "C'est que justement, micro, vous élevez deux types d'insectes. Qu'est-ce que vous pensez de ces chefs qui, justement, se mettent à introduire ces insectes dans leur menu ? Alors moi, déjà, je pense que c'est très intéressant que des chefs commencent à réfléchir sur comment pouvoir incorporer des insectes dans l'alimentation des Européens. La condition, c'est que les insectes comestibles aient du sens pour entrer dans l'alimentation des Européens et qu'on ne puisse pas les consommer comme on les consomme par ailleurs, en Asie, en Afrique, en Amérique du Sud, où vraiment des créatifs, des chefs vont être capables d'adapter les insectes à la cuisine européenne.", "audio": "CO 11/021.MP3", "_test": "11", "_pos": 21, "_origlabel": "test11#21", "_sources": ["test11#21"]}, {"type": "document", "q": "Question 20. Qu'est-ce que le commerçant accepte de prendre ?", "c": ["L'affiche", "Le carton", "Les billets", "Les jouets"], "a": 0, "k": "Je vais la mettre sur la porte", "transcript": "Bonjour monsieur. Vous voulez bien accrocher cette affiche dans votre magasin ? Mon école organise une collecte de jouets pour financer notre voyage en Europe. On organisera ensuite une tombola, les billets seront vendus à deux euros. C'est une très bonne idée. Je vais la mettre sur la porte ou est-ce que les gens doivent déposer les jeux qu'ils veulent donner dans un coin de votre boutique ? Si ça vous dérange pas, je peux vous laisser ce carton. J'ai pas tellement de place pour le carton. Demander à la pharmacie juste à côté.", "audio": "CO 12/020.MP3", "_test": "12", "_pos": 20, "_origlabel": "test12#20", "_sources": ["test12#20"]}, {"type": "document", "q": "Quelles conclusions le savant a-t-il tirées en observant les abeilles ?", "c": ["Elles ont la notion du temps chronologique.", "Elles redoutent de s'approcher des humains.", "Elles sont attirées par la lumière du soleil.", "Elles sont un cas à part chez les animaux."], "a": 0, "k": "elles sont quand même venues la chercher à l'heure habituelle", "transcript": "Elle est la première indication que les organismes, et en particulier les animaux, avaient une horloge interne. On doit cela à un biologiste — en fait un médecin suisse — qui observait les abeilles pendant son petit déjeuner à la terrasse de son chalet. Elles venaient, elles étaient attirées par la confiture. Et puis un jour, il faisait mauvais. Il a pris son petit déjeuner à l'intérieur. Donc les abeilles ne pouvaient pas sentir la confiture, mais elles sont quand même venues la chercher à l'heure habituelle. C'est une indication qu'il y avait non seulement un rythme, mais un mécanisme de mesure du temps.", "audio": "CO 14/028.MP3", "_test": "14", "_pos": 28, "_origlabel": "test14#28", "_sources": ["test14#28"]}, {"type": "document", "q": "Quel est l'objectif de ces deux scientifiques ?", "c": ["Augmenter le nombre des surfaces exploitables.", "Développer la production des fruits et légumes.", "Diffuser des procédés en accord avec la nature.", "Introduire la plantation de nouvelles espèces."], "a": 2, "k": "invitent les paysans à mieux connaître leur champ ou leur vigne et à les travailler autrement", "transcript": "– Souvent, on les surnomme « les médecins de la terre ». Claude et Lydia Bourguignon auscultent les sols. Ils tentent de leur rendre la santé.\n– Quand les méthodes agressives de l'agriculture intensive ont fortement abîmé les terres cultivables au point, parfois, de faire disparaître toute trace de vie, engrais chimiques et pesticides ne sont pas les amis de ce couple de scientifiques.\n– Claude et Lydia Bourguignon invitent les paysans à mieux connaître leur champ ou leur vigne et à les travailler autrement sans pour autant compromettre les rendements.\n– De cette révolution verte qu'ils défendent dépend, selon eux, la qualité de l'offre faite aux consommateurs, ainsi que la survie des agriculteurs et des terres qu'ils cultivent.", "audio": "CO 16/025.MP3", "_test": "16", "_pos": 25, "_origlabel": "test16#25", "_sources": ["test16#25"]}, {"type": "document", "q": "Question 26. Qu'est-ce que ce médecin retire de l'exercice de sa profession ?", "c": ["La préférence pour les mathématiques et les sciences.", "Un choix de carrière dicté par l'influence de son grand-père.", "Un rapprochement avec les gens dans des moments difficiles.", "Des regrets constants concernant son métier de médecin."], "a": 2, "k": "un métier qui m'a rapproché beaucoup des gens", "transcript": "– Moi, je n'ai pas été quelqu'un qui avait une vocation médicale. C'est arrivé très tard. J'aimais mieux les séances, les mathématiques, des trucs comme ça. Je n'ai pas d'environnement direct. Je n'avais pas ce moment-là des médecins, avec mon grand-père qui était médecin. Et donc ça a été un choix presque au hasard, la médecine pour moi. Mais c'est vrai que c'est un métier qui m'a rapproché beaucoup des gens parce qu'on est très, très près des gens, surtout à l'urgence, dans la douleur, dans la mort, dans ces trucs-là. Et je dirais que ça m'a aidé moi-même à me rapprocher de moi-même, d'être toujours en contact avec des gens. C'est assez différent d'être en contact avec moi, des mathématiques ou des livres. Et oui, je pense que c'est un métier que j'ai jamais regretté. J'ai jamais regretté le choix, une seconde.", "audio": "CO 17/026.MP3", "_test": "17", "_pos": 26, "_origlabel": "test17#26", "_sources": ["test17#26"]}], "devoirs": [{"type": "document", "q": "Question 24. Selon cette personne, qu'est-ce qui caractérise une structure médicale de bonne qualité ?", "c": ["La qualité de l'accueil des visiteurs et des familles.", "Le souci du bien-être des personnes hospitalisées.", "La capacité d'adaptation du personnel médical.", "La prise en charge personnalisée en fonction de l'âge."], "a": 1, "k": "un grand respect du sujet plutôt que de sa maladie", "transcript": "Je crois que l'enjeu de cette maison, c'est que ça déborde. Je crois vraiment que le côté de l'adolescence, c'est peut-être quelque chose où l'on fait du théâtre, de la musique, avec des soignants différents, des parents présents, un espace de circulation ouvert, vitré et transparent, avec de jolies couettes, de jolis meubles, de jolis espaces et un grand respect du sujet plutôt que de sa maladie. Comme si on attaquait la maladie, mais en respectant le patient.", "audio": "CO 23/024.MP3", "_test": "23", "_pos": 24, "_origlabel": "test23#24", "_sources": ["test23#24"]}, {"type": "document", "q": "Question 23. Pourquoi la patiente consulte-t-elle le médecin ?", "c": ["Parce qu'elle a toujours très faim.", "Parce qu'elle est surmenée et stressée.", "Parce qu'elle souffre et qu'elle est fatiguée.", "Parce qu'elle veut perdre du poids."], "a": 2, "k": "mal au ventre", "transcript": "Patiente : Docteur, je ne sais pas ce que j'ai. J'ai très mal au ventre et il est tout gonflé. Je me sens épuisée. Pourtant, je rentre de vacances et jusqu'à présent je me sentais en forme.\nMédecin : Allongez-vous, je vais prendre votre tension. Bon, tout est normal. Je pense que c'est juste un problème de digestion, peut-être des repas trop lourds.\nPatiente : Alors ce n'est pas grave docteur ? Je peux manger tout ce que je veux ?\nMédecin : Il faut faire attention pendant quelques jours. Il va falloir maigrir un peu.", "audio": "CO 25/023.MP3", "_test": "25", "_pos": 23, "_origlabel": "test25#23", "_sources": ["test25#23"]}, {"type": "document", "q": "Question 20 : Quel est l'objectif de ce programme ?", "c": ["Renforcer la lutte contre le changement climatique", "Améliorer l'accès aux soins de santé", "Faciliter l'intégration des immigrants", "Promouvoir le travail de la femme"], "a": 2, "k": "contacter les immigrants installés ici au Québec", "transcript": "Je suis agent de recrutement, en fait je suis chargé de projet de démarchage en francisation. Ce projet vise à contacter les immigrants installés ici au Québec depuis 3 ans et plus et qui ont besoin de connaître la langue pour faciliter leur vie quotidienne. Notre rôle c'est de contacter les personnes isolées, par exemple les femmes qui, à cause des charges familiales, n'ont pas eu l'occasion d'apprendre le français dès leur arrivée.", "audio": "CO 26/020.MP3", "_test": "26", "_pos": 20, "_origlabel": "test26#20", "_sources": ["test26#20"]}, {"type": "document", "q": "Question 29 : Pour quelles raisons le stress peut-il être bénéfique ?", "c": ["Il améliore significativement la condition physique", "Il donne de l'énergie pour faire face aux épreuves", "Il fait naître un fort sentiment de confiance en soi", "Il renforce les compétences professionnelles"], "a": 1, "k": "Le stress est source de motivation", "transcript": "Indispensable pour réussir les challenges et autres défis de la vie. Un excès de stress engendre la contre-productivité et la frustration mais active d'autres. Le stress est source de motivation et c'est la condition pour devenir meilleur. Si le stress est vécu comme un défi à surmonter, il devient un puissant stimulant. Les sportifs de haut niveau le savent, parce qu'ils réussissent leur performance grâce à ce stress qu'ils arrivent à exploiter de façon positive.", "audio": "CO 26/029.MP3", "_test": "26", "_pos": 29, "_origlabel": "test26#29", "_sources": ["test26#29"]}]}, "Technologie": {"cours": [{"type": "document", "q": "Question 21. Pourquoi le client n'obtient-il pas le transfert de sa ligne téléphonique ?", "c": ["Le promoteur a oublié de prévenir la compagnie de téléphone.", "Le réseau téléphonique du nouvel immeuble est déjà saturé.", "Les travaux nécessaires ne sont pas encore achevés.", "La compagnie de téléphone manque de personnel pour le faire."], "a": 2, "k": "Les travaux nécessaires ne sont pas encore achevés.", "transcript": "– Bonjour monsieur, je viens transférer ma ligne téléphonique. J'emménage demain dans les logements neufs de la rue du Pradau.\n– Oh là là, ça ne sera pas fini avant 26 jours. Les drapeaux ne sont pas encore terminés. Le promoteur a eu du retard. Nous attendons son autorisation pour installer le réseau.\n– 10 jours. Mais comment je fais sans téléphone ? Moi, j'en ai besoin pour mon travail.\n– Je suis désolé monsieur, mais vous n'êtes pas le seul dans ce cas et on ne peut pas aller plus vite que les travaux.", "audio": "CO 2/021.MP3", "_test": "2", "_pos": 21, "_origlabel": "test2#21", "_sources": ["test2#21"]}, {"type": "document", "q": "Question 22. Quelle est la réaction de la femme ?", "c": ["Elle accepte de garder le chien.", "Elle refuse de garder le chien.", "Elle propose de trouver une autre solution.", "Elle demande des excuses."], "a": 1, "k": "Ell
