<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF CO · NCLC 6 (20–29) · 9 thèmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:52px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#185FA5;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#185FA5;color:#185FA5;font-weight:600;background:#fff}
.btn-results:hover{background:#e6f1fb}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{display:inline-block;background:#E6F1FB;color:#0C447C;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem;font-weight:500}
.src-label{display:inline-block;background:#f0f0f0;color:#666;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
.img-wrap{text-align:center;margin-bottom:1rem}
.img-wrap img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid #e0ddd5}
.audio-row{display:flex;align-items:center;gap:10px;background:#f0f6fe;border:1px solid #B5D4F4;border-radius:8px;padding:.65rem 1rem;margin-bottom:1rem}
.play-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid #185FA5;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:background .15s}
.play-btn:hover{background:#e6f1fb}
.audio-label{flex:1;font-size:13px;color:#185FA5;font-weight:500}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong):not(.disabled){background:#f5f4f0}
.choice.disabled{cursor:default}
.choice .badge{font-weight:700;min-width:22px;flex-shrink:0;color:#185FA5;font-size:15px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.correct .badge{color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.wrong .badge{color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.transcript-box{background:#f0f6fe;border:1px solid #B5D4F4;border-radius:0 0 8px 8px;padding:.9rem 1.1rem;font-size:13.5px;line-height:1.85;color:#1a1a1a;font-style:italic}
.transcript-box mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.5rem}
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#185FA5}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:8px 18px;border-radius:8px;border:1px solid #B5D4F4;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#185FA5}
.sum-btn:hover{background:#e6f1fb}
.sum-btn.red{border-color:#F0997B;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-btn.pdf{border-color:#639922;color:#3B6D11;background:#EAF3DE}
.sum-btn.pdf:hover{background:#c0dd97}
.sum-note{font-size:11px;color:#aaa;margin-top:.75rem}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.report-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.qnum{font-size:13px;font-weight:700;color:#185FA5;margin-bottom:.6rem}
.report-choice{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:5px}
.report-choice.neutral{background:#f5f4f0}
.report-choice.correct{background:#E1F5EE;color:#085041;font-weight:600}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C}
/* level select screen */
.level-select{display:flex;flex-direction:column;gap:10px}
.level-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s}
.level-card:hover{border-color:#185FA5;background:#f0f6fe}
.level-name{font-size:20px;font-weight:700;color:#185FA5;min-width:48px}
.level-desc{flex:1;font-size:13px;color:#555;padding:0 10px}
.level-count{font-size:12px;color:#888;white-space:nowrap}
@media print {
  body{background:#fff;padding:0}
  #app{max-width:100%}
  .nav,.sum-actions,.prog-bar,.prog-labels{display:none!important}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid;margin-bottom:.5rem;padding:.75rem}
  .summary{border:none}
  .grid-btn{width:28px;height:28px;font-size:10px}
  .print-section{display:block!important}
  .no-print{display:none!important}
}
.print-section{display:none}
.fs-btn{position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:9px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.10);transition:background .15s,border-color .15s}
.fs-btn:hover{background:#f5f4f0;border-color:#185FA5}
@media print{.fs-btn{display:none!important}}

/* ── ZOOM BAR (added) ── */
.zoombar{display:flex;align-items:center;justify-content:center;gap:.55rem;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:.55rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.zoombar .zlabel{font-size:12px;font-weight:600;color:#0C447C}
.zoombar input[type=range]{-webkit-appearance:none;appearance:none;width:180px;max-width:55vw;height:4px;border-radius:2px;background:#dfe6ec;outline:none;cursor:pointer;accent-color:#185FA5}
.zoombar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#185FA5;cursor:pointer}
.zoombar input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#185FA5;border:none;cursor:pointer}
.zoombar .zval{font-size:12px;font-weight:700;color:#0C447C;min-width:42px;text-align:center}
.zoombar .zbtn{width:26px;height:26px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#0C447C;line-height:1;display:flex;align-items:center;justify-content:center}
.zoombar .zbtn:hover{background:#f5f4f0}
#zoomStage{transform-origin:top center;transition:transform .12s ease}
/* ── QUESTION JUMP BUTTONS (added) ── */
.qjump{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;padding:.55rem .7rem;margin-bottom:.85rem}
.qjump .qjlabel{width:100%;font-size:11px;color:#888;margin-bottom:2px}
.qjump .qj{min-width:30px;height:30px;padding:0 4px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555}
.qjump .qj:hover{background:#f5f4f0}
.qjump .qj.current{background:#0C447C;border-color:#0C447C;color:#fff}
.qjump .qj.answered{border-color:#185FA5;color:#0C447C}
.qjump .qj.answered.current{color:#fff}
@media print{.zoombar,.qjump{display:none!important}}

.theme-select{display:flex;flex-direction:column;gap:12px}
.theme-card{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:12px;padding:1rem 1.1rem}
.theme-head{display:flex;align-items:center;gap:12px;margin-bottom:.7rem}
.theme-emo{font-size:26px;line-height:1}
.theme-name{font-size:18px;font-weight:700;color:var(--tc,#2E8B62)}
.theme-desc{font-size:12.5px;color:#666;margin-top:2px}
.theme-actions{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#444}
.tbtn:hover{background:#f5f4f0;border-color:var(--tc,#2E8B62)}
.tbtn-cours{border-color:#BFE6D3;color:#0F5C3E;background:#F0FAF5}
.tbtn-cours:hover{background:#dcf3e8}
.tbtn-voc{border-color:#FCD34D;color:#92400E;background:#FEF9EC}
.tbtn-voc:hover{background:#fdf0cf}
.lvl-banner{background:linear-gradient(90deg,#0F5C3E,#2E8B62);color:#fff;border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-size:13.5px;font-weight:600;letter-spacing:.3px}
.voc-intro{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:10px;padding:.8rem 1rem;font-size:13.5px;color:#333;margin-bottom:1rem;line-height:1.6}
.voc-list{display:flex;flex-direction:column;gap:9px}
.voc-item{background:#fff;border:1px solid #e0ddd5;border-left:4px solid var(--tc,#2E8B62);border-radius:10px;padding:.75rem .95rem}
.voc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.voc-term{font-size:15.5px;font-weight:700;color:#1a1a1a}
.voc-en{font-size:13px;color:#777;margin:3px 0 6px;font-style:italic}
.voc-ex{font-size:14px;color:#0F5C3E;background:#F5FAF7;border-radius:7px;padding:7px 10px;line-height:1.55}
.voc-tag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.voc-tag.ee{background:#E8EEFF;color:#274690}
.voc-tag.eo{background:#FDE8EF;color:#9B1B47}
.voc-tag.both{background:#E1F5EE;color:#0F6E56}
@media print{.voc-ex,.voc-tag,.lvl-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
<script>
(function(){
  var b=document.getElementById('fsBtn');
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
  b.addEventListener('click',function(){
    if(!fsEl()){
      var el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }
  });
  function upd(){
    var on=!!fsEl();
    b.textContent=on?'✕':'⛶';
    b.title=on?'Quitter le plein écran':'Plein écran';
  }
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<script type="application/json" id="qdata">{"Culture": {"cours": [{"type": "document", "q": "Question 27. Quel est le point commun entre l'écrivain et le réalisateur ?", "c": ["Leur intérêt pour les méthodes minimalistes.", "Leur participation à la même émission de radio.", "Leur processus créatif pour développer des projets.", "Les avis qu'ils partagent au sujet de l'école."], "a": 3, "k": "Les avis qu'ils partagent au sujet de l'école.", "transcript": "– Comment est né votre film ?\n– Ça faisait longtemps que je voulais faire un film sur l'école. Rester entre les murs et montrer par des moments d'école ce que vivent les élèves. Le jour de la sortie de mon précédent film, j'ai participé à une émission de radio à laquelle était également invité François Rufus qui venait de sortir son livre. Et au cours de l'émission, je me suis aperçu qu'il traitait tous les thèmes que je voulais aborder de la manière dont je voulais le faire, sans sortir du collège avec une démarche minimaliste et très descriptive. Dans l'ascenseur, je lui ai demandé s'il était intéressé par une adaptation. Il m'a donné son livre et 3 jours après, je signais.", "audio": "CO 2/027.MP3", "_test": "2", "_pos": 27, "_origlabel": "test2#27", "_sources": ["test2#27"]}, {"type": "document", "q": "Question 26. Pourquoi le visiteur ne peut-il pas accéder à cette salle du musée ?", "c": ["Parce que la salle est en travaux aujourd'hui.", "Parce qu'un vol a eu lieu dans cette salle.", "Parce que le personnel procède au nettoyage.", "Parce qu'il manque du personnel aujourd'hui."], "a": 3, "k": "nous ne sommes pas assez nombreux", "transcript": "– Bonjour. Monsieur, vous voyez bien qu'il y a une barrière. Vous ne pouvez pas aller voir ces tableaux-là. En plus, il y a une alarme qui peut se mettre à sonner.\n– Oui, mais je ne voulais rien voler. Excusez-moi. Habituellement, on peut visiter cette salle. Vous êtes en train de la refaire ?\n– Non, non. Mais aujourd'hui, nous ne sommes pas assez nombreux pour ouvrir toutes les salles. Il y a une épidémie de grippe.\n– Ah, très bien. Je comprends mieux. Mais au moins, il n'y aura pas besoin d'y faire le ménage aujourd'hui.", "audio": "CO 3/026.MP3", "_test": "3", "_pos": 26, "_origlabel": "test3#26", "_sources": ["test3#26"]}, {"type": "document", "q": "Question 20. Quel est le projet de Régis Olives et de ses élèves ?", "c": ["Interviewer un réalisateur.", "Participer à un festival.", "Tourner un film.", "Visiter des studios de cinéma."], "a": 2, "k": "participer à la réalisation d'un film", "transcript": "– Régis Olives. Bonjour, bonjour. Bonjour Régis, vous lancez une aventure à vos lycéens dans une aventure assez incroyable qui est de participer à la réalisation d'un film, un film avec un réalisateur professionnel avec des professionnels du cinéma. Et il s'appelle François Chailloux.\n– Oui, à l'occasion du festival de Luchon, j'ai rencontré François. J'ai dit que je voulais faire un film.", "audio": "CO 5/020.MP3", "_test": "5", "_pos": 20, "_origlabel": "test5#20", "_sources": ["test5#20", "test36#21"]}, {"type": "document", "q": "Question 21. Qu'apprend-on sur le peintre Pierre Soulage ?", "c": ["C'est un artiste oublié par le public.", "Il a travaillé avec des couleurs claires.", "On lui a demandé de décorer un bâtiment.", "Son œuvre est présentée en France."], "a": 3, "k": "célébré dans son pays au musée d'art moderne de Paris", "transcript": "Bienvenue dans notre émission culturelle. Le peintre Soulage, connu mondialement et célébré dans son pays au musée d'art moderne de Paris. L'exposition s'appelle Noire Lumière parce que le noir de Soulage ne ressemble à aucun autre.", "audio": "CO 5/021.MP3", "_test": "5", "_pos": 21, "_origlabel": "test5#21", "_sources": ["test5#21"]}, {"type": "document", "q": "Question 27. Selon Marie Nicole Lemieux, quelle est la spécificité du français qu'elle parle ?", "c": ["Il est caractérisé par son rythme.", "Il est protégé par des apports lexicaux variés.", "Il est protégé par les académiciens.", "Il est utilisé par une minorité de locuteurs."], "a": 1, "k": "j'ai la richesse de tout le patrimoine québécois", "transcript": "– Bonjour Marie Nicole Lemieux.\n– Bonjour, merci beaucoup d'être avec nous. Ça me fait très plaisir.\n– D'abord, quel français est-ce que vous parlez, vous ?\n– C'est un français que j'espère être international. Donc, vous êtes capable de me comprendre et déjà ça. Mais disons aussi que j'ai la richesse de tout le patrimoine québécois qui contient évidemment des mots anciens, très anciens qu'on a gardés, comme là, présentement, nous ne discutons pas, nous jasons. Et puis, et puis aussi d'anglicismes. Le régime britannique a vraiment teinté aussi notre français.", "audio": "CO 5/027.MP3", "_test": "5", "_pos": 27, "_origlabel": "test5#27", "_sources": ["test5#27"]}, {"type": "document", "q": "Question 20. Qu'est-ce que Maë va faire ce soir ?", "c": ["Manger au restaurant.", "Regarder un film.", "Rester à la maison.", "Voir un spectacle."], "a": 2, "k": "La pièce finit trop tard. Je leur ai proposé le cinéma mais c'est trop loin.", "transcript": "– Salut Maë. Alors, tu vas au théâtre avec tes parents ce soir ?\n– Non, finalement nous n'y allons pas.\n– Ah bon ? Pourquoi ?\n– Bah, ils ont changé d'avis. La pièce finit trop tard. Je leur ai proposé le cinéma mais c'est trop loin.", "audio": "CO 8/020.MP3", "_test": "8", "_pos": 20, "_origlabel": "test8#20", "_sources": ["test8#20", "test37#20"]}, {"type": "document", "q": "Question 27. Qu'apprend-t-on au sujet de cet écrivain ?", "c": ["Il a eu conscience de son talent tôt.", "Il édite des œuvres pour la jeunesse.", "Il pratique son art depuis l'enfance.", "Il rédige des manuels de jardinage."], "a": 2, "k": "tout petit garçon et toute petite fille qui rentrait chez elle ou chez lui écrivait des histoires", "transcript": "À partir de là, vous n'avez jamais arrêté d'écrire.\n– Oui, je n'ai jamais arrêté d'écrire et en même temps, ça m'a fait me rendre compte véritablement que j'étais écrivain. Moi, j'étais absolument persuadé pendant très très longtemps que tout petit garçon et toute petite fille qui rentrait chez elle ou chez lui écrivait des histoires, puisque c'était ce que je faisais. J'ai l'impression que je suis écrivain comme le pommier fait des pommes, quoi. C'est très très naturel. Tout le monde avait compris que j'étais écrivain sauf moi.", "audio": "CO 8/027.MP3", "_test": "8", "_pos": 27, "_origlabel": "test8#27", "_sources": ["test8#27", "test21#27"]}, {"type": "document", "q": "Question 21. De quoi parlent ces personnes ?", "c": ["D'un projet de voyage.", "D'un changement de travail.", "D'un futur déménagement.", "D'une sortie au cinéma."], "a": 0, "k": "je vais voir mon patron demain. Je lui demanderai si je peux prendre des vacances", "transcript": "– Salut, ça va ?\n– Ça va. Mais mon petit ami est parti pour trois mois pour réaliser un documentaire sur la Gaspésie, une région assez sauvage du Québec.\n– Ah oui, je connais, quelle chance ! J'adorerais y retourner. Et tu vas y aller aussi ?\n– J'aimerais bien, mais j'ai des missions prévues prochainement. Mais bon, je vais voir mon patron demain. Je lui demanderai si je peux prendre des vacances.\n– Bonne chance. Tu m'écriras pour me raconter ton expérience là-bas et préviens-moi quand le film sortira.", "audio": "CO 9/021.MP3", "_test": "9", "_pos": 21, "_origlabel": "test9#21", "_sources": ["test9#21"]}, {"type": "document", "q": "Quel principe retrouve-t-on dans l'architecture haussmannienne ?", "c": ["L'absence d'éléments ornementaux", "La limitation du nombre d'étages", "Le respect d'obligations légales", "L'utilisation d'un matériau unique"], "a": 3, "k": "Vous devez utiliser de la pierre pour les façades.", "transcript": "– M. Rinon, vous êtes architecte et vous allez nous présenter une avenue à Paris datant de la fin du XIXe siècle. La façade haussmannienne est-elle toujours en pierre ?\n– Oui, c'était une obligation qui figurait dans l'acte de vente. C'était la manière finalement dont Haussmann légiféra puisqu'il n'y avait pas de loi.\n– Pourquoi ? Le permis de construire n'existait pas ?\n– Le permis de construire, en effet, viendra plus tard. Donc on leur disait simplement « Vous devez utiliser de la pierre pour les façades. »\n– C'est ça. Quand les propriétaires achètent le terrain pour construire, on leur imposait une pierre de taille. Dans les belles avenues comme celle de l'Opéra, on indiquait aussi que les lignes devaient filer pour donner une certaine harmonie, une certaine homogénéité, une certaine monotonie pour ceux qui n'apprécient pas cette esthétique. L'idée d'Haussmann, c'était qu'à partir du moment où on construisait un immeuble dans une avenue, les immeubles suivants devaient le prendre comme modèle.", "audio": "CO 10/029.MP3", "_test": "10", "_pos": 29, "_origlabel": "test10#29", "_sources": ["test10#29", "test22#29"]}, {"type": "document", "q": "Qu'est-ce qui est important pour Christelle Nolo ?", "c": ["L'organisation d'ateliers vidéo.", "La présence de réalisateurs étrangers.", "La projection de documentaires.", "La variété de la programmation."], "a": 3, "k": "un maximum de diversité", "transcript": "Christelle Nolo, directrice d'une salle de cinéma, nous parle du festival le Printemps du Cinéma. Je décide moi-même des films que nous présentons. Le but est de proposer un maximum de diversité. C'est l'occasion de mettre en avant des films qui ont bien marché, mais qui n'ont pas été suffisamment exploités. Il y a aussi une sélection de 15 films, ce qui est déjà significatif.", "audio": "CO 24/025.MP3", "_test": "24", "_pos": 25, "_origlabel": "test24#25", "_sources": ["test24#25", "test36#25"]}, {"type": "document", "q": "Qu'aurait souhaité cette personne en allant chez Georges Brassens ?", "c": ["Lui apporter un livre", "Lui demander conseil", "Lui présenter son travail", "Lui proposer une interview"], "a": 2, "transcript": "Quand j'étais adolescent, j'avais écrit un long poème à Georges Brassens. J'avais fini de le recopier dans le bistrot en face de l'impasse Florimont où il habitait. Et j'étais allé lui porter. Je me dis que si un jour j'avais reçu un petit mot de Brassens me disant : 'J'ai lu vos chansons et j'aimerais bien vous en parler', ça m'aurait intéressé.", "k": "J'ai lu vos chansons", "audio": "CO 30/023.MP3", "_test": "30", "_pos": 23, "_origlabel": "test30#23", "_sources": ["test30#23"]}, {"type": "document", "q": "Qu'explique l'auteur ?", "c": ["Il cherche à éviter toute forme de violence.", "Il dénonce la stérilité des affrontements.", "Il refuse de prendre parti pour une cause.", "Il voit la solitude comme un mal nécessaire."], "a": 0, "k": "une obsession de la douceur", "transcript": "— Le titre du livre, c'est \"Tous les hommes n'habitent pas le monde de la même façon\". Ça raconte les différentes manières d'être au monde. Quelle est la vôtre ?\n— J'ai commencé par tâtonner, j'ai ensuite essayé de trouver un chemin qui soit... où j'aie pas trop peur, ou quelque chose... qui soit bienveillant. Et je suis allé toujours vers quelque chose qui était compréhensible. Je savais que il n'y a pas de combat inutile, que le pouvoir n'est pas un truc... ne sert absolument à rien si ce n'est à perdre son temps, et essayer d'aller vers quelque chose de... de doux, quoi. Moi, j'ai une obsession de la douceur. J'adore me battre, s'il le faut, mais je déteste les conflits.", "audio": "CO 31/025.MP3", "_test": "31", "_pos": 25, "_origlabel": "test31#25", "_sources": ["test31#25"]}, {"type": "document", "c": ["D'avoir choisi d'y aller seul.", "D'avoir attendu dans une file.", "D'avoir manqué quelques œuvres.", "D'avoir suivi le conseil de son amie."], "a": 0, "transcript": "Je suis allé voir l'exposition que tu m'as conseillée. Et qu'en as-tu pensé ? C'était sympa, mais il y a beaucoup d'œuvres que je n'ai pas comprises et puis j'y suis allé jeudi en soirée, il y avait du monde. Tu aurais dû attendre ce week-end. J'y retourne et j'aurais pu t'expliquer pas mal de choses. C'est vrai que tu es passionné d'art contemporain. La prochaine fois, je te demanderai de m'accompagner.", "k": "beaucoup d'œuvres que je n'ai pas comprises", "q": "Que regrette le jeune homme ?", "audio": "CO 32/026.MP3", "_test": "32", "_pos": 26, "_origlabel": "test32#26", "_sources": ["test32#26"]}, {"type": "document", "q": "Question 25. À quoi sont liés les goûts littéraires de cet invité ?", "c": ["À l'époque de sa jeunesse.", "À sa passion pour un artiste.", "À son amour des langues.", "À un voyage aux États-Unis."], "a": 0, "k": "Quand j'avais 20 ans", "transcript": "– Vous, d'ailleurs, vous lisez plutôt des romans anglo-saxons ? Américains ? Américains. Mais oui, mais c'est toute ma culture. Quand j'avais 20 ans, c'était une telle révolution aussi bien au niveau de la musique que de la mode, que du cinéma, tout ça. J'étais obligé de lire des romans américains, d'autant plus que c'était les romans qui était important pour moi pour me donner des directions éventuellement et pour savoir un petit peu vers quoi j'avais envie de me diriger. À quoi sont liés les goûts littéraires de cet invité ?", "audio": "CO 35/025.MP3", "_test": "35", "_pos": 25, "_origlabel": "test35#25", "_sources": ["test35#25"]}, {"type": "document", "q": "Question 22. Qu'aurait souhaité cette personne en allant chez Georges Brassens ?", "c": ["Visiter des studios de cinéma.", "Lui apporter un livre.", "Lui présenter son travail.", "Lui proposer une interview."], "a": 2, "k": "J'ai lu vos chansons et j'aimerais bien vous en parler", "transcript": "Quand j'étais adolescent, j'avais écrit un long poème à Georges Brassens. J'avais fini de le recopier. Enfin, c'était une espèce de chanson que j'avais fini de recopier dans le bistrot en face de l'impasse Fleurymont où il habitait. Et j'étais allé lui porter, sauf qu'il n'habitait plus là depuis des années et que j'étais assez rassuré qu'il n'habite plus là parce que je ne sais pas ce que je lui aurais raconté. Mais je l'avais écrite. Et je me dis que si un jour j'avais reçu un petit mot de Brassens me disant « J'ai lu vos chansons et j'aimerais bien vous en parler », ça m'aurait intéressé.\nQu'aurait souhaité cette personne en allant chez Georges Brassens ?", "audio": "CO 36/022.MP3", "_test": "36", "_pos": 22, "_origlabel": "test36#22", "_sources": ["test36#22"]}, {"type": "document", "q": "Question 25 : Comment le choix du titre de ce film s'est-il fait ?", "c": ["C'est l'instituteur qui a proposé ce titre, qui lui plaisait, au réalisateur.", "Ce sont les parents d'élèves qui ont proposé ce titre au réalisateur.", "Les élèves faisaient un exercice de conjugaison quand le réalisateur les a rencontrés.", "Le réalisateur a trouvé que ces verbes résumaient les multiples aspects de la vie."], "a": 3, "k": "la conjugaison, c'est toute une vie, passé, présent, futur", "transcript": "Le réalisateur de films documentaires Nicolas Philibert a passé plusieurs semaines dans une école élémentaire composée d'une classe unique. Autour d'un seul instituteur, installé dans ce village d'Auvergne depuis plus de 20 ans, une douzaine d'enfants étudiaient ensemble de la maternelle à l'entrée au collège. Pourquoi avez-vous intitulé votre film Être et Avoir ? Vous savez, ce titre s'est imposé tout de suite. On a tous fait beaucoup d'exercices à l'école sur ces deux verbes. Et puis, la conjugaison, c'est toute une vie, passé, présent, futur, avoir. C'est aussi l'image d'un monde où nous sommes tentés par la possession, la consommation.", "audio": "CO 37/025.MP3", "_test": "37", "_pos": 25, "_origlabel": "test37#25", "_sources": ["test37#25"]}, {"type": "document", "q": "Que propose le vendeur à la cliente ?", "subq": "Que propose le vendeur à la cliente ?", "c": ["D'acheter un roman.", "D'attendre son collègue.", "De réserver un livre.", "De revenir le lendemain."], "a": 2, "k": "je peux vous en garder un si vous voulez", "transcript": "— Bonjour monsieur, je cherche le dernier livre de Michel Tellier sur la France rurale du 19e siècle.\n— En fait, l'ouvrage que vous cherchez est en rupture de stock. Nous en recevrons quelques-uns dans deux semaines, je peux vous en garder un si vous voulez.\n— Oui, très bien, merci. Je reviendrai.\n— Voilà madame, c'est noté.", "audio": "CO 40/020.MP3", "_test": "40", "_pos": 20, "_origlabel": "test40#20", "_sources": ["test40#20"]}, {"type": "document", "q": "Pourquoi Claudine a-t-elle autant d'activités ?", "c": ["Elle a arrêté d'exercer sa profession.", "Elle a décidé d'enrichir son curriculum vitae.", "Elle a obtenu un congé de longue durée.", "Elle a réduit son nombre d'heures de travail."], "a": 0, "k": "je suis à la retraite maintenant", "transcript": "— Vous avez beaucoup d'activités, beaucoup de passion artistique, vous faites du soutien scolaire, vous êtes écrivain publique.\n— Oui, j'essaie d'occuper mes journées par des activités qui me plaisent, étant donné que je suis à la retraite maintenant. J'adore l'art. Et puis, j'aime bien les enfants, j'aime bien la nature, tout ce que je peux faire maintenant que j'ai du temps.", "audio": "CO 40/026.MP3", "_test": "40", "_pos": 26, "_origlabel": "test40#26", "_sources": ["test40#26"]}, {"type": "document", "q": "Qu'est-ce que les deux amis n'ont pas beaucoup apprécié dans le film ?", "c": ["Le jeu de l'acteur.", "Les dialogues.", "La musique.", "Le scénario."], "a": 2, "k": "Y'a que la musique et un rien mélo qui m'a ennuyé", "transcript": "— C'était bien, hein ? Quel acteur, ce type !\n— T'exagères un peu, mais oui. C'est surtout le scénario qui était original, pour une fois.\n— Y'a que la musique et un rien mélo qui m'a ennuyé.\n— C'est vrai, moi aussi. Mais les dialogues... T'as remarqué comme ils sonnaient juste ? Ça faisait l'équilibre.\n— Ils auraient pu soigner davantage la bande sonore.", "audio": "CO 40/027.MP3", "_test": "40", "_pos": 27, "_origlabel": "test40#27", "_sources": ["test40#27"]}, {"type": "document", "q": "Pourquoi cette personne aime-t-elle lire ?", "c": ["Pour comprendre la société.", "Pour enrichir sa culture.", "Pour passer le temps.", "Pour plonger dans l'imaginaire."], "a": 3, "k": "la lecture est pour moi le plaisir du récit qui construit de nouveaux mondes", "transcript": "Je me souviens très bien du premier livre — pas du premier livre lu, mais du premier à avoir provoqué en moi la joie de la lecture. Celui qui fait que je ne lis plus que des romans parce que la lecture est pour moi le plaisir du récit qui construit de nouveaux mondes. C'était un volume du Club des Cinq. Je ressens encore dans mon corps la qualité et l'intensité de cette lecture. Je m'absorbais totalement dans le texte, devenant sourde et aveugle au monde. Vivre l'action, voir la vie pétiller et se teinter de nouvelles couleurs, nommer des sensations inconnues, entrevoir des passions nouvelles, refermer le livre avec bonheur et regret, et attendre le prochain avec une fiévreuse impatience.", "audio": "CO 14/023.MP3", "_test": "14", "_pos": 23, "_origlabel": "test14#23", "_sources": ["test14#23"]}], "devoirs": [{"type": "document", "q": "Quel est le but de ce communiqué ?", "c": ["Annoncer la diffusion exceptionnelle, en direct, d'un festival de musique.", "Dire pourquoi des journalistes et des techniciens ont cessé le travail.", "Expliquer pourquoi on entend de la musique au lieu des programmes habituels.", "Rappeler les changements de programme dus à la nouvelle grille horaire."], "a": 2, "k": "l'ensemble de nos journaux et de nos émissions de la journée sera remplacé par un programme musical continu", "transcript": "Nous informons nos auditeurs qu'en raison d'un arrêt de travail observé par certaines catégories de personnel, l'ensemble de nos journaux et de nos émissions de la journée sera remplacé par un programme musical continu. Deux bulletins d'information assurés par des personnels non grévistes seront diffusés à 13 heures et à 20 heures. Nous prions nos auditeurs de nous excuser de cette situation. C'était un communiqué de la direction de la station.", "audio": "CO 14/029.MP3", "_test": "14", "_pos": 29, "_origlabel": "test14#29", "_sources": ["test14#29"]}, {"type": "document", "q": "Question 29. Quel est le point commun entre l'écrivain et le réalisateur ?", "c": ["Ils sont tous les deux professeurs de français.", "Ils ont tous les deux participé à la même émission de radio.", "Ils ont tous les deux écrit un livre sur l'école.", "Ils s'intéressent tous les deux au même sujet de la vie scolaire."], "a": 3, "k": "il traitait tous les thèmes que je voulais aborder", "transcript": "– Comment aimer votre film ?\n– Ça faisait longtemps que je voulais faire un film sur l'école, rester entre les murs et montrer par des moments d'école ce que vivent les élèves. Le jour de la sortie de mon précédent film En route, j'ai participé à une émission de radio à laquelle était également invité François Rufus, qui venait de sortir son livre. Et au cours de l'émission, je me suis aperçu qu'il traitait tous les thèmes que je voulais aborder de la manière dont je voulais le faire, sans sortir du collège, avec une démarche minimaliste et très descriptive. Je lui demandai s'il était intéressé par une adaptation. Il m'a donné son livre. Et trois jours après, je signai.", "audio": "CO 17/029.MP3", "_test": "17", "_pos": 29, "_origlabel": "test17#29", "_sources": ["test17#29"]}, {"type": "document", "q": "Question 26. De quoi parlent les deux jeunes filles ?", "c": ["De la préparation des vacances", "Des révisions d'un examen", "D'un anniversaire surprise", "D'un projet de visites culturelles"], "a": 1, "k": "Des révisions d'un examen", "transcript": "Tu viens à l'anniversaire de Bertrand samedi.\n– Je ne sais pas encore, j'ai un examen lundi prochain.\n– Tu es prête ?\n– Plus ou moins. Mes cousins de Toulouse sont venus passer une partie des vacances à la maison et j'ai dû leur faire visiter les monuments et les musées de Paris.\n– Tu as pu travailler un peu ?\n– Oui, mais je dois encore étudier les maths.", "audio": "CO 18/026.MP3", "_test": "18", "_pos": 26, "_origlabel": "test18#26", "_sources": ["test18#26"]}, {"type": "document", "q": "Selon cet homme, qu'est-ce qui permet d'apprécier pleinement ce que l'on mange ?", "c": ["Écouter de la musique classique.", "Parler des plats que l'on savoure.", "Partager un repas en famille.", "Avoir une table bien décorée."], "a": 1, "k": "on discute avec quelqu'un", "transcript": "De manière de ne pas goûter les aliments, c'est de manger en silence. On les trouve moins bons ou de manger avec un bruit sonore de la musique constamment ou un bruit de fond continu qui altère le goût des aliments. La dimension sonore est adaptée au goût des aliments. C'est la parole. Il faut commenter tout ce que l'on déguste, commenter les aliments. Et à ce moment-là, on éprouve mieux leur goût. On éprouve mieux leur saveur quand on discute avec quelqu'un, alors que lorsque l'on est seul dans le silence, le plaisir de manger et de boire est bien moins grand.", "audio": "CO 20/025.MP3", "_test": "20", "_pos": 25, "_origlabel": "test20#25", "_sources": ["test20#25"]}, {"type": "document", "q": "Question 20. Que propose Marie à ses amis ?", "c": ["Une sortie au théâtre.", "Un voyage au Pérou.", "Un séjour en Bretagne.", "Une visite à Anne Roman."], "a": 0, "k": "réservations des places de théâtre", "transcript": "Bonjour, c'est Marie. Vous n'êtes pas là. Bon, je vous appelais comme promis au sujet des réservations des places de théâtre avant votre départ au Pérou. Je vous propose un autre spectacle que Bérénice car ça ne se joue plus. Pourquoi pas un roman ? Il paraît que son spectacle est très bien et plein d'humour. Ou bien André S, qui lit des textes qu'il a créés lui-même sur les athlètes de haut niveau. Dites ce que vous en pensez. Je réserverai les places. Nous partons en Bretagne demain, mais je crois que vous avez notre numéro de téléphone là-bas. À bientôt.", "audio": "CO 21/020.MP3", "_test": "21", "_pos": 20, "_origlabel": "test21#20", "_sources": ["test21#20"]}, {"type": "document", "q": "Question 25. Quelle est l'originalité des instruments de musique du spectacle ?", "c": ["C'est le jeune public qui les crée.", "Ce sont des outils de jardinage transformés.", "Ils sont confectionnés sur scène.", "Ils sont réalisés avec des objets recyclés."], "a": 3, "k": "il fabriquait des instruments de musique avec des matériaux de récupération", "transcript": "Bruno Blandy a appris la musique en autodidacte en écoutant du jazz, de la musique brésilienne ou les Beatles. Avec sa guitare, il a intégré des groupes de rock, de blues ou de chansons françaises, composé un album de musique métissée et est parti en tournée. Puis, il est devenu chef d'orchestre. Durant son temps libre, il fabriquait des instruments de musique avec des matériaux de récupération : vibraphone en piqué de tente, flûte en tuyaux d'arrosage. La difficulté, c'est de produire des notes justes. J'utilise des sons qu'on ne trouve pas ailleurs. Ça donne une couleur particulière, récupère tout en un seul mot. Et avec un cas, c'est le nom du spectacle pour enfants tiré de ce concept. Un concert aura lieu le 20 mai à La Citrouille.", "audio": "CO 22/025.MP3", "_test": "22", "_pos": 25, "_origlabel": "test22#25", "_sources": ["test22#25"]}, {"type": "document", "q": "Question 24. De quoi parle cette personne ?", "c": ["D'une collection de haute-couture.", "D'une exposition de peinture.", "D'une sélection de films.", "D'une tournée de chanteurs."], "a": 2, "k": "longs-métrages canadiens", "transcript": "Journaliste : Près de la moitié des meilleurs longs-métrages canadiens produits cette année proviennent du Québec. La liste a été établie par dix experts nationaux, parmi lesquels on peut citer la productrice Nicole Robert, seule personne représentant le Québec. Ce choix permet de mettre en vedette un groupe de nouveaux jeunes réalisateurs passionnants. Ils ont fait un travail audacieux. Des projections auront lieu dans de nombreuses salles à travers tout le pays, du 14 au 21 janvier, en présence de certains d'entre eux.", "audio": "CO 25/024.MP3", "_test": "25", "_pos": 24, "_origlabel": "test25#24", "_sources": ["test25#24"]}, {"type": "document", "q": "Question 27. Quel est le point de vue de la libraire interrogée ?", "c": ["La création d'un livre pour enfant de qualité est un travail d'équipe.", "Les enfants préfèrent les livres illustrés en trois dimensions.", "Pour faire un bon livre, l'auteur doit réaliser lui-même les illustrations.", "Un livre pour enfant doit comporter le moins de texte possible."], "a": 0, "k": "équilibrer le texte et l'image", "transcript": "Journaliste : Souad Haddad, vous êtes libraire à Bordeaux. Parmi vos clients, vous en comptez de très jeunes. Dans un album pour enfants, l'image est-elle plus importante que le texte ?\nSouad Haddad : Il y a des albums sans texte qui sont très forts. La petite marionnette de Gabrielle Vincent en est un exemple. Les émotions sont véhiculées par un trait de crayon extrêmement évocateur, et la moindre ligne aurait été de trop. Le bon travail éditorial consiste précisément à équilibrer le texte et l'image, tout en laissant l'auteur et l'illustrateur s'exprimer au mieux de leurs compétences. Il y a de grands artistes dans la littérature de jeunesse, qu'ils soient auteurs, illustrateurs, ou les deux à la fois. Et il y a aussi des éditeurs passionnés. Ces rencontres donnent naissance à de petits chefs-d'œuvre.", "audio": "CO 25/027.MP3", "_test": "25", "_pos": 27, "_origlabel": "test25#27", "_sources": ["test25#27"]}, {"type": "document", "q": "Question 26. Selon le journaliste, quel genre d'ouvrage cette philosophe française vient-elle d'écrire ?", "c": ["Un essai historique sur la vie à Paris pendant la Seconde Guerre mondiale", "Un livre de souvenirs sur l'histoire mouvementée de sa famille", "Un récit autobiographique ancré dans la vie intellectuelle du siècle dernier", "Un roman sur l'impact des événements historiques sur le destin individuel"], "a": 2, "k": "qui publie ces jours-ci ses mémoires", "transcript": "À mes côtés cette semaine, une philosophe, essayiste et romancière née à Paris, grande voyageuse, passionnée d'Afrique, férue de politique et d'opéra, qui publie ces jours-ci ses mémoires. Si vous aimez la petite et la grande histoire, sans vraiment savoir ce que pouvait signifier naître petite fille dans une famille de la bourgeoisie cultivée des années 40, si vous voulez comprendre ce que cela voulait dire, à la fin des années 50, intégrer la grande fabrique intellectuelle française — quelles sont les grandes écoles ? — si vous aimez la philosophie, les voyages et la politique, bref, si l'histoire intellectuelle de la seconde moitié du 20e siècle vous passionne, alors vous allez lire comme moi d'une traite le dernier livre de Claire Robert.", "audio": "CO 28/026.MP3", "_test": "28", "_pos": 26, "_origlabel": "test28#26", "_sources": ["test28#26"]}, {"type": "document", "q": "Question 29. Selon cette femme, qu'est-ce qui explique son amour inconditionnel du cinéma ?", "c": ["L'absence de distractions dans le village où elle habitait", "L'influence autoritaire que son père a exercée sur elle", "Le choc du tout premier film qu'elle a vu dans sa vie", "Sa fréquentation des salles dès son plus jeune âge"], "a": 3, "k": "mon père m'emmenait au cinéma alors que j'étais encore au biberon", "transcript": "Vous avez vu le premier film de Robert Feuillade hier ? Non, ce n'est pas le genre de film que j'aime. Moi, je regarde tous les films. J'adore le cinéma depuis toujours, sans doute parce que mon père m'emmenait au cinéma alors que j'étais encore au biberon. Je me souviens encore de mon premier western dans la petite ville où on habitait, tous les samedis. Il y avait le cinéma en plein air gratuit. Moi, ce que je préférais quand j'allais au cinéma avec mon père, c'était la glace à la vanille qu'il m'achetait.", "audio": "CO 28/029.MP3", "_test": "28", "_pos": 29, "_origlabel": "test28#29", "_sources": ["test28#29"]}]}, "Profession": {"cours": [{"type": "document", "q": "Pour quelle raison la jeune femme accepte-t-elle de recevoir la candidature de ce monsieur ?", "c": ["Il a quatre ans d'expérience.", "Il a travaillé dans un commerce.", "Il accepte de travailler l'été.", "Il est très motivé par la formation."], "a": 1, "k": "j'ai travaillé deux étés comme caissier en supermarché", "transcript": "— CDV Formations, bonjour.\n— Bonjour, je serais intéressé par votre formation en vente.\n— Oui, quel est votre parcours ?\n— Je suis déménageur depuis 4 ans. Je voudrais me réorienter.\n— Malheureusement, notre formation s'adresse à des personnes déjà expérimentées en vente.\n— Je vois. Mais j'y pense, j'ai travaillé deux étés comme caissier en supermarché. C'est suffisant ?\n— Envoyez-nous un CV et une lettre de motivation, nous étudierons votre candidature.\n— Je m'en occupe. Merci, au revoir.\n— Au revoir.", "audio": "CO1/025.MP3", "_test": "1", "_pos": 25, "_origlabel": "test1#25", "_sources": ["test1#25", "test3#25"]}, {"type": "document", "q": "Question 20. Qu'annonce le directeur à l'employé ?", "c": ["Il est possible qu'il soit renvoyé.", "Il est renvoyé définitivement.", "Il va commencer sa période d'essai.", "Il va être embauché définitivement."], "a": 0, "k": "Il est possible qu'il soit renvoyé.", "transcript": "– Vous avez vu l'heure ?\n– Oui, je sais. Il n'est pas si tard.\n– C'est la troisième fois que vous arrivez en retard cette semaine. Je m'excuse.\n– Écoutez-moi bien. Votre période d'essai se termine dans 15 jours. Dorénavant, veuillez arriver à l'heure si vous voulez être embauché.", "audio": "CO 2/020.MP3", "_test": "2", "_pos": 20, "_origlabel": "test2#20", "_sources": ["test2#20"]}, {"type": "document", "q": "Question 24. Sur quel aspect travaillent les concepteurs des voitures autonomes ?", "c": ["L'écologie.", "La puissance.", "La sécurité.", "Les équipements."], "a": 3, "k": "Les équipements.", "transcript": "Différents modèles de véhicules sans conducteur étaient à essayer dans les rues de Las Vegas la semaine dernière. Pour le moment, il s'agit seulement d'expérimentation. En attendant une réglementation, le secteur s'intéresse à ce que l'on fera dans ces voitures quand elles conduiront vraiment toutes seules. Persuadés que c'est l'intérieur de la voiture et les services proposés qui feront la différence demain, bien plus que le moteur, plusieurs concepts d'habitacle futuriste étaient présentés sur le salon. Des voitures avec des écrans partout intégrés dans les vitres faisant toute la largeur du tableau de bord. Des véhicules qui se personnalisent en fonction de leur passager.", "audio": "CO 2/024.MP3", "_test": "2", "_pos": 24, "_origlabel": "test2#24", "_sources": ["test2#24"]}, {"type": "document", "q": "Question 29. Que souhaite l'association dont il est question ?", "c": ["Accroître la mixité sociale dans les grandes villes.", "Décrocher des financements pour ses activités.", "Modifier le fonctionnement des marchés aux puces.", "Obtenir un statut professionnel officiel pour les biffins."], "a": 3, "k": "C'est un travail et il devrait être connu comme tel", "transcript": "Projecteurs maintenant sur la biffe. C'est un phénomène qui s'étend, surtout à Paris, poussé par la précarité. Des hommes et des femmes qui font de la récup leur métier revendent en fait tout ce qui peut l'être. Le dialogue avec les autorités n'est pas toujours simple, mais une association se mobilise pour leur permettre de poursuivre leur activité. Ce dynamisme économique est nécessaire en ville pour lutter contre la pauvreté, pour réduire les déchets, pour créer une économie circulaire populaire et pour protéger les ressources de la planète. Pour les familles démunies, c'est nécessaire d'avoir un peu d'argent en vendant sa récup. C'est un travail et il devrait être connu comme tel.", "audio": "CO 3/029.MP3", "_test": "3", "_pos": 29, "_origlabel": "test3#29", "_sources": ["test3#29"]}, {"type": "document", "q": "Question 23. Quelle est la qualité dont le travailleur moderne doit faire preuve ?", "c": ["La créativité.", "La ponctualité.", "La mobilité.", "La spécialisation."], "a": 2, "k": "La mobilité.", "transcript": "Bienvenue à tous. Ce colloque est intitulé « Travail et modernité » car nous devons changer notre manière d'appréhender le travail au sein d'une société en pleine mutation. Nous entrons en effet dans l'ère de la communication interplanétaire. Nul ne peut se contenter d'évoluer à l'intérieur des frontières de son pays. Il faut étudier, voyager, communiquer et surtout savoir changer de métier, de pays avec souplesse.", "audio": "CO 34/023.MP3", "_test": "4", "_pos": 23, "_origlabel": "test4#23", "_sources": ["test4#23"]}, {"type": "document", "q": "Question 28. Quel est l'objet de la discussion ?", "c": ["La répartition des tâches dans le service.", "Le manque d'expérience de l'équipe.", "Le retard pris dans la réalisation d'un projet.", "Les désaccords entre employeur et employés."], "a": 0, "k": "redéfinir clairement", "transcript": "– Je pense que le chef de département a raison. Il faudrait modifier la façon dont nous fonctionnons et redéfinir clairement les missions de chacun.\n– Oui, je suis d'accord d'autant que nous avons eu des incompréhensions entre nous ces derniers temps. D'après moi, elles sont directement liées au fait que personne ne sait précisément où commence son rôle et surtout, où il s'arrête dans le projet.\n– Tout à fait, d'accord. Moi-même, je suis un peu perdu. Si tout le monde essaie de tout faire, on ne sera jamais d'accord au sein de ce service, sans compter que ça ne nous fait pas gagner de temps.\n– Bien. Alors mettons ça à l'ordre de la réunion d'équipe de demain.", "audio": "CO 5/028.MP3", "_test": "5", "_pos": 28, "_origlabel": "test5#28", "_sources": ["test5#28", "test6#28", "test15#28"]}, {"type": "document", "q": "Question 22. Comment cet individu reçoit-il la proposition patronale ?", "c": ["Il est ironique.", "Il est favorable.", "Il est plein d'espoir.", "Il est méprisant."], "a": 0, "k": "Quelle belle initiative !", "transcript": "Monsieur Morales, vous êtes donc secrétaire de la Fédération syndicale des travailleurs de l'alimentation, de l'agroindustrie et industries similaires. Comment jugez-vous les rapports entre votre organisation syndicale et les patrons ?\n– Dans le cadre des discussions avec les partenaires sociaux, l'organisation patronale nous a récemment proposé, à titre expérimental, un système de résolution alternative des conflits. Ce système prévoit la formation par le patronat de médiateurs soi-disant indépendants et permettrait, je cite le représentant, d'intervenir en amont des conflits sociaux pour éviter le recours lent et coûteux aux inspections du travail et aux tribunaux. Quelle belle initiative ! Mais une question me taraude : comment peut-on prétendre être à la fois juge et partie ?", "audio": "CO 8/022.MP3", "_test": "8", "_pos": 22, "_origlabel": "test8#22", "_sources": ["test8#22"]}, {"type": "document", "q": "Question 23. Quelle difficulté les créateurs de musique rencontrent-ils ?", "c": ["Leur public est en diminution.", "Leur salaire est insuffisant.", "Leur savoir est peu transmis.", "Leur talent est dévalorisé."], "a": 1, "k": "ne leur permet pas de pouvoir avoir suffisamment de rémunération pour vivre correctement", "transcript": "Et donc les compositeurs ont un autre métier, c'est-à-dire que oui, ils sont chefs d'orchestre, ou ils sont directeurs de conservatoire, ou encore enseignants-chercheurs, directeurs artistiques, parfois parce que leur métier de compositeur ne leur permet pas de pouvoir avoir suffisamment de rémunération pour vivre correctement. Je pense qu'il doit d'ailleurs y avoir à peu près 2 ou 3 % de compositeurs aujourd'hui qui vivent réellement de leur musique. C'est très très peu.", "audio": "CO 8/023.MP3", "_test": "8", "_pos": 23, "_origlabel": "test8#23", "_sources": ["test8#23"]}, {"type": "document", "q": "Question 23. Pourquoi son responsable est-il satisfait de Chantal ?", "c": ["Elle a beaucoup d'expérience.", "Elle a vite appris son métier.", "Elle aime prendre des risques.", "Elle sait diriger ses collègues."], "a": 1, "k": "Elle a assimilé rapidement les manœuvres d'exécution", "transcript": "Chers auditeurs, nous allons aujourd'hui vous présenter Chantal Harvey, une franco-québécoise qui travaille au centre de service de Shawinigan et qui, tenez-vous bien, conduit un chasse-neige.\n– Alors Chantal, comment on se sent aux commandes de cette grosse machine ?\n– Je me sens parfaitement dans mon élément.\n– Et votre chef, qu'en pense-t-il ? Est-il satisfait d'avoir une femme dans votre équipe ?\n– Ah, j'en suis ravi. Elle a assimilé rapidement les manœuvres d'exécution et elle intervient efficacement aux endroits stratégiques. Même si elle s'y connaît peu en déneigement, elle a su tirer son épingle du jeu. C'est une personne courageuse et regardez comme elle est à l'aise aux manettes de cet engin. On jurerait qu'elle a fait ça toute sa vie.", "audio": "CO 9/023.MP3", "_test": "9", "_pos": 23, "_origlabel": "test9#23", "_sources": ["test9#23"]}, {"type": "document", "q": "Que recommande cette universitaire pour trouver un travail au Québec ?", "c": ["De devenir entrepreneur en créant son entreprise", "De s'informer sur les secteurs porteurs d'emplois", "De suivre une formation diplômante à l'université", "D'élargir sa recherche d'emploi à d'autres domaines"], "a": 3, "k": "Tu pourrais trouver un emploi demain matin si tu misais sur le développement de tes compétences plutôt que sur ton bout de papier.", "transcript": "Quand un Français s'aperçoit que ses compétences ne sont pas en adéquation avec le marché du travail québécois, il commet généralement la même erreur. Plutôt que d'aller chercher une autre expérience en se disant « Ce n'est pas grave, je vais peut-être obtenir un poste avec moins de responsabilités », mais je vais chercher à développer de nouvelles compétences en occupant un nouvel emploi dans un secteur différent, il essaie de retourner à l'université et refait un certificat. Que conseillez-vous alors ?\n– En tant qu'enseignant à l'université, je lui dis « Tu pourrais trouver un emploi demain matin si tu misais sur le développement de tes compétences plutôt que sur ton bout de papier. »", "audio": "CO 10/028.MP3", "_test": "10", "_pos": 28, "_origlabel": "test10#28", "_sources": ["test10#28"]}, {"type": "document", "q": "Qu'exprime le jeune homme ?", "c": ["De l'enthousiasme", "De l'étonnement", "De l'admiration", "De l'intérêt"], "a": 1, "k": "Ça alors ! Je ne peux pas le croire.", "transcript": "— Mathieu, je vous félicite. Vous avez fait un très bon travail de recherche.\n— C'est vrai ? Je ne pensais pas avoir réussi. J'ai mis beaucoup de temps. Ça n'a pas été facile.\n— En tout cas, c'est une excellente copie. Vous avez la meilleure note du groupe.\n— Ça alors ! Je ne peux pas le croire.", "audio": "CO 29/021.MP3", "_test": "29", "_pos": 21, "_origlabel": "test29#21", "_sources": ["test29#21"]}, {"type": "document", "q": "Pourquoi madame Lefebvre a-t-elle appelé monsieur Noguet ?", "c": ["Pour lui annoncer le rejet de sa proposition", "Pour lui confirmer un rendez-vous de travail", "Pour lui demander des documents supplémentaires", "Pour lui fixer un entretien d'embauche"], "a": 3, "k": "nous aimerions vous rencontrer dans les prochains jours", "transcript": "Bonjour monsieur Noguet. Madame Lefebvre, de la direction des ressources humaines de la société AG Pro. Je vous appelle au sujet de votre candidature pour le poste de graphiste. Votre CV a été présélectionné par la directrice des ressources humaines. Si ce poste vous intéresse toujours, nous aimerions vous rencontrer dans les prochains jours. Merci de me rappeler au 01 25 38 67 54. Au revoir.", "audio": "CO 29/023.MP3", "_test": "29", "_pos": 23, "_origlabel": "test29#23", "_sources": ["test29#23"]}, {"type": "document", "q": "Quelle était la motivation de cet homme pour devenir pêcheur ?", "c": ["L'envie de changer de profession", "La nécessité de trouver un travail", "La réalisation d'un rêve de jeunesse", "La rencontre avec un passionné"], "a": 1, "transcript": "— Je suis marin depuis les années 80. J'ai commencé le métier marin à 15 ans et demi. — Vous avez pris la suite de quelqu'un ? — Non non, j'ai commencé dans les années 81 à la pêche. — Je n'étais vraiment pas attiré par la mer. — Et pourtant vous avez franchi le pas pour faire pêcheur. — Je n'avais pas le choix, il fallait bien que je gagne ma vie. Ici, à part la pêche, il n'y a pas grand-chose comme boulot.", "k": "il fallait bien que je gagne ma vie", "audio": "CO 30/020.MP3", "_test": "30", "_pos": 20, "_origlabel": "test30#20", "_sources": ["test30#20"]}, {"type": "document", "q": "Selon cet intervenant, comment augmenter ses chances d'obtenir un emploi ?", "c": ["En collaborant à des activités de bénévolat", "En effectuant des stages durant ses études", "En prenant part à des salons de recrutement", "En suivant plusieurs formations spécifiques"], "a": 0, "transcript": "Les jeunes pensent qu'une participation aux forums de recrutement, une formation professionnelle et plusieurs stages suffisent à décrocher un contrat. Or, les entreprises cherchent des personnes réellement motivées et passionnées. Un travail de bénévole dans des organisations humanitaires à l'étranger peut faire la différence. Il ne faut pas hésiter à mettre ces expériences caritatives sur son CV.", "k": "Un travail de bénévole dans des organisations humanitaires", "audio": "CO 30/026.MP3", "_test": "30", "_pos": 26, "_origlabel": "test30#26", "_sources": ["test30#26"]}, {"type": "document", "q": "Qu'apprend-on sur les jardins communautaires ?", "c": ["Ils appartiennent à des demandeurs d'emploi", "Ils sont cultivés par des gens sans emploi", "Ils fournissent des légumes aux commerçants de la ville", "Ils sont cultivés par des jardiniers professionnels"], "a": 1, "transcript": "— Monsieur Goslin, pouvez-vous nous parler des jardins communautaires de Verdun ? — Oui, ce sont des jardins mis à la disposition des chômeurs par la ville de Montréal. — Donc, les chômeurs retrouvent une activité par la même occasion ? — Oui, et ils peuvent se nourrir des légumes cultivés.", "k": "jardins mis à la disposition des chômeurs", "audio": "CO 30/027.MP3", "_test": "30", "_pos": 27, "_origlabel": "test30#27", "_sources": ["test30#27"]}, {"type": "document", "q": "Qu'apprend-on sur le rire dans ce document ?", "c": ["Il a un effet inattendu sur le cerveau.", "Il allonge notre espérance de vie.", "Il apaise les souffrances psychiques.", "Il s'apparente à un effort physique."], "a": 3, "k": "c'est une sorte de gymnastique douce", "transcript": "Le rire, c'est une onde. Cette onde, elle se manifeste dans les muscles. Cette onde, elle part du visage, elle part des petits muscles du visage. Elle va ensuite aller aux épaules, aux cuisses, et bien sûr aux muscles de l'abdomen. Donc, ça les fait travailler, ça fait travailler les muscles. Donc, c'est une sorte de gymnastique douce. Et la gymnastique douce, comme chacun sait, s'accompagne d'exercices respiratoires que le rire se charge d'exécuter pour vous. Dans la vie courante, on échange un demi-litre d'air. Quand on rit, on échange facilement deux litres d'air. Donc, ça va avoir une fonction de détoxiquant très claire.", "audio": "CO 31/029.MP3", "_test": "31", "_pos": 29, "_origlabel": "test31#29", "_sources": ["test31#29"]}, {"type": "document", "q": "Question 20 : Que dit cette intervenante au sujet du travail à Londres ?", "c": ["Il est facile d'évoluer rapidement dans sa carrière.", "Les diplômes sont très importants pour être recruté.", "Les salaires y sont bien supérieurs à ceux de France.", "Il est difficile de trouver un premier emploi."], "a": 0, "k": "franchir les étapes beaucoup plus rapidement", "transcript": "On dit souvent qu'à Londres on peut changer de job quasiment comme de chemise. Est-ce que c'est toujours vrai ? — Il est toujours facile de passer d'un job à l'autre, le diplôme a beaucoup moins d'importance, on va surtout regarder les postes que vous avez déjà occupés, on va aussi tenir compte de vos motivations, c'est vrai qu'on vous donne aussi la possibilité d'augmenter assez, enfin, comment dire, de franchir les étapes beaucoup plus rapidement. On retrouve assez régulièrement des personnes vers 22, 23 ans et déjà managers, tandis qu'en France, c'est quand même un petit peu plus compliqué.", "audio": "CO 38/020.MP3", "_test": "38", "_pos": 20, "_origlabel": "test38#20", "_sources": ["test38#20"]}, {"type": "document", "q": "Question 23 : Qu'apprécie la femme dans son nouveau travail ?", "c": ["L'ambiance détendue.", "Les horaires flexibles.", "La proximité du lieu de travail.", "Les perspectives d'évolution."], "a": 3, "k": "je n'avais pas de possibilité d'évolution", "transcript": "– Malheureusement, je n'ai pas de vacances, je viens de changer de travail. — Ah bon, tu ne te plaisais pas là où tu étais ? — Si, l'ambiance était vraiment bonne, et j'avais un bon emploi du temps. — Oui, je me souviens, et tu as trouvé encore mieux. — En fait, c'était sympa, mais je n'avais pas de possibilité d'évolution, alors que là les perspectives sont bonnes, enfin, si je survis aux horaires imposés, et l'ambiance est aussi bonne qu'avant, oui, je pense que ça va aller, mais je ne connais pas encore beaucoup de monde. — Il faut du temps.", "audio": "CO 38/023.MP3", "_test": "38", "_pos": 23, "_origlabel": "test38#23", "_sources": ["test38#23"]}, {"type": "document", "q": "Question 25 : Les journalistes évoquent une tendance qui concerne les Français. Laquelle ?", "c": ["Ils apprennent de plus en plus l'anglais.", "Ils sont de plus en plus nombreux à partir à l'étranger.", "Ils ont du mal à trouver du travail en France.", "Ils préfèrent s'installer dans les pays francophones."], "a": 1, "k": "partir à la conquête du monde", "transcript": "Gros plan sur les Français qui partent pour réussir. Oui, tous ces Français que l'on dit nuls en anglais, ils n'ont plus peur de partir à la conquête du monde. En fait, il est toujours un peu difficile de cerner leur motivation profonde entre ceux qui franchissent les frontières pour monter un business, ceux qui cherchent un job, ceux qui s'exilent pour fuir une fiscalité asphyxiante, ou bien ceux qui veulent tout simplement profiter d'une retraite au soleil.", "audio": "CO 38/025.MP3", "_test": "38", "_pos": 25, "_origlabel": "test38#25", "_sources": ["test38#25"]}, {"type": "document", "q": "Question 28. Selon la personne interrogée, pour quelle raison les entreprises québécoises doivent-elles continuer leurs efforts pour l'intégration des immigrés ?", "c": ["Parce qu'elles ont beaucoup à apprendre d'eux.", "Parce qu'elles s'implanteront mieux ensuite à l'étranger.", "Parce qu'elles sont en manque de main-d'œuvre.", "Parce qu'elles y sont contraintes par la mondialisation."], "a": 0, "k": "on apprend sur la nôtre, on apprend sur les autres", "transcript": "Les entreprises québécoises m'ont fait beaucoup pour l'intégration des immigrés, mais elles doivent faire davantage. Je pense qu'on peut toujours faire mieux, qu'on a encore besoin d'être sensibilisés, d'être ouverts. Donc je pense que c'est un défi de tous les jours. Si on ne le fait pas, on y perd, parce qu'il y a tellement de gains à l'immigration. On n'a pas parlé de s'ouvrir vers d'autres cultures, on y gagne, on apprend sur la nôtre, on apprend sur les autres. Et pour le milieu du travail également, toute la richesse, la diversité que d'autres cultures peuvent nous apporter. Quand on parle d'un contexte de globalisation, on travaille à l'échelle de la planète. Il faut avoir un regard beaucoup plus large.", "audio": "CO 11/028.MP3", "_test": "11", "_pos": 28, "_origlabel": "test11#28", "_sources": ["test11#28", "test26#27"]}], "devoirs": [{"type": "document", "q": "Question 29. Que fait cette intervenante ?", "c": ["Elle annonce la fin prochaine d'un projet.", "Elle félicite des collègues pour un travail.", "Elle prépare une opération commerciale.", "Elle présente une nouveauté à des clients."], "a": 2, "k": "pendant la période de vente", "transcript": "Après deux années de recherche, nous avons lancé le dernier modèle de notre garde et votre rôle va être essentiel. Le marché sur lequel votre équipe va intervenir est en pleine croissance. C'est pourquoi nous avons besoin de personnes prêtes à prendre leur fonction rapidement. Nous allons maintenant examiner les étapes que vous devrez suivre pour être les meilleures pendant la période de vente.", "audio": "CO 11/029.MP3", "_test": "11", "_pos": 29, "_origlabel": "test11#29", "_sources": ["test11#29"]}, {"type": "document", "q": "Question 28. Que désirent les jeunes en commençant leur carrière ?", "c": ["Une ascension professionnelle accompagnée de revenus confortables", "Une nomination à un premier poste valorisant au sein de l'entreprise", "Une opportunité de multiplier les contrats dans différentes entreprises", "Une reconnaissance rapide de leurs supérieurs sur les résultats obtenus"], "a": 0, "k": "hommes et femmes aspirent à utiliser salaire et promotion", "transcript": "Quels sont les objectifs de carrière des étudiants ? Vous savez, hommes et femmes aspirent à utiliser salaire et promotion, non seulement pour pouvoir utiliser une entreprise comme un nom sur un CV, mais aussi pour obtenir un réel accélérateur de carrière et plus simplement ce qui attire hommes et femmes, c'est d'envisager de pouvoir gagner beaucoup plus. Les kilos de leur premier salaire ne sauraient donc être un frein à leur entrée dans une société. Tant que ces jeunes diplômés peuvent se projeter dans une globalité liant augmentation salariale et promotion interne.", "audio": "CO 12/028.MP3", "_test": "12", "_pos": 28, "_origlabel": "test12#28", "_sources": ["test12#28", "test18#29"]}, {"type": "document", "q": "Que fait cette femme ?", "c": ["Elle organise des fêtes au village.", "Elle travaille chez un fleuriste.", "Elle se marie le lendemain.", "Elle travaille dans un restaurant."], "a": 3, "k": "vous serez complet", "transcript": "– Bonjour.\n– Ah, c'est joli. Toutes ces fleurs.\n– Oui, je suis en train de préparer des bouquets pour demain.\n– Ah bon ? Il y a une fête en ville demain ?\n– Non, nous avons un repas de mariage. Il faut que tout soit prêt pour 12h.\n– Ah, alors vous serez complet, je suppose. On voulait vous réserver une table.\n– Je ne sais pas. Il faut voir avec la patronne.", "audio": "CO 14/021.MP3", "_test": "14", "_pos": 21, "_origlabel": "test14#21", "_sources": ["test14#21"]}, {"type": "document", "q": "De quoi se plaint Géraldine ?", "c": ["De ses difficultés à se réveiller le matin.", "De son dernier salaire qui est insuffisant.", "De son emploi du temps professionnel.", "De son manque d'organisation habituel."], "a": 2, "k": "je commence à six heures du matin et à une heure de chez moi en plus", "transcript": "Salut Géraldine, ça va ? Non, pas trop. Tu sais que je cherchais du travail. Eh bien, maintenant que je l'ai trouvé, je ne suis pas très contente. Pourquoi ? Tu ne touches pas assez d'argent ? Non, c'est que deux fois par semaine, je commence à six heures du matin et à une heure de chez moi en plus. Oh, c'est tôt. Et comment tu vas faire pour les enfants ? Gil va s'en occuper. Mais moi, imagine que je ne sais pas comment je vais faire pour récupérer. Tu vas dormir les week-ends.", "audio": "CO 15/027.MP3", "_test": "15", "_pos": 27, "_origlabel": "test15#27", "_sources": ["test15#27"]}, {"type": "document", "q": "Quelles difficultés les créateurs de musique rencontrent-ils ?", "c": ["Leur public est en diminution.", "Leur salaire est insuffisant.", "Leur savoir est peu transmis.", "Leur talent est dévalorisé."], "a": 1, "k": "ne leur permet pas d'avoir suffisamment de rémunération", "transcript": "– Et donc les compositeurs ont un autre métier.\n– C'est-à-dire que oui, ils sont chefs d'orchestre ou ils sont directeurs de conservatoire ou ils sont enseignants, chercheurs, directeurs artistiques, parfois parce que leur métier de compositeur ne leur permet pas d'avoir suffisamment de rémunération pour vivre correctement.\n– Je pense qu'il doit d'ailleurs y avoir à peu près deux ou 3 % de compositeurs aujourd'hui qui vivent réellement de leur musique. C'est très, très peu.", "audio": "CO 16/023.MP3", "_test": "16", "_pos": 23, "_origlabel": "test16#23", "_sources": ["test16#23"]}, {"type": "document", "q": "Pour quelles raisons ce psychologue a-t-il interrompu ses consultations ?", "c": ["Il a répondu à une demande de ses patients.", "Il consacre son temps à son nouveau métier.", "Il s'est remis en question suite à un échec.", "Il veut éviter toute publicité personnelle."], "a": 3, "k": "je ne veux pas donner l'image de quelqu'un qui va plus vite que les autres", "transcript": "– Psychologue, vous animez une émission télévisée. Comment faites-vous pour jongler entre vos consultations et vos émissions ?\n– J'ai suspendu mes consultations privées dans un souci éthique.\n– Je ne veux pas utiliser cette émission comme fonds de commerce, comme une manière de rabattre de la clientèle.\n– Je suis un thérapeute ordinaire et je ne veux pas donner l'image de quelqu'un qui va plus vite que les autres.", "audio": "CO 16/024.MP3", "_test": "16", "_pos": 24, "_origlabel": "test16#24", "_sources": ["test16#24", "test25#25"]}, {"type": "document", "q": "Question 27. Que conseille de faire le psychologue face à un recruteur ?", "c": ["Montrer de l'insolence pour se démarquer.", "Être impressionné et angoissé pendant l'entretien.", "Faire face sans manquer de politesse.", "Éviter de créer une atmosphère détendue."], "a": 2, "k": "sans être insolente ou désinvolte", "transcript": "– David Bernard, vous êtes psychologue au travail. Quels conseils donneriez-vous pour décrocher un emploi de rêve ?\n– Tout d'abord, n'oubliez pas que le recruteur a l'habitude de voir des candidats impressionnés au cours de l'entretien, angoissés de rester deux semaines de plus au chômage.\n– Mais alors, que proposez-vous en pratique ?\n– Cassez la routine du recruteur, soyez à l'aise, mais sans être insolente ou désinvolte, soyez simple, franc, décidé et montrez de l'intérêt. Vous contribuerez ainsi à l'installation d'une atmosphère courtoise et détendue.", "audio": "CO 17/027.MP3", "_test": "17", "_pos": 27, "_origlabel": "test17#27", "_sources": ["test17#27"]}, {"type": "document", "q": "Question 23. Qu'apprécie la femme dans son nouveau travail ?", "c": ["L'atmosphère détendue.", "La souplesse des horaires.", "L'efficacité de son équipe.", "Les opportunités de carrière."], "a": 3, "k": "les perspectives sont bonnes", "transcript": "– Malheureusement, je n'ai pas de vacances. Je viens de changer de travail.\n– Ah bon ? Tu ne te plaisais pas là où tu étais ? L'ambiance était vraiment bonne et tu avais un bon emploi du temps.\n– Oui, je me souviens, et tu as trouvé encore mieux.\n– En fait, c'était sympa, mais je n'avais pas de possibilité d'évolution, alors que là, les perspectives sont bonnes. Enfin, si je survis aux horaires imposés... et l'ambiance est aussi bonne qu'avant. Oui, je pense que ça va aller, mais je ne connais pas encore beaucoup de monde. Il faut du temps.", "audio": "CO 19/023.MP3", "_test": "19", "_pos": 23, "_origlabel": "test19#23", "_sources": ["test19#23"]}, {"type": "document", "q": "Question 25. Les journalistes évoquent une tendance qui concerne les Français. Laquelle ?", "c": ["Ils aiment passer leurs vieux jours dans le sud de la France.", "Ils osent davantage partir à l'étranger qu'auparavant.", "Ils payent plus d'impôts que les autres citoyens européens.", "Ils prennent des cours de langue pour améliorer leur niveau."], "a": 1, "k": "ils n'ont plus peur de partir à la conquête du monde", "transcript": "Gros plan sur les Français qui partent pour réussir. Oui, tous ces Français que l'on dit nuls en anglais. Eh bien, ils n'ont plus peur de partir à la conquête du monde. En fait, il est toujours un peu difficile de cerner leurs motivations profondes, entre ceux qui franchissent les frontières pour monter un business, ceux qui cherchent un job, ceux qui s'exilent pour fuir une fiscalité asphyxiante ou bien ceux qui veulent tout simplement profiter d'une retraite au soleil.", "audio": "CO 19/025.MP3", "_test": "19", "_pos": 25, "_origlabel": "test19#25", "_sources": ["test19#25"]}, {"type": "document", "q": "Pourquoi la personne cherche-t-elle du travail à Montréal ?", "c": ["Pour mettre en pratique ses connaissances.", "Pour opérer une reconversion professionnelle.", "Pour se rapprocher de sa famille.", "Pour suivre son compagnon."], "a": 3, "k": "mon petit ami a été muté à Montréal", "transcript": "– Bonjour monsieur. J'ai vu votre annonce. Vous cherchez toujours une vendeuse ?\n– Oui, cela vous intéresse. Vous avez de l'expérience.\n– J'ai été vendeuse pendant 15 ans à Québec, mais mon petit ami a été muté à Montréal. Alors j'ai dû démissionner.\n– Vous habitez encore là-bas ?\n– Non, nous sommes chez mes parents en attendant de trouver un logement.\n– Vous parlez anglais ?\n– Bien sûr.\n– Bien. Vous pouvez revenir demain pour un essai.\n– Avec plaisir.", "audio": "CO 20/024.MP3", "_test": "20", "_pos": 24, "_origlabel": "test20#24", "_sources": ["test20#24"]}, {"type": "document", "q": "Question 28. Que propose la navigatrice ?", "c": ["De collecter des dons.", "De développer la recherche.", "De sensibiliser l'opinion.", "D'explorer l'écosystème."], "a": 2, "k": "faire prendre conscience", "transcript": "La navigatrice Marie Le Valois est la porte-parole de la Semaine de la mer. Écoutez-la : on a voulu mettre en place une Semaine de la mer pour le très grand public. À côté, les institutions membres de l'Alliance de la Mer font intervenir des scientifiques et des professionnels qui travaillent sur des solutions d'avenir pour une meilleure gestion de la mer. Mais il faut mobiliser tout le monde pour faire prendre conscience que les océans ne sont pas seulement l'endroit où l'on va passer ses vacances, mais participent aussi à la régulation du climat, fournissent 70 % de l'oxygène que l'on respire, et représentent un réservoir de solutions en énergie renouvelable et médicinale, des ressources dont on ne connaît quasi rien. Puisqu'on ne connaît qu'un pour cent de la biodiversité marine.", "audio": "CO 21/028.MP3", "_test": "21", "_pos": 28, "_origlabel": "test21#28", "_sources": ["test21#28"]}, {"type": "document", "q": "Question 26. Pourquoi M. Durand appelle-t-il ?", "c": ["Pour annoncer une nouvelle.", "Pour annuler une livraison.", "Pour faire une réclamation.", "Pour obtenir une information."], "a": 3, "k": "Avez-vous bien reçu le colis", "transcript": "Bonjour Tom, c'est Monsieur Durand. Avez-vous bien reçu le colis que nous a envoyé notre client japonais ?\n– Toutes mes excuses, monsieur. J'ai oublié de vous le dire. J'ai contacté le bureau de poste hier. Ils ont pris beaucoup de retard à cause de la neige et ne pourront pas distribuer le courrier avant vendredi.\n– D'accord ? N'oubliez pas de me prévenir car c'est vraiment urgent. J'espère avoir ce colis d'ici vendredi matin.", "audio": "CO 22/026.MP3", "_test": "22", "_pos": 26, "_origlabel": "test22#26", "_sources": ["test22#26"]}, {"type": "document", "q": "Question 22. Que critique ce journaliste dans la pratique actuelle de son métier ?", "c": ["La formation professionnelle des jeunes.", "L'absence de vérification des sources.", "Le recours systématique aux technologies.", "Les mensonges de certains collègues."], "a": 1, "k": "trier l'information", "transcript": "Animateur : Cette nouvelle façon de faire l'info immédiate par rapport à celle que vous faisiez à l'époque, dans Envoyé Spécial, vous fascine-t-elle ou vous fait-elle peur ?\nJournaliste : Elle m'inquiète. Elle m'inquiète parce que j'ai l'impression qu'on a tendance à oublier le rôle du journaliste. Nous, vous, nous sommes là pour trier l'information, pour savoir ce qui est vrai de ce qui ne l'est pas. Aujourd'hui avec l'avalanche d'informations que nous avons, en particulier sur les réseaux sociaux, on ne sait plus ce qui est vrai, ce qui n'est pas vrai. Les rumeurs les plus folles courent et ensuite, on met des jours et des jours à rattraper une information qui était fausse au départ. Je pense que les journalistes devraient être beaucoup plus présents dans cette course à l'information et faire attention, c'est-à-dire, faire leur métier.", "audio": "CO 25/022.MP3", "_test": "25", "_pos": 22, "_origlabel": "test25#22", "_sources": ["test25#22"]}, {"type": "document", "q": "Question 21 : Que demande le Directeur ?", "c": ["De fixer les horaires de travail du comptable", "De prendre rendez-vous avec le comptable", "De préparer des documents pour le comptable", "De remplir la fiche de salaire du comptable"], "a": 2, "k": "les fiches de paie des professeurs doivent être prêtes pour demain", "transcript": "Allô, bonjour. Oui, bonjour Monsieur le Directeur. Je veux juste vous rappeler que les fiches de paie des professeurs doivent être prêtes pour demain. Oui, j'ai contrôlé les heures de tous les professeurs. J'attends deux confirmations ce matin et je vais pouvoir finir cet après-midi. Bon, je compte sur vous pour respecter les délais imposés par le service comptabilité.", "audio": "CO 26/021.MP3", "_test": "26", "_pos": 21, "_origlabel": "test26#21", "_sources": ["test26#21"]}, {"type": "document", "q": "Question 23 : Quelle est la qualité dont le travailleur moderne doit faire preuve ?", "c": ["La créativité", "La disponibilité", "La mobilité", "La persuasion"], "a": 2, "k": "savoir changer de métier, de pays avec souplesse", "transcript": "Bienvenue à tous. Ce colloque est intitulé « Travail et modernité » car nous devons changer notre manière d'appréhender le travail au sein d'une société en pleine mutation. Nous entrons en effet dans l'ère de la communication interplanétaire. Nul ne peut se contenter d'évoluer à l'intérieur des frontières de son pays. Il faut étudier, voyager, communiquer et surtout savoir changer de métier, de pays avec souplesse.", "audio": "CO 26/023.MP3", "_test": "26", "_pos": 23, "_origlabel": "test26#23", "_sources": ["test26#23"]}, {"type": "document", "q": "Question 26 : Que reprochait l'employeur à Monsieur Baudot ?", "c": ["Sa mauvaise gestion du temps", "Ses dépenses excessives", "Ses absences répétées", "Ses résultats insuffisants"], "a": 3, "k": "vous n'avez pas réalisé votre objectif", "transcript": "Tu te rends compte ? Il m'a convoqué dans son bureau dès que je suis arrivé. Pourquoi ? Il m'a dit, Monsieur Baudot, ce mois-ci vous n'avez pas réalisé votre objectif, vous devriez atteindre les 150 000 euros et vous en êtes loin, il va falloir être plus performant. Tu lui as répondu quoi ? D'abord que depuis que je travaille ici j'ai rarement peu de profit, en plus comme j'essaie de réduire les frais de déplacement, je fais un peu moins de ventes mais plus de bénéfices.", "audio": "CO 26/026.MP3", "_test": "26", "_pos": 26, "_origlabel": "test26#26", "_sources": ["test26#26"]}]}, "Education": {"cours": [{"type": "document", "q": "Vers qui la femme dirige-t-elle l'étudiant ?", "c": ["Le bureau des relations internationales.", "Le directeur de son département.", "Le secrétariat de son département.", "L'université étrangère qui l'intéresse."], "a": 2, "k": "au secrétariat de votre département", "transcript": "— Bonjour. C'est bien ici le bureau des relations internationales ?\n— Oui, c'est à quel sujet ?\n— Je suis en master. Je voudrais des informations sur les échanges internationaux proposés aux étudiants.\n— Demandez d'abord la liste des universités partenaires au secrétariat de votre département. Ici, nous nous occupons seulement du transfert de votre demande à l'étranger. Revenez quand le dossier sera complet et validé par le directeur de votre département.", "audio": "CO1/021.MP3", "_test": "1", "_pos": 21, "_origlabel": "test1#21", "_sources": ["test1#21"]}, {"type": "document", "q": "Comment cet homme a-t-il développé ses ventes de prêt-à-porter avec succès ?", "c": ["Il a créé un partenariat avec une marque de voiture.", "Il a distribué gratuitement ses premiers modèles.", "Il a engagé des mannequins pour présenter sa collection.", "Il s'est d'abord fait connaître auprès des étudiants."], "a": 3, "k": "je suis devenu un super vendeur de Gérard Pasquier dans les universités", "transcript": "— C'était Gérard Pasquier qui avait fait un concours. J'avais gagné ce concours pour aller dans le Michigan, faire des tests de vente de prêt-à-porter. Donc, dans une belle Ford Mustang, j'ai crapahuté un peu partout. Je me suis pris un maximum de portes fermées, puis à un moment j'ai trouvé quand même que, dans la collection, au lieu d'avoir les cinq valises, il y avait sept huit modèles qui se vendaient. Donc j'ai fait ma petite valise avec les sept huit modèles. J'ai trouvé les endroits où ça se vendait : c'était les boutiques qui étaient dans les universités, parce qu'il y a des centres commerciaux dans les universités. Et là, je suis devenu un super vendeur de Gérard Pasquier dans les universités.", "audio": "CO1/026.MP3", "_test": "1", "_pos": 26, "_origlabel": "test1#26", "_sources": ["test1#26"]}, {"type": "document", "q": "Comment favorise-t-on l'innovation chez les jeunes dans cet institut ?", "c": ["En les incitant à travailler de manière collaborative.", "En les poussant à prendre des risques importants.", "En leur offrant des formations personnalisées.", "En leur proposant de participer à des compétitions."], "a": 0, "k": "dans le cadre d'équipes diversifiées", "transcript": "— Delphine Mansceau, en tant que directrice de l'Institut pour l'innovation et la compétitivité, pensez-vous que tout le monde peut être innovant ?\n— On croit souvent que l'innovation survient par hasard, et qu'il s'agit d'un don individuel. Mais être innovant et créatif, ça s'apprend.\n— Alors, comment rend-on un étudiant innovant, par exemple ?\n— Il faut différencier l'innovation individue
