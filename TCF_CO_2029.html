lle et la capacité à être innovant collectivement. Nous avons donc mis en place des programmes pour apprendre aux jeunes à conduire des projets innovants dans le cadre d'équipes diversifiées.", "audio": "CO1/027.MP3", "_test": "1", "_pos": 27, "_origlabel": "test1#27", "_sources": ["test1#27", "test32#27"]}, {"type": "document", "q": "Question 24. Quelle est l'ambition du prix des lycéens autrichiens ?", "c": ["Développer le marché du livre de jeunesse en Autriche.", "Faire découvrir aux élèves la culture française.", "Favoriser la création artistique en classe de langue.", "Utiliser la littérature comme un support pédagogique."], "a": 3, "k": "prouver que c'est un bon outil d'apprentissage du français", "transcript": "– Quel but poursuivez-vous en organisant le prix des lycéens autrichiens auprès des élèves qui apprennent le français comme langue étrangère ?\n– Bien entendu, nous cherchons d'abord à promouvoir la langue française en Autriche. Mais nous avons surtout l'objectif d'introduire plus fortement la littérature de jeunesse française, que nous considérons comme étant très riche, dans la classe de français, pour prouver que c'est un bon outil d'apprentissage du français. En effet, c'est un excellent moyen de s'entraîner à la lecture suivie, ce qui n'est pas toujours facile dans l'apprentissage du français.", "audio": "CO 3/024.MP3", "_test": "3", "_pos": 24, "_origlabel": "test3#24", "_sources": ["test3#24"]}, {"type": "document", "q": "Question 21. Que conseille l'animateur radio aux automobilistes ?", "c": ["D'éviter l'autoroute.", "D'écouter la radio en conduisant.", "De se montrer prudent.", "De participer à un concours."], "a": 2, "k": "De se montrer prudent.", "transcript": "Chers auditeurs, au volant, restez vigilant. L'hiver peut vous surprendre. Que vous soyez expérimenté ou non, surtout quand il neige beaucoup comme aujourd'hui, ralentissez et avant de prendre la route, n'oubliez pas de consulter Québec 511 sur le web. Et pour les jeunes conducteurs, nous rappelons que le concours « Des routes l'hiver » vous offre la possibilité de gagner un cours de conduite préventive en conditions hivernales. N'hésitez pas à participer.", "audio": "CO 34/021.MP3", "_test": "4", "_pos": 21, "_origlabel": "test4#21", "_sources": ["test4#21"]}, {"type": "document", "q": "Question 28. Qu'explique la personne interrogée à propos de cette université sénégalaise ?", "c": ["Les critères de sélection sont particulièrement stricts.", "Elle manque de financement.", "Les étudiants viennent uniquement de la région.", "Le taux d'échec y est élevé."], "a": 0, "k": "Les critères de sélection sont particulièrement stricts.", "transcript": "On est aujourd'hui à Saint-Louis du Sénégal à l'université Gaston Berger. C'est la deuxième université du pays avec 10 fois moins d'étudiants qu'à Dakar. Elle a échappé à l'arrivée en masse d'étudiants pour une raison simple : l'université a été créée pour développer l'excellence. Nous avons mis en place la sélection pour assurer la réussite des étudiants que nous recrutons sur la base des résultats du bac qui doit être obtenu avec mention. Du coup, le recrutement n'est pas seulement local. On vient de partout pour s'inscrire ici. Et comme les étudiants ont un encadrement fort, les taux de réussite sont très élevés.", "audio": "CO 34/028.MP3", "_test": "4", "_pos": 28, "_origlabel": "test4#28", "_sources": ["test4#28"]}, {"type": "document", "q": "Question 25. Qu'expliquent ces personnes sur le monde universitaire québécois ?", "c": ["Le nombre d'étudiants inscrits a augmenté.", "Les cursus sur l'environnement se sont multipliés.", "Les enseignants font des carrières prestigieuses.", "Les formations sont devenues plus concrètes."], "a": 1, "k": "au-dessus de 400 programmes au Québec", "transcript": "– Vous êtes écologiste, vous êtes environnementaliste à temps plein. C'est votre carrière. C'est votre métier.\n– Tout à fait, j'ai ce plaisir, moi, quand je faisais mes études, il n'y avait pas de possibilité de travailler en environnement. Alors maintenant, il existe des formations, des cours. On va à l'université pour…\n– Tout à fait. Il existe de très nombreux programmes. C'est assez fascinant. On a au-dessus de 400 programmes au Québec, tant au niveau technique qu'au niveau cégep. 400 programmes techniques, cégep, université, pour aller à l'université pour apprendre l'environnement.\n– Oui, oui, tout à fait. Mais j'ai, je travaille beaucoup sur le terrain avant, alors que j'avais moins de programme à l'époque.", "audio": "CO 5/025.MP3", "_test": "5", "_pos": 25, "_origlabel": "test5#25", "_sources": ["test5#25"]}, {"type": "document", "q": "Question 29. De quoi est-il question dans cette émission ?", "c": ["D'un outil qui facilite l'apprentissage, quelle que soit la discipline étudiée.", "De la bonne méthode de révision d'un cours quand on est pris par le temps.", "De la difficulté à rédiger des cours motivants pour les jeunes étudiants.", "Des limites de l'enseignement à distance pour certaines disciplines."], "a": 0, "k": "un logiciel qui s'adapte à toutes les matières", "transcript": "– Parlons maintenant de l'enseignement à distance. Marielle Barreau, vous nous présentez un logiciel qui fait des fils de révision à votre place. C'est ça. Finalement, vous voulez inciter nos auditeurs étudiants à se tourner les pouces.\n– Ce n'est pas exactement ça. On vous propose en fait de travailler plus efficacement. C'est un logiciel qui s'adapte à toutes les matières et qui vous fait réviser. Le principe, c'est que vous numérisez en un temps record n'importe quel cours. Vous faites vous-même votre fiche de révision que vous saisissez sur votre clavier et le logiciel vous interroge de la façon la plus adéquate pour vous faire apprendre. Il pose des questions en rafale et s'adapte à vos difficultés en mettant l'accent là où vous avez des points faibles.", "audio": "CO 5/029.MP3", "_test": "5", "_pos": 29, "_origlabel": "test5#29", "_sources": ["test5#29"]}, {"type": "document", "q": "Question 22. Quel objectif Sylvie poursuit-elle en enseignant le français langue étrangère ?", "c": ["La diffusion d'une langue qui exprime les nuances des sentiments.", "La multiplication des actions pour la défense des droits de l'homme.", "La promotion d'un moyen d'échanges entre les différentes nationalités.", "La reconnaissance d'un patrimoine culturel unique par sa richesse."], "a": 2, "k": "une passerelle entre les peuples et les cultures", "transcript": "Sylvie, qu'est-ce qui vous plaît plus particulièrement dans votre travail ?\n– En tant que responsable multimédia, je suis également enseignante de français langue étrangère. C'est ce dernier point qui m'attire. Un de mes centres d'intérêt concerne le développement d'une politique linguistique en faveur du français comme langue de communication, et pas seulement comme symbole d'une certaine culture. J'essaie de montrer que l'apprentissage des langues est une passerelle entre les peuples et les cultures.", "audio": "CO 6/022.MP3", "_test": "6", "_pos": 22, "_origlabel": "test6#22", "_sources": ["test6#22", "test11#23", "test40#22"]}, {"type": "document", "q": "Question 29. Que dénonce cette journaliste ?", "c": ["L'absence de formation sur l'élaboration d'un budget.", "Le désintérêt des jeunes pour les questions financières.", "Le manque de cours d'économie à l'Université.", "Le peu d'informations des banques sur les crédits."], "a": 0, "k": "aucune séance de travail n'est dédiée à cette question", "transcript": "Apprendre à gérer son argent n'est pas une priorité éducative, alors que l'argent nous accompagne toute notre vie. Construire un budget, ça s'apprend, mais trop souvent le sujet est considéré tabou par les adultes. Dans la sphère de l'école, aucune séance de travail n'est dédiée à cette question.", "audio": "CO 6/029.MP3", "_test": "6", "_pos": 29, "_origlabel": "test6#29", "_sources": ["test6#29"]}, {"type": "document", "q": "Que préconise Nicolas Pinel pour les mathématiques ?", "c": ["De créer des groupes de recherche scientifique.", "De reculer l'âge de début de leur apprentissage.", "De réviser les méthodes pédagogiques actuelles.", "De sélectionner les meilleurs élèves des écoles."], "a": 2, "k": "les enseigner comme un outil de réflexion ancré dans le quotidien", "transcript": "Comment réconcilier donc les élèves et les maths ? Les maths apparaissent beaucoup trop techniques et déconnectées du monde qui nous entoure, alors qu'il faudrait les enseigner comme un outil de réflexion ancré dans le quotidien, affirme Nicolas Pinel. Il suggère de montrer que les maths sont à la portée de tous en revenant à des choses très concrètes, justement en mettant les enfants dans des situations de réussite afin qu'ils prennent du plaisir et retrouvent un sentiment de compétence. Les tout-petits peuvent par exemple apprendre à rejouer au jeu de la marchande, car figurez-vous que beaucoup d'enfants aujourd'hui ne savent plus rendre la monnaie. La place du jeu est essentielle pour combattre l'anxiété qui naît de l'échec et de la mésestime de soi.", "audio": "CO 7/020.MP3", "_test": "7", "_pos": 20, "_origlabel": "test7#20", "_sources": ["test7#20"]}, {"type": "document", "q": "Selon la directrice de cette école, quel est l'objectif de la pédagogie active ?", "c": ["Amener l'élève à participer à sa propre formation.", "Axer principalement l'apprentissage sur le jeu.", "Initier les élèves à des activités parascolaires.", "Responsabiliser les élèves encore immatures."], "a": 0, "k": "c'est une pédagogie qui implique l'élève dans son apprentissage", "transcript": "Malgré les apparences, vous n'êtes pas dans une salle de danse, mais dans une école pour le moins innovante et unique à Marseille. Ici, on enseigne bien sûr les matières essentielles, mais aussi la comédie musicale, la cuisine ou bien l'électricité. Cette école parie surtout depuis 5 ans sur la pédagogie active de remotivation dans l'intérêt de l'enfant. On écoute la directrice de l'établissement.\n– La pédagogie active, c'est une pédagogie qui implique l'élève dans son apprentissage, il est acteur, c'est-à-dire qu'on va le familiariser tout seul avec un texte ou avec n'importe quel support d'information. Il s'autonomise tout en prenant plaisir à apprendre.", "audio": "CO 7/025.MP3", "_test": "7", "_pos": 25, "_origlabel": "test7#25", "_sources": ["test7#25"]}, {"type": "document", "q": "D'après ce professeur, qu'est-ce que le débat apporte aux élèves ?", "c": ["Ils apprennent à communiquer.", "Ils développent leur créativité.", "Ils s'ouvrent à d'autres cultures.", "Ils sont dynamiques en cours."], "a": 0, "k": "faire débattre les élèves entre eux, c'est leur faire parler d'eux", "transcript": "Le débat dans la classe s'organise généralement autour d'un prétexte, généralement une œuvre littéraire, un album en classe de CP ou un conte ou une histoire traditionnelle. Et je parle de prétexte parce qu'en fait, faire débattre les élèves entre eux, c'est leur faire parler d'eux. C'est les sortir de leur individualité, c'est les faire échanger entre eux, accepter la différence, accepter la parole de l'autre, accepter le désaccord. Et comme je leur dis souvent, l'objectif c'est qu'ils se mettent à se disputer, mais à se disputer avec les bons arguments.", "audio": "CO 7/027.MP3", "_test": "7", "_pos": 27, "_origlabel": "test7#27", "_sources": ["test7#27"]}, {"type": "document", "q": "De quoi parle ce journaliste ?", "c": ["D'un ancien événement protestataire.", "D'un nouveau code vestimentaire.", "D'une fête scolaire traditionnelle.", "D'une sensibilisation aux injustices."], "a": 3, "k": "pour dénoncer les inégalités entre les hommes et les femmes", "transcript": "Dans votre cabinet de curiosités ce matin, Éric Belvaux, la journée de la jupe.\n– Oui, ça concerne cette fois les lycéens et les lycéennes qui sont invités donc à porter une jupe aujourd'hui.\n– Pourquoi ?\n– Pour dénoncer les inégalités entre les hommes et les femmes et les discriminations que subissent les femmes. Cette journée de la jupe, pour les garçons comme pour les filles, c'est une première organisée dans toute la France.", "audio": "CO 7/029.MP3", "_test": "7", "_pos": 29, "_origlabel": "test7#29", "_sources": ["test7#29"]}, {"type": "document", "q": "Question 25. Quelle est la durée de validité d'un avoir dans cette boutique ?", "c": ["Trois jours.", "Une semaine.", "Un mois.", "Cinq ans."], "a": 2, "k": "Il est valable pendant un mois.", "transcript": "– Bonjour madame. J'ai acheté ce pull il y a 3 jours, mais il a un défaut. J'aimerais me faire rembourser. Voici le ticket de caisse.\n– D'accord monsieur, mais je ne pourrai pas vous rendre la valeur de l'article en espèces. Le remboursement peut seulement se faire sous forme d'un échange ou d'un avoir.\n– Non, l'échange ne m'intéresse pas. Je n'ai trouvé aucun article qui me convienne.\n– Je vous fais donc un avoir. Il est valable pendant un mois. Vous aurez du temps pour choisir un autre produit.\n– Non, il n'en est pas question. Je pars dans une semaine en vacances et je ne pourrai pas utiliser cet avoir.\n– Ah, il existe une meilleure solution, la carte cadeau. Je mettrai le prix du pull sur cette carte et par la suite vous pouvez la créditer jusqu'à 500 €. Elle est valable 5 ans, cela vous conviendrait ?\n– C'est d'accord. Donnez-moi la carte cadeau.", "audio": "CO 8/025.MP3", "_test": "8", "_pos": 25, "_origlabel": "test8#25", "_sources": ["test8#25"]}, {"type": "document", "q": "Question 29. Pourquoi le directeur choisit-il de renoncer à ce projet ?", "c": ["Le directeur nourrit de plus grandes ambitions pour l'entreprise.", "Le groupe a décidé de restreindre son domaine d'intervention.", "Les partenaires européens trouvent le projet hasardeux.", "Les ressources financières de l'entreprise sont en baisse."], "a": 2, "k": "Rome et Berlin avaient déjà montré leurs réticences", "transcript": "– Alors, quelles informations avez-vous ramenées de Berne, Pierre ?\n– Notre partenaire suisse n'est pas favorable à l'élargissement de nos activités communes. Il estime que les investissements sont trop élevés par rapport aux retombées économiques possibles.\n– C'est également la position de nos collaborateurs anglais. Ils ne veulent pas prendre de risque inutile, étant donné le faible taux de croissance du pouvoir d'achat cette année. Ce projet est véritablement compromis.\n– Rome et Berlin avaient déjà montré leurs réticences.\n– Hum, eh bien, d'accord, arrêtons tout dès maintenant et commençons tout de suite à explorer de nouvelles pistes.", "audio": "CO 9/029.MP3", "_test": "9", "_pos": 29, "_origlabel": "test9#29", "_sources": ["test9#29"]}, {"type": "document", "q": "Pour quelle raison Marie-Hélène fréquente-t-elle les cours de bricolage ?", "c": ["Pour apprendre les termes spécifiques de la plomberie", "Pour économiser les frais d'un dépannage par un artisan", "Pour être autonome face aux petits travaux de la maison", "Pour rencontrer d'autres femmes ayant la même passion"], "a": 2, "k": "Pour être plus indépendante et savoir changer un joint, éventuellement des robinets.", "transcript": "Voici l'initiative originale d'une société spécialisée dans les cours de bricolage et qui accueille les femmes jeunes ou moins jeunes, mariées, divorcées, célibataires, étudiantes ou même retraitées. Celles qui s'inscrivent n'ont qu'un désir, ne plus se sentir démunies face à une chasse d'eau qui fuit. Marie-Hélène a assisté au cours du samedi matin, le B.A.B. de la plomberie. Le plus dur au départ, c'est le vocabulaire. Téflon, joint, siphon, une langue étrangère pour Marie-Hélène qui nous explique sa motivation. Pour être plus indépendante et savoir changer un joint, éventuellement des robinets. Est-ce que c'est rassurant qu'il n'y ait que des femmes ? Peut-être. Parce qu'on se dit que les hommes risqueraient de se moquer de nous. C'est plus, oui, rassurant.", "audio": "CO 10/022.MP3", "_test": "10", "_pos": 22, "_origlabel": "test10#22", "_sources": ["test10#22"]}, {"type": "document", "q": "Que propose cette émission ?", "c": ["Un point de vue sur la situation mondiale aujourd'hui", "Une analyse de l'actualité économique dans le monde", "Une critique des conséquences de la mondialisation", "Une réflexion sur les relations politiques mondiales"], "a": 0, "k": "Jacques Lecomte nous donne à voir ce matin une humanité en progrès.", "transcript": "Bonjour, ravi de vous retrouver dans Grand Bien Vous Fasse. La pauvreté dans le monde recule, la démocratie avance, la couche d'ozone se reconstitue, ou encore le monde n'a jamais connu aussi peu de violence. Ce matin, nous recevons un rameur à contre-courant de certaines idées reçues. Le spécialiste en psychologie positive Jacques Lecomte nous donne à voir ce matin une humanité en progrès. En s'appuyant sur une série de chiffres, des statistiques et de rapports internationaux fiables, Jacques Lecomte nous invite à regarder notre monde avec un optimisme réaliste. Il appelle ça l'optiréalisme, loin des discours catastrophistes des prophètes de malheur.", "audio": "CO 10/023.MP3", "_test": "10", "_pos": 23, "_origlabel": "test10#23", "_sources": ["test10#23"]}, {"type": "document", "q": "Pourquoi cette étudiante a-t-elle apprécié ses études en Allemagne ?", "c": ["Elle a changé de cursus universitaire", "Elle a rencontré des gens étonnants", "Elle a suivi des enseignements variés", "Elle a trouvé le niveau des cours facile"], "a": 2, "k": "Là, j'ai pu choisir mes matières. J'ai pris des cours sur la presse, sur Napoléon", "transcript": "En Allemagne, elle a profité d'études peu coûteuses, mais aussi découvert un rapport aux études supérieures complètement décomplexé par rapport à ceux qu'on connaît en France. Contrairement à la France où on est vraiment dans un programme prédéfini avec une option fortement recommandée. Donc, on n'a pas vraiment le choix. Là, j'ai pu choisir mes matières. J'ai pris des cours sur la presse, sur Napoléon, sur…\n– Napoléon, c'est original, ça.\n– Oui, Napoléon, c'est marrant de voir la vision… Bon, par exemple, eux, ils ne disent pas la défaite de Waterloo, mais la victoire de Waterloo.", "audio": "CO 10/025.MP3", "_test": "10", "_pos": 25, "_origlabel": "test10#25", "_sources": ["test10#25", "test15#24"]}, {"type": "document", "q": "Que veut Loïc Lemaire ?", "c": ["Avoir la liberté d'être son propre patron", "Innover dans le domaine informatique", "Mener un projet aux Etats-Unis", "Mieux réussir que ses parents"], "a": 0, "k": "je pense que je serais volontiers indépendant.", "transcript": "Élu récemment par le magazine Business Week parmi les 25 personnes les plus influentes du web, Loïc Lemaire, qui vit désormais à San Francisco, en Californie, au cœur de la Silicon Valley. C'est là qu'il a créé sa nouvelle société, Seesmic, qui n'est pas un coup d'essai. Ce diplômé de l'école des hautes études commerciales de Paris est devenu, au fil du temps, un serial entrepreneur.\n– Mon père était entrepreneur et mon grand-père aussi était commerçant. J'ai jamais eu vraiment envie de travailler pour qui que ce soit d'autre que moi, y compris… Peu importe la taille, en fait, de ce que je faisais, je pense que je serais volontiers indépendant. J'ai toujours voulu créer ma propre entreprise dans l'Internet. Donc, c'est les deux passions que j'ai toujours.", "audio": "CO 10/026.MP3", "_test": "10", "_pos": 26, "_origlabel": "test10#26", "_sources": ["test10#26", "test14#26", "test20#26"]}], "devoirs": [{"type": "document", "q": "Quel est le but du Collège de la Cité des sciences et de l'industrie ?", "c": ["Délivrer des diplômes à ceux qui suivent ses cours", "Elargir les connaissances scientifiques des participants", "Faire progresser la recherche scientifique en France", "Recueillir des fonds pour les laboratoires français"], "a": 1, "k": "permettre à chacun d'acquérir des connaissances fondamentales", "transcript": "Les avancées des sciences et des techniques soulèvent des questions qui touchent à la vie de chacun et font débat. Le progrès n'est plus une évidence. Les citoyens veulent comprendre ce que la recherche rend possible. Le Collège de la Cité des sciences et de l'industrie organise, tout au long de l'année, des cycles de conférences et de débats où des chercheurs viennent à la rencontre du public. L'ambition est de permettre à chacun d'acquérir des connaissances fondamentales, de s'informer des développements récents, de se former une opinion éclairée, pour que la science devienne une composante de la culture.", "audio": "CO 29/020.MP3", "_test": "29", "_pos": 20, "_origlabel": "test29#20", "_sources": ["test29#20"]}, {"type": "document", "q": "Quels sont les critères de recrutement des professeurs de l'Inalco ?", "c": ["Avoir effectué de nombreux séjours à l'étranger", "Avoir été eux-mêmes formés à l'école Colbert", "Avoir obtenu la nationalité française", "Avoir vécu dans le pays de la langue qu'ils enseignent"], "a": 3, "k": "des Français qui ont vécu dans ce pays", "transcript": "L'Institut des langues et civilisations orientales, c'est-à-dire l'Inalco, a été fondé par Colbert au XVIIe siècle à Istanbul. Aujourd'hui encore, même si l'école est à Paris, les professeurs sont soit des autochtones originaires du pays dont ils enseignent la langue, soit des Français qui ont vécu dans ce pays. Les professeurs étrangers ont souvent acquis la nationalité française par la suite. Ils sont tous des spécialistes de leur domaine, linguistique ou culturel, et un certain nombre d'entre eux ont fait leurs études à l'Institut.", "audio": "CO 29/026.MP3", "_test": "29", "_pos": 26, "_origlabel": "test29#26", "_sources": ["test29#26"]}, {"type": "document", "q": "Qu'est-ce que Léonard a de particulier ?", "c": ["Sa mémoire exceptionnelle", "Ses aptitudes au jardinage", "Ses origines sociales modestes", "Son parcours d'apprentissage"], "a": 3, "transcript": "Léonard reçoit une éducation relativement libre. C'est un enfant qui s'est mis en quelque sorte à l'école de la nature, qui scrute, qui observe tout. Il est passionné par tout ce qui l'entoure et il s'aperçoit vite que le sens de l'observation est peut-être le meilleur des enseignements.", "k": "s'est mis à l'école de la nature", "audio": "CO 30/028.MP3", "_test": "30", "_pos": 28, "_origlabel": "test30#28", "_sources": ["test30#28", "test33#27"]}, {"type": "document", "q": "Quel problème soulève l'étude menée par l'Université de Laval ?", "c": ["Les élèves manquent de temps pour prendre leur repas.", "Les habitudes alimentaires des élèves sont difficiles à modifier.", "Les menus des cantines scolaires sont mal équilibrés.", "Les restaurants scolaires coûtent cher aux familles."], "a": 1, "k": "ils sont encore trop nombreux à manger à l'extérieur de l'école", "transcript": "Des menus équilibrés, un bar à salades, une sandwicherie... L'école secondaire de Rochebelle à Sainte-Foy au Québec fait tout pour inciter les jeunes à mieux manger.\n— J'aime la nourriture, le choix, les sandwichs et le bar à salades. Je suis fatiguée de manger gras.\nUne étude parue l'année dernière sur les habitudes des jeunes, menée en collaboration avec l'Université de Laval, montre qu'ils sont encore trop nombreux à manger à l'extérieur de l'école et à privilégier la restauration rapide.\n— On aimerait augmenter de 15 % la proportion des élèves qui restent à l'école pour déjeuner.", "audio": "CO 31/028.MP3", "_test": "31", "_pos": 28, "_origlabel": "test31#28", "_sources": ["test31#28"]}, {"type": "document", "c": ["Il a décidé d'arrêter ses études d'histoire.", "Il a choisi de poursuivre uniquement des études de lettres.", "Il a décidé d'étudier dans deux différents domaines.", "Il a décidé de changer d'université."], "a": 2, "transcript": "Tiens, Alex, que fais-tu ici ? On ne te voit pas souvent dans ce département. J'ai décidé de faire des lettres. Mais cela veut dire que tu arrêtes les cours d'histoire ? Non, pas pour le moment. Comme cela, je pourrai quand même valider ma licence sans perdre mon année. Le master de lettres est plus dur que celui d'histoire. Ma décision est prise de toute façon. J'aurai bien plus de débouchés professionnels.", "k": "je pourrai quand même valider ma licence", "q": "Quel choix Alex a-t-il fait ?", "audio": "CO 32/028.MP3", "_test": "32", "_pos": 28, "_origlabel": "test32#28", "_sources": ["test32#28"]}, {"type": "document", "q": "Question 23. De quelle évolution du monde du cirque parlent les intervenants ?", "c": ["La création de numéros innovants", "La renaissance des traditions oubliées", "L'introduction des animaux sauvages", "L'ouverture de formations artistiques"], "a": 3, "k": "créer une école pour permettre aux jeunes", "transcript": "Jusqu'en 1974, l'année où Annie Fratellini et Pierre Étaix ont créé la première école de cirque en Europe, il fallait être né dans une famille pour apprendre ce métier, c'était obligatoire. Mais eux ont voulu justement créer une école pour permettre aux jeunes qui n'étaient pas issus des familles de cirque d'apprendre ce métier du cirque. Depuis, ça s'est énormément professionnalisé.", "audio": "CO 33/023.MP3", "_test": "33", "_pos": 23, "_origlabel": "test33#23", "_sources": ["test33#23"]}, {"type": "document", "q": "Question 29. De quoi traite ce reportage ?", "c": ["D'un appel à projets imaginaires", "D'un examen d'études", "D'un nouveau plan d'urbanisme", "D'une rénovation d'un monument"], "a": 0, "k": "concevoir un édifice de très grande hauteur", "transcript": "La vieille dame de fer dans tous ses états, ou comment les jeunes architectes se sont mesurés à cette forme unique qu'est la Tour Eiffel. Pour ce concours organisé par la fondation Eiffel adressé aux élèves des écoles d'architecture, la consigne était de rêver : concevoir un édifice de très grande hauteur sur le champ de Mars à Paris, à distance, accollé ou à la place de la Tour Eiffel. Trois étudiants suppriment donc carrément la tour. À la place, ils y construisent un aéroport vertical ou creusent un puits de lumière avec de vastes plateaux. D'autres choisissent de la rendre habitable en comblant ses vides par de belles couleurs ou la dotent d'un jardin suspendu.", "audio": "CO 33/029.MP3", "_test": "33", "_pos": 29, "_origlabel": "test33#29", "_sources": ["test33#29", "test40#29"]}, {"type": "document", "q": "Question 23. Quelle est l'attitude des jeunes face au don du sang ?", "c": ["Ils déplorent un manque d'information.", "Ils refusent de participer à la collecte.", "Ils s'inquiètent de la sécurité sanitaire.", "Ils souhaitent rencontrer des soignants."], "a": 0, "k": "ils ne savent pas où aller", "transcript": "La question du jour, Valérie Antier. Pourquoi l'établissement français du sang en appelle-t-il aux étudiants ? Les jeunes donnent plus facilement leur sang, il faut le savoir. Ils voient ça comme un premier acte de citoyenneté. Un acte solidaire, disent-ils, un geste utile. C'est ce qui ressort des sondages. Un donneur sur cinq a entre 18 et 24 ans en France. Mais souvent, ils déclarent ne pas donner parce qu'ils ne sont pas sollicités, pas assez en tout cas, ou bien parce qu'ils ne savent pas où aller. Du coup, la semaine prochaine, l'établissement français du sang lance une campagne pour mobiliser les étudiants. Le slogan : « On est plus qu'amis, on est donneurs de sang. »\nQuelle est l'attitude des jeunes face au don du sang ?", "audio": "CO 36/023.MP3", "_test": "36", "_pos": 23, "_origlabel": "test36#23", "_sources": ["test36#23"]}, {"type": "document", "q": "Question 27. Pour quelle raison ces évaluations ont-elles été critiquées ?", "c": ["Parce qu'elles étaient difficiles à mettre en œuvre.", "Parce qu'elles ignoraient la particularité des contextes.", "Parce qu'elles avaient lieu tôt dans l'année scolaire.", "Parce qu'elles proposaient des exercices complexes."], "a": 2, "k": "une évaluation qui intervenait au mois de janvier", "transcript": "Dans toutes les écoles primaires de France, 815 900 élèves du cours élémentaire vont passer des évaluations nationales en français et mathématiques. Alors ces évaluations nationales sont-elles utiles ? L'évaluation est un acte quotidien pour tous les enseignants. Là, c'est une évaluation institutionnelle que propose le ministère de l'Éducation nationale. Ça a déjà été effectué au mois de janvier pour les élèves du cours moyen et, à l'époque, on l'avait d'ailleurs fortement critiqué puisque c'était une évaluation qui intervenait au mois de janvier alors qu'une grande partie des programmes n'avaient pas été effectués.\nPour quelle raison ces évaluations ont-elles été critiquées ?", "audio": "CO 36/027.MP3", "_test": "36", "_pos": 27, "_origlabel": "test36#27", "_sources": ["test36#27"]}, {"type": "document", "q": "Question 28 : Selon ce reportage, pourquoi les futurs apprentis doivent-ils se montrer tenaces ?", "c": ["Parce que l'apprentissage est une formation longue.", "Parce que le lieu de stage peut être difficile à trouver.", "Parce que les centres de formation sont surchargés.", "Parce que les patrons préfèrent les jeunes diplômés."], "a": 1, "k": "Il faut parfois démarcher plusieurs dizaines d'entreprises", "transcript": "L'apprentissage en centre de formation est une voie possible après la classe de troisième. Pour y parvenir, deux mots d'ordre. Motivation et ténacité. Motivation, car c'est l'un des critères majeurs de recrutement par des patrons. Ténacité, car il faut impérativement décrocher un stage pour pouvoir s'inscrire dans tout centre de formation. Et là, ce n'est pas forcément gagner d'entrée. Il faut parfois démarcher plusieurs dizaines d'entreprises avant de trouver son bonheur.", "audio": "CO 37/028.MP3", "_test": "37", "_pos": 28, "_origlabel": "test37#28", "_sources": ["test37#28"]}, {"c": ["Le report de la remise d'un devoir.", "Le changement de l'emploi du temps.", "Le rattrapage d'une mauvaise note.", "Le programme de révision pour un examen."], "a": 0, "q": "Sur quoi le professeur et l'élève sont-ils d'accord ?", "transcript": "Monsieur, pourrais-je faire mon exposé plus tard que prévu ? Pourquoi voulez-vous déplacer la date de votre exposé ? Parce que sinon, je ne pourrais pas terminer la dissertation que vous avez demandée. Pour le bon déroulement du cours, il est important que vous fassiez votre exposé la semaine prochaine. Je préfère encore que vous me rendiez le travail écrit en retard. Je comprends. J'essaierai donc de faire comme ça.", "k": "terminer la dissertation que vous avez demandée", "type": "document", "audio": "CO 39/025.MP3", "_test": "39", "_pos": 25, "_origlabel": "test39#25", "_sources": ["test39#25"]}, {"type": "document", "q": "Question 27. Que souhaite la jeune fille ?", "c": ["Revendre des livres d'occasion auprès des finissants", "Rencontrer les étudiants nouvellement inscrits", "Se rendre à une vente de livres universitaires d'occasion à la faculté", "Aller acheter des livres pour réviser avec son ami avant leurs examens"], "a": 3, "k": "Aller acheter des livres pour réviser avec son ami avant leurs examens", "transcript": "Tu as vu les fiches dans le hall de l'université ce week-end. Les finissants organisent une bourse au livre sur les programmes qu'ils ont étudiés. On y va.\n– Tu sais, ce genre de vente ne m'intéresse pas parce que les manuels changent tous les ans, surtout en économie. Il faut se tenir au courant de tout.\n– Non ? Vas-y toute seule. Tu me déçois. On va rencontrer des étudiants qui ont déjà travaillé sur notre futur programme. C'est aussi important. Pouvoir discuter sur ce que l'on va rencontrer l'an prochain. Le cursus, les profs, le diplôme. Allez, viens.\n– Non, je n'ai pas envie. Je dois revoir mes cours pour mes partiels.", "audio": "CO 18/027.MP3", "_test": "18", "_pos": 27, "_origlabel": "test18#27", "_sources": ["test18#27"]}, {"type": "document", "q": "Question 20. Pour Hélène Carrère, quel est le problème des lycées français de l'étranger ?", "c": ["Le nombre d'élèves est en baisse.", "Les frais de scolarité sont élevés.", "Leurs programmes sont inadaptés.", "Leurs financements sont fragilisés."], "a": 3, "k": "C'est l'État seul qui soutient les lycées", "transcript": "Hélène Carrère d'Encausse, votre article nous informe du danger qui menace l'existence et le développement des lycées français de l'étranger. Oui, ces lycées étaient payants, ils sont devenus gratuits en 2007. Cette décision, au départ généreuse, se retourne finalement contre les lycées, car les entreprises qui payaient ne le font plus. C'est l'État seul qui soutient les lycées. Donc, quand cela deviendra trop lourd pour l'État, il risque de vouloir en fermer certains.", "audio": "CO 23/020.MP3", "_test": "23", "_pos": 20, "_origlabel": "test23#20", "_sources": ["test23#20"]}, {"type": "document", "q": "Question 26. Qu'est-ce que cette personne conseille aux étudiants ?", "c": ["Aller à l'essentiel.", "Faire des phrases courtes.", "Hiérarchiser ses idées.", "S'exprimer avec précision."], "a": 3, "k": "remplacer le verbe être dans vos textes par d'autres verbes, plus appropriés", "transcript": "Étudiant, lycéen ? Il existe une façon très simple d'améliorer vos copies, c'est d'éviter l'utilisation du verbe être. Ce verbe apparaît trop souvent dans les dissertations. Or, le verbe être, c'est la description d'un état et une succession de descriptions d'états n'a jamais constitué une explication. Vous pouvez vous entraîner à remplacer le verbe être dans vos textes par d'autres verbes, plus appropriés à ce que vous voulez dire. Vous verrez, vous allez enrichir votre vocabulaire et vous trouverez votre production bien plus intéressante. Après tout, Georges Perec, qui a écrit un livre qui s'appelle La Disparition, dans lequel il n'a pas utilisé la lettre « e », vous pouvez bien rédiger une rédaction sans être.", "audio": "CO 23/026.MP3", "_test": "23", "_pos": 26, "_origlabel": "test23#26", "_sources": ["test23#26"]}, {"type": "document", "q": "Question 28. Quels problèmes soulève l'étude menée par l'université de Laval ?", "c": ["Les élèves manquent de temps pour prendre leurs repas.", "Les habitudes alimentaires des élèves sont difficiles à modifier.", "Les menus des cantines scolaires sont très mal équilibrés.", "Les restaurants scolaires coutent cher aux familles."], "a": 1, "k": "encore trop nombreux à manger à l'extérieur de l'école et à privilégier la restauration rapide", "transcript": "Des menus équilibrés ? Un bar à salades, un sandwich… L'école secondaire de Rochebelle à Sainte-Foy, au Québec, fait tout pour inciter les jeunes à mieux manger. J'aime la nourriture, le choix, les sandwiches et le bar à salades. Fatigués de manger gras. Une étude parue l'année dernière sur les habitudes des jeunes, menée en collaboration avec l'université de Laval, montre qu'ils sont encore trop nombreux à manger à l'extérieur de l'école et à privilégier la restauration rapide. On aimerait augmenter de 15 % la proportion des élèves qui restent à l'école pour déjeuner.", "audio": "CO 23/028.MP3", "_test": "23", "_pos": 28, "_origlabel": "test23#28", "_sources": ["test23#28"]}, {"type": "document", "q": "Question 29. Que dénonce cette personne ?", "c": ["L'absence de formation à l'élaboration du budget.", "Le désintérêt des jeunes pour les questions financières.", "Le manque de cours d'économie à l'université.", "Le peu d'information des banques sur les crédits."], "a": 0, "k": "aucune séance de travail n'est dédiée à cette question", "transcript": "Apprendre à gérer son argent n'est pas une priorité éducative. Alors que l'argent nous accompagne toute notre vie, construire un budget, ça prend du temps, mais trop souvent, le sujet est considéré tabou par les adultes. Donc la question d'en parler avec les enfants dans la sphère de l'école, aucune séance de travail n'est dédiée à cette question. Pourtant chacun est concerné dans sa vie professionnelle et personnelle par les principales notions que sont les coûts, les crédits, les prêts et tout d'intérêt, l'endettement, l'économie à l'échelle de l'individu. Voilà un domaine qui touche chaque français sans que jamais celui-ci y soit vraiment initié.", "audio": "CO 23/029.MP3", "_test": "23", "_pos": 29, "_origlabel": "test23#29", "_sources": ["test23#29"]}]}, "VieQuotidienne": {"cours": [{"type": "document", "q": "Que font les amis ?", "c": ["Ils dînent au restaurant.", "Ils jouent aux cartes.", "Ils révisent leurs leçons.", "Ils préparent le repas."], "a": 1, "k": "Continuez à jouer, distribuez sans moi", "transcript": "— Thé, café ? Trois cafés les gars ! Julie, café aussi ?\n— Euh non, je préférerais un thé.\n— Nature ? Citron ? Bergamote ?\n— Ce que tu veux, avec un peu de lait.\n— Trois cafés et deux thés au lait. Je n'en ai pas pour longtemps. Continuez à jouer, distribuez sans moi.", "audio": "CO1/022.MP3", "_test": "1", "_pos": 22, "_origlabel": "test1#22", "_sources": ["test1#22"]}, {"type": "document", "q": "Question 26. Pourquoi le client demande-t-il la résiliation de son abonnement ?", "c": ["Il trouve que cela lui coûte trop cher.", "Il pense que cela ne lui est plus utile.", "Il trouve que l'augmentation est injustifiée.", "Il pense qu'il aurait dû être prévenu."], "a": 3, "k": "Il pense qu'il aurait dû être prévenu.", "transcript": "– Allô ! Bonjour madame, c'est monsieur. J'ai reçu mon relevé bancaire et je vois que mon abonnement au service en ligne a augmenté de 5 %. Ce n'est pas beaucoup certes, mais est-ce normal ?\n– Oui, je vous rassure, c'est bien normal. Tous nos tarifs ont subi une augmentation au 1er janvier.\n– Peut-être mais je ne reçois aucun courrier pour m'avertir.\n– Vous avez raison mais nos conditions tarifaires sont affichées à l'agence.\n– Cela ne justifie pas que vous n'avertissez pas vos clients. Je vous demande de résilier cet abonnement au plus vite.", "audio": "CO 2/026.MP3", "_test": "2", "_pos": 26, "_origlabel": "test2#26", "_sources": ["test2#26"]}, {"type": "document", "q": "Question 28. Quelle est l'attitude à adopter par le personnel ?", "c": ["Être insistant pour augmenter les ventes.", "Ignorer les clients pour leur donner de l'espace.", "Assister de façon discrète le client.", "Se concentrer sur l'arrangement des produits."], "a": 2, "k": "Assister de façon discrète le client.", "transcript": "Bonjour à tous. Vous avez tous passé les tests avec succès et le monde enchanté est heureux de vous accueillir parmi son personnel. La période des fêtes voit notre magasin littéralement envahi d'enfants venus repérer les jouets à commander. Vous devez être attentifs, agréables, sans insistance. Toutefois, faites la démarche d'aller conseiller les clients sur les produits, mais sachez vous effacer afin de leur permettre d'être à l'aise et donc de consommer en toute tranquillité. Je compte sur vous pour véhiculer une bonne image du magasin. Pas d'acharnement donc. Bonne journée.", "audio": "CO 2/028.MP3", "_test": "2", "_pos": 28, "_origlabel": "test2#28", "_sources": ["test2#28"]}, {"type": "document", "q": "Question 23. Qu'est-ce que Gérard aurait aimé faire ?", "c": ["Acquérir son logement.", "Épargner de l'argent.", "Exercer un autre métier.", "Fonder un foyer."], "a": 3, "k": "Je n'ai jamais été marié, je n'ai jamais eu d'enfant", "transcript": "– Bonjour Gérard. Nous écoutons votre témoignage.\n– Eh bien, moi, j'ai passé la plus grande partie de ma vie à travailler. J'ai placé ma vie sous le signe de cette phrase d'un philosophe : on existe parce que l'on fait. Mais aujourd'hui, à 62 ans, je me dis que le bilan n'est peut-être pas aussi positif que ça. J'ai une jolie maison, un train de vie plutôt élevé. Je n'ai jamais été marié, je n'ai jamais eu d'enfant. Ma vie amoureuse fut un parfait désastre.", "audio": "CO 3/023.MP3", "_test": "3", "_pos": 23, "_origlabel": "test3#23", "_sources": ["test3#23"]}, {"type": "document", "q": "Question 27. Pourquoi le client demande-t-il la résiliation de son abonnement bancaire ?", "c": ["Les frais ont trop augmenté.", "Il change de banque.", "Il n'utilise plus ce service.", "Il pense qu'il aurait dû être prévenu."], "a": 3, "k": "Il pense qu'il aurait dû être prévenu.", "transcript": "– Allô ! Bonjour madame, c'est monsieur Étienne. J'ai reçu mon relevé bancaire et je vois que mon abonnement au service en ligne a augmenté de 5 %. C'est pas beaucoup certes, mais est-ce normal ?\n– Oui, je vous rassure, c'est bien normal. Tous nos tarifs ont subi une augmentation au 1er janvier.\n– Peut-être, mais je n'ai reçu aucun courrier pour m'avertir.\n– Vous avez raison, mais nos conditions tarifaires sont affichées à l'agence.\n– Cela ne justifie pas que vous n'avertissez pas vos clients. Alors, je vous demande de résilier cet abonnement au plus vite.", "audio": "CO 34/027.MP3", "_test": "4", "_pos": 27, "_origlabel": "test4#27", "_sources": ["test4#27"]}, {"type": "document", "q": "Question 24. Selon l'intervenant, pourquoi accumulons-nous des objets ?", "c": ["Pour afficher notre niveau de vie.", "Pour affirmer notre personnalité.", "Pour améliorer notre quotidien.", "Pour imiter notre entourage."], "a": 1, "k": "nous permet de nous construire une identité", "transcript": "Pourquoi accumulons-nous des objets ? L'objet, en fait, nous signale. L'objet, c'est un peu nous. Je suis ce que j'ai, je suis ce que je porte, je suis ce que je possède. Et en fait, l'objet, via le regard d'autrui sur notre objet, nous permet de nous construire une identité, qui on est, notre intérêt.", "audio": "CO 6/024.MP3", "_test": "6", "_pos": 24, "_origlabel": "test6#24", "_sources": ["test6#24", "test32#23"]}, {"type": "document", "q": "Question 24. Quel est le problème soulevé ?", "c": ["La voiture est interdite en centre-ville.", "Le sens de la circulation a été modifié.", "Le stationnement est devenu payant.", "Les embouteillages sont fréquents."], "a": 2, "k": "la réglementation vient de changer", "transcript": "Charlotte, tu as trouvé une place pour te garer ?\n– Oui, mais j'ai mis au moins un quart d'heure entre les emplacements réservés et les arrêts minute.\n– Et tu t'es garée où ?\n– Rue Colbert, après l'intersection avec la rue en sens interdit.\n– Tu as pensé à prendre un ticket de stationnement ?\n– Non, c'est gratuit dans ce quartier.\n– Plus maintenant, la réglementation vient de changer.\n– Bon, j'y retourne avant le passage des agents municipaux.", "audio": "CO 8/024.MP3", "_test": "8", "_pos": 24, "_origlabel": "test8#24", "_sources": ["test8#24"]}, {"type": "document", "q": "Question 28. Que recherchent les habitants de ces lieux ?", "c": ["Adopter un mode de vie collectif responsable.", "Construire un réseau d'assainissement des eaux.", "Faire la promotion de logements écologiques.", "Mener une politique d'aménagement des villes."], "a": 0, "k": "des familles qui vivent côte à côte, mais aussi ensemble", "transcript": "Si demain vous viviez dans une oasis, je ne vous parle pas d'un lac avec des petits palmiers au milieu du désert, mais d'une communauté, d'une petite communauté en France, en ville ou à la campagne, où vos voisins seraient comme vous décidés à vivre de façon plus écolo. C'est ça les oasis, 500 petits groupes aujourd'hui, des familles qui vivent côte à côte, mais aussi ensemble, et c'est peut-être avant-gardiste. Prenez par exemple en Eure-et-Loir, l'écohameau du Plessis : 28 familles, soit 60 personnes, qui vivent dans des bâtiments bioclimatiques dont le chauffage, pour faire simple, ne pollue pas, qui toutes ont renoncé à se brancher au tout-à-l'égout. Leurs eaux grises sont traitées dans des bassins plantés de roseaux qui dépolluent. C'est parfaitement légal et ça marche.", "audio": "CO 9/028.MP3", "_test": "9", "_pos": 28, "_origlabel": "test9#28", "_sources": ["test9#28"]}, {"type": "document", "q": "Qu'est-ce que Sarah regrette ?", "c": ["De disposer d'une petite surface", "De partager sa salle de bain", "De payer un loyer excessif", "De prendre ses repas seule"], "a": 1, "k": "une seule douche pour quatre, ça n'est vraiment pas commode", "transcript": "– Alors, Sarah, comment se passe la vie en colocation ?\n– Ah, écoute, tu sais, une seule douche pour quatre, ça n'est vraiment pas commode, surtout le matin. Mais bon, faut s'organiser un peu, c'est tout.\n– Hum, c'est toujours mieux que la chambre de bonne que tu avais avant, non ?\n– T'as raison, neuf mètres carrés pour 750 euros, c'est exagéré, même avec une vue sur la tour Eiffel. Au moins, maintenant, le loyer est divisé par quatre. Et pour les courses, vous faites aussi caisse commune ?\n– Ah non, là, c'est chacun pour soi. Et c'est aussi bien, d'ailleurs. Sinon, le frigo serait toujours vide.", "audio": "CO 10/024.MP3", "_test": "10", "_pos": 24, "_origlabel": "test10#24", "_sources": ["test10#24", "test12#23"]}, {"type": "document", "q": "Que va faire la cliente ?", "c": ["Elle va repartir avec sa voiture.", "Elle va revenir dans dix minutes.", "Elle va revenir le lendemain.", "Elle va repartir sans sa voiture."], "a": 3, "k": "laissez-la-moi toute l'après-midi", "transcript": "– Bonjour madame Lévesque. Qu'est-ce qui vous amène aujourd'hui ?\n– Eh bien, ma voiture a un problème au démarrage depuis hier. Elle démarre assez bien, puis elle s'arrête brusquement au bout de 10 minutes. Vous pouvez voir ce qui se passe ?\n– Maintenant, ce n'est pas possible. Demain peut-être.\n– Ah, c'est dommage. J'en ai vraiment besoin demain.\n– Attendez, je regarde mon agenda… Écoutez, laissez-la-moi toute l'après-midi et vous la reprendrez ce soir, elle sera prête.\n– C'est vraiment très gentil de votre part. Alors, à ce soir. Merci.", "audio": "CO 24/021.MP3", "_test": "24", "_pos": 21, "_origlabel": "test24#21", "_sources": ["test24#21"]}, {"type": "document", "q": "Qu'est-ce que Gérard regrette de ne pas avoir fait ?", "c": ["Acquérir son logement.", "Épargner de l'argent.", "Exercer un autre métier.", "Fonder un foyer."], "a": 3, "k": "je n'ai jamais été marié", "transcript": "– Bonjour, Gérard. Nous écoutons votre témoignage.\n– Eh bien, moi, j'ai passé la plus grande partie de ma vie à travailler. J'ai placé ma vie sous le signe de cette phrase d'un philosophe : « On existe parce que l'on fait. » Mais aujourd'hui, à 62 ans, je me dis que le bilan n'est peut-être pas aussi positif que ça. J'ai une jolie maison, un train de vie élevé… je n'ai jamais été marié, je n'ai jamais eu d'enfant, vie amoureuse un peu désastreuse. On existe parce que l'on fait, certes, mais le prix n'est-il pas trop élevé ?", "audio": "CO 24/023.MP3", "_test": "24", "_pos": 23, "_origlabel": "test24#23", "_sources": ["test24#23"]}, {"type": "document", "q": "Que retient-on sur le transport maritime ?", "c": ["Les accidents peuvent être très graves.", "Les navires sont inadaptés aux besoins.", "Les passagers se sentent en insécurité.", "Les profils économiques sont en baisse."], "a": 0, "k": "les accidents se transforment donc en catastrophe", "transcript": "C'est une des richesses de la France : elle possède la deuxième façade maritime du monde, derrière les États-Unis. C'est une chance économique de première importance. Plus de 80 % du trafic mondial de marchandises passe par la mer. Aujourd'hui, les plus gros navires peuvent transporter des quantités colossales — les super pétroliers, un demi-million de mètres cubes de pétrole — et les accidents se transforment donc en catastrophe. Le sable breton se souvient encore des naufrages de l'Amoco Cadiz et de l'Erika. Le gigantisme a aussi gagné le transport des passagers depuis longtemps. Le drame du Costa Concordia vient de le rappeler.", "audio": "CO 24/024.MP3", "_test": "24", "_pos": 24, "_origlabel": "test24#24", "_sources": ["test24#24"]}, {"type": "document", "q": "De quoi s'étonne le jeune homme ?", "c": ["Des différences entre la taxe locative et la taxe foncière", "Du délai accordé pour le paiement des taxes", "Du mode de calcul de la taxe locative", "Du système français de taxe d'habitation"], "a": 3, "k": "Quoi ? Il faut que je paye le loyer et cette facture locale ? Mais dans mon pays, ça n'existe pas, ça.", "transcript": "— Bonjour madame. J'habite en France depuis 6 mois seulement dans un studio. J'ai reçu une feuille d'impôt bizarre à payer avant le 15 octobre prochain. Pourquoi ?\n— Oui, c'est normal. Il y a le loyer et une fois par ans, il y a les impôts locaux. Ils sont basés sur la superficie de votre studio et sur le lieu de résidence.\n— Quoi ? Il faut que je paye le loyer et cette facture locale ? Mais dans mon pays, ça n'existe pas, ça.\n— Désolée, mais chaque pays a ses lois. Si vous étiez propriétaire, vous payeriez aussi la taxe foncière, mais pas de loyer, bien sûr.", "audio": "CO 29/027.MP3", "_test": "29", "_pos": 27, "_origlabel": "test29#27", "_sources": ["test29#27"]}, {"type": "document", "q": "Quelle information le chef de train donne-t-il aux voyageurs ?", "c": ["Ils devront demander le remboursement de leur billet par écrit", "Ils devront descendre en gare de Valence suite à une panne", "Ils devront patienter à leur place jusqu'à l'arrêt complet du train", "Ils devront présenter leur billet à leur descente du train"], "a": 0, "k": "un document à remplir et à retourner à l'adresse indiquée", "transcript": "Mesdames, messieurs, suite à un incident technique, notre train arrive en gare de Valence TGV avec un retard de 45 minutes. Nous invitons tous les voyageurs qui descendent à se rapprocher du personnel de gare. Il vous remettra une enveloppe et un document à remplir et à retourner à l'adresse indiquée pour que la SNCF puisse vous virer la somme correspondant au prix de votre billet de train, à titre de dédommagement. Nous vous prions de bien vouloir nous excuser pour la gêne occasionnée. Assurez-vous de n'avoir rien oublié à vos places. Bonne fin de journée.", "audio": "CO 29/029.MP3", "_test": "29", "_pos": 29, "_origlabel": "test29#29", "_sources": ["test29#29", "test30#29"]}, {"type": "document", "c": ["Elle va appeler le locataire.", "Elle va attendre un petit peu.", "Elle va refuser le paiement.", "Elle va revenir une autre fois."], "a": 1, "transcript": "Allô ? Bonjour madame Tremblay. Je suis désolé, il y a eu un problème informatique à ma banque, je ne peux pas retirer d'argent. Ou bien je vous règle mon loyer dans deux ou trois jours, ou bien je vous apporte un chèque demain si vous préférez. Non, ce n'est pas la peine, deux ou trois jours ce n'est pas si long. Merci beaucoup.", "k": "deux ou trois jours ce n'est pas si long", "q": "Que va faire la propriétaire ?", "audio": "CO 32/020.MP3", "_test": "32", "_pos": 20, "_origlabel": "test32#20", "_sources": ["test32#20"]}, {"type": "document", "c": ["Parce que la consommation dépend avant tout du pouvoir d'achat.", "Parce que la création d'emploi restera rare dans ce secteur d'activité.", "Parce que les commerces font des bénéfices sur les ventes en semaine.", "Parce que les Français ne sont pas habitués à consommer le dimanche."], "a": 0, "transcript": "Autoriser les magasins à ouvrir le dimanche en France, serait-ce la solution pour développer la croissance et l'emploi ? Le directeur de la revue 60 millions de consommateurs s'explique. Le secrétaire d'État a relevé qu'en visitant un dimanche un centre commercial, les boutiques réalisent sur ce seul jour plus du tiers du chiffre d'affaires de toute la semaine. Oui, mais voilà, ce qu'on achète le dimanche, on ne l'achète pas les autres jours et vice versa. Attention aux illusions d'optique. Les consommateurs dépensent d'abord en fonction de leurs revenus et non en fonction des jours d'ouverture des magasins, c'est simplement une autre répartition du temps d'achat. Donc quel impact pour la croissance et l'emploi en général ? Je crains que ça ne change rien.", "k": "les consommateurs dépensent d'abord en fonction de leurs revenus", "q": "D'après le directeur de la revue, pourquoi l'ouverture des magasins le dimanche aurait-elle peu d'influence sur l'économie française ?", "audio": "CO 32/025.MP3", "_test": "32", "_pos": 25, "_origlabel": "test32#25", "_sources": ["test32#25"]}, {"type": "document", "q": "Quel temps fait-il aujourd'hui ?", "c": ["Il fait beau qu'hier.", "Il fait plus mauvais qu'hier.", "Il pleut plus qu'hier.", "Il y a moins de soleil qu'hier."], "a": 0, "k": "C'est bien mieux qu'hier", "transcript": "Quelle froid ce matin ? — Oui, mais au moins, il y a du soleil. C'est bien mieux qu'hier toute la journée, c'était l'horreur. — Ah oui, j'aime mieux ce froid sec.", "audio": "CO 15/020.MP3", "_test": "15", "_pos": 20, "_origlabel": "test15#20", "_sources": ["test15#20", "test33#20"]}, {"type": "document", "q": "Question 24. Que souhaite cette intervenante ?", "c": ["Un meilleur contrôle des repas dans les cantines.", "Une information complète pour le consommateur.", "Une promotion des produits bons pour la santé.", "Une suppression des emballages en plastique."], "a": 1, "k": "substances qui sont invisibles à l'œil nu", "transcript": "On a l'impression, en nous entendant, qu'on est en train de s'empoisonner chaque fois qu'on va à la cantine. Ce qui est inacceptable, c'est qu'il y a plein de substances qui sont invisibles à l'œil nu dans les aliments, que le consommateur ne peut pas choisir s'il va les avaler ou pas, puisque ça n'est pas indiqué sur les emballages, qu'on ne le sait pas, et que oui, c'est dangereux pour la santé. Donc, ce qu'on ne veut pas, c'est pas qu'on cesse de s'alimenter les uns les autres faut-il encore... Ah, dis-peu, là, quand même. Non, non, mais parce que la peur, la seule façon de ne pas l'alimenter, c'est de dire, eh bien oui, faisons ce qu'il faut pour qu'effectivement, quand on achète nos aliments, que ce soit au supermarché ou ailleurs, on n'a pas à se poser la question des substances cachées qui peuvent être dangereuses pour notre santé. Que souhaite cette intervenante ?", "audio": "CO 35/024.MP3", "_test": "35", "_pos": 24, "_origlabel": "test35#24", "_sources": ["test35#24"]}, {"type": "document", "q": "Question 20. Pourquoi y a-t-il un retard de livraison ?", "c": ["La circulation routière est coupée.", "La commande s'est perdue.", "Le transporteur est en grève.", "Les marchandises ont été volées."], "a": 0, "k": "La neige a interrompu le trafic.", "transcript": "– Allô ! Bonjour, je suis madame Leroy. J'ai passé une commande de vêtements par téléphone il y a dix jours avec une livraison à domicile et pourtant rien n'est arrivé pour l'instant.\n– Donnez-moi votre numéro client Blanche-Maison, s'il vous plaît. Je vais vérifier. En effet, la livraison n'a pas été faite. La neige a interrompu le trafic. Le transporteur ne pourra vous livrer que demain.\nPourquoi y a-t-il un retard de livraison ?", "audio": "CO 36/020.MP3", "_test": "36", "_pos": 20, "_origlabel": "test36#20", "_sources": ["test36#20"]}, {"type": "document", "q": "Question 26. D'après Camille, quel est le point fort de l'immobilier à Québec ?", "c": ["La recherche d'un appartement est rapide.", "Le système de la colocation est encouragé.", "Les habitations proposées sont de qualité.", "Les logements sont bon marché en banlieue."], "a": 0, "k": "Ça se fait en quelques jours.", "transcript": "– Camille, à ton arrivée à Québec, dans quel type de logement résidais-tu ?\n– J'ai d'abord habité un appartement en colocation dans le quartier de Montcalm. Au bout de six mois à peine, j'ai emménagé à deux pas du centre-ville. C'est très simple de trouver un logement ici. Ça se fait en quelques jours.\n– Comment as-tu trouvé ton premier appartement ?\n– Avant de quitter la France, sur un site internet regroupant les annonces de colocation. Mais je conseille de chercher sur place. Il y a tout ce qu'il faut pour trouver facilement. On peut découvrir le quartier, voir si les pièces sont spacieuses, lumineuses et surtout bien insonorisées. Ce n'était pas le cas de mon premier logement, malgré le nom du quartier.\nD'après Camille, quel est le point fort de l'immobilier à Québec ?", "audio": "CO 36/026.MP3", "_test": "36", "_pos": 26, "_origlabel": "test36#26", "_sources": ["test36#26"]}], "devoirs": [{"type": "document", "q": "Question 24 : Pourquoi les pêcheurs utilisent-ils une cabane ?", "c": ["Pour conserver le poisson au frais.", "Pour ranger leur matériel de pêche.", "Pour se protéger du froid.", "Pour se reposer entre deux pêches."], "a": 2, "k": "chaque pêcheur se protège du froid", "transcript": "– Dis-moi, Paul, c'est quoi la pêche blanche au Québec ? — On l'appelle blanche parce qu'on pêche l'hiver à la ligne en creusant des trous dans la glace des lacs et des rivières gelées. — Mais vous, vous devez geler et attendre le poisson sans bouger. — Non, car chaque pêcheur se protège du froid en installant une cabane en bois au-dessus des trous. C'est une pêche d'intérieur. — Oh, que c'est ça ! En tout cas, le poisson est bien frais.", "audio": "CO 38/024.MP3", "_test": "38", "_pos": 24, "_origlabel": "test38#24", "_sources": ["test38#24"]}, {"type": "document", "q": "Question 28 : Quelle information le chef de train donne-t-il aux voyageurs ?", "c": ["Les passagers peuvent obtenir le remboursement de leur billet.", "Le train s'arrêtera en gare de Valence en raison d'une panne.", "Les passagers doivent rester assis jusqu'à l'arrêt du train.", "Le trajet sera annulé en raison d'un incident technique."], "a": 0, "k": "vous virer la somme correspondant au prix de votre billet", "transcript": "Mesdames, Messieurs, suite à un incident technique, notre train arrive en gare de Valence TGV avec un retard de 45 minutes. Nous invitons tous les voyageurs qui descendent à se rapprocher du personnel de gare, il vous remettra une enveloppe et un document à remplir et à retourner à l'adresse indiquée pour que la SNCF puisse vous virer la somme correspondant au prix de votre billet de train à titre de dédommagement. Nous vous prions de bien vouloir nous excuser pour la gêne occasionnée. Assurez-vous de n'avoir rien oublié à vos places, bonne fin de journée.", "audio": "CO 38/028.MP3", "_test": "38", "_pos": 28, "_origlabel": "test38#28", "_sources": ["test38#28"]}, {"type": "document", "q": "Question 29 : Selon le chroniqueur, que permet la course par rapport à la marche ?", "c": ["De mieux contrôler son poids.", "De renforcer ses muscles plus vite.", "De réduire le risque de blessures.", "D'améliorer son endurance."], "a": 0, "k": "la perte de poids, c'est la course qui l'emporte", "transcript": "Et on termine avec vous, Jeannie, qui nous pose une grande question existentielle, marcher ou courir ? — Ça dépend, c'est ce qui ressort de quelques études récentes qui ont opposé les 2 exercices et mesuré leurs effets. L'une d'elles a été publiée le mois dernier dans la revue Medicine and Science in Sports and Exercise. Conclusion, en ce qui concerne la perte de poids, c'est la course qui l'emporte haut la main. Les coureurs sont plus minces, moins de surcharge pondérale que les marcheurs, et passé l'âge de 55 ans, c'est encore plus vrai. Même si le nombre de kilomètres parcourus à la course par semaine est minime, il y a une différence entre les coureurs et les marcheurs, et la cause pourrait être l'effet de la course sur l'appétit.", "audio": "CO 38/029.MP3", "_test": "38", "_pos": 29, "_origlabel": "test38#29", "_sources": ["test38#29"]}, {"type": "document", "q": "Pourquoi les pêcheurs utilisent-ils une cabane ?", "c": ["Pour conserver le poisson.", "Pour ranger leur matériel.", "Pour se réchauffer.", "Pour se reposer."], "a": 2, "k": "se protège du froid en installant une cabane", "transcript": "— Dis-moi, Paul, c'est quoi la pêche blanche au Québec ?\n— On l'appelle blanche parce qu'on pêche l'hiver à la ligne en creusant des trous dans la glace.\n— Vous devez geler à attendre le poisson.\n— Non, car chaque pêcheur se protège du froid en installant une cabane en bois au-dessus des trous.\n— C'est une pêche d'intérieur ! En tout cas, le poisson est bien frais.", "audio": "CO 40/025.MP3", "_test": "40", "_pos": 25, "_origlabel": "test40#25", "_sources": ["test40#25"]}, {"type": "document", "q": "Question 24. Quel phénomène apparaît chez les seniors ?", "c": ["Ils choisissent de partager leur habitation avec des jeunes", "Ils recherchent des appartements aménagés selon leurs besoins", "Ils refusent de laisser leurs biens à des locataires sans emploi", "Ils s'organisent pour faire valoir leur droit au logement"], "a": 0, "k": "La colocation entre différentes générations commence donc à se développer", "transcript": "Aujourd'hui, de plus en plus de Français ont recours à la colocation comme mode d'hébergement. Pourquoi un tel engouement face aux pénuries des petites surfaces et à l'augmentation des loyers ? La colocation est la solution idéale. Elle permet d'accéder à de grands appartements sans en payer intégralement le loyer. Les étudiants ont été les premiers à en comprendre les avantages suivis par les seniors. Pour eux, l'idée tombe à pic. L'espérance de vie ne cesse de s'allonger et les pensions de retraite ne sont parfois plus suffisantes pour vivre décemment. La colocation entre différentes générations commence donc à se développer.", "audio": "CO 12/024.MP3", "_test": "12", "_pos": 24, "_origlabel": "test12#24", "_sources": ["test12#24"]}, {"type": "document", "q": "Quel est le rôle d'un oiseau de tête dans un vol groupé ?", "c": ["Il diminue les efforts de ceux qui le suivent.", "Il est le seul à connaître la direction à prendre.", "Il guide ses congénères en cas de tempête.", "Il protège les plus faibles durant la migration."], "a": 0, "k": "profitent des turbulences qu'il a créées et font des économies", "transcript": "On s'est rendu compte que quand les oiseaux sont en V, celui qui est à la pointe dépense beaucoup d'énergie parce qu'il est le premier et qu'il doit persévérer. Mais les autres, qui sont tous derrière lui, bien alignés, un peu décalés, profitent des turbulences qu'il a créées et font des économies. Et l'idée, c'est que plus on est nombreux, plus on peut partager chacun son tour. Le premier, au bout d'un certain temps, quand il en a assez, se décale et se met en bout de chaîne pour prendre la place de celui qui était derrière. Et c'est un nouveau qui va prendre sa place et qui fera l'effort initial.", "audio": "CO 14/027.MP3", "_test": "14", "_pos": 27, "_origlabel": "test14#27", "_sources": ["test14#27"]}, {"type": "document", "q": "Pourquoi les supermarchés ont-ils été condamnés à payer des amendes ?", "c": ["Ils affichaient des prix erronés.", "Ils annonçaient de fausses promotions.", "Ils soldaient des articles périmés.", "Ils vendaient des marchandises à perte."], "a": 1, "k": "tu achètes un lot de quatre paquets de gâteaux en pensant que c'est moins cher", "transcript": "Tu as vu ? Je t'ai pris tes gâteaux préférés. Tu as pris un lot de quatre ? Ça fait beaucoup, non ? Prends-en moins. Il y en a quatre pour le prix de trois. Oula, attention. Parce que j'ai entendu à la radio que les supermarchés allaient payer des amendes pour des vols comme ça. Qu'est-ce que tu veux dire des vols comme ça ? Bah, tu achètes un lot de quatre paquets de gâteaux en pensant que c'est moins cher que si tu les achètes séparément. Et en fait, non. C'est du vol. Ah bon ? Attends, je vais aller vérifier.", "audio": "CO 15/022.MP3", "_test": "15", "_pos": 22, "_origlabel": "test15#22", "_sources": ["test15#22"]}, {"type": "document", "q": "Question 25. D'après Camille, quel est le point fort de l'immobilier à Québec ?", "c": ["La possibilité de visiter les logements en personne.", "La difficulté de trouver un logement rapidement.", "La nécessité de chercher un logement sur Internet.", "L'obligation de choisir un logement en fonction du quartier."], "a": 0, "k": "je conseille de chercher sur place", "transcript": "– Camille, à ton arrivée à Québec, dans quel type de logement résidais-tu ?\n– J'ai d'abord habité un appartement en colocation dans le quartier de Montcalm. Au bout de six mois à peine, j'ai emménagé à deux pas du centre-ville. C'est très simple de trouver un logement ici. Ça se fait en quelques jours.\n– Hum, comment as-tu trouvé ton premier appartement ?\n– Avant de quitter la France, sur un site internet regroupant les annonces de colocation. Mais je conseille de chercher sur place. Il y a tout ce qu'il faut pour trouver facilement. On peut découvrir le quartier, voir si les pièces sont spacieuses, lumineuses et surtout bien insonorisées. Ce n'était pas le cas de mon premier logement, malgré le nom de quartier.", "audio": "CO 17/025.MP3", "_test": "17", "_pos": 25, "_origlabel": "test17#25", "_sources": ["test17#25"]}, {"type": "document", "q": "Question 20. Pourquoi l'employé conseille-t-il au client de choisir une formule tout compris ?", "c": ["C'est meilleur marché.", "C'est plus simple.", "C'est plus rapide.", "C'est trop tard."], "a": 1, "k": "le plus facile", "transcript": "Bonjour, je souhaiterais passer quelques jours à Paris. J'espère qu'il est encore temps de réserver. Qu'est-ce que vous me conseillez ?\n– Oh, pour Paris, ce n'est pas un problème. Vous avez le temps, mais il vaut mieux une formule tout compris. C'est ce qu'il y a de moins cher à cette époque, pas forcément le moins cher, mais en tout cas, le plus facile.", "audio": "CO 22/020.MP3", "_test": "22", "_pos": 20, "_origlabel": "test22#20", "_sources": ["test22#20"]}, {"type": "document", "q": "Question 20. Qu'est-ce qui caractérise ce service ?", "c": ["Il associe tourisme et shopping.", "Il est accessible la journée entière.", "Il regroupe les personnes âgées.", "Il s'adresse aux acheteurs à Noël."], "a": 3, "k": "achats de fin d'année", "transcript": "Journaliste : En période de grande bousculade dans les magasins pour les achats de fin d'année, si la perspective des difficultés de circulation ou de stationnement vous angoisse, voici une initiative qui va peut-être vous intéresser. La ville d'Angers a mis en place un service original pour que les particuliers puissent faire leurs courses de Noël sans subir le stress des transports en commun. De 14 heures à 19 heures, un chauffeur vient vous chercher à votre domicile et vous conduit en centre-ville à proximité des magasins dans lesquels vous souhaitez vous rendre. Ce service est gratuit à condition d'avoir de nombreux achats à effectuer.", "audio": "CO 25/020.MP3", "_test": "25", "_pos": 20, "_origlabel": "test25#20", "_sources": ["test25#20"]}, {"type": "document", "q": "Question 22 : Que demande le client ?", "c": ["La visite d'un technicien", "L'échange d'un article abîmé", "Le conseil d'un professionnel", "Le remboursement d'un produit"], "a": 2, "k": "comment emboîter les parties vitrées sur les panneaux en bois", "transcript": "Bonjour, je suis bien au service après-vente de meubles modernes ? Oui bonjour, que puis-je faire pour vous ? C'est au sujet de la bibliothèque que j'ai achetée chez vous. Depuis deux jours j'essaie de la monter mais, hélas je n'ai pas dû comprendre comment emboîter les parties vitrées sur les panneaux en bois. Je ne gère pas le côté technique. Je vais donc vous mettre en communication avec le service compétent qui vous expliquera comment réaliser l'assemblage.", "audio": "CO 26/022.MP3", "_test": "26", "_pos": 22, "_origlabel": "test26#22", "_sources": ["test26#22"]}]}, "Famille": {"cours": [{"type": "document", "q": "Pourquoi les filles partent-elles de la maison plutôt que les garçons ?", "c": ["Elles entrent dans la vie active avant les jeunes garçons.", "Elles se rebellent très vite face à l'autorité familiale au quotidien.", "Elles sont en désaccord avec leurs parents au sujet de leurs études.", "Elles sont mieux préparées aux tâches de tous les jours."], "a": 1, "k": "entrent plus vite dans les conflits avec leurs parents", "transcript": "— Bonjour à tous. Aujourd'hui nous recevons Philippe Bouchard, sociologue, qui publie Les grands enfants chez papa et maman. Bonjour Philippe Bouchard. Dans votre livre, vous dites que les jeunes filles partent plus vite de chez elles que les garçons. Comment l'expliquez-vous ?\n— Elles sont plus précoces que les garçons. Elles sont plus mûres et entrent plus vite dans les conflits avec leurs parents.\n— Et qu'est-ce qui provoque ces conflits ?\n— Ils sont de toute nature : de l'habillement à l'argent de poche, en passant par le programme télé. Elles ont plus de disputes avec leurs parents au sujet de leur petit ami, et elles sont donc plus pressées de partir de la maison, de devenir plus indépendantes.", "audio": "CO1/024.MP3", "_test": "1", "_pos": 24, "_origlabel": "test1#24", "_sources": ["test1#24", "test40#23"]}, {"type": "document", "q": "Question 25. Pourquoi les parents doivent-ils passer du temps avec leurs enfants ?", "c": ["Pour limiter le temps passé devant la télévision.", "Pour améliorer les performances scolaires de l'enfant.", "Pour respecter les obligations légales de parentalité.", "Pour façonner la personnalité de l'enfant."], "a": 3, "k": "Pour façonner la personnalité de l'enfant.", "transcript": "Ce que vous dites, c'est que le temps passé par un parent avec son enfant, ça fait partie aujourd'hui des besoins psychiques essentiels à la construction de l'enfant.\n– Le temps ? Oui, vraiment. Parce qu'il faut dire tout de suite que le temps passé par les enfants devant la télévision, notamment plusieurs heures par jour, on sait que plus tard ce sont des failles de concentration, ce sont des problématiques à l'école. Donc savoir avoir ce temps-là, c'est d'abord regarder son enfant comme un être à part, comme un être en développement, et c'est donc regarder le type de tempérament qui est là, le type de caractère.", "audio": "CO 2/025.MP3", "_test": "2", "_pos": 25, "_origlabel": "test2#25", "_sources": ["test2#25"]}, {"type": "document", "q": "Question 27. Pourquoi certains jeunes choisissent-ils de rester chez leurs parents ?", "c": ["La peur de faire de la peine à leur entourage familial.", "Le confort que leur procure leur structure familiale.", "Le plaisir de voir leur famille comme ils le souhaitent.", "L'obligation de soutenir financièrement leur famille."], "a": 1, "k": "Maman et papa prennent soin de tout", "transcript": "– À peine a-t-on le temps de s'habituer à être parents, que l'on doit préparer nos enfants à devenir autonomes, puis à partir. Ce moment où le jeune adulte quitte la maison est difficile, effectivement.\n– Ce moment est difficile tant pour le parent que pour l'enfant. Nos adolescents, qui ont attendu parfois très longtemps ce temps de liberté, eux-mêmes peuvent se retrouver démunis au moment de franchir la porte de la maison. Aujourd'hui, les jeunes adultes vivent de plus en plus longtemps chez leurs parents.\n– Tout à fait. On invoque des raisons économiques pour rester à la maison plus longtemps. Ceci est parfois lié aussi à une question d'immaturité. On est bien à la maison. Maman et papa prennent soin de tout, c'est pratique quand même.", "audio": "CO 3/027.MP3", "_test": "3", "_pos": 27, "_origlabel": "test3#27", "_sources": ["test3#27"]}, {"type": "document", "q": "Question 20. Quel problème cette mère rencontre-t-elle ?", "c": ["Ses enfants refusent de jouer.", "Les jeux sont trop coûteux.", "Ses enfants se disputent pour les jouets.", "Un de ses enfants a du mal à respecter les règles du jeu."], "a": 3, "k": "Un de ses enfants a du mal à respecter les règles du jeu.", "transcript": "Lucy a trois enfants et pour Noël, ils ont reçu des jeux de société. Ces jeux les passionnent. Ils jouent beaucoup avec leurs copains ou encore avec leurs cousins. Mais nous dit Lucy, mon fils de 6 ans provoque régulièrement des drames parce qu'il triche. Une situation à laquelle tous les parents de jeunes enfants sont un jour ou l'autre confrontés.", "audio": "CO 34/020.MP3", "_test": "4", "_pos": 20, "_origlabel": "test4#20", "_sources": ["test4#20"]}, {"type": "document", "q": "Question 26. Pourquoi changer de prénom peut-il s'avérer difficile ?", "c": ["Les délais administratifs sont très longs.", "Il faut prouver la nécessité de la démarche.", "Les avocats refusent souvent de s'en charger.", "La loi l'interdit dans la plupart des cas."], "a": 1, "k": "Il faut prouver la nécessité de la démarche.", "transcript": "Le prénom que vos parents vous ont donné vous rebute ? Vous pouvez en changer mais ce n'est pas une simple formalité. Il faut obligatoirement faire appel à un avocat qui dépose le dossier auprès du tribunal de grande instance du lieu de naissance ou du domicile du demandeur. La principale difficulté est de parvenir à convaincre les juges du bien-fondé de sa requête. On peut changer de prénom à condition de justifier d'un intérêt légitime : la francisation par exemple, ou des personnes qui souhaitent mettre en adéquation leur prénom avec leur conviction religieuse. Et puis il y a des cas beaucoup plus atypiques.", "audio": "CO 34/026.MP3", "_test": "4", "_pos": 26, "_origlabel": "test4#26", "_sources": ["test4#26"]}, {"type": "document", "q": "Question 22. Pourquoi les enfants de M. Baoulé ont-ils des accents variés quand ils parlent français ?", "c": ["Parce qu'ils ont été scolarisés dans des lycées plurilingues.", "Parce qu'ils ont été adoptés dans des pays différents.", "Parce qu'ils ont vécu dans de diverses zones de la planète.", "Parce qu'ils parlent plusieurs langues à la maison."], "a": 2, "k": "tous nés dans des endroits différents", "transcript": "– J'ai le plaisir de recevoir aujourd'hui Monsieur Baoulé, qui nous vient tout droit du Nouveau-Brunswick. Alors, Monsieur Baoulé, vous avez une belle famille puisque vous avez huit enfants, tous nés dans des endroits différents, je crois.\n– Oui, en Afrique, au Québec et les petits derniers au Nouveau-Brunswick.\n– Ah. Et est-ce qu'ils ont tous des accents différents ?\n– Ma foi, oui. Dans chacun de ces endroits, le français est parlé différemment et mes enfants ont pris l'accent du lieu où ils sont allés à l'école dans les premières années de leur vie.", "audio": "CO 5/022.MP3", "_test": "5", "_pos": 22, "_origlabel": "test5#22", "_sources": ["test5#22"]}, {"type": "document", "q": "Question 23. Que conseille cet intervenant aux parents ?", "c": ["D'attribuer à la lecture le statut de loisir.", "De favoriser la lecture en automne.", "De limiter la lecture d'histoires illustrées.", "De sélectionner des lectures classiques."], "a": 0, "k": "la lecture est avant tout un plaisir", "transcript": "Mais je crois que les difficultés en matière de lecture ont des causes à la fois individuelles et sociales. Les parents, par exemple, parce qu'ils sont angoissés par l'avenir de leurs enfants, leur présentent souvent la lecture comme une obligation, une démarche indispensable pour réussir. Et c'est une erreur parce que la lecture est avant tout un plaisir. Un livre, c'est un voyage, une découverte, une aventure, et il faudrait faire découvrir la lecture aux enfants comme on leur fait découvrir la cuisine chinoise ou les jeux dans la neige. Et puis les parents refusent aussi souvent à leurs enfants des lectures qu'ils considèrent comme mineures, les bandes dessinées, par exemple. Et ça aussi, c'est une erreur. Lire une bande dessinée, c'est lire et ça permet souvent d'ailleurs de découvrir ensuite d'autres formes de littérature.", "audio": "CO 5/023.MP3", "_test": "5", "_pos": 23, "_origlabel": "test5#23", "_sources": ["test5#23", "test7#22", "test20#22"]}, {"type": "document", "q": "Question 26. Que propose l'association présentée ?", "c": ["Elle construit des maisons pour les personnes âgées.", "Elle organise des évènements rassemblant les générations.", "Elle permet à des jeunes d'habiter chez des personnes âgées.", "Elle valorise les professions d'assistance aux personnes âgées."], "a": 2, "k": "favorise la cohabitation entre personnes âgées et jeunes", "transcript": "D'un côté, certaines personnes âgées ont de la place chez elles, ont besoin d'aide dans leur quotidien. D'un autre côté, certains jeunes ont du temps libre et cherchent à se loger. Alors on en reste là où on trouve une solution. L'association de l'or à Rennes favorise la cohabitation entre personnes âgées et jeunes défavorisés. Si vous voulez soutenir ce type de solution, rendez-vous sur Fondation de France.org.", "audio": "CO 5/026.MP3", "_test": "5", "_pos": 26, "_origlabel": "test5#26", "_sources": ["test5#26", "test6#25"]}, {"type": "document", "q": "Question 29. D'après l'intervenante, qu'est-ce qui est important pour un lecteur ?", "c": ["Partager ses impressions.", "Rechercher de nouveaux auteurs.", "S'extraire du quotidien.", "Utiliser un support électronique."], "a": 2, "k": "ce temps-là est consacré à la lecture", "transcript": "Les enfants à côté, il faut se donner la peine, il faut vraiment dire : ce temps-là, eh bien non, ce temps-là est consacré à la lecture.", "audio": "CO 8/029.MP3", "_test": "8", "_pos": 29, "_origlabel": "test8#29", "_sources": ["test8#29"]}, {"type": "document", "q": "Question 25. Qu'est-ce que la fille achète ?", "c": ["Une paire de boucles d'oreille.", "Une paire de chaussures.", "Une paire de lunettes.", "Une paire de skis."], "a": 2, "k": "Elles vont très bien avec la couleur de tes cheveux", "transcript": "– Et celle-là, qu'est-ce que tu en penses ?\n– Pas mal. J'aime bien la forme des branches. Tourne-toi un peu pour voir. Ce sera parfait pour la montagne.\n– J'essaie encore ces trois paires et je me décide.\n– Moi, je préfère celle-là. Elles vont très bien avec la couleur de tes cheveux et elles sont très élégantes.\n– D'accord, ça va aller. Je les prends.", "audio": "CO 9/025.MP3", "_test": "9", "_pos": 25, "_origlabel": "test9#25", "_sources": ["test9#25", "test29#25"]}, {"type": "document", "q": "De quoi est-il question ?", "c": ["Des besoins énergétiques des jeunes", "Des bons réflexes pour les repas", "Des comportements alimentaires", "Des conseils de préparation culinaire"], "a": 2, "k": "les enfants mangent principalement par plaisir", "transcript": "Si les enfants ne mangent pas assez de fruits et légumes, c'est peut-être parce qu'ils n'aiment pas ça. En fait, les enfants mangent principalement par plaisir et c'est une fonction que ne remplissent pas les fruits et légumes. Certes, tout le monde est d'accord pour dire que c'est bon à la santé, que c'est nécessaire, que c'est souvent contraignant à préparer, que cela ne remplit pas l'estomac, voire que ce n'est pas bon. Mais on trouve rarement la notion de plaisir associée aux fruits et légumes.", "audio": "CO 10/027.MP3", "_test": "10", "_pos": 27, "_origlabel": "test10#27", "_sources": ["test10#27"]}, {"type": "document", "q": "Que dit la journaliste des grand-mères modernes ?", "c": ["Elles assument leurs désirs malgré leur âge.", "Elles participent au maintien des traditions.", "Elles s'impliquent dans l'éducation des enfants.", "Elles sont à la pointe des tendances de la mode."], "a": 0, "k": "trop occupée à refaire sa vie", "transcript": "– Et dans la famille des héroïnes ordinaires, vous voulez nous présenter la grand-mère Laure.\n– Et oui. Je ne vous l'apprends pas : dans les sociétés occidentales modernes, l'archétype de la grand-mère est de moins en moins la mamie gâteau, garante de la transmission des recettes autant que de l'histoire de la famille. Mais la grand-mère voyageuse, engagée, dynamique, dont l'espérance de vie est de plus en plus longue, toujours dispos pour garder les petits-enfants… car trop occupée à refaire sa vie. Et même quand elle porte des robes à la mode et qu'elle a l'air d'une jeune femme, elle s'éclate à faire des blagues.", "audio": "CO 24/022.MP3", "_test": "24", "_pos": 22, "_origlabel": "test24#22", "_sources": ["test24#22"]}, {"type": "document", "q": "Quelle est la raison du déplacement de ce couple ?", "c": ["Un mariage.", "Un anniversaire.", "Une naissance.", "Une promotion."], "a": 2, "k": "cadeau pour le petit Romain", "transcript": "– Bon, je suis prête. J'ai le cadeau pour le petit Romain.\n– Tu as pris la carte et le plan d'Arnaud ?\n– La carte est dans la voiture, mais c'est toi qui as le plan. Je te l'ai donné avec le faire-part.\n– T'es sûr ? Je ne sais pas ce que j'en ai fait.\n– Bon, ça fait rien. On va bien trouver.\n– Oui, j'espère. La maternité est juste derrière le restaurant près de la rivière — c'est celui où on a fêté l'anniversaire de mariage de mes parents.\n– Ah oui. J'y suis retourné avec mes c
